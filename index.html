                                  {isAdmin && (
                                    <div className="mt-2 pt-2 border-t border-gray-800/80">
                                      <input
                                        type="text"
                                        value={githubRepoSlug}
                                        onChange={(e) => {
                                          setGithubRepoSlug(e.target.value);
                                          localStorage.setItem('sp_rieumes_gh_repo', e.target.value.trim());
                                        }}
                                        placeholder="pseudo/nom-du-depot"
                                        className="w-full bg-gray-900 border border-gray-700 rounded-lg px-2.5 py-1.5 text-[11px] text-white outline-none focus:border-blue-500"
                                      />
                                    </div>
                                  )}
                                </div>
                                {isAdmin && (
                                  <a
                                    href={githubRepoSlug && githubRepoSlug.includes('/') ? `https://github.com/${githubRepoSlug.trim().replace(/^https?:\/\/github\.com\//i, '')}` : "https://github.com/settings/billing"}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="inline-flex items-center justify-center space-x-1.5 w-full bg-gray-900 hover:bg-gray-800 text-blue-400 border border-blue-500/30 py-2 px-3 rounded-lg text-xs font-bold transition-colors"
                                  >
                                    <ExternalLink className="w-3.5 h-3.5" />
                                    <span>Ouvrir le dépôt GitHub</span>
                                  </a>
                                )}
                              </div>

                              {/* CARTE 3 : GOOGLE DRIVE */}
                              <div className="bg-gray-950 border border-gray-800 rounded-xl p-4 flex flex-col justify-between space-y-3">
                                <div>
                                  <div className="flex items-center justify-between mb-1">
                                    <span className="text-xs font-bold uppercase tracking-wider text-amber-400">3. Google Drive</span>
                                    <span className="text-xs font-extrabold text-white">{storageMetrics.driveLinksCount} facture(s)</span>
                                  </div>
                                  <div className="w-full bg-gray-800 h-2.5 rounded-full overflow-hidden my-2">
                                    <div className="bg-amber-400 h-full rounded-full" style={{ width: '4%' }}></div>
                                  </div>
                                  <p className="text-[11px] text-gray-400">
                                    Factures PDF/Photos déportées sur Drive (15 Go gratuits) : <strong className="text-white">0 Ko</strong> dans Firebase.
                                  </p>
                                  {storageMetrics.embeddedFilesCount > 0 ? (
                                    <p className="text-[11px] text-amber-400 mt-1 font-semibold">⚠️ {storageMetrics.embeddedFilesCount} fichier(s) joint(s) en local.</p>
                                  ) : (
                                    <p className="text-[11px] text-emerald-400 mt-1 font-semibold">✓ Aucun fichier lourd dans Firebase.</p>
                                  )}
                                </div>
                                {isAdmin && (
                                  <a
                                    href="https://drive.google.com/drive/quota"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="inline-flex items-center justify-center space-x-1.5 w-full bg-gray-900 hover:bg-gray-800 text-amber-300 border border-amber-500/30 py-2 px-3 rounded-lg text-xs font-bold transition-colors"
                                  >
                                    <ExternalLink className="w-3.5 h-3.5" />
                                    <span>Voir le quota Google Drive (15 Go)</span>
                                  </a>
                                )}
                              </div>
                            </div>
                          </div>

                          {/* SIGNATAIRES OFFICIELS & ÉCUSSON (MODIFIABLES PAR ADMIN) */}
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                              <h2 className="text-lg font-bold text-white flex items-center mb-1">
                                <Pencil className="w-5 h-5 mr-2 text-red-500"/> Signataires Officiels (AG)
                              </h2>
                              <p className="text-xs text-gray-400 mb-4">Apparaissent dans les cadres de signatures des Bilans et PDF.</p>
                              <div className="space-y-3">
                                <div>
                                  <label className="block text-xs font-semibold text-gray-400 mb-1">Le Trésorier</label>
                                  <input
                                    type="text"
                                    disabled={!isAdmin}
                                    value={treasurerName}
                                    onChange={(e) => setTreasurerName(e.target.value)}
                                    className="w-full bg-gray-950 border border-gray-700 disabled:opacity-60 focus:border-red-500 rounded-xl p-3 text-sm text-white outline-none font-medium"
                                  />
                                </div>
                                <div>
                                  <label className="block text-xs font-semibold text-gray-400 mb-1">Le Président</label>
                                  <input
                                    type="text"
                                    disabled={!isAdmin}
                                    value={presidentName}
                                    onChange={(e) => setPresidentName(e.target.value)}
                                    className="w-full bg-gray-950 border border-gray-700 disabled:opacity-60 focus:border-red-500 rounded-xl p-3 text-sm text-white outline-none font-medium"
                                  />
                                </div>
                              </div>
                            </div>

                            <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 flex flex-col justify-between">
                              <div className="flex items-center space-x-4">
                                <div className="bg-gray-950 p-2.5 rounded-2xl border border-gray-800">
                                  <AmicaleLogo size="md" customLogoData={customLogoData} />
                                </div>
                                <div>
                                  <h2 className="text-lg font-bold text-white">Écusson de l'Amicale</h2>
                                  <p className="text-xs text-gray-400 mt-0.5">
                                    Lit <code className="text-blue-300 font-bold">logo.png</code> sur GitHub (0 Ko Firebase).
                                  </p>
                                </div>
                              </div>
                              {isAdmin && (
                                <div className="mt-4 flex flex-wrap gap-2">
                                  <label className="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl cursor-pointer transition-colors flex items-center space-x-2">
                                    <Upload className="w-4 h-4" />
                                    <span>Mémoriser logo.png sur cet appareil</span>
                                    <input type="file" accept="image/*" onChange={handleLocalLogoUpload} className="hidden" />
                                  </label>
                                  {customLogoData && (
                                    <button
                                      type="button"
                                      onClick={() => {
                                        localStorage.removeItem('sp_rieumes_custom_logo');
                                        setCustomLogoData(null);
                                        setLogoMsg("Cache local effacé : lecture de ./logo.png active.");
                                      }}
                                      className="bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs px-3 py-2.5 rounded-xl border border-gray-700"
                                    >
                                      Utiliser ./logo.png
                                    </button>
                                  )}
                                </div>
                              )}
                              {logoMsg && <p className="text-xs text-emerald-400 mt-2 font-medium">{logoMsg}</p>}
                            </div>
                          </div>
                        </div>
                      )}

                      {/* SOUS-ONGLET 3 : UTILISATEURS & ACCÈS (ADMIN UNIQUEMENT) */}
                      {settingsSubTab === 'users' && isAdmin && (
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                          {/* FORMULAIRE CRÉATION D'UN COMPTE EN LIGNE */}
                          <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                            <h2 className="text-lg font-bold text-white flex items-center mb-1">
                              <Plus className="w-5 h-5 mr-2 text-blue-400"/> Créer un utilisateur en ligne
                            </h2>
                            <p className="text-xs text-gray-400 mb-4">
                              Le compte est créé instantanément sur Firebase sans vous déconnecter.
                            </p>
                            <form onSubmit={handleCreateUserOnline} className="space-y-3.5">
                              <div>
                                <label className="block text-xs font-semibold text-gray-400 mb-1">Prénom et Nom</label>
                                <input
                                  type="text"
                                  required
                                  placeholder="Ex: Frédéric Sudron"
                                  value={newUserForm.name}
                                  onChange={e => setNewUserForm(prev => ({ ...prev, name: e.target.value }))}
                                  className="w-full bg-gray-950 border border-gray-700 focus:border-blue-500 rounded-xl p-3 text-sm text-white outline-none"
                                />
                              </div>
                              <div>
                                <label className="block text-xs font-semibold text-gray-400 mb-1">Adresse e-mail</label>
                                <input
                                  type="email"
                                  required
                                  placeholder="frederic@exemple.fr"
                                  value={newUserForm.email}
                                  onChange={e => setNewUserForm(prev => ({ ...prev, email: e.target.value }))}
                                  className="w-full bg-gray-950 border border-gray-700 focus:border-blue-500 rounded-xl p-3 text-sm text-white outline-none"
                                />
                              </div>
                              <div>
                                <label className="block text-xs font-semibold text-gray-400 mb-1">Mot de passe provisoire (6 car. min)</label>
                                <input
                                  type="text"
                                  required
                                  minLength={6}
                                  placeholder="Ex: Rieumes2026!"
                                  value={newUserForm.password}
                                  onChange={e => setNewUserForm(prev => ({ ...prev, password: e.target.value }))}
                                  className="w-full bg-gray-950 border border-gray-700 focus:border-blue-500 rounded-xl p-3 text-sm text-white outline-none"
                                />
                              </div>
                              <div>
                                <label className="block text-xs font-semibold text-gray-400 mb-1">Rôle et droits d'accès</label>
                                <select
                                  value={newUserForm.role}
                                  onChange={e => setNewUserForm(prev => ({ ...prev, role: e.target.value }))}
                                  className="w-full bg-gray-950 border border-gray-700 focus:border-blue-500 rounded-xl p-3 text-sm text-white outline-none font-semibold"
                                >
                                  <option value="treasurer">💼 Trésorier (Compta complète, sans réglages techniques)</option>
                                  <option value="viewer">👁️ Lecture seule (Consultation & impressions PDF)</option>
                                  <option value="admin">🛡️ Administrateur (Accès total + utilisateurs)</option>
                                </select>
                              </div>
                              <button
                                type="submit"
                                disabled={isCreatingUser}
                                className="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-bold py-3 rounded-xl text-sm transition-colors shadow-lg shadow-blue-600/20"
                              >
                                {isCreatingUser ? 'Création en cours...' : 'Créer cet utilisateur'}
                              </button>
                            </form>
                            {userAdminMsg && (
                              <div className={`mt-3 p-3 rounded-xl text-xs font-medium border ${
                                userAdminMsg.type === 'success' ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' :
                                userAdminMsg.type === 'error' ? 'bg-red-500/10 border-red-500/30 text-red-300' :
                                'bg-blue-500/10 border-blue-500/30 text-blue-300'
                              }`}>
                                {userAdminMsg.text}
                              </div>
                            )}
                          </div>

                          {/* LISTE DES UTILISATEURS AUTORISÉS + STATUT EN LIGNE EN TEMPS RÉEL */}
                          <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 lg:col-span-2">
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
                              <div>
                                <h2 className="text-lg font-bold text-white flex items-center">
                                  <Shield className="w-5 h-5 mr-2 text-red-400"/> Membres ayant accès à la trésorerie
                                </h2>
                                <p className="text-xs text-gray-400 mt-0.5">
                                  Voyant vert en temps réel lorsqu'un membre est connecté • Modifiez un prénom, un rôle ou coupez un accès instantanément.
                                </p>
                              </div>
                              <span className="inline-flex items-center space-x-1.5 text-xs font-bold px-3 py-1.5 rounded-full bg-emerald-500/10 text-emerald-300 border border-emerald-500/30 self-start">
                                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                <span>{onlineUsersCount} connecté{onlineUsersCount > 1 ? 's' : ''} en direct</span>
                              </span>
                            </div>

                            <div className="space-y-3">
                              {allUsers.map(u => {
                                const isMe = u.uid === authUser?.uid;
                                const uRole = ROLE_META[u.role] || ROLE_META.viewer;
                                const isActive = u.active !== false;
                                const pres = onlinePresence[u.uid];
                                const isOnlineNow = pres && pres.online === true;
                                return (
                                  <div key={u.uid} className={`p-4 rounded-2xl border flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${isActive ? 'bg-gray-950 border-gray-800' : 'bg-red-950/20 border-red-500/30 opacity-75'}`}>
                                    <div className="flex items-center space-x-3 min-w-0">
                                      <div className="relative flex-shrink-0">
                                        <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-extrabold ${uRole.avatarClass}`}>
                                          {getFirstName(u.name, u.email).charAt(0).toUpperCase()}
                                        </div>
                                        <span
                                          title={isOnlineNow ? `En ligne (${pres.device || 'Appareil'})` : 'Hors ligne'}
                                          className={`absolute -bottom-1 -right-1 w-3.5 h-3.5 rounded-full border-2 border-gray-950 ${isOnlineNow ? 'bg-emerald-400 animate-pulse' : 'bg-gray-600'}`}
                                        ></span>
                                      </div>
                                      <div className="min-w-0">
                                        <div className="flex flex-wrap items-center gap-1.5">
                                          <input
                                            type="text"
                                            defaultValue={u.name || ''}
                                            onBlur={(e) => {
                                              const val = e.target.value.trim();
                                              if (val && val !== u.name) handleUpdateUserRecord(u.uid, { name: val });
                                            }}
                                            className="bg-transparent border-b border-transparent hover:border-gray-600 focus:border-blue-500 text-sm font-bold text-white outline-none max-w-[170px]"
                                            title="Cliquez pour modifier le prénom/nom"
                                          />
                                          {isOnlineNow ? (
                                            <span className="text-[10px] bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full font-bold">
                                              🟢 En ligne • {pres.device || 'Connecté'}
                                            </span>
                                          ) : (
                                            <span className="text-[10px] bg-gray-800 text-gray-400 border border-gray-700 px-2 py-0.5 rounded-full font-medium">
                                              {pres?.lastSeen
                                                ? `Vu le ${new Date(pres.lastSeen).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' })} à ${new Date(pres.lastSeen).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}`
                                                : 'Hors ligne'}
                                            </span>
                                          )}
                                          {isMe && <span className="text-[10px] bg-blue-500/15 text-blue-300 border border-blue-500/30 px-2 py-0.5 rounded-full font-bold">Vous</span>}
                                          {!isActive && <span className="text-[10px] bg-red-500/20 text-red-300 border border-red-500/30 px-2 py-0.5 rounded-full font-bold">Bloqué</span>}
                                        </div>
                                        <p className="text-xs text-gray-400 truncate mt-0.5">{u.email}</p>
                                      </div>
                                    </div>

                                    <div className="flex flex-wrap items-center gap-2">
                                      <select
                                        value={u.role || 'viewer'}
                                        onChange={(e) => handleUpdateUserRecord(u.uid, { role: e.target.value })}
                                        className="bg-gray-900 border border-gray-700 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-white outline-none"
                                      >
                                        <option value="admin">🛡️ Administrateur</option>
                                        <option value="treasurer">💼 Trésorier</option>
                                        <option value="viewer">👁️ Lecture seule</option>
                                      </select>

                                      <button
                                        type="button"
                                        onClick={() => handleSendResetToUser(u.email)}
                                        className="bg-gray-900 hover:bg-gray-800 border border-gray-700 text-gray-300 hover:text-white px-2.5 py-1.5 rounded-lg text-xs font-medium"
                                        title="Envoyer un e-mail de réinitialisation de mot de passe"
                                      >
                                        Réinit. MDP
                                      </button>

                                      {!isMe && (
                                        <button
                                          type="button"
                                          onClick={() => handleUpdateUserRecord(u.uid, { active: !isActive })}
                                          className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition-colors ${isActive ? 'bg-red-500/15 hover:bg-red-500/25 text-red-300 border-red-500/30' : 'bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-300 border-emerald-500/30'}`}
                                        >
                                          {isActive ? 'Couper accès' : 'Réactiver'}
                                        </button>
                                      )}
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        </div>
                      )}

                      {/* SOUS-ONGLET 4 : TECHNIQUE (ADMIN UNIQUEMENT) */}
                      {settingsSubTab === 'tech' && isAdmin && (
                        <div className="space-y-6">
                          {/* MONITEUR EN DIRECT & HISTORIQUE DES CONNEXIONS (ADMIN UNIQUEMENT) */}
                          <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 space-y-5">
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-gray-800 pb-4">
                              <div>
                                <h2 className="text-lg font-bold text-white flex items-center">
                                  <Clock className="w-5 h-5 mr-2 text-emerald-400"/> Activité en Direct & Historique des Connexions
                                </h2>
                                <p className="text-xs text-gray-400 mt-0.5">
                                  Suivi en temps réel des membres connectés et journal des 50 dernières ouvertures de session.
                                </p>
                              </div>
                              <div className="flex items-center gap-2">
                                <span className="inline-flex items-center space-x-1.5 text-xs font-bold px-3 py-1.5 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">
                                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                  <span>{onlineUsersCount} en ligne</span>
                                </span>
                                {loginLogs.length > 0 && (
                                  <button
                                    type="button"
                                    onClick={handleClearLoginLogs}
                                    className="text-xs bg-gray-800 hover:bg-red-600/20 text-gray-300 hover:text-red-300 border border-gray-700 px-3 py-1.5 rounded-xl font-medium transition-colors"
                                  >
                                    Vider l'historique
                                  </button>
                                )}
                              </div>
                            </div>

                            {/* MEMBRES ACTUELLEMENT EN LIGNE */}
                            <div>
                              <h3 className="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2.5">
                                Présence en temps réel
                              </h3>
                              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                {allUsers.map(u => {
                                  const pres = onlinePresence[u.uid];
                                  const isOnlineNow = pres && pres.online === true;
                                  const uRole = ROLE_META[u.role] || ROLE_META.viewer;
                                  return (
                                    <div key={u.uid} className={`p-3.5 rounded-xl border flex items-center justify-between gap-2 ${isOnlineNow ? 'bg-emerald-950/25 border-emerald-500/40' : 'bg-gray-950 border-gray-800'}`}>
                                      <div className="flex items-center space-x-2.5 min-w-0">
                                        <span className={`w-2.5 h-2.5 rounded-full flex-shrink-0 ${isOnlineNow ? 'bg-emerald-400 animate-pulse' : 'bg-gray-600'}`}></span>
                                        <div className="min-w-0">
                                          <p className="text-xs font-bold text-white truncate">{getFirstName(u.name, u.email)}</p>
                                          <p className="text-[11px] text-gray-400 truncate">{uRole.label}</p>
                                        </div>
                                      </div>
                                      <div className="text-right flex-shrink-0">
                                        {isOnlineNow ? (
                                          <span className="inline-flex items-center space-x-1 text-[11px] font-bold text-emerald-300">
                                            {pres.device === 'Téléphone' ? <Smartphone className="w-3.5 h-3.5" /> : <Monitor className="w-3.5 h-3.5" />}
                                            <span>{pres.device || 'En ligne'}</span>
                                          </span>
                                        ) : (
                                          <span className="text-[11px] text-gray-500">
                                            {pres?.lastSeen
                                              ? `${new Date(pres.lastSeen).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' })} ${new Date(pres.lastSeen).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}`
                                              : 'Hors ligne'}
                                          </span>
                                        )}
                                      </div>
                                    </div>
                                  );
                                })}
                              </div>
                            </div>

                            {/* TABLEAU DU JOURNAL DES CONNEXIONS */}
                            <div>
                              <h3 className="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2.5">
                                Journal des dernières connexions ({loginLogs.length})
                              </h3>
                              {loginLogs.length === 0 ? (
                                <p className="text-xs text-gray-500 bg-gray-950 border border-gray-800 rounded-xl p-4 text-center">
                                  Aucune connexion enregistrée pour le moment (la prochaine ouverture de session apparaîtra ici).
                                </p>
                              ) : (
                                <div className="overflow-x-auto max-h-72 overflow-y-auto rounded-xl border border-gray-800">
                                  <table className="w-full text-xs text-left text-gray-300">
                                    <thead className="text-[11px] text-gray-400 uppercase bg-gray-950 border-b border-gray-800 sticky top-0">
                                      <tr>
                                        <th className="px-3.5 py-2.5">Membre</th>
                                        <th className="px-3.5 py-2.5">Rôle</th>
                                        <th className="px-3.5 py-2.5">Appareil</th>
                                        <th className="px-3.5 py-2.5 text-right">Date & Heure</th>
                                      </tr>
                                    </thead>
                                    <tbody>
                                      {loginLogs.map(log => {
                                        const lRole = ROLE_META[log.role] || ROLE_META.viewer;
                                        const dt = log.timestamp ? new Date(log.timestamp) : null;
                                        return (
                                          <tr key={log.id} className="bg-gray-950/60 border-b border-gray-800/70 hover:bg-gray-800/40">
                                            <td className="px-3.5 py-2.5 font-bold text-white">
                                              {log.firstName || getFirstName(log.name, log.email)}
                                              <span className="block text-[10px] font-normal text-gray-500">{log.email}</span>
                                            </td>
                                            <td className="px-3.5 py-2.5">
                                              <span className={`inline-block text-[10px] font-bold px-2 py-0.5 rounded-full border ${lRole.badgeClass}`}>
                                                {lRole.short}
                                              </span>
                                            </td>
                                            <td className="px-3.5 py-2.5 text-gray-300">
                                              <span className="inline-flex items-center space-x-1">
                                                {log.device === 'Téléphone' ? <Smartphone className="w-3.5 h-3.5 text-blue-400" /> : <Monitor className="w-3.5 h-3.5 text-gray-400" />}
                                                <span>{log.device || 'Ordinateur'}</span>
                                              </span>
                                            </td>
                                            <td className="px-3.5 py-2.5 text-right text-gray-300 whitespace-nowrap">
                                              {dt ? `${dt.toLocaleDateString('fr-FR')} à ${dt.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}` : '-'}
                                            </td>
                                          </tr>
                                        );
                                      })}
                                    </tbody>
                                  </table>
                                </div>
                              )}
                            </div>
                          </div>

                          {/* LIEN DU DOSSIER DRIVE (POUR LE BOUTON DU BANDEAU) */}
                          <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                            <h2 className="text-lg font-bold text-white flex items-center mb-1">
                              <FolderOpen className="w-5 h-5 mr-2 text-amber-400"/> Raccourci « Dossier Google Drive » du Bandeau
                            </h2>
                            <p className="text-xs text-gray-400 mb-3">
                              Lien ouvert en un clic par le bouton <strong>Drive</strong> dans le bandeau du haut (modifiable à tout moment).
                            </p>
                            <div className="flex flex-col sm:flex-row gap-3">
                              <input
                                type="url"
                                value={tempDriveFolderUrl}
                                onChange={(e) => setTempDriveFolderUrl(e.target.value)}
                                placeholder="https://drive.google.com/drive/folders/..."
                                className="flex-1 bg-gray-950 border border-gray-700 rounded-xl p-3 text-sm text-white outline-none focus:border-amber-500"
                              />
                              <button
                                onClick={() => {
                                  const cleaned = tempDriveFolderUrl.trim() || DEFAULT_DRIVE_FOLDER_URL;
                                  setDriveFolderUrl(cleaned);
                                  localStorage.setItem('sp_rieumes_drive_folder_url', cleaned);
                                  forcePushToCloud(undefined, cleaned);
                                  showToast("Lien du dossier Google Drive mis à jour pour tous les appareils !", "success");
                                }}
                                className="bg-amber-600 hover:bg-amber-700 text-white px-5 py-3 rounded-xl font-bold text-sm transition-colors"
                              >
                                Enregistrer le lien Drive
                              </button>
                            </div>
                          </div>

                          {/* PASSERELLE GOOGLE DRIVE AUTOMATIQUE */}
                          <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                              <div>
                                <h2 className="text-lg font-bold text-white flex items-center">
                                  <FolderUp className="w-5 h-5 mr-2 text-blue-400"/> Passerelle Automatique Google Apps Script (Factures & Sauvegardes)
                                </h2>
                                <p className="text-xs text-gray-400 mt-0.5">
                                  Classe automatiquement les factures dans <code className="text-emerald-300">Année / Fournisseur /</code> et les sauvegardes dans <code className="text-emerald-300">Trésorier / Sauvegarde / Année /</code>.
                                </p>
                              </div>
                              <span className={`text-xs px-3 py-1 rounded-full font-semibold ${driveScriptUrl ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : 'bg-gray-800 text-gray-400 border border-gray-700'}`}>
                                {driveScriptUrl ? '✓ Passerelle active' : 'Non configuré'}
                              </span>
                            </div>
                            <div className="flex flex-col sm:flex-row gap-3">
                              <input
                                type="url"
                                value={tempDriveScriptUrl}
                                onChange={(e) => setTempDriveScriptUrl(e.target.value)}
                                placeholder="https://script.google.com/macros/s/.../exec"
                                className="flex-1 bg-gray-950 border border-gray-700 rounded-xl p-3 text-sm text-white outline-none focus:border-blue-500"
                              />
                              <button
                                onClick={() => {
                                  const cleaned = tempDriveScriptUrl.trim();
                                  setDriveScriptUrl(cleaned);
                                  localStorage.setItem('sp_rieumes_drive_script_url', cleaned);
                                  forcePushToCloud(cleaned);
                                  setDriveTestMsg({ type: 'success', text: "Lien enregistré et synchronisé pour tous les appareils !" });
                                }}
                                className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-xl font-bold text-sm transition-colors"
                              >
                                Enregistrer
                              </button>
                              <button
                                onClick={testDriveConnection}
                                className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-3 rounded-xl font-bold text-sm transition-colors"
                              >
                                Tester
                              </button>
                            </div>
                            {driveTestMsg && (
                              <div className={`mt-3 p-3 rounded-xl text-xs font-medium border ${
                                driveTestMsg.type === 'success' ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' :
                                driveTestMsg.type === 'error' ? 'bg-red-500/10 border-red-500/30 text-red-300' :
                                'bg-blue-500/10 border-blue-500/30 text-blue-300'
                              }`}>
                                {driveTestMsg.text}
                              </div>
                            )}
                          </div>

                          {/* CONNEXION CLOUD FIREBASE */}
                          <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
                              <div>
                                <h2 className="text-lg font-bold text-white flex items-center">
                                  <Database className="w-5 h-5 mr-2 text-emerald-400"/> Base de Données Cloud Firebase (URL)
                                </h2>
                                <p className="text-xs text-gray-400 mt-0.5">
                                  Fusion intelligente multi-appareils protégée par Firebase Authentication.
                                </p>
                              </div>
                              <span className={`text-xs px-3 py-1 rounded-full font-semibold ${
                                cloudStatus === 'connected' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' :
                                cloudStatus === 'error' ? 'bg-red-500/10 text-red-400 border border-red-500/30' :
                                'bg-amber-500/10 text-amber-400 border border-amber-500/30'
                              }`}>
                                {cloudStatus === 'connected' ? '✓ Connecté & Synchronisé' :
                                 cloudStatus === 'error' ? `⚠️ ${cloudErrorDetail || 'Vérifier les Règles Firebase'}` :
                                 'Connexion en cours...'}
                              </span>
                            </div>
                            <div className="flex flex-col sm:flex-row gap-3">
                              <input 
                                type="url" 
                                value={tempFbUrl} 
                                onChange={(e) => setTempFbUrl(e.target.value)} 
                                placeholder="https://tresorerie-amicale-sp-rieumes-default-rtdb.europe-west1.firebasedatabase.app" 
                                className="flex-1 bg-gray-950 border border-gray-700 rounded-xl p-3 text-sm text-white outline-none focus:border-emerald-500"
                              />
                              <button 
                                onClick={() => {
                                  localStorage.setItem('sp_rieumes_fb_url', tempFbUrl.trim());
                                  setFirebaseDbUrl(tempFbUrl.trim());
                                  setTimeout(() => forcePushToCloud(), 400);
                                }}
                                className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-bold text-sm transition-colors"
                              >
                                Connecter / Fusionner
                              </button>
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </main>
          </div>

          {/* FENÊTRE DE SÉLECTION DU COMPTE */}
          {isAccountPickerOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex justify-center items-center z-50 p-4">
              <div className="bg-gray-900 border border-gray-700 rounded-3xl w-full max-w-2xl overflow-hidden shadow-2xl">
                <div className="p-6 border-b border-gray-800 flex justify-between items-center">
                  <div className="flex items-center space-x-3">
                    <div className="bg-red-600 p-2.5 rounded-xl text-white">
                      <CreditCard className="w-6 h-6" />
                    </div>
                    <div>
                      <h3 className="text-xl font-bold text-white">Quel compte souhaitez-vous traiter ?</h3>
                      <p className="text-xs text-gray-400">Sélectionnez le compte sur lequel saisir ou pointer vos écritures</p>
                    </div>
                  </div>
                  <button onClick={() => setIsAccountPickerOpen(false)} className="text-gray-400 hover:text-white p-1">
                    <X className="w-6 h-6" />
                  </button>
                </div>

                <div className="p-6 grid grid-cols-1 sm:grid-cols-2 gap-4 max-h-[75vh] overflow-y-auto">
                  {accounts.map(acc => {
                    const bal = accountBalances[acc.id] || { pointed: 0, unpointed: 0, theoretical: 0 };
                    const isSelected = currentAccountId === acc.id;
                    return (
                      <button
                        key={acc.id}
                        onClick={() => { setCurrentAccountId(acc.id); setHasSelectedAccountOnce(true); setIsAccountPickerOpen(false); }}
                        className={`text-left p-5 rounded-2xl border transition-all flex flex-col justify-between group ${isSelected ? 'bg-red-600/15 border-red-500 shadow-lg shadow-red-600/10' : 'bg-gray-950 hover:bg-gray-800 border-gray-800 hover:border-gray-600'}`}
                      >
                        <div className="flex items-center justify-between mb-4">
                          <span className="text-lg font-bold text-white group-hover:text-red-400 transition-colors">{acc.name}</span>
                          <span className={`text-xs px-2.5 py-1 rounded-full font-semibold ${isSelected ? 'bg-red-600 text-white' : 'bg-gray-800 text-gray-400'}`}>
                            {isSelected ? 'Actif' : 'Choisir'}
                          </span>
                        </div>
                        <div className="space-y-1.5 pt-3 border-t border-gray-800/80 w-full">
                          <div className="flex justify-between text-xs">
                            <span className="text-gray-400">Solde Pointé :</span>
                            <span className={`font-bold ${bal.pointed >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>{formatCurrency(bal.pointed)}</span>
                          </div>
                          <div className="flex justify-between text-xs">
                            <span className="text-gray-400">Non pointé :</span>
                            <span className="font-medium text-blue-400">{bal.unpointed > 0 ? '+' : ''}{formatCurrency(bal.unpointed)}</span>
                          </div>
                          <div className="flex justify-between text-sm pt-1 border-t border-gray-800/50">
                            <span className="text-gray-300 font-semibold">Solde Théorique :</span>
                            <span className={`font-extrabold ${bal.theoretical >= 0 ? 'text-white' : 'text-red-400'}`}>{formatCurrency(bal.theoretical)}</span>
                          </div>
                        </div>
                      </button>
                    );
                  })}

                  <button
                    onClick={() => { setCurrentAccountId('all'); setHasSelectedAccountOnce(true); setIsAccountPickerOpen(false); }}
                    className={`sm:col-span-2 text-left p-4 rounded-2xl border transition-all flex items-center justify-between ${currentAccountId === 'all' ? 'bg-red-600/15 border-red-500' : 'bg-gray-950 hover:bg-gray-800 border-gray-800'}`}
                  >
                    <div>
                      <span className="font-bold text-white block">Voir tous les comptes (Cumul global)</span>
                      <span className="text-xs text-gray-400">Affiche toutes les écritures confondues</span>
                    </div>
                    <span className="text-xs bg-gray-800 text-gray-300 px-3 py-1.5 rounded-xl border border-gray-700">Vue globale</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FENÊTRE DE SÉLECTION DE L'ANNÉE */}
          {isYearPickerOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex justify-center items-center z-50 p-4">
              <div className="bg-gray-900 border border-gray-700 rounded-3xl w-full max-w-lg overflow-hidden shadow-2xl">
                <div className="p-6 border-b border-gray-800 flex justify-between items-center">
                  <div className="flex items-center space-x-3">
                    <div className="bg-blue-600 p-2.5 rounded-xl text-white">
                      <Calendar className="w-6 h-6" />
                    </div>
                    <div>
                      <h3 className="text-xl font-bold text-white">Choisir l'exercice comptable</h3>
                      <p className="text-xs text-gray-400">Sélectionnez l'année à consulter ou modifier</p>
                    </div>
                  </div>
                  <button onClick={() => setIsYearPickerOpen(false)} className="text-gray-400 hover:text-white p-1">
                    <X className="w-6 h-6" />
                  </button>
                </div>

                <div className="p-6 grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[65vh] overflow-y-auto">
                  {availableYears.map(year => {
                    const isSelected = currentYear === year;
                    const isClosed = closedYears.includes(year);
                    const countTx = transactions.filter(t => t.date.startsWith(year)).length;
                    return (
                      <div
                        key={year}
                        className={`p-4 rounded-2xl border text-left transition-all flex flex-col justify-between ${
                          isSelected 
                            ? 'bg-blue-600/15 border-blue-500 shadow-lg shadow-blue-600/10' 
                            : 'bg-gray-950 hover:bg-gray-800 border-gray-800 hover:border-gray-600'
                        }`}
                      >
                        <div className="flex items-center justify-between mb-2">
                          <button onClick={() => { setCurrentYear(year); setIsYearPickerOpen(false); }} className="text-2xl font-extrabold text-white hover:text-blue-400 transition-colors">
                            {year}
                          </button>
                          <div className="flex items-center space-x-1.5">
                            {canEditCompta ? (
                              <button
                                onClick={(e) => { e.stopPropagation(); toggleYearClosure(year); }}
                                title="Cliquer pour basculer Ouvert / Clôturé"
                                className={`flex items-center space-x-1 text-[11px] px-2.5 py-1 rounded-full border font-semibold transition-colors ${
                                  isClosed 
                                    ? 'bg-yellow-500/10 text-yellow-400 border-yellow-500/30 hover:bg-yellow-500/20' 
                                    : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30 hover:bg-emerald-500/20'
                                }`}
                              >
                                {isClosed ? <><Lock className="w-3 h-3" /><span>Clôturé</span></> : <><Unlock className="w-3 h-3" /><span>Ouvert</span></>}
                              </button>
                            ) : (
                              <span className={`flex items-center space-x-1 text-[11px] px-2.5 py-1 rounded-full border font-semibold ${isClosed ? 'bg-yellow-500/10 text-yellow-400 border-yellow-500/30' : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30'}`}>
                                {isClosed ? 'Clôturé' : 'Ouvert'}
                              </span>
                            )}
                            {canEditCompta && countTx === 0 && availableYears.length > 1 && (
                              <button
                                onClick={(e) => { e.stopPropagation(); deleteYear(year); }}
                                title="Supprimer cet exercice vide"
                                className="p-1 text-gray-500 hover:text-red-400 rounded-lg"
                              >
                                <Trash2 className="w-4 h-4" />
                              </button>
                            )}
                          </div>
                        </div>
                        <button onClick={() => { setCurrentYear(year); setIsYearPickerOpen(false); }} className="text-left w-full flex justify-between items-center pt-2 border-t border-gray-800/60 mt-1">
                          <span className="text-xs text-gray-400">{countTx} écriture(s)</span>
                          <span className="text-xs font-semibold text-blue-400">Choisir →</span>
                        </button>
                      </div>
                    );
                  })}
                </div>

                {canEditCompta && (
                  <div className="p-4 bg-gray-950 border-t border-gray-800 flex justify-between items-center">
                    <span className="text-xs text-gray-400">Garder plusieurs exercices ouverts :</span>
                    <button
                      onClick={() => {
                        const nextYear = openNextYear();
                        setCurrentYear(nextYear);
                        setIsYearPickerOpen(false);
                      }}
                      className="flex items-center space-x-1.5 text-xs bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl font-bold transition-colors shadow"
                    >
                      <Plus className="w-3.5 h-3.5" />
                      <span>Ouvrir l'exercice {Math.max(...availableYears.map(Number)) + 1}</span>
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODALE : CHANGER MON MOT DE PASSE PERSONNEL */}
          {isPasswordModalOpen && (
            <ChangePasswordModal
              email={authUser?.email || ''}
              onClose={() => setIsPasswordModalOpen(false)}
              onSuccess={(msg) => { setIsPasswordModalOpen(false); showToast(msg, 'success'); }}
            />
          )}

          {/* MODALE : VIREMENT INTERNE COMPTE À COMPTE (B) */}
          {canEditCompta && isTransferModalOpen && (
            <InternalTransferModal
              onClose={() => setIsTransferModalOpen(false)}
              onSave={addInternalTransfer}
              accounts={accounts}
              currentAccountId={currentAccountId}
              currentYear={currentYear}
            />
          )}

          {/* MODALE : GESTION / APERÇU DU DOCUMENT LIÉ (JUSTIFICATIF) */}
          {receiptModalTx && (
            <ReceiptModal
              tx={receiptModalTx}
              isClosed={isCurrentYearClosed || !canEditCompta}
              driveScriptUrl={driveScriptUrl}
              suppliers={suppliers}
              onClose={() => setReceiptModalTx(null)}
              onSave={(url, name, sup) => handleUpdateReceipt(receiptModalTx.id, url, name, sup)}
            />
          )}

          {/* MODALE : NOUVELLE OPÉRATION */}
          {canEditCompta && isAddModalOpen && (
            <AddTransactionModal 
              onClose={() => setIsAddModalOpen(false)} 
              onSave={addTransaction} 
              accounts={accounts} 
              currentAccountId={currentAccountId} 
              categories={categories} 
              suppliers={suppliers}
              driveScriptUrl={driveScriptUrl}
            />
          )}

          {/* MODALE : MODIFIER OPÉRATION */}
          {canEditCompta && editModalTx && (
            <EditTransactionModal
              tx={editModalTx}
              onClose={() => setEditModalTx(null)}
              onSave={handleEditTransaction}
              accounts={accounts}
              categories={categories}
              suppliers={suppliers}
              driveScriptUrl={driveScriptUrl}
            />
          )}

          {/* MODALE : CONFIRMATION DE SUPPRESSION D'UNE ÉCRITURE */}
          {deleteConfirmTx && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-50 p-4 print:hidden">
              <div className="bg-gray-900 border border-gray-700 rounded-2xl p-6 max-w-md w-full space-y-4 shadow-2xl">
                <div className="flex items-center space-x-3">
                  <div className="bg-red-500/20 text-red-400 p-3 rounded-xl border border-red-500/30">
                    <AlertTriangle className="w-6 h-6" />
                  </div>
                  <div>
                    <h3 className="text-lg font-bold text-white">Supprimer cette écriture ?</h3>
                    <p className="text-xs text-gray-400">Cette suppression sera synchronisée sur tous les appareils.</p>
                  </div>
                </div>

                <div className="bg-gray-950 border border-gray-800 rounded-xl p-4 space-y-1.5 text-xs">
                  <div className="flex justify-between">
                    <span className="text-gray-400">Date :</span>
                    <span className="text-gray-200 font-medium">{new Date(deleteConfirmTx.date).toLocaleDateString('fr-FR')}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-gray-400">Libellé :</span>
                    <span className="text-white font-bold">{deleteConfirmTx.description}</span>
                  </div>
                  {deleteConfirmTx.supplier && (
                    <div className="flex justify-between">
                      <span className="text-gray-400">Tiers :</span>
                      <span className="text-blue-300">{deleteConfirmTx.supplier}</span>
                    </div>
                  )}
                  <div className="flex justify-between pt-1 border-t border-gray-800">
                    <span className="text-gray-400">Montant :</span>
                    <span className={`font-extrabold text-sm ${deleteConfirmTx.type === 'income' ? 'text-emerald-400' : 'text-red-400'}`}>
                      {deleteConfirmTx.type === 'income' ? '+' : '-'}{formatCurrency(deleteConfirmTx.amount)}
                    </span>
                  </div>
                </div>

                <div className="flex space-x-3 pt-2">
                  <button
                    type="button"
                    onClick={() => setDeleteConfirmTx(null)}
                    className="flex-1 py-3 bg-gray-800 hover:bg-gray-700 text-white rounded-xl text-sm font-medium transition-colors"
                  >
                    Annuler
                  </button>
                  <button
                    type="button"
                    onClick={() => deleteTransaction(deleteConfirmTx.id)}
                    className="flex-1 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl text-sm font-bold transition-colors shadow-lg shadow-red-600/20"
                  >
                    Oui, supprimer
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODALE : NOUVELLE AUTOMATISATION */}
          {isAddAutomationOpen && (
            <AddAutomationModal 
              onClose={() => setIsAddAutomationOpen(false)} 
              onSave={addAutomation} 
              accounts={accounts} 
              categories={categories} 
              suppliers={suppliers}
            />
          )}

          {/* MODALE : CONFIRMATION RESTAURATION */}
          {restoreData && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-50 p-4 print:hidden">
              <div className="bg-gray-900 border border-gray-700 rounded-2xl p-6 max-w-md w-full space-y-4">
                <h3 className="text-xl font-bold text-white">Restaurer la sauvegarde ?</h3>
                <p className="text-sm text-gray-300">Cette action remplacera les données actuelles par celles du fichier sélectionné.</p>
                <div className="flex space-x-3 pt-2">
                  <button onClick={() => setRestoreData(null)} className="flex-1 py-2.5 bg-gray-800 text-white rounded-xl">Annuler</button>
                  <button onClick={confirmRestore} className="flex-1 py-2.5 bg-red-600 text-white rounded-xl font-bold">Confirmer</button>
                </div>
              </div>
            </div>
          )}

          {/* MODALE : CENTRE D'IMPRESSION SUR-MESURE */}
          {isPrintModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex justify-center items-center z-50 p-4 print:hidden">
              <div className="bg-gray-900 border border-gray-700 rounded-3xl w-full max-w-2xl overflow-hidden shadow-2xl">
                <div className="p-6 border-b border-gray-800 flex justify-between items-center">
                  <div className="flex items-center space-x-3">
                    <div className="bg-blue-600 p-2.5 rounded-xl text-white">
                      <Printer className="w-6 h-6" />
                    </div>
                    <div>
                      <h3 className="text-xl font-bold text-white">Centre d'Impression & Export PDF</h3>
                      <p className="text-xs text-gray-400">Choisissez le modèle exact et les options à inclure sur votre document</p>
                    </div>
                  </div>
                  <button onClick={() => setIsPrintModalOpen(false)} className="text-gray-400 hover:text-white p-1">
                    <X className="w-6 h-6" />
                  </button>
                </div>

                <div className="p-6 space-y-5 max-h-[78vh] overflow-y-auto">
                  {/* 1. CHOIX DU MODÈLE DE DOCUMENT */}
                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-2.5">
                      1. Quel document souhaitez-vous imprimer ?
                    </label>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                      {[
                        { id: 'ag_complete', title: "Rapport complet d'AG", desc: "Synthèse par catégorie + soldes des comptes + signatures" },
                        { id: 'balance_category', title: "Bilan détaillé par Catégorie", desc: "Chaque catégorie avec le détail de ses opérations" },
                        { id: 'balance_supplier', title: "Bilan par Fournisseur / Tiers", desc: "Total et détail des sommes versées par fournisseur" },
                        { id: 'ledger_full', title: "Journal complet (Livre de Comptes)", desc: "Toutes les écritures de la période choisie par date" },
                        { id: 'ledger_filtered', title: "Sélection filtrée actuelle", desc: `Uniquement les ${displayedTransactions.length} écriture(s) filtrées à l'écran` },
                        { id: 'unpointed_only', title: "État de Rapprochement Bancaire", desc: "Liste uniquement les opérations non pointées" },
                        { id: 'missing_receipts', title: "Dépenses sans facture liée", desc: "Liste des dépenses à régulariser (justificatif manquant)" }
                      ].map(opt => (
                        <button
                          key={opt.id}
                          type="button"
                          onClick={() => setPrintConfig(prev => ({ ...prev, reportType: opt.id }))}
                          className={`p-3.5 rounded-2xl border text-left transition-all ${
                            printConfig.reportType === opt.id
                              ? 'bg-blue-600/20 border-blue-500 text-white shadow-lg shadow-blue-600/10'
                              : 'bg-gray-950 hover:bg-gray-800 border-gray-800 text-gray-300'
                          }`}
                        >
                          <div className="font-bold text-sm flex items-center justify-between">
                            <span>{opt.title}</span>
                            {printConfig.reportType === opt.id && <CheckCircle className="w-4 h-4 text-blue-400 flex-shrink-0" />}
                          </div>
                          <p className="text-[11px] text-gray-400 mt-1">{opt.desc}</p>
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* 2. PÉRIMÈTRE DES COMPTES & PÉRIODE */}
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2 border-t border-gray-800">
                    <div>
                      <label className="block text-xs font-semibold text-gray-400 mb-1">Compte à imprimer</label>
                      <select
                        value={printConfig.accountScope}
                        onChange={e => setPrintConfig(prev => ({ ...prev, accountScope: e.target.value }))}
                        className="w-full bg-gray-800 border border-gray-700 focus:border-blue-500 rounded-xl p-2.5 text-xs text-white font-semibold outline-none"
                      >
                        {currentAccountId === 'all' ? (
                          <>
                            <option value="all">★ Tous les comptes (Cumul global - Actif)</option>
                            {accounts.map(acc => (
                              <option key={acc.id} value={acc.id}>{acc.name}</option>
                            ))}
                          </>
                        ) : (
                          <>
                            {orderedAccountsForPrint.map((acc, idx) => (
                              <option key={acc.id} value={acc.id}>
                                {idx === 0 ? `★ ${acc.name} (Compte actif)` : acc.name}
                              </option>
                            ))}
                            <option value="all">Tous les comptes (Cumul global)</option>
                          </>
                        )}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-gray-400 mb-1">Du (Date de début)</label>
                      <input
                        type="date"
                        value={printConfig.dateFrom}
                        onChange={e => setPrintConfig(prev => ({ ...prev, dateFrom: e.target.value }))}
                        className="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-white outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-gray-400 mb-1">Au (Date de fin)</label>
                      <input
                        type="date"
                        value={printConfig.dateTo}
                        onChange={e => setPrintConfig(prev => ({ ...prev, dateTo: e.target.value }))}
                        className="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-white outline-none"
                      />
                    </div>
                  </div>

                  {/* 3. OPTIONS D'AFFICHAGE SUR LE PAPIER */}
                  <div className="pt-2 border-t border-gray-800 space-y-3">
                    <label className="block text-xs font-bold uppercase tracking-wider text-gray-300">
                      2. Éléments à faire figurer sur l'impression
                    </label>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <label className="flex items-center space-x-2.5 bg-gray-950 border border-gray-800 p-3 rounded-xl cursor-pointer">
                        <input
                          type="checkbox"
                          checked={printConfig.includeAccountsTable}
                          onChange={e => setPrintConfig(prev => ({ ...prev, includeAccountsTable: e.target.checked }))}
                          className="w-4 h-4 accent-blue-500 rounded"
                        />
                        <span className="text-xs text-gray-200 font-medium">Situation des 3 comptes</span>
                      </label>
                      <label className="flex items-center space-x-2.5 bg-gray-950 border border-gray-800 p-3 rounded-xl cursor-pointer">
                        <input
                          type="checkbox"
                          checked={printConfig.includeSignatures}
                          onChange={e => setPrintConfig(prev => ({ ...prev, includeSignatures: e.target.checked }))}
                          className="w-4 h-4 accent-blue-500 rounded"
                        />
                        <span className="text-xs text-gray-200 font-medium">Cadres de signatures AG</span>
                      </label>
                      <label className="flex items-center space-x-2.5 bg-gray-950 border border-gray-800 p-3 rounded-xl cursor-pointer">
                        <input
                          type="checkbox"
                          checked={printConfig.includePointedCol}
                          onChange={e => setPrintConfig(prev => ({ ...prev, includePointedCol: e.target.checked }))}
                          className="w-4 h-4 accent-blue-500 rounded"
                        />
                        <span className="text-xs text-gray-200 font-medium">Colonne Pointé / N° Chèque</span>
                      </label>
                    </div>

                    {printConfig.includeSignatures && (
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-1">
                        <div>
                          <label className="block text-xs text-gray-400 mb-1">Signataire — Le Trésorier</label>
                          <input
                            type="text"
                            value={treasurerName}
                            onChange={e => setTreasurerName(e.target.value)}
                            placeholder="Frédéric Sudron"
                            className="w-full bg-gray-800 border border-gray-700 focus:border-blue-500 rounded-xl p-2.5 text-xs text-white font-semibold outline-none"
                          />
                        </div>
                        <div>
                          <label className="block text-xs text-gray-400 mb-1">Signataire — Le Président</label>
                          <input
                            type="text"
                            value={presidentName}
                            onChange={e => setPresidentName(e.target.value)}
                            placeholder="Laurent Basque"
                            className="w-full bg-gray-800 border border-gray-700 focus:border-blue-500 rounded-xl p-2.5 text-xs text-white font-semibold outline-none"
                          />
                        </div>
                        <div>
                          <label className="block text-xs text-gray-400 mb-1">Date de signature (Auto : Aujourd'hui)</label>
                          <input
                            type="date"
                            value={printConfig.signatureDate}
                            onChange={e => setPrintConfig(prev => ({ ...prev, signatureDate: e.target.value }))}
                            className="w-full bg-gray-800 border border-gray-700 focus:border-blue-500 rounded-xl p-2.5 text-xs text-white font-semibold outline-none"
                          />
                        </div>
                      </div>
                    )}

                    <div>
                      <label className="block text-xs text-gray-400 mb-1">Titre personnalisé ou note de bas de page (optionnel)</label>
                      <input
                        type="text"
                        placeholder="Ex: Document présenté lors de l'Assemblée Générale du 15/12/2026..."
                        value={printConfig.customTitle}
                        onChange={e => setPrintConfig(prev => ({ ...prev, customTitle: e.target.value }))}
                        className="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-white outline-none"
                      />
                    </div>
                  </div>
                </div>

                <div className="p-5 bg-gray-950 border-t border-gray-800 flex justify-between items-center">
                  <span className="text-xs text-gray-400">
                    Astuce : choisissez <strong>« Enregistrer au format PDF »</strong> dans l'imprimante pour créer un PDF.
                  </span>
                  <div className="flex space-x-3">
                    <button
                      type="button"
                      onClick={() => setIsPrintModalOpen(false)}
                      className="px-4 py-2.5 bg-gray-800 text-white rounded-xl text-xs font-medium"
                    >
                      Fermer
                    </button>
                    <button
                      type="button"
                      onClick={() => window.print()}
                      className="flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow-lg shadow-blue-600/20"
                    >
                      <Printer className="w-4 h-4" />
                      <span>Lancer l'impression / PDF</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ZONE D'IMPRESSION SUR-MESURE (VISIBLE UNIQUEMENT SUR PAPIER / PDF) */}
          <div id="custom-print-report" className="hidden print:block p-6 text-black bg-white text-xs space-y-6">
            {/* EN-TÊTE OFFICIEL AVEC ÉCUSSON DE L'AMICALE */}
            <div className="border-b-2 border-black pb-4 flex justify-between items-center">
              <div className="flex items-center space-x-4">
                <AmicaleLogo size="print" customLogoData={customLogoData} />
                <div>
                  <h1 className="text-xl font-extrabold uppercase tracking-wide">Amicale des Sapeurs-Pompiers de Rieumes</h1>
                  <h2 className="text-base font-bold mt-1">
                    {printConfig.reportType === 'ag_complete' && `Rapport Financier d'Assemblée Générale — Exercice ${currentYear}`}
                    {printConfig.reportType === 'balance_category' && `Bilan Détaillé par Catégorie — Exercice ${currentYear}`}
                    {printConfig.reportType === 'balance_supplier' && `Bilan par Fournisseur / Tiers — Exercice ${currentYear}`}
                    {printConfig.reportType === 'ledger_full' && `Journal du Livre de Comptes — Exercice ${currentYear}`}
                    {printConfig.reportType === 'ledger_filtered' && `Extrait Filtré du Livre de Comptes — Exercice ${currentYear}`}
                    {printConfig.reportType === 'unpointed_only' && `État de Rapprochement Bancaire (Opérations non pointées)`}
                    {printConfig.reportType === 'missing_receipts' && `Relevé des Dépenses sans Justificatif Lié`}
                  </h2>
                  {printConfig.customTitle && <p className="text-xs italic text-gray-700 mt-0.5">{printConfig.customTitle}</p>}
                  <p className="text-xs text-gray-700 mt-1">
                    Périmètre : <strong>{printReportData.scopeAccName}</strong> • Période du <strong>{new Date(printReportData.start).toLocaleDateString('fr-FR')}</strong> au <strong>{new Date(printReportData.end).toLocaleDateString('fr-FR')}</strong>
                  </p>
                </div>
              </div>
              <div className="text-right text-[11px] text-gray-600">
                <p>Édité le {new Date().toLocaleDateString('fr-FR')}</p>
                <p>{printReportData.baseTxs.length} écriture(s)</p>
              </div>
            </div>

            {/* BANDEAU SYNTHÈSE DES TOTAUX */}
            <div className="grid grid-cols-4 gap-3 border border-gray-400 rounded-lg p-3 bg-gray-50">
              <div>
                <span className="block text-[10px] uppercase text-gray-600">Report antérieur</span>
                <span className="text-sm font-bold">{formatCurrency(printReportData.reportBefore)}</span>
              </div>
              <div>
                <span className="block text-[10px] uppercase text-gray-600">Total Recettes</span>
                <span className="text-sm font-bold">+{formatCurrency(printReportData.totalInc)}</span>
              </div>
              <div>
                <span className="block text-[10px] uppercase text-gray-600">Total Dépenses</span>
                <span className="text-sm font-bold">-{formatCurrency(printReportData.totalExp)}</span>
              </div>
              <div>
                <span className="block text-[10px] uppercase text-gray-600">Solde Final Période</span>
                <span className="text-sm font-extrabold">{formatCurrency(printReportData.finalBalance)}</span>
              </div>
            </div>

            {/* CONTENU SELON LE MODÈLE CHOISI */}
            {printConfig.reportType === 'ag_complete' && (
              <div className="space-y-4">
                <h3 className="font-bold text-sm uppercase border-b border-gray-400 pb-1">Récapitulatif par Catégorie</h3>
                <table>
                  <thead>
                    <tr>
                      <th className="text-left">Catégorie</th>
                      <th className="text-right">Recettes</th>
                      <th className="text-right">Dépenses</th>
                      <th className="text-right">Solde net</th>
                    </tr>
                  </thead>
                  <tbody>
                    {printReportData.catEntries.map(([cat, d]) => (
                      <tr key={cat}>
                        <td className="font-medium">{cat}</td>
                        <td className="text-right">{d.income > 0 ? formatCurrency(d.income) : '-'}</td>
                        <td className="text-right">{d.expense > 0 ? formatCurrency(d.expense) : '-'}</td>
                        <td className="text-right font-bold">{formatCurrency(d.total)}</td>
                      </tr>
                    ))}
                    <tr className="font-bold bg-gray-100">
                      <td>TOTAL DES MOUVEMENTS</td>
                      <td className="text-right">{formatCurrency(printReportData.totalInc)}</td>
                      <td className="text-right">{formatCurrency(printReportData.totalExp)}</td>
                      <td className="text-right">{formatCurrency(printReportData.totalNet)}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            )}

            {(printConfig.reportType === 'balance_category' || printConfig.reportType === 'balance_supplier') && (
              <div className="space-y-4">
                {(printConfig.reportType === 'balance_category' ? printReportData.catEntries : printReportData.supEntries).map(([groupName, d]) => (
                  <div key={groupName} className="break-inside-avoid">
                    <div className="flex justify-between items-center bg-gray-100 px-3 py-1.5 font-bold border border-gray-400 border-b-0">
                      <span>{groupName} ({d.txs.length} écriture{d.txs.length > 1 ? 's' : ''})</span>
                      <span>Recettes : {formatCurrency(d.income)} | Dépenses : {formatCurrency(d.expense)} | Solde : {formatCurrency(d.total)}</span>
                    </div>
                    <table>
                      <thead>
                        <tr>
                          <th className="text-left">Date</th>
                          <th className="text-left">Compte</th>
                          <th className="text-left">Libellé</th>
                          <th className="text-left">{printConfig.reportType === 'balance_category' ? 'Fournisseur / Tiers' : 'Catégorie'}</th>
                          {printConfig.includePointedCol && <th className="text-left">Mode / Chèque</th>}
                          <th className="text-right">Montant</th>
                        </tr>
                      </thead>
                      <tbody>
                        {d.txs.map(tx => (
                          <tr key={tx.id}>
