                        className="w-full bg-gray-800 border border-gray-700 focus:border-blue-500 rounded-xl p-2.5 text-xs text-white font-semibold outline-none"
                      >
                        {currentAccountId === 'all' ? (
                          <>
                            <option value="all">★ Tous les comptes (Cumul global - Actif)</option>
                            {accounts.map(acc => (
                              <option key={acc.id} value={acc.id}>{acc.name}</option>
                            ))}
                          </>
                        ) : (
                          <>
                            {orderedAccountsForPrint.map((acc, idx) => (
                              <option key={acc.id} value={acc.id}>
                                {idx === 0 ? `★ ${acc.name} (Compte actif)` : acc.name}
                              </option>
                            ))}
                            <option value="all">Tous les comptes (Cumul global)</option>
                          </>
                        )}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-gray-400 mb-1">Du (Date de début)</label>
                      <input
                        type="date"
                        value={printConfig.dateFrom}
                        onChange={e => setPrintConfig(prev => ({ ...prev, dateFrom: e.target.value }))}
                        className="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-white outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-gray-400 mb-1">Au (Date de fin)</label>
                      <input
                        type="date"
                        value={printConfig.dateTo}
                        onChange={e => setPrintConfig(prev => ({ ...prev, dateTo: e.target.value }))}
                        className="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-white outline-none"
                      />
                    </div>
                  </div>

                  {/* 3. OPTIONS D'AFFICHAGE SUR LE PAPIER */}
                  <div className="pt-2 border-t border-gray-800 space-y-3">
                    <label className="block text-xs font-bold uppercase tracking-wider text-gray-300">
                      2. Éléments à faire figurer sur l'impression
                    </label>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <label className="flex items-center space-x-2.5 bg-gray-950 border border-gray-800 p-3 rounded-xl cursor-pointer">
                        <input
                          type="checkbox"
                          checked={printConfig.includeAccountsTable}
                          onChange={e => setPrintConfig(prev => ({ ...prev, includeAccountsTable: e.target.checked }))}
                          className="w-4 h-4 accent-blue-500 rounded"
                        />
                        <span className="text-xs text-gray-200 font-medium">Situation des 3 comptes</span>
                      </label>
                      <label className="flex items-center space-x-2.5 bg-gray-950 border border-gray-800 p-3 rounded-xl cursor-pointer">
                        <input
                          type="checkbox"
                          checked={printConfig.includeSignatures}
                          onChange={e => setPrintConfig(prev => ({ ...prev, includeSignatures: e.target.checked }))}
                          className="w-4 h-4 accent-blue-500 rounded"
                        />
                        <span className="text-xs text-gray-200 font-medium">Cadres de signatures AG</span>
                      </label>
                      <label className="flex items-center space-x-2.5 bg-gray-950 border border-gray-800 p-3 rounded-xl cursor-pointer">
                        <input
                          type="checkbox"
                          checked={printConfig.includePointedCol}
                          onChange={e => setPrintConfig(prev => ({ ...prev, includePointedCol: e.target.checked }))}
                          className="w-4 h-4 accent-blue-500 rounded"
                        />
                        <span className="text-xs text-gray-200 font-medium">Colonne Pointé / N° Chèque</span>
                      </label>
                    </div>

                    {printConfig.includeSignatures && (
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-1">
                        <div>
                          <label className="block text-xs text-gray-400 mb-1">Signataire — Le Trésorier</label>
                          <input
                            type="text"
                            value={treasurerName}
                            onChange={e => setTreasurerName(e.target.value)}
                            placeholder="Frédéric Sudron"
                            className="w-full bg-gray-800 border border-gray-700 focus:border-blue-500 rounded-xl p-2.5 text-xs text-white font-semibold outline-none"
                          />
                        </div>
                        <div>
                          <label className="block text-xs text-gray-400 mb-1">Signataire — Le Président</label>
                          <input
                            type="text"
                            value={presidentName}
                            onChange={e => setPresidentName(e.target.value)}
                            placeholder="Laurent Basque"
                            className="w-full bg-gray-800 border border-gray-700 focus:border-blue-500 rounded-xl p-2.5 text-xs text-white font-semibold outline-none"
                          />
                        </div>
                        <div>
                          <label className="block text-xs text-gray-400 mb-1">Date de signature (Auto : Aujourd'hui)</label>
                          <input
                            type="date"
                            value={printConfig.signatureDate}
                            onChange={e => setPrintConfig(prev => ({ ...prev, signatureDate: e.target.value }))}
                            className="w-full bg-gray-800 border border-gray-700 focus:border-blue-500 rounded-xl p-2.5 text-xs text-white font-semibold outline-none"
                          />
                        </div>
                      </div>
                    )}

                    <div>
                      <label className="block text-xs text-gray-400 mb-1">Titre personnalisé ou note de bas de page (optionnel)</label>
                      <input
                        type="text"
                        placeholder="Ex: Document présenté lors de l'Assemblée Générale du 15/12/2026..."
                        value={printConfig.customTitle}
                        onChange={e => setPrintConfig(prev => ({ ...prev, customTitle: e.target.value }))}
                        className="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-white outline-none"
                      />
                    </div>
                  </div>
                </div>

                <div className="p-5 bg-gray-950 border-t border-gray-800 flex justify-between items-center">
                  <span className="text-xs text-gray-400">
                    Astuce : choisissez <strong>« Enregistrer au format PDF »</strong> dans l'imprimante pour créer un PDF.
                  </span>
                  <div className="flex space-x-3">
                    <button
                      type="button"
                      onClick={() => setIsPrintModalOpen(false)}
                      className="px-4 py-2.5 bg-gray-800 text-white rounded-xl text-xs font-medium"
                    >
                      Fermer
                    </button>
                    <button
                      type="button"
                      onClick={() => window.print()}
                      className="flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow-lg shadow-blue-600/20"
                    >
                      <Printer className="w-4 h-4" />
                      <span>Lancer l'impression / PDF</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ZONE D'IMPRESSION SUR-MESURE (VISIBLE UNIQUEMENT SUR PAPIER / PDF) */}
          <div id="custom-print-report" className="hidden print:block p-6 text-black bg-white text-xs space-y-6">
            {/* EN-TÊTE OFFICIEL */}
            <div className="border-b-2 border-black pb-4 flex justify-between items-start">
              <div>
                <h1 className="text-xl font-extrabold uppercase tracking-wide">Amicale des Sapeurs-Pompiers de Rieumes</h1>
                <h2 className="text-base font-bold mt-1">
                  {printConfig.reportType === 'ag_complete' && `Rapport Financier d'Assemblée Générale — Exercice ${currentYear}`}
                  {printConfig.reportType === 'balance_category' && `Bilan Détaillé par Catégorie — Exercice ${currentYear}`}
                  {printConfig.reportType === 'balance_supplier' && `Bilan par Fournisseur / Tiers — Exercice ${currentYear}`}
                  {printConfig.reportType === 'ledger_full' && `Journal du Livre de Comptes — Exercice ${currentYear}`}
                  {printConfig.reportType === 'ledger_filtered' && `Extrait Filtré du Livre de Comptes — Exercice ${currentYear}`}
                  {printConfig.reportType === 'unpointed_only' && `État de Rapprochement Bancaire (Opérations non pointées)`}
                  {printConfig.reportType === 'missing_receipts' && `Relevé des Dépenses sans Justificatif Lié`}
                </h2>
                {printConfig.customTitle && <p className="text-xs italic text-gray-700 mt-0.5">{printConfig.customTitle}</p>}
                <p className="text-xs text-gray-700 mt-1">
                  Périmètre : <strong>{printReportData.scopeAccName}</strong> • Période du <strong>{new Date(printReportData.start).toLocaleDateString('fr-FR')}</strong> au <strong>{new Date(printReportData.end).toLocaleDateString('fr-FR')}</strong>
                </p>
              </div>
              <div className="text-right text-[11px] text-gray-600">
                <p>Édité le {new Date().toLocaleDateString('fr-FR')}</p>
                <p>{printReportData.baseTxs.length} écriture(s)</p>
              </div>
            </div>

            {/* BANDEAU SYNTHÈSE DES TOTAUX */}
            <div className="grid grid-cols-4 gap-3 border border-gray-400 rounded-lg p-3 bg-gray-50">
              <div>
                <span className="block text-[10px] uppercase text-gray-600">Report antérieur</span>
                <span className="text-sm font-bold">{formatCurrency(printReportData.reportBefore)}</span>
              </div>
              <div>
                <span className="block text-[10px] uppercase text-gray-600">Total Recettes</span>
                <span className="text-sm font-bold">+{formatCurrency(printReportData.totalInc)}</span>
              </div>
              <div>
                <span className="block text-[10px] uppercase text-gray-600">Total Dépenses</span>
                <span className="text-sm font-bold">-{formatCurrency(printReportData.totalExp)}</span>
              </div>
              <div>
                <span className="block text-[10px] uppercase text-gray-600">Solde Final Période</span>
                <span className="text-sm font-extrabold">{formatCurrency(printReportData.finalBalance)}</span>
              </div>
            </div>

            {/* CONTENU SELON LE MODÈLE CHOISI */}
            {printConfig.reportType === 'ag_complete' && (
              <div className="space-y-4">
                <h3 className="font-bold text-sm uppercase border-b border-gray-400 pb-1">Récapitulatif par Catégorie</h3>
                <table>
                  <thead>
                    <tr>
                      <th className="text-left">Catégorie</th>
                      <th className="text-right">Recettes</th>
                      <th className="text-right">Dépenses</th>
                      <th className="text-right">Solde net</th>
                    </tr>
                  </thead>
                  <tbody>
                    {printReportData.catEntries.map(([cat, d]) => (
                      <tr key={cat}>
                        <td className="font-medium">{cat}</td>
                        <td className="text-right">{d.income > 0 ? formatCurrency(d.income) : '-'}</td>
                        <td className="text-right">{d.expense > 0 ? formatCurrency(d.expense) : '-'}</td>
                        <td className="text-right font-bold">{formatCurrency(d.total)}</td>
                      </tr>
                    ))}
                    <tr className="font-bold bg-gray-100">
                      <td>TOTAL DES MOUVEMENTS</td>
                      <td className="text-right">{formatCurrency(printReportData.totalInc)}</td>
                      <td className="text-right">{formatCurrency(printReportData.totalExp)}</td>
                      <td className="text-right">{formatCurrency(printReportData.totalNet)}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            )}

            {(printConfig.reportType === 'balance_category' || printConfig.reportType === 'balance_supplier') && (
              <div className="space-y-4">
                {(printConfig.reportType === 'balance_category' ? printReportData.catEntries : printReportData.supEntries).map(([groupName, d]) => (
                  <div key={groupName} className="break-inside-avoid">
                    <div className="flex justify-between items-center bg-gray-100 px-3 py-1.5 font-bold border border-gray-400 border-b-0">
                      <span>{groupName} ({d.txs.length} écriture{d.txs.length > 1 ? 's' : ''})</span>
                      <span>Recettes : {formatCurrency(d.income)} | Dépenses : {formatCurrency(d.expense)} | Solde : {formatCurrency(d.total)}</span>
                    </div>
                    <table>
                      <thead>
                        <tr>
                          <th className="text-left">Date</th>
                          <th className="text-left">Compte</th>
                          <th className="text-left">Libellé</th>
                          <th className="text-left">{printConfig.reportType === 'balance_category' ? 'Fournisseur / Tiers' : 'Catégorie'}</th>
                          {printConfig.includePointedCol && <th className="text-left">Mode / Chèque</th>}
                          <th className="text-right">Montant</th>
                        </tr>
                      </thead>
                      <tbody>
                        {d.txs.map(tx => (
                          <tr key={tx.id}>
                            <td>{new Date(tx.date).toLocaleDateString('fr-FR')}</td>
                            <td>{accounts.find(a => a.id === tx.accountId)?.name || '-'}</td>
                            <td>{tx.description}</td>
                            <td>{printConfig.reportType === 'balance_category' ? (tx.supplier || '-') : (tx.category || '-')}</td>
                            {printConfig.includePointedCol && (
                              <td>{tx.paymentMethod || '-'}{tx.checkNumber ? ` (N°${tx.checkNumber})` : ''}</td>
                            )}
                            <td className="text-right font-semibold">{tx.type === 'income' ? '+' : '-'}{formatCurrency(tx.amount)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                ))}
              </div>
            )}

            {(printConfig.reportType === 'ledger_full' || printConfig.reportType === 'ledger_filtered' || printConfig.reportType === 'unpointed_only' || printConfig.reportType === 'missing_receipts') && (
              <div>
                <table>
                  <thead>
                    <tr>
                      <th className="text-left">Date</th>
                      <th className="text-left">Compte</th>
                      <th className="text-left">Libellé</th>
                      <th className="text-left">Fournisseur / Tiers</th>
                      <th className="text-left">Catégorie</th>
                      {printConfig.includePointedCol && <th className="text-left">Mode / Chèque</th>}
                      {printConfig.includePointedCol && <th className="text-center">Pointé</th>}
                      <th className="text-right">Montant</th>
                    </tr>
                  </thead>
                  <tbody>
                    {printReportData.baseTxs.length === 0 ? (
                      <tr>
                        <td colSpan={printConfig.includePointedCol ? 8 : 6} className="text-center py-4">Aucune écriture sur cette sélection.</td>
                      </tr>
                    ) : (
                      printReportData.baseTxs.map(tx => (
                        <tr key={tx.id}>
                          <td>{new Date(tx.date).toLocaleDateString('fr-FR')}</td>
                          <td>{accounts.find(a => a.id === tx.accountId)?.name || '-'}</td>
                          <td>{tx.description}</td>
                          <td>{tx.supplier || '-'}</td>
                          <td>{tx.category || '-'}</td>
                          {printConfig.includePointedCol && (
                            <td>{tx.paymentMethod || '-'}{tx.checkNumber ? ` (N°${tx.checkNumber})` : ''}</td>
                          )}
                          {printConfig.includePointedCol && (
                            <td className="text-center">{tx.reconciled ? 'Oui' : 'Non'}</td>
                          )}
                          <td className="text-right font-bold">{tx.type === 'income' ? '+' : '-'}{formatCurrency(tx.amount)}</td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            )}

            {/* TABLEAU DE SITUATION DES COMPTES (OPTIONNEL) */}
            {printConfig.includeAccountsTable && (
              <div className="pt-4 break-inside-avoid">
                <h3 className="font-bold text-sm uppercase border-b border-gray-400 pb-1 mb-2">
                  Situation de la trésorerie par compte au 31/12/{currentYear}
                </h3>
                <div className="grid grid-cols-3 gap-3">
                  {accounts.map(acc => {
                    const eoy = endOfYearAccountBalances[acc.id] || { pointed: 0, theoretical: 0 };
                    return (
                      <div key={acc.id} className="border border-gray-400 rounded-lg p-3">
                        <span className="font-bold uppercase block">{acc.name}</span>
                        <div className="flex justify-between mt-1">
                          <span>Solde théorique :</span>
                          <span className="font-extrabold">{formatCurrency(eoy.theoretical)}</span>
                        </div>
                        <div className="flex justify-between mt-0.5 text-gray-700">
                          <span>Solde pointé :</span>
                          <span className="font-semibold">{formatCurrency(eoy.pointed)}</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* CADRES DE SIGNATURES D'ASSEMBLÉE GÉNÉRALE (OPTIONNEL : TRÉSORIER & PRÉSIDENT) */}
            {printConfig.includeSignatures && (
              <div className="pt-4 break-inside-avoid">
                <div className="flex justify-between items-center mb-3 text-xs">
                  <span>Certifié sincère et véritable — Exercice {currentYear}.</span>
                  <span className="font-semibold">Fait à Rieumes, le {formattedSignatureDate}</span>
                </div>
                <div className="grid grid-cols-2 gap-6">
                  <div className="border border-gray-500 rounded-lg p-3.5 min-h-[110px] flex flex-col justify-between">
                    <div>

    // --- MODALE DÉDIÉE : LIER / SCANNER / ENVOYER UN DOCUMENT SUR GOOGLE DRIVE ---
    function ReceiptModal({ tx, isClosed, driveScriptUrl, suppliers = [], onClose, onSave }) {
      const [url, setUrl] = useState(tx.receiptUrl || '');
      const [fileName, setFileName] = useState(tx.receiptName || '');
      const [folderTier, setFolderTier] = useState((tx.supplier || '').trim() || (tx.description || '').trim() || 'Autres_Tiers');
      const [uploadSuccessInfo, setUploadSuccessInfo] = useState('');
      const [fileError, setFileError] = useState('');
      const [isUploading, setIsUploading] = useState(false);

      const isDataUrl = url.startsWith('data:');
      const isImage = isDataUrl ? url.startsWith('data:image/') : /\.(jpg|jpeg|png|gif|webp)(\?.*)?$/i.test(url);
      const txYear = (tx.date || '').split('-')[0] || new Date().getFullYear().toString();

      const handleFileOrCamera = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setFileError('');
        setUploadSuccessInfo('');

        const tierLabel = (folderTier || '').trim() || (tx.supplier || '').trim() || (tx.description || '').trim() || 'Autres_Tiers';

        if (driveScriptUrl) {
          setIsUploading(true);
          try {
            const uploaded = await uploadFileToGoogleDrive(file, driveScriptUrl, tierLabel, txYear);
            setUrl(uploaded.url);
            setFileName(uploaded.name);
            if ((uploaded.folder || '').includes('/')) {
              setUploadSuccessInfo(`✅ Rangé dans Google Drive : ${uploaded.folder} / ${uploaded.name}`);
            } else {
              setUploadSuccessInfo(`⚠️ Rangé dans "${uploaded.folder}" uniquement. Pour activer le sous-dossier "${tierLabel}", faites "Déployer > Nouveau déploiement" dans Google Apps Script et collez la nouvelle URL dans Paramètres.`);
            }
            setIsUploading(false);
          } catch (err) {
            setFileError("Échec de l'envoi vers Google Drive : " + err.message);
            setIsUploading(false);
          }
        } else {
          if (file.size > 1500000) {
            setFileError('Fichier > 1,5 Mo. Configurez la passerelle Google Drive dans les Paramètres pour déposer automatiquement vos fichiers dans votre Drive sans alourdir Firebase !');
            return;
          }
          const reader = new FileReader();
          reader.onload = (ev) => {
            setUrl(ev.target.result);
            setFileName(buildInvoiceFileName(file, tierLabel));
          };
          reader.readAsDataURL(file);
        }
      };

      const openDocument = () => {
        if (!url) return;
        if (isDataUrl) {
          const win = window.open();
          if (win) {
            win.document.write(`<iframe src="${url}" frameborder="0" style="border:0; top:0; left:0; bottom:0; right:0; width:100%; height:100%;" allowfullscreen></iframe>`);
          }
        } else {
          const formattedUrl = /^https?:\/\//i.test(url) ? url : `https://${url}`;
          window.open(formattedUrl, '_blank', 'noopener,noreferrer');
        }
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-50 p-4">
          <div className="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-lg overflow-visible shadow-2xl">
            <div className="flex justify-between items-center p-5 border-b border-gray-800">
              <div className="flex items-center space-x-2.5">
                <div className="bg-blue-600/20 text-blue-400 p-2 rounded-xl border border-blue-500/30">
                  <Paperclip className="w-5 h-5" />
                </div>
                <div>
                  <h3 className="text-lg font-bold text-white">Document / Facture liée</h3>
                  <p className="text-xs text-gray-400 truncate max-w-xs">
                    {tx.supplier ? `${tx.supplier} - ` : ''}{tx.description} ({new Date(tx.date).toLocaleDateString('fr-FR')})
                  </p>
                </div>
              </div>
              <button onClick={onClose} className="text-gray-400 hover:text-white"><X className="w-6 h-6"/></button>
            </div>

            <div className="p-6 space-y-5 max-h-[82vh] overflow-y-auto">
              {url ? (
                <div className="bg-gray-950 border border-emerald-500/30 rounded-xl p-4 space-y-3">
                  <div className="flex items-center justify-between gap-2">
                    <div className="overflow-hidden">
                      <span className="text-xs font-bold text-emerald-400 flex items-center">
                        <CheckCircle className="w-4 h-4 mr-1.5 flex-shrink-0" />
                        <span className="truncate">{fileName || (isDataUrl ? 'Fichier joint' : 'Facture sur Google Drive')}</span>
                      </span>
                      {!isDataUrl && <p className="text-[11px] text-gray-500 truncate mt-0.5">{url}</p>}
                    </div>
                    <button
                      type="button"
                      onClick={openDocument}
                      className="flex items-center space-x-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3.5 py-2 rounded-lg transition-colors shadow flex-shrink-0"
                    >
                      <ExternalLink className="w-3.5 h-3.5" />
                      <span>Ouvrir la facture</span>
                    </button>
                  </div>

                  {uploadSuccessInfo && (
                    <div className={`p-2.5 rounded-lg text-xs font-medium border ${uploadSuccessInfo.startsWith('✅') ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' : 'bg-amber-500/10 border-amber-500/30 text-amber-300'}`}>
                      {uploadSuccessInfo}
                    </div>
                  )}

                  {isImage && (
                    <div className="mt-2 rounded-lg overflow-hidden border border-gray-800 bg-black/40 max-h-60 flex justify-center">
                      <img src={url} alt="Aperçu du justificatif" className="max-h-60 object-contain" />
                    </div>
                  )}
                </div>
              ) : (
                <div className="bg-gray-950 border border-gray-800 rounded-xl p-4 text-center text-xs text-gray-400">
                  Aucune facture n'est encore liée à cette écriture.
                </div>
              )}

              {!isClosed && (
                <div className="space-y-4 pt-2 border-t border-gray-800">
                  <div>
                    <label className="block text-xs font-semibold text-gray-300 mb-1.5">
                      1. Nom du sous-dossier Fournisseur / Tiers dans « {txYear} » :
                    </label>
                    <AutocompleteInput
                      value={folderTier}
                      onChange={setFolderTier}
                      options={suppliers.map(s => s.name)}
                      placeholder="Ex: Super U Rieumes"
                      className="w-full bg-gray-800 border border-gray-700 focus:border-blue-500 rounded-xl p-2.5 text-xs text-white font-semibold outline-none"
                    />
                    <p className="text-[11px] text-gray-400 mt-1">
                      Chemin Drive créé : <strong className="text-emerald-400">{txYear} / {(folderTier || 'Autres_Tiers').trim()} / facture_{(folderTier || 'tiers').trim().replace(/[^a-zA-Z0-9]/g, '_')}...</strong>
                    </p>
                  </div>

                  <div>
                    <div className="flex items-center justify-between mb-2">
                      <label className="text-xs font-bold uppercase tracking-wider text-gray-300">
                        2. Choisir ou scanner le document
                      </label>
                      {driveScriptUrl ? (
                        <span className="text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/20">Dossiers Année + Tiers actifs</span>
                      ) : (
                        <span className="text-[10px] bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded-full border border-amber-500/20">Mode local (voir Paramètres)</span>
                      )}
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <label className={`flex flex-col items-center justify-center p-4 rounded-xl border border-dashed cursor-pointer transition-all text-center ${isUploading ? 'opacity-50 pointer-events-none bg-gray-800 border-gray-600' : 'bg-gray-800/70 hover:bg-gray-800 border-blue-500/40 hover:border-blue-400 text-gray-200'}`}>
                        <FolderUp className="w-6 h-6 text-blue-400 mb-1.5" />
                        <span className="text-xs font-bold text-white">{isUploading ? 'Envoi vers Drive en cours...' : 'Choisir un fichier (PC / Tél)'}</span>
                        <span className="text-[10px] text-gray-400 mt-0.5">Rangé dans {txYear} / {(folderTier || 'Tiers').trim()}</span>
                        <input type="file" accept="image/*,.pdf" onChange={handleFileOrCamera} disabled={isUploading} className="hidden" />
                      </label>

                      <label className={`flex flex-col items-center justify-center p-4 rounded-xl border border-dashed cursor-pointer transition-all text-center ${isUploading ? 'opacity-50 pointer-events-none bg-gray-800 border-gray-600' : 'bg-gray-800/70 hover:bg-gray-800 border-emerald-500/40 hover:border-emerald-400 text-gray-200'}`}>
                        <Camera className="w-6 h-6 text-emerald-400 mb-1.5" />
                        <span className="text-xs font-bold text-white">{isUploading ? 'Envoi vers Drive en cours...' : 'Scanner avec le Téléphone'}</span>
                        <span className="text-[10px] text-gray-400 mt-0.5">Rangé dans {txYear} / {(folderTier || 'Tiers').trim()}</span>
                        <input type="file" accept="image/*" capture="environment" onChange={handleFileOrCamera} disabled={isUploading} className="hidden" />
                      </label>
                    </div>
                    {fileError && <p className="text-xs text-red-400 mt-2">{fileError}</p>}
                  </div>

                  <div className="relative flex py-1 items-center">
                    <div className="flex-grow border-t border-gray-800"></div>
                    <span className="flex-shrink mx-3 text-[11px] text-gray-500 uppercase">ou lien existant</span>
                    <div className="flex-grow border-t border-gray-800"></div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-gray-400 mb-1.5">
                      Coller le lien d'un fichier déjà présent dans votre Google Drive :
                    </label>
                    <input
                      type="text"
                      placeholder="https://drive.google.com/file/d/..."
                      value={isDataUrl ? '' : url}
                      onChange={(e) => { setUrl(e.target.value); setFileName(''); }}
                      className="w-full bg-gray-800 border border-gray-700 focus:border-blue-500 rounded-xl p-3 text-sm text-white outline-none"
                    />
                  </div>
                </div>
              )}

              <div className="pt-3 flex justify-between items-center gap-3 border-t border-gray-800">
                {!isClosed && url && (
                  <button
                    type="button"
                    onClick={() => onSave('', '', tx.supplier)}
                    className="px-4 py-2.5 bg-red-600/15 hover:bg-red-600/25 text-red-400 border border-red-500/30 rounded-xl text-xs font-bold transition-colors"
                  >
                    Retirer le document
                  </button>
                )}
                <div className="flex space-x-3 ml-auto">
                  <button type="button" onClick={onClose} className="px-5 py-2.5 bg-gray-800 text-white rounded-xl text-sm">Fermer</button>
                  {!isClosed && (
                    <button
                      type="button"
                      disabled={isUploading}
                      onClick={() => onSave(url.trim(), fileName, (!tx.supplier && folderTier && folderTier !== tx.description) ? folderTier.trim() : tx.supplier)}
                      className="px-6 py-2.5 bg-red-600 hover:bg-red-700 disabled:opacity-50 text-white rounded-xl text-sm font-bold shadow-lg shadow-red-600/20"
                    >
                      Enregistrer sur la ligne
                    </button>
                  )}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function AddTransactionModal({ onClose, onSave, accounts, currentAccountId, categories, suppliers, driveScriptUrl }) {
      const [type, setType] = useState('expense');
      const [amount, setAmount] = useState('');
      const [description, setDescription] = useState('');
      const [supplier, setSupplier] = useState('');
      const [category, setCategory] = useState('');
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [accountId, setAccountId] = useState(currentAccountId === 'all' && accounts.length > 0 ? accounts[0].id : currentAccountId);
      const [paymentMethod, setPaymentMethod] = useState('CB');
      const [checkNumber, setCheckNumber] = useState('');
      const [receiptUrl, setReceiptUrl] = useState('');
      const [receiptName, setReceiptName] = useState('');
      const [isUploading, setIsUploading] = useState(false);

      const handleFile = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const tierLabel = (supplier || '').trim() || (description || '').trim() || 'tiers';
        const txYear = (date || '').split('-')[0] || new Date().getFullYear().toString();
        if (driveScriptUrl) {
          setIsUploading(true);
          try {
            const res = await uploadFileToGoogleDrive(file, driveScriptUrl, tierLabel, txYear);
            setReceiptUrl(res.url);
            setReceiptName(res.name);
          } catch (err) {
            alert("Erreur d'envoi vers Google Drive : " + err.message);
          }
          setIsUploading(false);
        } else {
          if (file.size > 1500000) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            setReceiptUrl(ev.target.result);
            setReceiptName(buildInvoiceFileName(file, tierLabel));
          };
          reader.readAsDataURL(file);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!amount || !description || !category) return;
        onSave({ 
          type, 
          amount: parseFloat(amount), 
          description, 
          supplier: supplier.trim(), 
          category: category.trim(), 
          date, 
          accountId, 
          paymentMethod, 
          checkNumber: paymentMethod === 'Chèque' ? checkNumber.trim() : null, 
          receiptUrl: receiptUrl.trim() || null,
          receiptName: receiptName || null,
          reconciled: false 
        });
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-50 p-4">
          <div className="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-md overflow-visible shadow-2xl">
            <div className="flex justify-between items-center p-6 border-b border-gray-800">
              <h3 className="text-xl font-bold text-white">Nouvelle Opération</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white"><X className="w-6 h-6"/></button>
            </div>
            <form onSubmit={handleSubmit} className="p-6 space-y-4 max-h-[82vh] overflow-y-auto">
              <div className="grid grid-cols-2 gap-4">
                <button type="button" onClick={() => setType('expense')} className={`p-3 rounded-xl border flex items-center justify-center space-x-2 ${type === 'expense' ? 'bg-red-500/10 border-red-500 text-red-500' : 'bg-gray-800 border-gray-700 text-gray-400'}`}><ArrowDownRight className="w-5 h-5"/><span className="font-medium">Dépense</span></button>
                <button type="button" onClick={() => setType('income')} className={`p-3 rounded-xl border flex items-center justify-center space-x-2 ${type === 'income' ? 'bg-emerald-500/10 border-emerald-500 text-emerald-500' : 'bg-gray-800 border-gray-700 text-gray-400'}`}><ArrowUpRight className="w-5 h-5"/><span className="font-medium">Recette</span></button>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="block text-sm text-gray-400 mb-1">Montant (€)</label><input type="number" step="0.01" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={amount} onChange={(e) => setAmount(e.target.value)} /></div>
                <div><label className="block text-sm text-gray-400 mb-1">Date</label><input type="date" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={date} onChange={(e) => setDate(e.target.value)} /></div>
              </div>
              <div><label className="block text-sm text-gray-400 mb-1">Compte</label><select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={accountId} onChange={(e) => setAccountId(e.target.value)}>{accounts.map(acc => <option key={acc.id} value={acc.id}>{acc.name}</option>)}</select></div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="block text-sm text-gray-400 mb-1">Mode</label><select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)}><option value="CB">CB</option><option value="Chèque">Chèque</option><option value="Prélèvement">Prélèvement</option><option value="Virement">Virement</option><option value="Espèces">Espèces</option></select></div>
                {paymentMethod === 'Chèque' && <div><label className="block text-sm text-gray-400 mb-1">N° chèque</label><input type="text" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={checkNumber} onChange={(e) => setCheckNumber(e.target.value)} /></div>}
              </div>
              <div><label className="block text-sm text-gray-400 mb-1">Libellé</label><input type="text" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={description} onChange={(e) => setDescription(e.target.value)} /></div>
              <div>
                <label className="block text-sm text-gray-400 mb-1">Fournisseur / Tiers (optionnel)</label>
                <AutocompleteInput direction="up" value={supplier} onChange={setSupplier} options={suppliers.map(s => s.name)} required={false} placeholder="Rechercher ou saisir un nouveau tiers..." className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" />
              </div>
              <div>
                <label className="block text-sm text-gray-400 mb-1">Catégorie</label>
                <AutocompleteInput direction="up" value={category} onChange={setCategory} options={categories.map(c => c.name)} required={true} placeholder="Choisir ou taper une catégorie..." className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" />
              </div>
              <div>
                <label className="block text-sm text-gray-400 mb-1 flex items-center justify-between">
                  <span>Facture / Justificatif (Dossier {(date || '').split('-')[0]})</span>
                  <div className="flex items-center space-x-3">
                    <label className="text-xs text-blue-400 hover:underline cursor-pointer flex items-center">
                      <FolderUp className="w-3.5 h-3.5 mr-1" />
                      <span>{isUploading ? 'Envoi Drive...' : 'Fichier -> Drive'}</span>
                      <input type="file" accept="image/*,.pdf" onChange={handleFile} disabled={isUploading} className="hidden" />
                    </label>
                    <label className="text-xs text-emerald-400 hover:underline cursor-pointer flex items-center">
                      <Camera className="w-3.5 h-3.5 mr-1" />
                      <span>Photo</span>
                      <input type="file" accept="image/*" capture="environment" onChange={handleFile} disabled={isUploading} className="hidden" />
                    </label>
                  </div>
                </label>
                <input 
                  type="text" 
                  placeholder="Lien Google Drive automatique ou collé..." 
                  className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm text-white outline-none" 
                  value={receiptUrl.startsWith('data:') ? `[Fichier joint : ${receiptName}]` : (receiptName ? `${receiptName} (${receiptUrl})` : receiptUrl)} 
                  onChange={(e) => { setReceiptUrl(e.target.value); setReceiptName(''); }} 
                />
              </div>
              <div className="pt-4 flex space-x-3"><button type="button" onClick={onClose} className="flex-1 py-3 bg-gray-800 text-white rounded-xl">Annuler</button><button type="submit" disabled={isUploading} className="flex-1 py-3 bg-red-600 disabled:opacity-50 text-white rounded-xl font-bold">Enregistrer</button></div>
            </form>
          </div>
        </div>
      );
    }

              </div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="block text-sm text-gray-400 mb-1">Montant (€)</label><input type="number" step="0.01" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={amount} onChange={(e) => setAmount(e.target.value)} /></div>
                <div><label className="block text-sm text-gray-400 mb-1">Date</label><input type="date" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={date} onChange={(e) => setDate(e.target.value)} /></div>
              </div>
              <div><label className="block text-sm text-gray-400 mb-1">Compte</label><select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={accountId} onChange={(e) => setAccountId(e.target.value)}>{accounts.map(acc => <option key={acc.id} value={acc.id}>{acc.name}</option>)}</select></div>
              <div><label className="block text-sm text-gray-400 mb-1">Libellé</label><input type="text" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={description} onChange={(e) => setDescription(e.target.value)} /></div>
              <div>
                <label className="block text-sm text-gray-400 mb-1">Fournisseur / Tiers</label>
                <AutocompleteInput direction="up" value={supplier} onChange={setSupplier} options={suppliers.map(s => s.name)} required={false} placeholder="Rechercher ou saisir un tiers..." className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" />
              </div>
              <div>
                <label className="block text-sm text-gray-400 mb-1">Catégorie</label>
                <AutocompleteInput direction="up" value={category} onChange={setCategory} options={categories.map(c => c.name)} required={true} placeholder="Choisir catégorie..." className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" />
              </div>
              <div>
                <label className="block text-sm text-gray-400 mb-1 flex items-center justify-between">
                  <span>Document / Justificatif lié</span>
                  <div className="flex items-center space-x-3">
                    <label className="text-xs text-blue-400 hover:underline cursor-pointer flex items-center">
                      <FolderUp className="w-3.5 h-3.5 mr-1" />
                      <span>{isUploading ? 'Envoi Drive...' : 'Fichier -> Drive'}</span>
                      <input type="file" accept="image/*,.pdf" onChange={handleFile} disabled={isUploading} className="hidden" />
                    </label>
                    <label className="text-xs text-emerald-400 hover:underline cursor-pointer flex items-center">
                      <Camera className="w-3.5 h-3.5 mr-1" />
                      <span>Photo</span>
                      <input type="file" accept="image/*" capture="environment" onChange={handleFile} disabled={isUploading} className="hidden" />
                    </label>
                  </div>
                </label>
                <div className="flex space-x-2">
                  <input 
                    type="text" 
                    placeholder="Lien (https://drive.google.com/...)" 
                    className="flex-1 bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm text-white outline-none" 
                    value={receiptUrl.startsWith('data:') ? `[Fichier joint : ${receiptName}]` : receiptUrl} 
                    onChange={(e) => { setReceiptUrl(e.target.value); setReceiptName(''); }} 
                  />
                  {receiptUrl && (
                    <button type="button" onClick={() => { setReceiptUrl(''); setReceiptName(''); }} className="px-3 bg-gray-800 hover:bg-red-600/20 text-gray-400 hover:text-red-400 rounded-lg border border-gray-700 text-xs">
                      Effacer
                    </button>
                  )}
                </div>
              </div>
              {showConfirmSave ? (
                <div className="pt-3 border-t border-amber-500/30 bg-amber-500/10 p-3.5 rounded-xl space-y-3">
                  <p className="text-xs text-amber-300 font-semibold text-center">
                    Confirmez-vous l'enregistrement des modifications sur cette écriture ?
                  </p>
                  <div className="flex space-x-3">
                    <button type="button" onClick={() => setShowConfirmSave(false)} className="flex-1 py-2.5 bg-gray-800 text-white rounded-xl text-xs font-medium">Retour</button>
                    <button type="submit" disabled={isUploading} className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-lg">Oui, confirmer la modification</button>
                  </div>
                </div>
              ) : (
                <div className="pt-4 flex space-x-3">
                  <button type="button" onClick={onClose} className="flex-1 py-3 bg-gray-800 text-white rounded-xl">Annuler</button>
                  <button type="submit" disabled={isUploading} className="flex-1 py-3 bg-red-600 disabled:opacity-50 text-white rounded-xl font-bold">Mettre à jour</button>
                </div>
              )}
            </form>
          </div>
        </div>
      );
    }

    function AddAutomationModal({ onClose, onSave, accounts, categories, suppliers }) {
      const [type, setType] = useState('expense');
      const [amount, setAmount] = useState('');
      const [description, setDescription] = useState('');
      const [supplier, setSupplier] = useState('');
      const [category, setCategory] = useState('');
      const [startDate, setStartDate] = useState(new Date().toISOString().split('T')[0]);
      const [frequency, setFrequency] = useState('monthly');
      const [paymentMethod, setPaymentMethod] = useState('Prélèvement');
      const [accountId, setAccountId] = useState(accounts.length > 0 ? accounts[0].id : '');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!amount || !description || !category) return;
        onSave({ type, amount: parseFloat(amount), description, supplier: supplier.trim(), category: category.trim(), startDate, nextDate: startDate, frequency, paymentMethod, accountId });
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-50 p-4">
          <div className="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-md overflow-visible shadow-2xl">
            <div className="flex justify-between items-center p-6 border-b border-gray-800"><h3 className="text-xl font-bold text-white">Nouvelle Automatisation</h3><button onClick={onClose} className="text-gray-400 hover:text-white"><X className="w-6 h-6"/></button></div>
            <form onSubmit={handleSubmit} className="p-6 space-y-4 max-h-[82vh] overflow-y-auto">
              <div className="grid grid-cols-2 gap-4">
                <button type="button" onClick={() => setType('expense')} className={`p-3 rounded-xl border flex items-center justify-center space-x-2 ${type === 'expense' ? 'bg-red-500/10 border-red-500 text-red-500' : 'bg-gray-800 border-gray-700 text-gray-400'}`}><ArrowDownRight className="w-5 h-5"/><span className="font-medium">Dépense</span></button>
                <button type="button" onClick={() => setType('income')} className={`p-3 rounded-xl border flex items-center justify-center space-x-2 ${type === 'income' ? 'bg-emerald-500/10 border-emerald-500 text-emerald-500' : 'bg-gray-800 border-gray-700 text-gray-400'}`}><ArrowUpRight className="w-5 h-5"/><span className="font-medium">Recette</span></button>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="block text-sm text-gray-400 mb-1">Montant (€)</label><input type="number" step="0.01" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={amount} onChange={(e) => setAmount(e.target.value)} /></div>
                <div><label className="block text-sm text-gray-400 mb-1">Date de début</label><input type="date" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={startDate} onChange={(e) => setStartDate(e.target.value)} /></div>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="block text-sm text-gray-400 mb-1">Fréquence</label><select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={frequency} onChange={(e) => setFrequency(e.target.value)}><option value="monthly">Mensuelle</option><option value="yearly">Annuelle</option></select></div>
                <div><label className="block text-sm text-gray-400 mb-1">Mode</label><select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)}><option value="Prélèvement">Prélèvement</option><option value="Virement">Virement</option></select></div>
              </div>
              <div><label className="block text-sm text-gray-400 mb-1">Compte</label><select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={accountId} onChange={(e) => setAccountId(e.target.value)}>{accounts.map(acc => <option key={acc.id} value={acc.id}>{acc.name}</option>)}</select></div>
              <div><label className="block text-sm text-gray-400 mb-1">Libellé</label><input type="text" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={description} onChange={(e) => setDescription(e.target.value)} /></div>
              <div>
                <label className="block text-sm text-gray-400 mb-1">Fournisseur / Tiers</label>
                <AutocompleteInput direction="up" value={supplier} onChange={setSupplier} options={suppliers.map(s => s.name)} required={false} placeholder="Choisir un fournisseur..." className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" />
              </div>
              <div>
                <label className="block text-sm text-gray-400 mb-1">Catégorie</label>
                <AutocompleteInput direction="up" value={category} onChange={setCategory} options={categories.map(c => c.name)} required={true} placeholder="Choisir catégorie..." className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" />
              </div>
              <div className="pt-4 flex space-x-3"><button type="button" onClick={onClose} className="flex-1 py-3 bg-gray-800 text-white rounded-xl">Annuler</button><button type="submit" className="flex-1 py-3 bg-red-600 text-white rounded-xl font-bold">Enregistrer</button></div>
            </form>
          </div>
        </div>
      );
    }

    function InternalTransferModal({ onClose, onSave, accounts, currentAccountId, currentYear }) {
      const defaultFrom = (currentAccountId !== 'all' && accounts.some(a => a.id === currentAccountId))
        ? currentAccountId
        : (accounts[0]?.id || '');
      const defaultTo = accounts.find(a => a.id !== defaultFrom)?.id || defaultFrom;

      const today = new Date().toISOString().split('T')[0];
      const defaultDate = today.startsWith(currentYear) ? today : `${currentYear}-01-01`;

      const [fromAccountId, setFromAccountId] = useState(defaultFrom);
      const [toAccountId, setToAccountId] = useState(defaultTo);
      const [amount, setAmount] = useState('');
      const [date, setDate] = useState(defaultDate);
      const [description, setDescription] = useState('Virement interne');
      const [paymentMethod, setPaymentMethod] = useState('Virement');
      const [reconciled, setReconciled] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!amount || !fromAccountId || !toAccountId || fromAccountId === toAccountId) return;
        onSave({ fromAccountId, toAccountId, amount, date, description, paymentMethod, reconciled });
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-50 p-4">
          <div className="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
            <div className="flex justify-between items-center p-6 border-b border-gray-800">
              <div className="flex items-center space-x-2.5">
                <div className="bg-indigo-600/20 text-indigo-400 p-2 rounded-xl border border-indigo-500/30">
                  <ArrowLeftRight className="w-5 h-5" />
                </div>
                <h3 className="text-xl font-bold text-white">Virement Interne</h3>
              </div>
              <button onClick={onClose} className="text-gray-400 hover:text-white"><X className="w-6 h-6"/></button>
            </div>
            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs text-gray-400 mb-1">Compte débité (Sortie)</label>
                  <select value={fromAccountId} onChange={e => setFromAccountId(e.target.value)} className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm text-white outline-none">
                    {accounts.map(acc => <option key={acc.id} value={acc.id}>{acc.name}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs text-gray-400 mb-1">Compte crédité (Entrée)</label>
                  <select value={toAccountId} onChange={e => setToAccountId(e.target.value)} className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm text-white outline-none">
                    {accounts.map(acc => <option key={acc.id} value={acc.id}>{acc.name}</option>)}
                  </select>
                </div>
              </div>
              {fromAccountId === toAccountId && (
                <p className="text-xs text-red-400">Veuillez choisir deux comptes différents.</p>
              )}
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs text-gray-400 mb-1">Montant (€)</label>
                  <input type="number" step="0.01" required value={amount} onChange={e => setAmount(e.target.value)} placeholder="0.00" className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none font-bold" />
                </div>
                <div>
                  <label className="block text-xs text-gray-400 mb-1">Date</label>
                  <input type="date" required value={date} onChange={e => setDate(e.target.value)} className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" />
                </div>
              </div>
              <div>
                <label className="block text-xs text-gray-400 mb-1">Motif / Libellé</label>
                <input type="text" required value={description} onChange={e => setDescription(e.target.value)} placeholder="Ex: Dépôt espèces Caisse vers Compte Courant" className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm text-white outline-none" />
              </div>
              <div className="flex items-center justify-between pt-1">
                <label className="flex items-center space-x-2 text-xs text-gray-300 cursor-pointer">
                  <input type="checkbox" checked={reconciled} onChange={e => setReconciled(e.target.checked)} className="w-4 h-4 accent-emerald-500 rounded" />
                  <span>Marquer directement comme pointé sur les 2 comptes</span>
                </label>
              </div>
              <div className="pt-4 flex space-x-3">
                <button type="button" onClick={onClose} className="flex-1 py-3 bg-gray-800 text-white rounded-xl">Annuler</button>
                <button type="submit" disabled={fromAccountId === toAccountId || !amount} className="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 text-white rounded-xl font-bold">Valider le virement</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
