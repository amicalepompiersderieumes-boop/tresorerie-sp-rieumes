                        <span className="hidden xl:inline">Drive</span>
                      </a>
                      <button
                        onClick={() => exportBackupToDrive(false)}
                        disabled={isBackingUpToDrive}
                        className="flex items-center justify-center space-x-1.5 bg-emerald-600/15 hover:bg-emerald-600/25 border border-emerald-500/30 text-emerald-300 hover:text-white disabled:opacity-50 px-3 py-2.5 rounded-xl text-xs font-bold transition-colors"
                        title="Envoyer une sauvegarde .json sur Google Drive en 1 clic"
                      >
                        <Save className="w-4 h-4" />
                        <span className="hidden xl:inline">{isBackingUpToDrive ? 'Envoi...' : 'Sauvegarde'}</span>
                      </button>
                    </>
                  )}
                  {canEditCompta && !isCurrentYearClosed && (
                    <>
                      <button 
                        onClick={() => setIsTransferModalOpen(true)} 
                        className="flex-1 sm:flex-initial flex items-center justify-center space-x-2 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-indigo-300 hover:text-white px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition-colors"
                        title="Transférer une somme d'un compte à un autre"
                      >
                        <ArrowLeftRight className="w-4 h-4" /><span>Virement</span>
                      </button>
                      <button 
                        onClick={() => setIsAddModalOpen(true)} 
                        className="flex-1 sm:flex-initial flex items-center justify-center space-x-2 bg-red-600 hover:bg-red-700 text-white px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-colors shadow-lg shadow-red-600/20"
                      >
                        <Plus className="w-4 h-4" /><span>Nouvelle Opération</span>
                      </button>
                    </>
                  )}
                  {isViewer && (
                    <span className="inline-flex items-center space-x-1.5 bg-gray-800/80 border border-gray-700 text-gray-300 px-3 py-2 rounded-xl text-xs font-semibold">
                      <Eye className="w-4 h-4 text-blue-400" />
                      <span>Mode Consultation (Lecture seule)</span>
                    </span>
                  )}
                </div>
              </header>

              <div className="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
                <div className="max-w-[1600px] w-full mx-auto">

                  {/* F. BANDEAU DISCRET DE RAPPEL DE SAUVEGARDE .JSON (> 30 JOURS) */}
                  {canEditCompta && backupReminderInfo.show && (
                    <div className="mb-6 bg-blue-950/40 border border-blue-500/30 rounded-2xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 print:hidden">
                      <div className="flex items-center space-x-3">
                        <div className="bg-blue-500/20 text-blue-400 p-2.5 rounded-xl flex-shrink-0">
                          <Download className="w-5 h-5" />
                        </div>
                        <div>
                          <h4 className="text-sm font-bold text-white">Rappel de sécurité mensuel (.json)</h4>
                          <p className="text-xs text-gray-300 mt-0.5">
                            {backupReminderInfo.days === null
                              ? "Vous n'avez pas encore téléchargé de copie de secours (.json) sur cet ordinateur."
                              : `Votre dernière copie de sauvegarde sur ordinateur date d'il y a ${backupReminderInfo.days} jours.`}
                          </p>
                        </div>
                      </div>
                      <div className="flex items-center space-x-2 w-full sm:w-auto justify-end">
                        <button
                          onClick={() => exportBackupToDrive(true)}
                          disabled={isBackingUpToDrive}
                          className="bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition-colors flex items-center space-x-1.5 shadow"
                        >
                          <Download className="w-4 h-4" />
                          <span>{isBackingUpToDrive ? 'Envoi sur Drive...' : 'Sauvegarder sur Drive + PC (.json)'}</span>
                        </button>
                        <button
                          onClick={() => setDismissBackupReminder(true)}
                          title="Me le rappeler plus tard"
                          className="text-gray-400 hover:text-white p-2"
                        >
                          <X className="w-4 h-4" />
                        </button>
                      </div>
                    </div>
                  )}
                  
                  {/* ONGLET 1 : TABLEAU DE BORD */}
                  {activeTab === 'dashboard' && (
                    <div className="space-y-6">
                      {/* MESSAGE DE BIENVENUE PERSONNALISÉ */}
                      <div className="bg-gradient-to-r from-gray-900 via-gray-900 to-blue-950/40 border border-gray-800 rounded-2xl p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                        <div className="flex items-center space-x-3.5">
                          <div className={`w-12 h-12 rounded-2xl flex items-center justify-center font-extrabold text-lg shadow-lg ${roleStyle.avatarClass}`}>
                            {currentUserFirstName.charAt(0).toUpperCase()}
                          </div>
                          <div>
                            <h2 className="text-xl font-extrabold text-white">Bonjour {currentUserFirstName} 👋</h2>
                            <p className="text-xs text-gray-400 mt-0.5">
                              Connecté en tant que <strong className="text-gray-200">{roleStyle.label}</strong> • Exercice {currentYear}
                            </p>
                          </div>
                        </div>
                        {canEditCompta && (
                          <div className="flex items-center gap-2">
                            <a
                              href={driveFolderUrl || DEFAULT_DRIVE_FOLDER_URL}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="inline-flex items-center space-x-1.5 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-amber-300 px-3.5 py-2 rounded-xl text-xs font-bold transition-colors"
                            >
                              <FolderOpen className="w-4 h-4" />
                              <span>Dossier Drive</span>
                            </a>
                            <button
                              onClick={() => exportBackupToDrive(false)}
                              disabled={isBackingUpToDrive}
                              className="inline-flex items-center space-x-1.5 bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/30 text-emerald-300 px-3.5 py-2 rounded-xl text-xs font-bold transition-colors"
                            >
                              <Save className="w-4 h-4" />
                              <span>{isBackingUpToDrive ? 'Sauvegarde...' : 'Sauvegarder sur Drive'}</span>
                            </button>
                          </div>
                        )}
                      </div>

                      {isCurrentYearClosed && (
                        <div className="bg-yellow-500/10 border border-yellow-500/20 text-yellow-500 p-4 rounded-xl flex items-center">
                          <Lock className="w-6 h-6 mr-3 flex-shrink-0" />
                          <div>
                            <h4 className="font-bold">Exercice Clôturé</h4>
                            <p className="text-sm">L'année {currentYear} est verrouillée.</p>
                          </div>
                        </div>
                      )}
                      <div>
                        <h2 className="text-2xl font-bold text-white mb-6">Aperçu Financier ({currentAccountName})</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                          <div className="bg-gray-900 border border-gray-800 p-6 rounded-2xl relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-4 opacity-10"><CheckCircle className="w-24 h-24" /></div>
                            <p className="text-sm font-medium text-gray-400 mb-1">Solde Bancaire (Pointé)</p>
                            <h3 className={`text-4xl font-bold ${balances.pointed >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>{formatCurrency(balances.pointed)}</h3>
                          </div>
                          <div className="bg-gray-900 border border-gray-800 p-6 rounded-2xl relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-4 opacity-10"><Circle className="w-24 h-24" /></div>
                            <p className="text-sm font-medium text-gray-400 mb-1">Opérations non pointées</p>
                            <h3 className={`text-4xl font-bold ${balances.unpointed >= 0 ? 'text-blue-400' : 'text-yellow-500'}`}>{balances.unpointed > 0 ? '+' : ''}{formatCurrency(balances.unpointed)}</h3>
                          </div>
                          <div className="bg-gray-900 border border-gray-800 p-6 rounded-2xl relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-4 opacity-10"><LayoutDashboard className="w-24 h-24" /></div>
                            <p className="text-sm font-medium text-gray-400 mb-1">Solde Théorique</p>
                            <h3 className={`text-4xl font-bold ${balances.theoretical >= 0 ? 'text-white' : 'text-red-400'}`}>{formatCurrency(balances.theoretical)}</h3>
                          </div>
                        </div>
                      </div>

                      {accounts.length > 0 && (
                        <div className="mt-8">
                          <h3 className="text-lg font-bold text-white mb-4">Soldes par compte (cliquer pour ouvrir le Livre de Comptes)</h3>
                          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {accounts.map(acc => {
                              const bal = accountBalances[acc.id] || { pointed: 0, unpointed: 0, theoretical: 0 };
                              return (
                                <div 
                                  key={acc.id} 
                                  onClick={() => { setCurrentAccountId(acc.id); setHasSelectedAccountOnce(true); setActiveTab('transactions'); }}
                                  className="bg-gray-900 hover:bg-gray-800/80 cursor-pointer transition-all p-5 rounded-2xl border border-gray-800 hover:border-red-500/50 flex flex-col justify-between group"
                                >
                                  <div className="flex items-center justify-between mb-4">
                                    <div className="flex items-center space-x-2.5">
                                      <CreditCard className="w-5 h-5 text-red-500" />
                                      <h4 className="font-bold text-gray-100 group-hover:text-white">{acc.name}</h4>
                                    </div>
                                    <span className="text-xs text-gray-500 group-hover:text-red-400">Ouvrir →</span>
                                  </div>
                                  <div className="flex justify-between items-end pt-2 border-t border-gray-800">
                                    <div><p className="text-xs text-gray-500 mb-1">Pointé</p><p className={`font-bold text-lg ${bal.pointed >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>{formatCurrency(bal.pointed)}</p></div>
                                    <div className="text-right"><p className="text-xs text-gray-500 mb-1">Théorique</p><p className={`font-bold text-lg ${bal.theoretical >= 0 ? 'text-white' : 'text-red-400'}`}>{formatCurrency(bal.theoretical)}</p></div>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  {/* ONGLET 2 : LIVRE DE COMPTES */}
                  {activeTab === 'transactions' && (
                    <div className="space-y-6">
                      {/* BANDEAU DES SOLDES DU COMPTE TRAITÉ */}
                      <div className="bg-gradient-to-br from-gray-900 via-gray-900 to-gray-950 border border-gray-800 rounded-2xl p-5 shadow-lg">
                        <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                          <div className="flex items-center space-x-4">
                            <div className="bg-red-600/20 border border-red-500/30 p-3.5 rounded-2xl text-red-400">
                              <CreditCard className="w-7 h-7" />
                            </div>
                            <div>
                              <span className="text-xs uppercase tracking-wider text-gray-400 font-semibold">Compte en cours de traitement</span>
                              <div className="flex flex-wrap items-center gap-2 mt-0.5">
                                <h2 className="text-2xl font-extrabold text-white">{currentAccountName}</h2>
                                <button 
                                  onClick={() => setIsAccountPickerOpen(true)}
                                  className="text-xs bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-1.5 rounded-lg border border-gray-700 transition-colors flex items-center space-x-1"
                                >
                                  <Repeat className="w-3.5 h-3.5 mr-1 text-red-400" />
                                  <span>Changer de compte</span>
                                </button>
                              </div>
                            </div>
                          </div>

                          <div className="grid grid-cols-3 gap-3 w-full lg:w-auto">
                            <div className="bg-gray-950/90 border border-gray-800 px-4 py-3 rounded-xl">
                              <p className="text-xs text-gray-400">Solde Pointé</p>
                              <p className={`text-lg sm:text-xl font-bold mt-0.5 ${balances.pointed >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                                {formatCurrency(balances.pointed)}
                              </p>
                            </div>
                            <div className="bg-gray-950/90 border border-gray-800 px-4 py-3 rounded-xl">
                              <p className="text-xs text-gray-400">Non Pointé</p>
                              <p className={`text-lg sm:text-xl font-bold mt-0.5 ${balances.unpointed >= 0 ? 'text-blue-400' : 'text-yellow-400'}`}>
                                {balances.unpointed > 0 ? '+' : ''}{formatCurrency(balances.unpointed)}
                              </p>
                            </div>
                            <div className="bg-gray-950/90 border border-gray-700 px-4 py-3 rounded-xl">
                              <p className="text-xs text-gray-300 font-medium">Solde Théorique</p>
                              <p className={`text-lg sm:text-xl font-extrabold mt-0.5 ${balances.theoretical >= 0 ? 'text-white' : 'text-red-400'}`}>
                                {formatCurrency(balances.theoretical)}
                              </p>
                            </div>
                          </div>
                        </div>
                      </div>

                      {/* TABLEAU DES ÉCRITURES AVEC RECHERCHE & FILTRES RAPIDES (A) */}
                      <div className="bg-gray-900 border border-gray-800 rounded-2xl shadow-sm overflow-visible">
                        <div className="p-5 border-b border-gray-800 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                          <div className="flex items-center space-x-3">
                            <h3 className="text-lg font-bold text-white">Écritures de l'exercice {currentYear}</h3>
                            <span className="text-xs bg-gray-800 text-gray-300 px-2.5 py-1 rounded-full border border-gray-700">
                              {displayedTransactions.length} / {filteredTransactions.length} opération(s)
                            </span>
                          </div>

                          {/* A. BARRE DE RECHERCHE & FILTRES RAPIDES */}
                          <div className="flex flex-wrap items-center gap-2.5 w-full lg:w-auto print:hidden">
                            <div className="relative flex-1 sm:w-64">
                              <Search className="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" />
                              <input
                                type="text"
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                placeholder="Chercher libellé, tiers, chèque, montant..."
                                className="w-full bg-gray-950 border border-gray-700 focus:border-red-500 rounded-xl pl-9 pr-8 py-2 text-xs text-white outline-none"
                              />
                              {searchQuery && (
                                <button onClick={() => setSearchQuery('')} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
                                  <X className="w-3.5 h-3.5" />
                                </button>
                              )}
                            </div>

                            <div className="flex items-center bg-gray-950 p-1 rounded-xl border border-gray-800">
                              <button
                                onClick={() => setQuickFilter('all')}
                                className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${quickFilter === 'all' ? 'bg-gray-800 text-white shadow' : 'text-gray-400 hover:text-white'}`}
                              >
                                Tout
                              </button>
                              <button
                                onClick={() => setQuickFilter(quickFilter === 'unpointed' ? 'all' : 'unpointed')}
                                className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center space-x-1.5 ${quickFilter === 'unpointed' ? 'bg-yellow-500/20 text-yellow-300 border border-yellow-500/40' : 'text-gray-400 hover:text-white'}`}
                              >
                                <Circle className="w-3 h-3" />
                                <span>Non pointés ({unpointedCount})</span>
                              </button>
                              <button
                                onClick={() => setQuickFilter(quickFilter === 'missing_receipt' ? 'all' : 'missing_receipt')}
                                className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center space-x-1.5 ${quickFilter === 'missing_receipt' ? 'bg-red-500/20 text-red-300 border border-red-500/40' : 'text-gray-400 hover:text-white'}`}
                              >
                                <Paperclip className="w-3 h-3" />
                                <span>Sans facture ({missingReceiptCount})</span>
                              </button>
                            </div>

                            <button
                              onClick={() => openPrintCenter(searchQuery || quickFilter !== 'all' ? 'ledger_filtered' : 'ledger_full')}
                              className="flex items-center space-x-1.5 bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow transition-colors"
                              title="Choisir les options d'impression du Livre de Comptes"
                            >
                              <Printer className="w-4 h-4" />
                              <span>Imprimer / PDF</span>
                            </button>
                          </div>
                        </div>
                        
                        <div className="overflow-x-auto pb-28">
                          <table className="w-full text-sm text-left text-gray-300">
                            <thead className="text-xs text-gray-400 uppercase bg-gray-950 border-b border-gray-800">
                              <tr>
                                <th className="px-3 py-3">Date</th>
                                <th className="px-3 py-3">Compte</th>
                                <th className="px-3 py-3">Libellé</th>
                                <th className="px-3 py-3">Fournisseur / Tiers</th>
                                <th className="px-3 py-3">Catégorie</th>
                                <th className="px-3 py-3">Mode</th>
                                <th className="px-3 py-3 text-right">Montant</th>
                                <th className="px-3 py-3 text-center">Pointé</th>
                                <th className="px-3 py-3 text-center print:hidden" title="Justificatif / Document lié">Doc.</th>
                                <th className="px-3 py-3 text-center print:hidden">Actions</th>
                              </tr>
                            </thead>
                            <tbody>
                              {canEditCompta && !isCurrentYearClosed ? (
                                <tr className="bg-red-950/20 border-b-2 border-red-500/30 print:hidden">
                                  <td className="px-3 py-3"><input type="date" value={inlineTx.date} onChange={e => setInlineTx({...inlineTx, date: e.target.value})} className="bg-gray-900 border border-gray-700 focus:border-red-500 rounded-lg p-2 text-xs text-white w-full outline-none" /></td>
                                  <td className="px-3 py-3">
                                    {currentAccountId === 'all' ? (
                                      <select value={inlineTx.accountId} onChange={e => setInlineTx({...inlineTx, accountId: e.target.value})} className="bg-gray-900 border border-gray-700 focus:border-red-500 rounded-lg p-2 text-xs text-white w-full outline-none min-w-[110px]">
                                        {accounts.map(acc => <option key={acc.id} value={acc.id}>{acc.name}</option>)}
                                      </select>
                                    ) : (
                                      <div className="bg-gray-800/70 border border-gray-700 rounded-lg p-2 text-xs text-red-300 font-medium w-full min-w-[110px]">
                                        {accounts.find(a => a.id === currentAccountId)?.name}
                                      </div>
                                    )}
                                  </td>
                                  <td className="px-3 py-3"><input type="text" placeholder="Saisir un nouveau libellé..." value={inlineTx.description} onChange={e => setInlineTx({...inlineTx, description: e.target.value})} onKeyDown={e => { if (e.key === 'Enter') handleInlineSubmit(); }} className="bg-gray-900 border border-gray-700 focus:border-red-500 rounded-lg p-2 text-xs text-white w-full outline-none min-w-[140px]" /></td>
                                  <td className="px-3 py-3">
                                    <AutocompleteInput 
                                      value={inlineTx.supplier} 
                                      onChange={val => setInlineTx({...inlineTx, supplier: val})} 
                                      options={suppliers.map(s => s.name)} 
                                      placeholder="Fournisseur / Tiers..." 
                                      className="bg-gray-900 border border-gray-700 focus:border-red-500 rounded-lg p-2 text-xs text-white w-full outline-none min-w-[130px]" 
                                    />
                                  </td>
                                  <td className="px-3 py-3">
                                    <AutocompleteInput 
                                      value={inlineTx.category} 
                                      onChange={val => setInlineTx({...inlineTx, category: val})} 
                                      options={categories.map(c => c.name)} 
                                      placeholder="Choisir catégorie..." 
                                      className="bg-gray-900 border border-gray-700 focus:border-red-500 rounded-lg p-2 text-xs text-white w-full outline-none min-w-[130px]" 
                                    />
                                  </td>
                                  <td className="px-3 py-3">
                                    <div className="flex flex-col space-y-1 min-w-[100px]">
                                      <select value={inlineTx.paymentMethod} onChange={e => setInlineTx({...inlineTx, paymentMethod: e.target.value})} className="bg-gray-900 border border-gray-700 focus:border-red-500 rounded-lg p-2 text-xs text-white w-full outline-none">
                                        <option value="CB">CB</option>
                                        <option value="Chèque">Chèque</option>
                                        <option value="Prélèvement">Prélèvement</option>
                                        <option value="Virement">Virement</option>
                                        <option value="Espèces">Espèces</option>
                                      </select>
                                      {inlineTx.paymentMethod === 'Chèque' && (
                                        <input type="text" placeholder="N° chèque" value={inlineTx.checkNumber} onChange={e => setInlineTx({...inlineTx, checkNumber: e.target.value})} className="bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-white w-full outline-none" />
                                      )}
                                    </div>
                                  </td>
                                  <td className="px-3 py-3 text-right min-w-[165px]">
                                    <div className="flex items-center justify-end space-x-2">
                                      <select value={inlineTx.type} onChange={e => setInlineTx({...inlineTx, type: e.target.value})} className={`bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs outline-none font-bold ${inlineTx.type === 'income' ? 'text-emerald-500' : 'text-red-400'}`}>
                                        <option value="expense">Dépense</option>
                                        <option value="income">Recette</option>
                                      </select>
                                      <input type="number" step="0.01" placeholder="0.00" value={inlineTx.amount} onChange={e => setInlineTx({...inlineTx, amount: e.target.value})} onKeyDown={e => { if (e.key === 'Enter') handleInlineSubmit(); }} className="bg-gray-900 border border-gray-700 focus:border-red-500 rounded-lg p-2 text-xs text-white w-20 outline-none text-right font-bold" />
                                    </div>
                                  </td>
                                  <td className="px-3 py-3 text-center text-xs text-gray-500">Nouveau</td>
                                  <td className="px-3 py-3 text-center relative">
                                    <button
                                      type="button"
                                      onClick={() => setInlineTx(prev => ({ ...prev, showReceiptInput: !prev.showReceiptInput }))}
                                      title={inlineTx.receiptUrl ? `Document lié : ${inlineTx.receiptName || inlineTx.receiptUrl}` : "Scanner ou lier une facture"}
                                      className={`p-2 rounded-lg border transition-colors ${inlineTx.receiptUrl ? 'bg-blue-600/20 border-blue-500 text-blue-400' : 'bg-gray-900 border-gray-700 text-gray-400 hover:text-white'}`}
                                    >
                                      <Paperclip className="w-4 h-4 mx-auto" />
                                    </button>
                                    {inlineTx.showReceiptInput && (
                                      <div className="absolute right-0 top-full mt-1 z-[250] bg-gray-900 border border-gray-700 p-3.5 rounded-xl shadow-2xl w-80 text-left space-y-2.5">
                                        <div className="flex items-center justify-between">
                                          <span className="text-xs font-bold text-white">Joindre une facture (Dossier {(inlineTx.date || '').split('-')[0] || currentYear})</span>
                                          <button type="button" onClick={() => setInlineTx({...inlineTx, showReceiptInput: false})} className="text-gray-400 hover:text-white"><X className="w-4 h-4"/></button>
                                        </div>

                                        <div className="grid grid-cols-2 gap-2">
                                          <label className="flex flex-col items-center justify-center p-2.5 rounded-lg bg-emerald-600/15 hover:bg-emerald-600/25 border border-emerald-500/30 text-emerald-300 cursor-pointer text-center transition-colors">
                                            <FolderUp className="w-4 h-4 mb-1" />
                                            <span className="text-[11px] font-bold">{inlineTx.uploadingInlineDrive ? 'Envoi...' : 'Fichier PC -> Drive'}</span>
                                            <input type="file" accept="image/*,.pdf" onChange={handleInlineDriveFile} disabled={inlineTx.uploadingInlineDrive} className="hidden" />
                                          </label>
                                          <label className="flex flex-col items-center justify-center p-2.5 rounded-lg bg-blue-600/15 hover:bg-blue-600/25 border border-blue-500/30 text-blue-300 cursor-pointer text-center transition-colors">
                                            <Camera className="w-4 h-4 mb-1" />
                                            <span className="text-[11px] font-bold">{inlineTx.uploadingInlineDrive ? 'Envoi...' : 'Photo Tél -> Drive'}</span>
                                            <input type="file" accept="image/*" capture="environment" onChange={handleInlineDriveFile} disabled={inlineTx.uploadingInlineDrive} className="hidden" />
                                          </label>
                                        </div>

                                        <div>
                                          <label className="block text-[10px] text-gray-400 mb-1">Ou coller un lien Drive direct :</label>
                                          <input
                                            type="url"
                                            placeholder="https://drive.google.com/..."
                                            value={inlineTx.receiptUrl}
                                            onChange={e => setInlineTx({...inlineTx, receiptUrl: e.target.value, receiptName: ''})}
                                            className="bg-gray-950 border border-gray-700 focus:border-blue-500 rounded-lg p-2 text-xs text-white w-full outline-none"
                                          />
                                        </div>

                                        <div className="flex justify-between items-center pt-1">
                                          {inlineTx.receiptUrl && (
                                            <button type="button" onClick={() => setInlineTx({...inlineTx, receiptUrl: '', receiptName: ''})} className="text-[11px] text-red-400 hover:underline">Effacer</button>
                                          )}
                                          <button type="button" onClick={() => setInlineTx({...inlineTx, showReceiptInput: false})} className="ml-auto bg-blue-600 text-white text-xs px-3 py-1 rounded-lg font-medium">Valider</button>
                                        </div>
                                      </div>
                                    )}
                                  </td>
                                  <td className="px-3 py-3 text-center">
                                    <button onClick={handleInlineSubmit} disabled={!inlineTx.amount || !inlineTx.description} className="bg-red-600 hover:bg-red-700 disabled:opacity-40 text-white p-2 rounded-lg shadow" title="Ajouter l'écriture">
                                      <Plus className="w-4 h-4 mx-auto"/>
                                    </button>
                                  </td>
                                </tr>
                              ) : isCurrentYearClosed ? (
                                <tr className="bg-yellow-500/10 border-b border-yellow-500/20 print:hidden">
                                  <td colSpan="10" className="px-4 py-3 text-center">
                                    <div className="flex flex-wrap items-center justify-center gap-3 text-xs text-yellow-400">
                                      <span className="flex items-center font-medium"><Lock className="w-4 h-4 mr-1.5" /> L'exercice {currentYear} est actuellement clôturé (saisie directe masquée).</span>
                                      {canEditCompta && (
                                        <button onClick={() => toggleYearClosure(currentYear)} className="bg-yellow-500/20 hover:bg-yellow-500/30 text-yellow-300 border border-yellow-500/40 px-3 py-1 rounded-lg font-bold transition-colors">
                                          Rouvrir l'exercice {currentYear}
                                        </button>
                                      )}
                                    </div>
                                  </td>
                                </tr>
                              ) : null}
                              {displayedTransactions.length === 0 ? (
                                <tr>
                                  <td colSpan="10" className="px-4 py-8 text-center text-gray-500">
                                    {searchQuery || quickFilter !== 'all'
                                      ? "Aucune écriture ne correspond à votre filtre ou recherche."
                                      : `Aucune écriture pour ce compte sur l'année ${currentYear}.`}
                                  </td>
                                </tr>
                              ) : (
                                displayedTransactions.map((tx) => {
                                  const isTransfer = tx.isInternalTransfer || tx.category === INTERNAL_TRANSFER_CATEGORY;
                                  return (
                                    <tr key={tx.id} className="bg-gray-900 border-b border-gray-800 hover:bg-gray-800/50">
                                      <td className="px-3 py-3 whitespace-nowrap">{new Date(tx.date).toLocaleDateString('fr-FR')}</td>
                                      <td className="px-3 py-3 whitespace-nowrap">{accounts.find(a => a.id === tx.accountId)?.name || '-'}</td>
                                      <td className="px-3 py-3 font-medium text-gray-200">
                                        <div>{tx.description}</div>
                                        {(tx.updatedBy || tx.createdBy) && (
                                          <span className="text-[10px] text-gray-500 font-normal">
                                            par {tx.updatedBy || tx.createdBy}
                                          </span>
                                        )}
                                      </td>
                                      <td className="px-3 py-3 text-gray-300 whitespace-nowrap">{tx.supplier || '-'}</td>
                                      <td className="px-3 py-3 whitespace-nowrap">
                                        <span className={`text-xs px-2.5 py-1 rounded-full border ${isTransfer ? 'bg-indigo-500/15 text-indigo-300 border-indigo-500/30' : 'bg-gray-800 text-gray-300 border-gray-700'}`}>
                                          {tx.category}
                                        </span>
                                      </td>
                                      <td className="px-3 py-3 text-sm text-gray-300 whitespace-nowrap">
                                        <span className="block font-medium">{tx.paymentMethod || '-'}</span>
                                        {tx.paymentMethod === 'Chèque' && tx.checkNumber && <span className="block text-xs text-gray-500">N° {tx.checkNumber}</span>}
                                      </td>
                                      <td className={`px-3 py-3 text-right font-bold whitespace-nowrap ${tx.type === 'income' ? 'text-emerald-500' : 'text-red-400'}`}>
                                        {tx.type === 'income' ? '+' : '-'}{formatCurrency(tx.amount)}
                                      </td>
                                      <td className="px-3 py-3 text-center">
                                        {isCurrentYearClosed || !canEditCompta ? (
                                          <div className="flex justify-center">{tx.reconciled ? <CheckCircle className="w-6 h-6 text-emerald-500/70" /> : <Circle className="w-6 h-6 text-gray-600" />}</div>
                                        ) : (
                                          <button onClick={() => toggleReconciled(tx.id)} className={`print:hidden ${tx.reconciled ? 'text-emerald-500' : 'text-gray-600'}`}>
                                            {tx.reconciled ? <CheckCircle className="w-6 h-6 mx-auto" /> : <Circle className="w-6 h-6 mx-auto" />}
                                          </button>
                                        )}
                                      </td>
                                      <td className="px-3 py-3 text-center print:hidden">
                                        {tx.receiptUrl ? (
                                          <button
                                            onClick={() => setReceiptModalTx(tx)}
                                            title={tx.receiptName || "Voir ou modifier le justificatif lié"}
                                            className="inline-flex items-center justify-center p-1.5 rounded-lg bg-blue-500/15 text-blue-400 hover:bg-blue-500/30 border border-blue-500/30 transition-colors"
                                          >
                                            <Paperclip className="w-4 h-4" />
                                          </button>
                                        ) : (
                                          canEditCompta && !isCurrentYearClosed ? (
                                            <button
                                              onClick={() => setReceiptModalTx(tx)}
                                              title="Scanner ou déposer une facture sur Google Drive"
                                              className="inline-flex items-center justify-center p-1.5 rounded-lg text-gray-600 hover:text-gray-300 hover:bg-gray-800 transition-colors"
                                            >
                                              <Paperclip className="w-4 h-4" />
                                            </button>
                                          ) : (
                                            <span className="text-gray-600">-</span>
                                          )
                                        )}
                                      </td>
                                      <td className="px-3 py-3 text-center print:hidden">
                                        {canEditCompta && !isCurrentYearClosed ? (
                                          <div className="flex justify-center space-x-2">
                                            <button onClick={() => setEditModalTx(tx)} className="text-gray-400 hover:text-white" title="Modifier l'opération"><Pencil className="w-4 h-4"/></button>
                                            <button onClick={() => setDeleteConfirmTx(tx)} className="text-gray-400 hover:text-red-500" title="Supprimer l'opération"><Trash2 className="w-4 h-4"/></button>
                                          </div>
                                        ) : (
                                          <span className="text-gray-600 text-xs">-</span>
                                        )}
                                      </td>
                                    </tr>
                                  );
                                })
                              )}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* ONGLET 3 : BILAN ANNUEL & RAPPORT D'ASSEMBLÉE GÉNÉRALE (G) */}
                  {activeTab === 'balance' && (
                    <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 space-y-6 print-card">
                      <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 border-b border-gray-800 pb-5">
                        <div>
                          <h2 className="text-2xl font-extrabold text-white">Bilan Annuel {currentYear} — {currentAccountName}</h2>
                          <p className="text-xs text-gray-400 mt-1">Synthèse comptable par catégorie ou par fournisseur / tiers</p>
                        </div>
                        <div className="flex flex-wrap items-center gap-2">
                          <button
                            onClick={exportCSV}
                            className="flex items-center space-x-2 bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/30 text-emerald-300 px-4 py-2.5 rounded-xl text-xs font-bold transition-colors"
                          >
                            <Download className="w-4 h-4" />
                            <span>Exporter Excel (CSV)</span>
                          </button>
                          <button
                            onClick={() => openPrintCenter(balanceGroupBy === 'supplier' ? 'balance_supplier' : 'ag_complete')}
                            className="flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition-colors shadow-lg shadow-blue-600/20"
                          >
                            <Printer className="w-4 h-4" />
                            <span>Imprimer / PDF (AG)</span>
                          </button>
                        </div>
                      </div>

                      {/* FILTRES DU BILAN */}
                      <div className="flex flex-wrap items-center gap-3">
                        <div className="flex bg-gray-950 p-1 rounded-xl border border-gray-800">
                          <button
                            onClick={() => { setBalanceGroupBy('category'); setBalanceItemFilter('all'); }}
                            className={`px-3.5 py-2 rounded-lg text-xs font-bold transition-all ${balanceGroupBy === 'category' ? 'bg-red-600 text-white shadow' : 'text-gray-400 hover:text-white'}`}
                          >
                            Par Catégorie
                          </button>
                          <button
                            onClick={() => { setBalanceGroupBy('supplier'); setBalanceItemFilter('all'); }}
                            className={`px-3.5 py-2 rounded-lg text-xs font-bold transition-all ${balanceGroupBy === 'supplier' ? 'bg-blue-600 text-white shadow' : 'text-gray-400 hover:text-white'}`}
                          >
                            Par Fournisseur / Tiers
                          </button>
                        </div>

                        <div className="flex bg-gray-950 p-1 rounded-xl border border-gray-800">
                          <button
                            onClick={() => setBalanceViewMode('global')}
                            className={`px-3.5 py-2 rounded-lg text-xs font-bold transition-all ${balanceViewMode === 'global' ? 'bg-gray-800 text-white' : 'text-gray-400 hover:text-white'}`}
                          >
                            Vue Synthèse
                          </button>
                          <button
                            onClick={() => setBalanceViewMode('detailed')}
                            className={`px-3.5 py-2 rounded-lg text-xs font-bold transition-all ${balanceViewMode === 'detailed' ? 'bg-gray-800 text-white' : 'text-gray-400 hover:text-white'}`}
                          >
                            Vue Détaillée
                          </button>
                        </div>

                        <select
                          value={balanceTypeFilter}
                          onChange={(e) => setBalanceTypeFilter(e.target.value)}
                          className="bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white font-semibold outline-none"
                        >
                          <option value="all">Recettes & Dépenses</option>
                          <option value="income">Recettes uniquement</option>
                          <option value="expense">Dépenses uniquement</option>
                        </select>

                        <select
                          value={balanceItemFilter}
                          onChange={(e) => setBalanceItemFilter(e.target.value)}
                          className="bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white font-semibold outline-none max-w-xs"
                        >
                          <option value="all">Tous ({balanceGroupBy === 'category' ? 'Catégories' : 'Fournisseurs'})</option>
                          {Object.keys(activeSummary).sort().map(k => (
                            <option key={k} value={k}>{k}</option>
                          ))}
                        </select>
                      </div>

                      {/* CARTES DE TOTAUX */}
                      {(() => {
                        const entries = Object.entries(activeSummary).filter(([name, d]) => {
                          if (balanceItemFilter !== 'all' && name !== balanceItemFilter) return false;
                          if (balanceTypeFilter === 'income' && d.income === 0) return false;
                          if (balanceTypeFilter === 'expense' && d.expense === 0) return false;
                          return d.income > 0 || d.expense > 0;
                        });
                        const totInc = entries.reduce((acc, [, d]) => acc + d.income, 0);
                        const totExp = entries.reduce((acc, [, d]) => acc + d.expense, 0);
                        const totNet = totInc - totExp;

                        return (
                          <>
                            <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
                              <div className="bg-gray-950 border border-gray-800 p-4 rounded-xl">
                                <span className="text-xs text-gray-400">Report à nouveau ({currentYear})</span>
                                <p className="text-xl font-bold text-gray-100 mt-1">{formatCurrency(reportANouveau)}</p>
                              </div>
                              <div className="bg-gray-950 border border-gray-800 p-4 rounded-xl">
                                <span className="text-xs text-gray-400">Total Recettes</span>
                                <p className="text-xl font-bold text-emerald-400 mt-1">+{formatCurrency(totInc)}</p>
                              </div>
                              <div className="bg-gray-950 border border-gray-800 p-4 rounded-xl">
                                <span className="text-xs text-gray-400">Total Dépenses</span>
                                <p className="text-xl font-bold text-red-400 mt-1">-{formatCurrency(totExp)}</p>
                              </div>
                              <div className="bg-gray-950 border border-blue-500/30 p-4 rounded-xl">
                                <span className="text-xs text-blue-300 font-semibold">Solde Final (avec report)</span>
                                <p className={`text-xl font-extrabold mt-1 ${(reportANouveau + totNet) >= 0 ? 'text-white' : 'text-red-400'}`}>
                                  {formatCurrency(reportANouveau + totNet)}
                                </p>
                              </div>
                            </div>

                            <div className="overflow-x-auto">
                              <table className="w-full text-sm text-left text-gray-300">
                                <thead className="text-xs text-gray-400 uppercase bg-gray-950 border-b border-gray-800">
                                  <tr>
                                    <th className="px-4 py-3">{balanceGroupBy === 'category' ? 'Catégorie' : 'Fournisseur / Tiers'}</th>
                                    <th className="px-4 py-3 text-right">Recettes</th>
                                    <th className="px-4 py-3 text-right">Dépenses</th>
                                    <th className="px-4 py-3 text-right">Solde Net</th>
                                  </tr>
                                </thead>
                                <tbody>
                                  {entries.length === 0 ? (
                                    <tr><td colSpan="4" className="px-4 py-8 text-center text-gray-500">Aucun mouvement sur cette sélection.</td></tr>
                                  ) : (
                                    entries.map(([name, data]) => {
                                      const matchingTxs = balanceViewMode === 'detailed'
                                        ? filteredTransactions.filter(tx => {
                                            const key = balanceGroupBy === 'category' ? (tx.category || 'Non catégorisé') : ((tx.supplier || '').trim() || 'Non renseigné');
                                            if (key !== name) return false;
                                            if (balanceTypeFilter !== 'all' && tx.type !== balanceTypeFilter) return false;
                                            return true;
                                          })
                                        : [];
                                      return (
                                        <React.Fragment key={name}>
                                          <tr className="border-b border-gray-800 hover:bg-gray-800/40">
                                            <td className="px-4 py-3 font-bold text-white">{name}</td>
                                            <td className="px-4 py-3 text-right text-emerald-400 font-medium">{data.income > 0 ? `+${formatCurrency(data.income)}` : '-'}</td>
                                            <td className="px-4 py-3 text-right text-red-400 font-medium">{data.expense > 0 ? `-${formatCurrency(data.expense)}` : '-'}</td>
                                            <td className={`px-4 py-3 text-right font-extrabold ${data.total >= 0 ? 'text-emerald-300' : 'text-red-300'}`}>{formatCurrency(data.total)}</td>
                                          </tr>
                                          {balanceViewMode === 'detailed' && matchingTxs.map(tx => (
                                            <tr key={tx.id} className="bg-gray-950/60 border-b border-gray-800/50 text-xs text-gray-400">
                                              <td className="px-8 py-2" colSpan="2">
                                                <span className="text-gray-500 mr-2">{new Date(tx.date).toLocaleDateString('fr-FR')}</span>
                                                <span className="text-gray-200">{tx.description}</span>
                                                {balanceGroupBy === 'category' && tx.supplier && <span className="ml-2 text-blue-400">({tx.supplier})</span>}
                                              </td>
                                              <td className="px-4 py-2 text-right">{tx.paymentMethod || '-'}</td>
                                              <td className={`px-4 py-2 text-right font-bold ${tx.type === 'income' ? 'text-emerald-400' : 'text-red-400'}`}>
                                                {tx.type === 'income' ? '+' : '-'}{formatCurrency(tx.amount)}
                                              </td>
                                            </tr>
                                          ))}
                                        </React.Fragment>
                                      );
                                    })
                                  )}
                                </tbody>
                              </table>
                            </div>
                          </>
                        );
                      })()}
                    </div>
                  )}

                  {/* ONGLET 4 : AUTOMATISATIONS (ADMIN & TRÉSORIER) */}
                  {activeTab === 'automations' && canEditCompta && (
                    <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 space-y-6">
                      <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-gray-800 pb-4">
                        <div>
                          <h2 className="text-2xl font-extrabold text-white flex items-center">
                            <Repeat className="w-6 h-6 mr-2.5 text-red-500" /> Opérations Récurrentes
                          </h2>
                          <p className="text-xs text-gray-400 mt-1">Générez en un clic vos prélèvements mensuels ou cotisations annuelles.</p>
                        </div>
                        <button
                          onClick={() => setIsAddAutomationOpen(true)}
                          className="flex items-center space-x-2 bg-red-600 hover:bg-red-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition-colors shadow-lg shadow-red-600/20"
                        >
                          <Plus className="w-4 h-4" />
                          <span>Nouvelle Automatisation</span>
                        </button>
                      </div>

                      {automations.length === 0 ? (
                        <div className="text-center py-12 text-gray-500 text-sm">
                          Aucune opération récurrente configurée pour le moment.
                        </div>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                          {automations.map(auto => (
                            <div key={auto.id} className="bg-gray-950 border border-gray-800 rounded-2xl p-5 flex flex-col justify-between space-y-4">
                              <div>
                                <div className="flex items-center justify-between gap-2">
                                  <span className={`text-[11px] font-bold px-2.5 py-0.5 rounded-full border ${auto.frequency === 'yearly' ? 'bg-blue-500/15 text-blue-300 border-blue-500/30' : 'bg-purple-500/15 text-purple-300 border-purple-500/30'}`}>
                                    {auto.frequency === 'yearly' ? 'Annuelle' : 'Mensuelle'}
                                  </span>
                                  <button onClick={() => deleteAutomation(auto.id)} className="text-gray-500 hover:text-red-500" title="Supprimer">
                                    <Trash2 className="w-4 h-4" />
                                  </button>
                                </div>
                                <h4 className="font-bold text-white text-base mt-2">{auto.description}</h4>
                                <p className="text-xs text-gray-400 mt-0.5">
                                  {accounts.find(a => a.id === auto.accountId)?.name || 'Compte'} • {auto.category}
                                  {auto.supplier ? ` • ${auto.supplier}` : ''}
                                </p>
                              </div>
                              <div className="pt-3 border-t border-gray-800 flex items-center justify-between">
                                <div>
                                  <span className="block text-[10px] text-gray-500 uppercase">Prochaine échéance</span>
                                  <span className="text-xs font-semibold text-gray-200">{new Date(auto.nextDate || auto.startDate).toLocaleDateString('fr-FR')}</span>
                                </div>
                                <span className={`text-lg font-extrabold ${auto.type === 'income' ? 'text-emerald-400' : 'text-red-400'}`}>
                                  {auto.type === 'income' ? '+' : '-'}{formatCurrency(auto.amount)}
                                </span>
                              </div>
                              <button
                                onClick={() => triggerAutomation(auto)}
                                className="w-full bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/30 text-emerald-300 font-bold text-xs py-2.5 rounded-xl transition-colors"
                              >
                                Générer l'écriture maintenant
                              </button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                  {/* ONGLET 5 : PARAMÈTRES (RÉORGANISÉS EN SOUS-ONGLETS CLAIRS SELON LE RÔLE) */}
                  {activeTab === 'settings' && canEditCompta && (
                    <div className="space-y-6">
                      {/* BARRE DE SOUS-ONGLETS DES PARAMÈTRES */}
                      <div className="bg-gray-900 border border-gray-800 rounded-2xl p-2 flex flex-wrap gap-2">
                        <button
                          onClick={() => setSettingsSubTab('compta')}
                          className={`flex items-center space-x-2 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all ${settingsSubTab === 'compta' ? 'bg-red-600 text-white shadow' : 'text-gray-400 hover:text-white hover:bg-gray-800'}`}
                        >
                          <CreditCard className="w-4 h-4" />
                          <span>Comptabilité</span>
                        </button>
                        <button
                          onClick={() => setSettingsSubTab('backups')}
                          className={`flex items-center space-x-2 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all ${settingsSubTab === 'backups' ? 'bg-emerald-600 text-white shadow' : 'text-gray-400 hover:text-white hover:bg-gray-800'}`}
                        >
                          <Save className="w-4 h-4" />
                          <span>Sauvegardes & État</span>
                        </button>
                        {isAdmin && (
                          <>
                            <button
                              onClick={() => setSettingsSubTab('users')}
                              className={`flex items-center space-x-2 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all ${settingsSubTab === 'users' ? 'bg-blue-600 text-white shadow' : 'text-gray-400 hover:text-white hover:bg-gray-800'}`}
                            >
                              <Users className="w-4 h-4" />
                              <span>Utilisateurs & Accès ({allUsers.length})</span>
                              {onlineUsersCount > 0 && (
                                <span className="ml-1 inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">
                                  ● {onlineUsersCount}
                                </span>
                              )}
                            </button>
                            <button
                              onClick={() => setSettingsSubTab('tech')}
                              className={`flex items-center space-x-2 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all ${settingsSubTab === 'tech' ? 'bg-indigo-600 text-white shadow' : 'text-gray-400 hover:text-white hover:bg-gray-800'}`}
                            >
                              <Settings className="w-4 h-4" />
                              <span>Technique (Admin)</span>
                            </button>
                          </>
                        )}
                      </div>

                      {/* SOUS-ONGLET 1 : COMPTABILITÉ (ADMIN & TRÉSORIER) */}
                      {settingsSubTab === 'compta' && (
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                          {/* COMPTES */}
                          <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                            <h2 className="text-lg font-bold text-white mb-4 flex items-center"><CreditCard className="w-5 h-5 mr-2 text-red-500"/> Comptes Bancaires</h2>
                            <ul className="space-y-3 mb-6">
                              {accounts.map(acc => (
                                <li key={acc.id} className="flex justify-between items-center bg-gray-950 p-3 rounded-lg border border-gray-800">
                                  <span className="text-gray-200 font-medium">{acc.name}</span>
                                  <button onClick={() => deleteAccount(acc.id)} className="text-gray-500 hover:text-red-500"><Trash2 className="w-4 h-4"/></button>
                                </li>
                              ))}
                            </ul>
                            <form onSubmit={addAccount} className="flex space-x-2">
                              <input type="text" value={newAccountName} onChange={e => setNewAccountName(e.target.value)} placeholder="Nouveau compte..." className="flex-1 bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white outline-none" />
                              <button className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium">Ajouter</button>
                            </form>
                          </div>

                          {/* CATÉGORIES */}
                          <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                            <h2 className="text-lg font-bold text-white mb-4 flex items-center"><List className="w-5 h-5 mr-2 text-red-500"/> Catégories</h2>
                            <ul className="space-y-2.5 mb-6 max-h-64 overflow-y-auto pr-1">
                              {categories.map(cat => (
                                <li key={cat.id} className="flex justify-between items-center bg-gray-950 p-3 rounded-lg border border-gray-800">
                                  <span className="text-gray-200 text-sm">{cat.name}</span>
                                  <button onClick={() => deleteCategory(cat.id)} className="text-gray-500 hover:text-red-500"><Trash2 className="w-4 h-4"/></button>
                                </li>
                              ))}
                            </ul>
                            <form onSubmit={addCategory} className="flex space-x-2">
                              <input type="text" value={newCategoryName} onChange={e => setNewCategoryName(e.target.value)} placeholder="Nouvelle catégorie..." className="flex-1 bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white outline-none" />
                              <button className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium">Ajouter</button>
                            </form>
                          </div>

                          {/* FOURNISSEURS / TIERS */}
                          <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                            <h2 className="text-lg font-bold text-white mb-4 flex items-center"><Users className="w-5 h-5 mr-2 text-blue-400"/> Fournisseurs / Tiers</h2>
                            <ul className="space-y-2.5 mb-6 max-h-64 overflow-y-auto pr-1">
                              {suppliers.map(sup => (
                                <li key={sup.id} className="flex justify-between items-center bg-gray-950 p-3 rounded-lg border border-gray-800">
                                  <span className="text-gray-200 text-sm">{sup.name}</span>
                                  <button onClick={() => deleteSupplier(sup.id)} className="text-gray-500 hover:text-red-500"><Trash2 className="w-4 h-4"/></button>
                                </li>
                              ))}
                            </ul>
                            <form onSubmit={addSupplier} className="flex space-x-2">
                              <input type="text" value={newSupplierName} onChange={e => setNewSupplierName(e.target.value)} placeholder="Nouveau fournisseur..." className="flex-1 bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white outline-none" />
                              <button className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium">Ajouter</button>
                            </form>
                          </div>

                          {/* GESTION DES EXERCICES ANNUELS */}
                          <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 md:col-span-3">
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                              <div>
                                <h2 className="text-lg font-bold text-white flex items-center"><Calendar className="w-5 h-5 mr-2 text-red-500"/> Gestion des Exercices Annuels</h2>
                                <p className="text-xs text-gray-400 mt-0.5">Vous pouvez laisser plusieurs exercices ouverts en même temps. Cliquez sur un exercice pour l'ouvrir ou le clôturer.</p>
                              </div>
                              <button
                                onClick={() => {
                                  const nextY = openNextYear();
                                  setCurrentYear(nextY);
                                }}
                                className="flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition-colors shadow-lg shadow-blue-600/20"
                              >
                                <Plus className="w-4 h-4" />
                                <span>Ouvrir l'exercice {Math.max(...availableYears.map(Number)) + 1}</span>
                              </button>
                            </div>
                            <div className="flex flex-wrap gap-3">
                              {availableYears.map(year => {
                                const closed = closedYears.includes(year);
                                const hasTx = transactions.some(tx => tx.date.startsWith(year));
                                return (
                                  <div key={year} className={`flex items-center space-x-2 px-4 py-2.5 rounded-xl border text-sm font-medium ${closed ? 'bg-yellow-500/10 border-yellow-500/30 text-yellow-400' : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400'}`}>
                                    <button onClick={() => toggleYearClosure(year)} className="flex items-center space-x-2">
                                      {closed ? <Lock className="w-4 h-4"/> : <Unlock className="w-4 h-4"/>}
                                      <span>{year} ({closed ? 'Clôturé' : 'Ouvert'})</span>
                                    </button>
                                    {!hasTx && availableYears.length > 1 && (
                                      <button onClick={() => deleteYear(year)} title="Supprimer cet exercice vide" className="ml-2 text-gray-500 hover:text-red-400 pl-2 border-l border-gray-700">
                                        <Trash2 className="w-3.5 h-3.5" />
                                      </button>
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        </div>
                      )}

                      {/* SOUS-ONGLET 2 : SAUVEGARDES & ÉTAT DU STOCKAGE (ADMIN & TRÉSORIER) */}
                      {settingsSubTab === 'backups' && (
                        <div className="space-y-6">
                          {/* SAUVEGARDE JSON EN PREMIER (BIEN VISIBLE) */}
                          <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
                              <div>
                                <h2 className="text-lg font-bold text-white flex items-center">
                                  <Save className="w-5 h-5 mr-2 text-emerald-400"/> Sauvegarde de Sécurité (.json) — Google Drive & Ordinateur
                                </h2>
                                <p className="text-xs text-gray-400 mt-0.5">
                                  Centralise automatiquement vos sauvegardes dans votre Google Drive sous <code className="text-emerald-300 font-bold">Trésorier / Sauvegarde / {currentYear} /</code>.
                                </p>
                              </div>
                              {lastJsonBackupAt && (
                                <span className="text-xs text-emerald-400 font-medium">
                                  Dernière sauvegarde : {new Date(lastJsonBackupAt).toLocaleDateString('fr-FR')}
                                </span>
                              )}
                            </div>
                            <div className={`grid grid-cols-1 ${isAdmin ? 'sm:grid-cols-3' : 'sm:grid-cols-2'} gap-3`}>
                              <button
                                onClick={() => exportBackupToDrive(true)}
                                disabled={isBackingUpToDrive}
                                className="flex items-center justify-center space-x-2 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white py-3 px-4 rounded-xl font-bold text-sm transition-colors shadow-lg shadow-emerald-600/20"
                              >
                                <FolderUp className="w-5 h-5"/>
                                <span>{isBackingUpToDrive ? 'Envoi vers Drive...' : `Sauvegarder sur Drive + PC (${currentYear})`}</span>
                              </button>
                              <button
                                onClick={exportBackup}
                                className="flex items-center justify-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white py-3 px-4 rounded-xl font-medium text-sm transition-colors"
                              >
                                <Download className="w-5 h-5"/>
                                <span>Télécharger sur cet appareil seul</span>
                              </button>
                              {isAdmin && (
                                <label className="flex items-center justify-center space-x-2 bg-gray-800 hover:bg-gray-700 text-white py-3 px-4 rounded-xl cursor-pointer font-medium text-sm border border-gray-700 transition-colors">
                                  <Upload className="w-5 h-5"/>
                                  <span>Restaurer un fichier (.json)</span>
                                  <input type="file" accept=".json" onChange={handleFileUpload} className="hidden" />
                                </label>
                              )}
                            </div>
                            {backupDriveMsg && (
                              <div className={`mt-3 p-3 rounded-xl text-xs font-medium border ${
                                backupDriveMsg.type === 'success' ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' :
                                backupDriveMsg.type === 'error' ? 'bg-red-500/10 border-red-500/30 text-red-300' :
                                'bg-blue-500/10 border-blue-500/30 text-blue-300'
                              }`}>
                                {backupDriveMsg.text}
                              </div>
                            )}
                          </div>

                          {/* MONITEUR DE STOCKAGE & QUOTAS (CONSULTATION SEULE POUR LE TRÉSORIER, ACCÈS COMPLET POUR ADMIN) */}
                          <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-5">
                              <div>
                                <h2 className="text-lg font-bold text-white flex items-center">
                                  <Database className="w-5 h-5 mr-2 text-emerald-400"/> État du Stockage & des Quotas (Temps Réel)
                                </h2>
                                <p className="text-xs text-gray-400 mt-0.5">
                                  Suivi de l'espace utilisé sur Firebase, GitHub Pages et Google Drive.{!isAdmin && " (Consultation seule)"}
                                </p>
                              </div>
                              <span className="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full font-bold">
                                État de santé : Optimal
                              </span>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                              {/* CARTE 1 : FIREBASE */}
                              <div className="bg-gray-950 border border-gray-800 rounded-xl p-4 flex flex-col justify-between space-y-3">
                                <div>
                                  <div className="flex items-center justify-between mb-1">
                                    <span className="text-xs font-bold uppercase tracking-wider text-emerald-400">1. Base Firebase</span>
                                    <span className="text-xs font-extrabold text-white">{storageMetrics.kb} Ko / 1 Go</span>
                                  </div>
                                  <div className="w-full bg-gray-800 h-2.5 rounded-full overflow-hidden my-2">
                                    <div className="bg-emerald-500 h-full rounded-full transition-all" style={{ width: `${Math.max(1.5, storageMetrics.firebasePercent)}%` }}></div>
                                  </div>
                                  <p className="text-[11px] text-gray-400">
                                    Utilisé : <strong className="text-white">{storageMetrics.firebasePercent < 0.01 ? '< 0,01 %' : `${storageMetrics.firebasePercent.toFixed(3)} %`}</strong> ({transactions.length} écritures).
                                  </p>
                                  <p className="text-[11px] text-gray-400 mt-1">
                                    Capacité restante : <strong className="text-emerald-400">~{storageMetrics.remainingInstallations.toLocaleString('fr-FR')} écritures</strong>.
                                  </p>
                                </div>
                                {isAdmin && (
                                  <a
                                    href={storageMetrics.firebaseConsoleUrl}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="inline-flex items-center justify-center space-x-1.5 w-full bg-gray-900 hover:bg-gray-800 text-emerald-400 border border-emerald-500/30 py-2 px-3 rounded-lg text-xs font-bold transition-colors"
                                  >
                                    <ExternalLink className="w-3.5 h-3.5" />
                                    <span>Ouvrir la console Firebase</span>
                                  </a>
                                )}
                              </div>

                              {/* CARTE 2 : GITHUB */}
                              <div className="bg-gray-950 border border-gray-800 rounded-xl p-4 flex flex-col justify-between space-y-3">
                                <div>
                                  <div className="flex items-center justify-between mb-1">
                                    <span className="text-xs font-bold uppercase tracking-wider text-blue-400">2. GitHub Pages</span>
                                    <span className="text-xs font-extrabold text-white">{storageMetrics.bandwidthUsedMb} Mo / 100 Go</span>
                                  </div>
                                  <div className="w-full bg-gray-800 h-2.5 rounded-full overflow-hidden my-2">
                                    <div className="bg-blue-500 h-full rounded-full transition-all" style={{ width: `${Math.max(1.5, storageMetrics.bandwidthPercent)}%` }}></div>
                                  </div>
                                  <p className="text-[11px] text-gray-400">
                                    Bande passante restante ce mois : <strong className="text-blue-300">{storageMetrics.bandwidthRemainingGb} Go / 100 Go</strong> ({storageMetrics.monthlyLoads} ouverture{storageMetrics.monthlyLoads > 1 ? 's' : ''}).
                                  </p>
                                  <p className="text-[11px] text-gray-400 mt-1">
                                    Stockage dépôt : <strong className="text-white">{githubLiveSizeKb ? `${githubLiveSizeKb} Ko (API Live)` : `~${storageMetrics.githubEstimatedKb} Ko`} / 1 Go</strong>.
                                  </p>
