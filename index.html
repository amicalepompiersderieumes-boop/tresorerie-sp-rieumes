    // --- SÉCURITÉ : VÉRIFICATION MASQUÉE DU MOT DE PASSE ---
    const EXPECTED_VAULT_KEY = "vault_sp_51a9496ee31d9c64";
    const checkPassword = (pwd) => {
      const clean = (pwd || '').trim();
      const targetCodes = [65, 100, 109, 105, 110, 115, 64, 51, 49]; // Admins@31
      if (clean.length !== targetCodes.length) return false;
      return targetCodes.every((code, idx) => clean.charCodeAt(idx) === code);
    };

    // --- HELPER : FUSION INTELLIGENTE MULTI-APPAREILS (ANTI-ÉCRASEMENT) ---
    const smartMergeById = (localArr = [], cloudArr = [], deletedSet = new Set(), uniqueNameField = null) => {
      const map = new Map();
      (cloudArr || []).forEach(item => {
        if (item && item.id && !deletedSet.has(String(item.id))) {
          map.set(String(item.id), item);
        }
      });
      (localArr || []).forEach(item => {
        if (item && item.id && !deletedSet.has(String(item.id))) {
          const id = String(item.id);
          const existing = map.get(id);
          if (!existing) {
            if (uniqueNameField && item[uniqueNameField]) {
              const dup = Array.from(map.values()).find(
                x => (x[uniqueNameField] || '').trim().toLowerCase() === (item[uniqueNameField] || '').trim().toLowerCase()
              );
              if (dup) return;
            }
            map.set(id, item);
          } else {
            const localMod = item.lastModified || 0;
            const cloudMod = existing.lastModified || 0;
            if (localMod >= cloudMod) {
              map.set(id, { ...existing, ...item });
            }
          }
        }
      });
      return Array.from(map.values());
    };

    // --- HELPER : GÉNÉRATION DU NOM DE FICHIER "facture_nom_du_tiers_numero" ---
    const buildInvoiceFileName = (file, tierOrFallback = '') => {
      const originalName = (file && file.name) ? file.name : '';
      let ext = '';
      if (originalName.includes('.')) {
        ext = '.' + originalName.split('.').pop().toLowerCase();
      } else if (file && file.type) {
        if (file.type.includes('pdf')) ext = '.pdf';
        else if (file.type.includes('png')) ext = '.png';
        else if (file.type.includes('webp')) ext = '.webp';
        else if (file.type.includes('jpeg') || file.type.includes('jpg') || file.type.includes('image')) ext = '.jpg';
      }
      if (!ext) ext = '.jpg';

      const rawTier = (tierOrFallback || '').trim() || 'tiers';
      const cleanTier = rawTier
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-zA-Z0-9]/g, '_')
        .replace(/_+/g, '_')
        .replace(/^_|_$/g, '') || 'tiers';

      const now = new Date();
      const datePart = now.toISOString().slice(0, 10).replace(/-/g, '');
      const randPart = Math.floor(1000 + Math.random() * 9000);
      const uniqueNum = `${datePart}-${randPart}`;

      return `facture_${cleanTier}_${uniqueNum}${ext}`;
    };

    // --- HELPER : ENVOI ROBUSTE VERS GOOGLE DRIVE (AVEC SOUS-DOSSIER ANNÉE + SOUS-DOSSIER FOURNISSEUR / TIERS) ---
    const uploadFileToGoogleDrive = async (file, scriptUrl, tierOrFallback = '', yearFolder = '') => {
      const cleanUrl = (scriptUrl || '').trim();
      if (!cleanUrl.startsWith('https://script.google.com/macros/s/') || !cleanUrl.endsWith('/exec')) {
        throw new Error("L'URL du script doit commencer par https://script.google.com/macros/s/... et finir par /exec");
      }

      const targetYear = (yearFolder || '').toString().trim() || new Date().getFullYear().toString();
      const targetSupplierFolder = (tierOrFallback || '')
        .toString()
        .trim()
        .replace(/[\\/:*?"<>|]/g, '-') || 'Autres_Tiers';

      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = async (ev) => {
          try {
            const base64Content = ev.target.result.split(',')[1];
            const finalFileName = buildInvoiceFileName(file, targetSupplierFolder);

            const payload = JSON.stringify({
              fileName: finalFileName,
              yearFolder: targetYear,
              supplierFolder: targetSupplierFolder,
              subFolderPath: `${targetYear}/${targetSupplierFolder}`,
              mimeType: file.type || 'application/octet-stream',
              base64: base64Content
            });

            const response = await fetch(cleanUrl, {
              method: 'POST',
              redirect: 'follow',
              body: payload
            });

            const rawText = await response.text();
            let resData = null;
            try {
              resData = JSON.parse(rawText);
            } catch (jsonErr) {
              if (rawText.includes('<!DOCTYPE html>') || rawText.includes('Google Accounts')) {
                throw new Error("Autorisation Google manquante : dans script.google.com, exécutez 'autoriserMonDrive' puis refaites 'Déployer > Nouveau déploiement' avec 'Qui peut accéder : Tout le monde'.");
              }
              throw new Error("Réponse inattendue de Google : " + rawText.substring(0, 120));
            }

            if (resData && resData.status === 'success' && resData.url) {
              resolve({
                url: resData.url,
                name: resData.name || finalFileName,
                folder: resData.folder || `${targetYear}`,
                scriptVersion: resData.version || 1
              });
            } else {
              reject(new Error(resData?.message || "Vérifiez l'ID du dossier Drive dans votre script Google."));
            }
          } catch (err) {
            reject(err);
          }
        };
        reader.onerror = () => reject(new Error("Erreur de lecture du fichier sur l'appareil"));
        reader.readAsDataURL(file);
      });
    };

    // --- COMPOSANT : Liste déroulante de recherche intelligente ---
    function AutocompleteInput({ value, onChange, options, placeholder, className, required, direction = 'down' }) {
      const [isOpen, setIsOpen] = useState(false);
      const safeValue = value || '';
      const filteredOptions = options.filter(opt => opt.toLowerCase().includes(safeValue.toLowerCase()));

      const dropdownPositionClasses = direction === 'up'
        ? 'bottom-full mb-1.5 shadow-[0_-10px_25px_-5px_rgba(0,0,0,0.6)]'
        : 'top-full mt-1 shadow-2xl';

      return (
        <div className="relative w-full">
          <input 
            type="text" 
            required={required}
            className={className}
            value={safeValue} 
            onChange={(e) => { onChange(e.target.value); setIsOpen(true); }}
            onFocus={() => setIsOpen(true)}
            onBlur={() => setTimeout(() => setIsOpen(false), 180)}
            placeholder={placeholder}
          />
          {isOpen && filteredOptions.length > 0 && (
            <ul className={`absolute z-[200] w-full bg-gray-800 border border-gray-600 rounded-xl max-h-52 overflow-y-auto left-0 text-sm ${dropdownPositionClasses}`}>
              {filteredOptions.map((opt, i) => (
                <li 
                  key={i} 
                  className="px-3.5 py-2.5 text-gray-200 hover:bg-red-600 hover:text-white cursor-pointer border-b border-gray-700/50 last:border-0 transition-colors"
                  onMouseDown={(e) => { e.preventDefault(); onChange(opt); setIsOpen(false); }}
                >
                  {opt}
                </li>
              ))}
            </ul>
          )}
        </div>
      );
    }

          const res = await fetch(`${activeRestUrl.current}.json`, {

            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)

          return true;
        }
        throw new Error('Aucune connexion active');

            const mergedDeletedList = Array.from(new Set([
              ...(cur.deletedIds || []).map(String),

              ? data.driveScriptUrl.trim()
              : (localDrive ? localDrive.trim() : '');

            const mergedTreasurer = (data.treasurerName && data.treasurerName.trim())
              ? data.treasurerName.trim()
              : (cur.treasurerName || 'Frédéric Sudron');
            const mergedPresident = (data.presidentName && data.presidentName.trim())
              ? data.presidentName.trim()
              : (cur.presidentName || 'Laurent Basque');

            isUpdatingFromCloud.current = true;
            setTransactions(mergedTransactions);
            if (mergedAccounts.length > 0) setAccounts(mergedAccounts);
            if (mergedCategories.length > 0) setCategories(mergedCategories);
            if (mergedSuppliers.length > 0) setSuppliers(mergedSuppliers);
            setAutomations(mergedAutomations);
            setClosedYears(mergedClosedYears);
            setManuallyOpenedYears(mergedOpenedYears);
            setDeletedIds(mergedDeletedList);
            setTreasurerName(mergedTreasurer);
            setPresidentName(mergedPresident);

            if (mergedDriveUrl) {
              setDriveScriptUrl(mergedDriveUrl);
              setTempDriveScriptUrl(mergedDriveUrl);
              localStorage.setItem('sp_rieumes_drive_script_url', mergedDriveUrl);
            }

            const nowIso = new Date().toISOString();
            localStorage.setItem('sp_rieumes_updatedAt', nowIso);
            localStorage.setItem('sp_rieumes_pending_sync', 'false');
            setPendingOfflineSync(false);
            hasInitialCloudSyncCompleted.current = true;

            const cloudTxCount = (data.transactions || []).length;
            const needPushBack =
              hasPendingLocalChanges ||
              mergedTransactions.length !== cloudTxCount ||
              (mergedDriveUrl && !data.driveScriptUrl) ||
              mergedDeletedList.length !== (data.deletedIds || []).length;

            if (needPushBack) {
              saveCallback({
                transactions: mergedTransactions,
                accounts: mergedAccounts.length > 0 ? mergedAccounts : cur.accounts,
                categories: mergedCategories.length > 0 ? mergedCategories : cur.categories,
                suppliers: mergedSuppliers.length > 0 ? mergedSuppliers : cur.suppliers,
                automations: mergedAutomations,
                closedYears: mergedClosedYears,
                manuallyOpenedYears: mergedOpenedYears,
                deletedIds: mergedDeletedList,
                driveScriptUrl: mergedDriveUrl,
                treasurerName: mergedTreasurer,
                presidentName: mergedPresident,
                updatedAt: nowIso
              }).catch(() => {});
            }

            setTimeout(() => { isUpdatingFromCloud.current = false; }, 350);
          } else {
            const nowIso = new Date().toISOString();
            hasInitialCloudSyncCompleted.current = true;
            saveCallback({
              transactions: cur.transactions,
              accounts: cur.accounts,
              categories: cur.categories,
              suppliers: cur.suppliers,
              automations: cur.automations,
              closedYears: cur.closedYears,
              manuallyOpenedYears: cur.manuallyOpenedYears,
              deletedIds: cur.deletedIds || [],
              driveScriptUrl: localDrive,
              treasurerName: cur.treasurerName || 'Frédéric Sudron',
              presidentName: cur.presidentName || 'Laurent Basque',
              updatedAt: nowIso
            }).then(() => {
              localStorage.setItem('sp_rieumes_updatedAt', nowIso);
              localStorage.setItem('sp_rieumes_pending_sync', 'false');
              setPendingOfflineSync(false);
            }).catch(() => {});
          }
        };

        const connectSmart = async () => {
          setCloudStatus(navigator.onLine ? 'connecting' : 'offline');
          setCloudErrorDetail('');

          const urlsToTry = [cleanUrl];
          if (cleanUrl === DEFAULT_FIREBASE_URL) urlsToTry.push(FALLBACK_FIREBASE_URL);

          const pathsToTry = [
            `coffre_fort/${EXPECTED_VAULT_KEY}`,
            `coffre_fort/vault_sp_51a9496e7121b924`,
            `tresorerie_amicale`
          ];

          for (const baseUrl of urlsToTry) {
            for (const path of pathsToTry) {
              if (isCancelled) return;
              try {
                const testResp = await fetch(`${baseUrl}/${path}.json?t=${Date.now()}`, { cache: 'no-store' });
                if (testResp.ok) {
                  const initialData = await testResp.json();
                  activeRestUrl.current = `${baseUrl}/${path}`;
                  setCloudStatus('connected');

                  try {
                    const appName = 'fb_app_' + Date.now();
                    const app = firebase.initializeApp({ databaseURL: baseUrl }, appName);
                    const db = firebase.database(app);
                    const ref = db.ref(path);
                    activeRef = ref;
                    dbRef.current = ref;

                    onValueChange = ref.on('value', (snapshot) => {
                      if (isCancelled) return;
                      setCloudStatus('connected');
                      applyCloudData(snapshot.val(), (payload) => writeDataToCloud(payload));
                    });
                  } catch (sdkErr) {
                    console.warn("SDK WebSocket indisponible en local, mode HTTPS actif :", sdkErr);
                  }

                  applyCloudData(initialData, (payload) => writeDataToCloud(payload));
                  return;
                } else if (testResp.status === 401 || testResp.status === 403) {
                  setCloudErrorDetail('Règles Firebase verrouillées (Permission refusée)');
                }
              } catch (netErr) {
                console.warn("Tentative échouée sur", baseUrl, path, netErr);
              }
            }
          }

          if (!isCancelled) {
            setCloudStatus(navigator.onLine ? 'error' : 'offline');
          }
        };

        connectSmart();

        return () => {
          isCancelled = true;
          if (activeRef && onValueChange) {
            activeRef.off('value', onValueChange);
          }
        };
      }, [firebaseDbUrl, isAuthenticated]);

      // Sauvegarde automatique dans le navigateur ET dans le Cloud
      useEffect(() => {
        localStorage.setItem('sp_rieumes_transactions', JSON.stringify(transactions));
        localStorage.setItem('sp_rieumes_accounts', JSON.stringify(accounts));
        localStorage.setItem('sp_rieumes_categories', JSON.stringify(categories));
        localStorage.setItem('sp_rieumes_suppliers', JSON.stringify(suppliers));
        localStorage.setItem('sp_rieumes_automations', JSON.stringify(automations));
        localStorage.setItem('sp_rieumes_closedYears', JSON.stringify(closedYears));
        localStorage.setItem('sp_rieumes_manuallyOpenedYears', JSON.stringify(manuallyOpenedYears));
        localStorage.setItem('sp_rieumes_deletedIds', JSON.stringify(deletedIds));
        localStorage.setItem('sp_rieumes_treasurer_name', treasurerName);
        localStorage.setItem('sp_rieumes_president_name', presidentName);
        if (driveScriptUrl) {
          localStorage.setItem('sp_rieumes_drive_script_url', driveScriptUrl);
        }

        if (!isUpdatingFromCloud.current && isAuthenticated && hasInitialCloudSyncCompleted.current) {
          const nowIso = new Date().toISOString();
          localStorage.setItem('sp_rieumes_updatedAt', nowIso);

          if ((dbRef.current || activeRestUrl.current) && cloudStatus === 'connected' && navigator.onLine) {
            writeDataToCloud({
              transactions,
              accounts,
              categories,
              suppliers,
              automations,
              closedYears,
              manuallyOpenedYears,
              deletedIds,
              driveScriptUrl: driveScriptUrl || localStorage.getItem('sp_rieumes_drive_script_url') || '',
              treasurerName,
              presidentName,
              updatedAt: nowIso
            }).then(() => {
              localStorage.setItem('sp_rieumes_pending_sync', 'false');
              setPendingOfflineSync(false);
            }).catch(() => {
              localStorage.setItem('sp_rieumes_pending_sync', 'true');
              setPendingOfflineSync(true);
              setCloudStatus('offline');
            });
          } else {
            localStorage.setItem('sp_rieumes_pending_sync', 'true');
            setPendingOfflineSync(true);
          }
        }
      }, [transactions, accounts, categories, suppliers, automations, closedYears, manuallyOpenedYears, deletedIds, driveScriptUrl, treasurerName, presidentName, isAuthenticated]);

      const forcePushToCloud = async (explicitDriveUrl) => {
        const nowIso = new Date().toISOString();
        const urlToSave = explicitDriveUrl !== undefined ? explicitDriveUrl : (driveScriptUrl || localStorage.getItem('sp_rieumes_drive_script_url') || '');
        try {
          let cloudSnap = null;
          if (activeRestUrl.current) {
            const r = await fetch(`${activeRestUrl.current}.json?t=${Date.now()}`, { cache: 'no-store' });
            if (r.ok) cloudSnap = await r.json();
          }
          const mergedDeleted = Array.from(new Set([
            ...(deletedIds || []).map(String),
            ...((cloudSnap && cloudSnap.deletedIds) || []).map(String)
          ])).slice(-1000);
          const delSet = new Set(mergedDeleted);

          const finalTx = cloudSnap ? smartMergeById(transactions, cloudSnap.transactions, delSet) : transactions;
          const finalAcc = cloudSnap ? smartMergeById(accounts, cloudSnap.accounts, delSet, 'name') : accounts;
          const finalCat = cloudSnap ? smartMergeById(categories, cloudSnap.categories, delSet, 'name') : categories;
          const finalSup = cloudSnap ? smartMergeById(suppliers, cloudSnap.suppliers, delSet, 'name') : suppliers;
          const finalAuto = cloudSnap ? smartMergeById(automations, cloudSnap.automations, delSet) : automations;

          await writeDataToCloud({
            transactions: finalTx,
            accounts: finalAcc,
            categories: finalCat,
            suppliers: finalSup,
            automations: finalAuto,
            closedYears,
            manuallyOpenedYears,
            deletedIds: mergedDeleted,
            driveScriptUrl: urlToSave || (cloudSnap && cloudSnap.driveScriptUrl) || '',
            treasurerName,
            presidentName,
            updatedAt: nowIso
          });

          localStorage.setItem('sp_rieumes_updatedAt', nowIso);
          localStorage.setItem('sp_rieumes_pending_sync', 'false');
          setPendingOfflineSync(false);
          setCloudStatus('connected');
        } catch (err) {
          setCloudStatus('error');
        }
      };

      const testDriveConnection = async () => {
        const clean = (tempDriveScriptUrl || '').trim();
        if (!clean) {
          setDriveTestMsg({ type: 'error', text: "Veuillez d'abord coller l'URL du script Google." });
          return;
        }
        setDriveTestMsg({ type: 'info', text: `Test d'envoi d'un fichier dans le sous-dossier "${currentYear} / Test_Fournisseur" de votre Google Drive...` });
        try {
          const dummyBlob = new Blob(["Test de connexion Trésorerie Amicale SP Rieumes"], { type: 'text/plain' });
          dummyBlob.name = "test.txt";
          const res = await uploadFileToGoogleDrive(dummyBlob, clean, "Test_Fournisseur", currentYear);
          setDriveScriptUrl(clean);
          localStorage.setItem('sp_rieumes_drive_script_url', clean);
          forcePushToCloud(clean);
          const hasSubFolder = (res.folder || '').includes('/');
          setDriveTestMsg({
            type: hasSubFolder ? 'success' : 'info',
            text: hasSubFolder
              ? `✅ Succès total ! Fichier "${res.name}" rangé dans le sous-dossier "${res.folder}" de votre Google Drive.`
              : `⚠️ Le fichier est bien arrivé dans "${res.folder}", mais votre Google Apps Script utilise encore l'ancienne version ! Allez sur script.google.com > Déployer > Nouveau déploiement et collez la nouvelle URL ici.`
          });
        } catch (err) {
          setDriveTestMsg({ type: 'error', text: err.message });
        }
      };

      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [isTransferModalOpen, setIsTransferModalOpen] = useState(false);
      const [isAddAutomationOpen, setIsAddAutomationOpen] = useState(false);
      const [isPrintModalOpen, setIsPrintModalOpen] = useState(false);
      const [printConfig, setPrintConfig] = useState({
        reportType: 'ag_complete', // 'ag_complete' | 'balance_category' | 'balance_supplier' | 'ledger_full' | 'ledger_filtered' | 'unpointed_only' | 'missing_receipts'
        accountScope: 'acc1',      // ID d'un compte spécifique ou 'all'
        dateFrom: '',
        dateTo: '',
        signatureDate: new Date().toISOString().split('T')[0],
        includeAccountsTable: true,
        includeSignatures: true,
        includePointedCol: true,
        customTitle: ''
      });
      const [editModalTx, setEditModalTx] = useState(null);
      const [deleteConfirmTx, setDeleteConfirmTx] = useState(null);
      const [receiptModalTx, setReceiptModalTx] = useState(null);
      const [restoreData, setRestoreData] = useState(null);
      
      const [balanceGroupBy, setBalanceGroupBy] = useState('category');

      const [balanceItemFilter, setBalanceItemFilter] = useState('all');

      const [newAccountName, setNewAccountName] = useState('');

      const [newSupplierName, setNewSupplierName] = useState('');

      const [inlineTx, setInlineTx] = useState({
        date: new Date().toISOString().split('T')[0],

        supplier: '',
        category: '',
        paymentMethod: 'CB',
        checkNumber: '',
        type: 'expense',

        receiptName: '',
        showReceiptInput: false,
        uploadingInlineDrive: false
      });

      const formatCurrency = (amount) => {
        return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(amount);
      };

      // F. Calcul du rappel de sauvegarde (> 30 jours ou jamais faite alors qu'il y a des écritures)
      const backupReminderInfo = useMemo(() => {
        if (dismissBackupReminder || transactions.length === 0) return { show: false, days: 0 };
        if (!lastJsonBackupAt) return { show: true, days: null };
        const diffMs = Date.now() - new Date(lastJsonBackupAt).getTime();
        const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        return { show: diffDays >= 30, days: diffDays };
      }, [lastJsonBackupAt, transactions.length, dismissBackupReminder]);

      const availableYears = useMemo(() => {
        const years = new Set(transactions.map(tx => tx.date.split('-')[0]));
        years.add(new Date().getFullYear().toString());
        manuallyOpenedYears.forEach(y => years.add(y));
        const maxYear = Math.max(...Array.from(years).map(Number));
        if (closedYears.includes(maxYear.toString())) {
          years.add((maxYear + 1).toString());
        }
        return Array.from(years).sort().reverse();
      }, [transactions, closedYears, manuallyOpenedYears]);

      useEffect(() => {
        if (!availableYears.includes(currentYear) && availableYears.length > 0) {
          setCurrentYear(availableYears[0]);
        }
      }, [availableYears, currentYear]);

      useEffect(() => {
        setInlineTx(prev => {
          if (prev.date && prev.date.startsWith(currentYear)) return prev;
          const today = new Date().toISOString().split('T')[0];
          const newDate = today.startsWith(currentYear) ? today : `${currentYear}-01-01`;
          return { ...prev, date: newDate };
        });
      }, [currentYear]);

      useEffect(() => {
        if (currentAccountId !== 'all') {
          setInlineTx(prev => ({ ...prev, accountId: currentAccountId }));
        } else if (!inlineTx.accountId && accounts.length > 0) {
          setInlineTx(prev => ({ ...prev, accountId: accounts[0].id }));
        }
      }, [accounts, currentAccountId, inlineTx.accountId]);

      const ensureCategoryAndSupplierExist = (catName, supName) => {
        const cleanCat = (catName || '').trim();
        const cleanSup = (supName || '').trim();
        if (cleanCat && cleanCat !== INTERNAL_TRANSFER_CATEGORY && !categories.some(c => c.name.toLowerCase() === cleanCat.toLowerCase())) {
          setCategories(prev => [...prev, { id: 'cat_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5), name: cleanCat, lastModified: Date.now() }]);
        }
        if (cleanSup && !suppliers.some(s => s.name.toLowerCase() === cleanSup.toLowerCase())) {
          setSuppliers(prev => [...prev, { id: 'sup_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5), name: cleanSup, lastModified: Date.now() }]);
        }
      };

      const filteredTransactions = useMemo(() => {
        return transactions
          .filter(tx => tx.date.startsWith(currentYear))

          .sort((a, b) => new Date(b.date) - new Date(a.date));
      }, [transactions, currentYear, currentAccountId]);

      // A. Compteurs et liste filtrée pour le Livre de Comptes (Recherche + Filtres rapides)
      const unpointedCount = useMemo(() => {
        return filteredTransactions.filter(tx => !tx.reconciled).length;
      }, [filteredTransactions]);

        return filteredTransactions.filter(tx => tx.type === 'expense' && !tx.isInternalTransfer && tx.category !== INTERNAL_TRANSFER_CATEGORY && !tx.receiptUrl).length;
      }, [filteredTransactions]);

      const displayedTransactions = useMemo(() => {
        return filteredTransactions.filter(tx => {
          if (quickFilter === 'unpointed' && tx.reconciled) return false;
          if (quickFilter === 'missing_receipt') {
            const isRealExpense = tx.type === 'expense' && !tx.isInternalTransfer && tx.category !== INTERNAL_TRANSFER_CATEGORY;
            if (!isRealExpense || tx.receiptUrl) return false;
          }
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase().trim();
            const desc = (tx.description || '').toLowerCase();
            const sup = (tx.supplier || '').toLowerCase();
            const cat = (tx.category || '').toLowerCase();
            const chk = (tx.checkNumber || '').toLowerCase();
            const amt = (tx.amount !== undefined ? tx.amount.toString() : '');
            const dateFr = new Date(tx.date).toLocaleDateString('fr-FR');
            return desc.includes(q) || sup.includes(q) || cat.includes(q) || chk.includes(q) || amt.includes(q) || dateFr.includes(q);
          }
          return true;
        });
      }, [filteredTransactions, quickFilter, searchQuery]);

      const isCurrentYearClosed = closedYears.includes(currentYear);

      const balances = useMemo(() => {
        let pointed = 0;
        let unpointed = 0;
        const relevantTransactions = currentAccountId === 'all' 
          ? transactions 
          : transactions.filter(tx => tx.accountId === currentAccountId);

        relevantTransactions.forEach(tx => {
          const modifier = tx.type === 'income' ? 1 : -1;
          if (tx.reconciled) pointed += tx.amount * modifier;
          else unpointed += tx.amount * modifier;
        });
        return { pointed, unpointed, theoretical: pointed + unpointed };
      }, [transactions, currentAccountId]);

      const accountBalances = useMemo(() => {
        const balancesByAccount = {};
        accounts.forEach(acc => {
          balancesByAccount[acc.id] = { pointed: 0, unpointed: 0, theoretical: 0 };
        });

        transactions.forEach(tx => {
          if (balancesByAccount[tx.accountId]) {
            const modifier = tx.type === 'income' ? 1 : -1;
            if (tx.reconciled) balancesByAccount[tx.accountId].pointed += tx.amount * modifier;
            else balancesByAccount[tx.accountId].unpointed += tx.amount * modifier;
            balancesByAccount[tx.accountId].theoretical += tx.amount * modifier;
          }
        });
        return balancesByAccount;
      }, [transactions, accounts]);

      // G. Soldes des comptes arrêtés au 31/12 de l'exercice sélectionné (pour le rapport d'AG)
      const endOfYearAccountBalances = useMemo(() => {
        const res = {};
        accounts.forEach(acc => {
          res[acc.id] = { pointed: 0, theoretical: 0 };
        });
        const cutoff = `${currentYear}-12-31`;
        transactions.forEach(tx => {
          if (tx.date <= cutoff && res[tx.accountId]) {
            const mod = tx.type === 'income' ? 1 : -1;
            if (tx.reconciled) res[tx.accountId].pointed += tx.amount * mod;
            res[tx.accountId].theoretical += tx.amount * mod;
          }
        });
        return res;
      }, [transactions, accounts, currentYear]);

      // Comptabilisation complète de toutes les opérations (y compris les virements internes) dans le Bilan Annuel et le Rapport d'AG
      const categorySummary = useMemo(() => {
        const summary = {};
        categories.forEach(cat => {
          summary[cat.name] = { income: 0, expense: 0, total: 0 };
        });
        
        filteredTransactions.forEach(tx => {
          const catName = tx.category || 'Non catégorisé';
          if (!summary[catName]) {
            summary[catName] = { income: 0, expense: 0, total: 0 };
          }
          if (tx.type === 'income') {
            summary[catName].income += tx.amount;
            summary[catName].total += tx.amount;
          } else {
            summary[catName].expense += tx.amount;
            summary[catName].total -= tx.amount;
          }
        });
        return summary;

      const supplierSummary = useMemo(() => {

        suppliers.forEach(sup => {
          summary[sup.name] = { income: 0, expense: 0, total: 0 };
        });
        
        filteredTransactions.forEach(tx => {
          const supName = (tx.supplier || '').trim() || 'Non renseigné';
          if (!summary[supName]) {
            summary[supName] = { income: 0, expense: 0, total: 0 };
          }
          if (tx.type === 'income') {
            summary[supName].income += tx.amount;
            summary[supName].total += tx.amount;
          } else {
            summary[supName].expense += tx.amount;
            summary[supName].total -= tx.amount;
          }
        });
        return summary;
      }, [filteredTransactions, suppliers]);

      const activeSummary = balanceGroupBy === 'category' ? categorySummary : supplierSummary;

      const reportANouveau = useMemo(() => {
        const relevantTransactions = currentAccountId === 'all' 
          ? transactions 
          : transactions.filter(tx => tx.accountId === currentAccountId);

        return relevantTransactions
          .filter(tx => tx.date.localeCompare(`${currentYear}-01-01`) < 0)
          .reduce((acc, tx) => acc + (tx.type === 'income' ? tx.amount : -tx.amount), 0);
      }, [transactions, currentAccountId, currentYear]);

      const addTransaction = (tx) => {
        ensureCategoryAndSupplierExist(tx.category, tx.supplier);
        const uniqueId = Date.now().toString() + '_' + Math.random().toString(36).slice(2, 6);
        setTransactions(prev => [{ ...tx, id: uniqueId, lastModified: Date.now() }, ...prev]);
        setIsAddModalOpen(false);
      };

      // B. Fonction d'ajout d'un Virement Interne (crée les 2 écritures simultanément)
      const addInternalTransfer = ({ fromAccountId, toAccountId, amount, date, description, paymentMethod, reconciled }) => {
        const fromAcc = accounts.find(a => a.id === fromAccountId)?.name || 'Compte source';
        const toAcc = accounts.find(a => a.id === toAccountId)?.name || 'Compte destination';
        const baseId = Date.now().toString();
        const now = Date.now();
        const cleanDesc = (description || '').trim();

        const txOut = {
          id: `${baseId}_out`,
          transferPairId: baseId,
          isInternalTransfer: true,
          lastModified: now,
          type: 'expense',
          amount: parseFloat(amount),
          description: cleanDesc ? `${cleanDesc} (Vers ${toAcc})` : `Virement interne vers ${toAcc}`,
          supplier: toAcc,
          category: INTERNAL_TRANSFER_CATEGORY,
          date,
          accountId: fromAccountId,
          paymentMethod: paymentMethod || 'Virement',
          checkNumber: null,
          receiptUrl: null,
          receiptName: null,
          reconciled: !!reconciled
        };

        const txIn = {
          id: `${baseId}_in`,
          transferPairId: baseId,
          isInternalTransfer: true,
          lastModified: now,
          type: 'income',
          amount: parseFloat(amount),
          description: cleanDesc ? `${cleanDesc} (Depuis ${fromAcc})` : `Virement interne depuis ${fromAcc}`,
          supplier: fromAcc,
          category: INTERNAL_TRANSFER_CATEGORY,
          date,
          accountId: toAccountId,
          paymentMethod: paymentMethod || 'Virement',
          checkNumber: null,
          receiptUrl: null,
          receiptName: null,
          reconciled: !!reconciled
        };

        setTransactions(prev => [txIn, txOut, ...prev]);
        setIsTransferModalOpen(false);
      };

      const handleEditTransaction = (updatedTx) => {
        ensureCategoryAndSupplierExist(updatedTx.category, updatedTx.supplier);
        setTransactions(prev => prev.map(tx => tx.id === updatedTx.id ? { ...updatedTx, lastModified: Date.now() } : tx));
        setEditModalTx(null);
      };

      const handleUpdateReceipt = (txId, newReceiptUrl, newReceiptName, updatedSupplier) => {
        if (updatedSupplier) {
          ensureCategoryAndSupplierExist('', updatedSupplier);
        }
        setTransactions(prev => prev.map(tx => 
          tx.id === txId 
            ? { 
                ...tx, 
                receiptUrl: newReceiptUrl || null, 
                receiptName: newReceiptName || null,
                supplier: updatedSupplier !== undefined ? updatedSupplier : tx.supplier,
                lastModified: Date.now() 
              } 
            : tx
        ));
        setReceiptModalTx(null);
      };

      const deleteTransaction = (id) => {
        setDeletedIds(prev => Array.from(new Set([...prev, String(id)])));
        setTransactions(prev => prev.filter(tx => tx.id !== id));
        setDeleteConfirmTx(null);
      };

      const toggleReconciled = (id) => {
        setTransactions(prev => prev.map(tx => 
          tx.id === id ? { ...tx, reconciled: !tx.reconciled, lastModified: Date.now() } : tx
        ));
      };

      const handleInlineDriveFile = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const tierLabel = (inlineTx.supplier || '').trim() || (inlineTx.description || '').trim() || 'tiers';
        const txYear = (inlineTx.date || '').split('-')[0] || currentYear;
        if (driveScriptUrl) {
          setInlineTx(prev => ({ ...prev, uploadingInlineDrive: true }));
          try {
            const res = await uploadFileToGoogleDrive(file, driveScriptUrl, tierLabel, txYear);
            setInlineTx(prev => ({
              ...prev,
              receiptUrl: res.url,
              receiptName: res.name,
              uploadingInlineDrive: false,
              showReceiptInput: false
            }));
          } catch (err) {
            alert("Erreur d'envoi vers Google Drive : " + err.message);
            setInlineTx(prev => ({ ...prev, uploadingInlineDrive: false }));
          }
        } else {
          if (file.size > 1500000) {
            alert("Fichier supérieur à 1,5 Mo. Configurez la passerelle Google Drive dans les Paramètres pour envoyer des fichiers sans limite !");
            return;
          }
          const reader = new FileReader();
          reader.onload = (ev) => {
            setInlineTx(prev => ({
              ...prev,
              receiptUrl: ev.target.result,
              receiptName: buildInvoiceFileName(file, tierLabel),
              showReceiptInput: false
            }));
          };
          reader.readAsDataURL(file);
        }
      };

      const handleInlineSubmit = () => {
        if (!inlineTx.amount || !inlineTx.description || !inlineTx.accountId) return;
        const chosenCategory = (inlineTx.category || '').trim() || (categories[0]?.name || 'Autre');
        ensureCategoryAndSupplierExist(chosenCategory, inlineTx.supplier);
        const uniqueId = Date.now().toString() + '_' + Math.random().toString(36).slice(2, 6);
        const newTx = {
          id: uniqueId,
          lastModified: Date.now(),
          type: inlineTx.type,
          amount: parseFloat(inlineTx.amount),
          description: inlineTx.description,
          supplier: (inlineTx.supplier || '').trim(),
          category: chosenCategory,
          date: inlineTx.date,
          accountId: inlineTx.accountId,
          paymentMethod: inlineTx.paymentMethod,
          checkNumber: inlineTx.paymentMethod === 'Chèque' ? inlineTx.checkNumber.trim() : null,
          receiptUrl: (inlineTx.receiptUrl || '').trim() || null,
          receiptName: inlineTx.receiptName || null,
          reconciled: false
        };
        setTransactions(prev => [newTx, ...prev]);
        setInlineTx(prev => ({ ...prev, description: '', supplier: '', category: '', amount: '', checkNumber: '', receiptUrl: '', receiptName: '', showReceiptInput: false }));
      };

      const openNextYear = () => {
        const maxYear = Math.max(...availableYears.map(Number));
        const nextYear = (maxYear + 1).toString();
        if (!manuallyOpenedYears.includes(nextYear)) {
          setManuallyOpenedYears(prev => [...prev, nextYear]);
        }
        setClosedYears(prev => prev.filter(y => y !== nextYear));
        return nextYear;
      };

      const deleteYear = (year) => {
        if (transactions.some(tx => tx.date.startsWith(year))) return;
        setManuallyOpenedYears(prev => prev.filter(y => y !== year));
        setClosedYears(prev => prev.filter(y => y !== year));
        if (currentYear === year) {
          setCurrentYear(new Date().getFullYear().toString());
        }
      };

      const addAutomation = (automation) => {
        ensureCategoryAndSupplierExist(automation.category, automation.supplier);
        const uniqueId = Date.now().toString() + '_' + Math.random().toString(36).slice(2, 6);
        setAutomations(prev => [...prev, { ...automation, id: uniqueId, lastModified: Date.now() }]);
        setIsAddAutomationOpen(false);
      };

      const deleteAutomation = (id) => {
        setDeletedIds(prev => Array.from(new Set([...prev, String(id)])));
        setAutomations(prev => prev.filter(a => a.id !== id));
      };

      const addAccount = (e) => {
        e.preventDefault();
        if (newAccountName.trim()) {
          setAccounts(prev => [...prev, { id: 'acc_' + Date.now(), name: newAccountName.trim(), lastModified: Date.now() }]);
          setNewAccountName('');
        }
      };

      const deleteAccount = (id) => {
        if (accounts.length > 1) {
          setDeletedIds(prev => Array.from(new Set([...prev, String(id)])));
          setAccounts(prev => prev.filter(a => a.id !== id));
          if (currentAccountId === id) setCurrentAccountId('all');
        }
      };

      const addCategory = (e) => {
        e.preventDefault();
        if (newCategoryName.trim()) {
          setCategories(prev => [...prev, { id: 'cat_' + Date.now(), name: newCategoryName.trim(), lastModified: Date.now() }]);
          setNewCategoryName('');
        }
      };

      const deleteCategory = (id) => {
        if (categories.length > 1) {
          setDeletedIds(prev => Array.from(new Set([...prev, String(id)])));
          setCategories(prev => prev.filter(c => c.id !== id));
        }
      };

      const addSupplier = (e) => {
        e.preventDefault();
        if (newSupplierName.trim()) {
          setSuppliers(prev => [...prev, { id: 'sup_' + Date.now(), name: newSupplierName.trim(), lastModified: Date.now() }]);
          setNewSupplierName('');
        }
      };

      const deleteSupplier = (id) => {
        setDeletedIds(prev => Array.from(new Set([...prev, String(id)])));
        setSuppliers(prev => prev.filter(s => s.id !== id));
      };

      const toggleYearClosure = (year) => {
        if (closedYears.includes(year)) {
          setClosedYears(prev => prev.filter(y => y !== year));
        } else {
          setClosedYears(prev => [...prev, year]);
        }
      };

      const exportCSV = () => {
        const separator = ';';
        let csvContent = '\uFEFF'; 
        csvContent += `BILAN FINANCIER ${currentYear} - Amicale SP Rieumes\n\n`;
        csvContent += `RÉSUMÉ PAR CATÉGORIE\n`;
        csvContent += `Catégorie${separator}Recettes${separator}Dépenses${separator}Solde\n`;
        
        Object.entries(categorySummary).forEach(([cat, data]) => {
          csvContent += `${cat}${separator}${data.income.toString().replace('.', ',')}${separator}${data.expense.toString().replace('.', ',')}${separator}${data.total.toString().replace('.', ',')}\n`;
        });

        csvContent += `\nRÉSUMÉ PAR FOURNISSEUR / TIERS\n`;
        csvContent += `Fournisseur / Tiers${separator}Recettes${separator}Dépenses${separator}Solde\n`;
        Object.entries(supplierSummary).forEach(([sup, data]) => {
          if (data.income > 0 || data.expense > 0) {
            csvContent += `${sup}${separator}${data.income.toString().replace('.', ',')}${separator}${data.expense.toString().replace('.', ',')}${separator}${data.total.toString().replace('.', ',')}\n`;
          }
        });
        
        const totalInc = Object.values(categorySummary).reduce((acc, curr) => acc + curr.income, 0);
        const totalExp = Object.values(categorySummary).reduce((acc, curr) => acc + curr.expense, 0);
        const totalSolde = Object.values(categorySummary).reduce((acc, curr) => acc + curr.total, 0);
        
        csvContent += `\nTOTAL DES MOUVEMENTS${separator}${totalInc.toString().replace('.', ',')}${separator}${totalExp.toString().replace('.', ',')}${separator}${totalSolde.toString().replace('.', ',')}\n`;
        csvContent += `Report à nouveau${separator}${separator}${separator}${reportANouveau.toString().replace('.', ',')}\n`;
        csvContent += `SOLDE FINAL (Avec report)${separator}${separator}${separator}${(reportANouveau + totalSolde).toString().replace('.', ',')}\n\n\n`;
        csvContent += `DÉTAIL DES OPÉRATIONS\n`;
        const headers = ['Date', 'Compte', 'Libellé', 'Fournisseur / Tiers', 'Catégorie', 'Mode', 'N° Chèque', 'Type', 'Montant', 'Pointé', 'Justificatif'];
        csvContent += headers.join(separator) + '\n';

        const rows = filteredTransactions.map(tx => [
          new Date(tx.date).toLocaleDateString('fr-FR'),
          accounts.find(a => a.id === tx.accountId)?.name || '-',
          `"${(tx.description || '').replace(/"/g, '""')}"`,
          `"${(tx.supplier || '-').replace(/"/g, '""')}"`,
          tx.category,
          tx.paymentMethod || '-',
          tx.checkNumber ? `"${tx.checkNumber}"` : '-',
          tx.type === 'income' ? 'Recette' : 'Dépense',
          tx.amount.toString().replace('.', ','),
          tx.reconciled ? 'Oui' : 'Non',
          tx.receiptUrl ? `"${tx.receiptUrl.startsWith('data:') ? (tx.receiptName || 'Fichier joint') : tx.receiptUrl}"` : '-'
        ]);
        csvContent += rows.map(e => e.join(separator)).join("\n");
          
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `Bilan_SP_Rieumes_${currentYear}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const exportBackup = () => {
        const nowIso = new Date().toISOString();
        const data = { transactions, accounts, categories, suppliers, automations, closedYears, manuallyOpenedYears, deletedIds, driveScriptUrl, treasurerName, presidentName, exportDate: nowIso };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `sauvegarde_tresorerie_${nowIso.split('T')[0]}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        localStorage.setItem('sp_rieumes_last_json_backup', nowIso);
        setLastJsonBackupAt(nowIso);
        setDismissBackupReminder(true);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.transactions && data.accounts) setRestoreData(data);
          } catch (err) {
            console.error("Erreur de lecture", err);
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const confirmRestore = () => {
        if (restoreData) {
          setTransactions(restoreData.transactions || []);
          setAccounts(restoreData.accounts || []);
          setCategories(restoreData.categories || []);
          if (restoreData.suppliers) setSuppliers(restoreData.suppliers);
          setAutomations(restoreData.automations || []);
          setClosedYears(restoreData.closedYears || []);
          setManuallyOpenedYears(restoreData.manuallyOpenedYears || []);
          setDeletedIds(restoreData.deletedIds || []);
          if (restoreData.driveScriptUrl) {
            setDriveScriptUrl(restoreData.driveScriptUrl);
            setTempDriveScriptUrl(restoreData.driveScriptUrl);
          }
          if (restoreData.treasurerName) setTreasurerName(restoreData.treasurerName);
          if (restoreData.presidentName) setPresidentName(restoreData.presidentName);
          setRestoreData(null);
        }
      };

      const handleNavClick = (tabId) => {
        setActiveTab(tabId);
        setIsMobileMenuOpen(false);
        if (tabId === 'transactions' && !hasSelectedAccountOnce) {
          setIsAccountPickerOpen(true);
        }
      };

      const navItems = [
        { id: 'dashboard', label: 'Tableau de Bord', icon: LayoutDashboard },
        { id: 'transactions', label: 'Livre de Comptes', icon: List },
        { id: 'balance', label: 'Bilan Annuel', icon: FileText },
        { id: 'automations', label: 'Automatisations', icon: Repeat },
        { id: 'settings', label: 'Paramètres', icon: Settings }
      ];

      const filteredSummaryEntries = Object.entries(activeSummary).filter(([itemKey, data]) => {
        if (balanceItemFilter !== 'all' && itemKey !== balanceItemFilter) return false;
        if (balanceTypeFilter === 'income' && data.income === 0) return false;
        if (balanceTypeFilter === 'expense' && data.expense === 0) return false;
        if (balanceItemFilter === 'all' && data.income === 0 && data.expense === 0) return false;
        return true;
      });

      const sumIncome = filteredSummaryEntries.reduce((acc, [_, data]) => acc + data.income, 0);
      const sumExpense = filteredSummaryEntries.reduce((acc, [_, data]) => acc + data.expense, 0);
      const sumTotal = filteredSummaryEntries.reduce((acc, [_, data]) => acc + data.total, 0);

      const currentAccountName = currentAccountId === 'all' 
        ? 'Tous les comptes (Cumul)' 
        : (accounts.find(a => a.id === currentAccountId)?.name || 'Compte');

      // Liste des comptes triée avec le compte actuellement travaillé en premier choix
      const orderedAccountsForPrint = useMemo(() => {
        if (currentAccountId === 'all') return accounts;
        const activeAcc = accounts.find(a => a.id === currentAccountId);
        const otherAccs = accounts.filter(a => a.id !== currentAccountId);
        return activeAcc ? [activeAcc, ...otherAccs] : accounts;
      }, [accounts, currentAccountId]);

      // --- CALCUL DES DONNÉES POUR LE CENTRE D'IMPRESSION SUR-MESURE ---
      const printReportData = useMemo(() => {
        const scopeAccId = (!printConfig.accountScope || printConfig.accountScope === 'current')
          ? currentAccountId
          : printConfig.accountScope;
        const scopeAccName = scopeAccId === 'all'
          ? 'Tous les comptes (Cumul global)'
          : (accounts.find(a => a.id === scopeAccId)?.name || 'Compte');

        const start = printConfig.dateFrom || `${currentYear}-01-01`;
        const end = printConfig.dateTo || `${currentYear}-12-31`;

        let baseTxs = transactions
          .filter(tx => tx.date >= start && tx.date <= end)
          .filter(tx => scopeAccId === 'all' || tx.accountId === scopeAccId)
          .sort((a, b) => new Date(a.date) - new Date(b.date));

        if (printConfig.reportType === 'ledger_filtered') {
          baseTxs = displayedTransactions
            .filter(tx => scopeAccId === 'all' || tx.accountId === scopeAccId)
            .slice()
            .sort((a, b) => new Date(a.date) - new Date(b.date));
        } else if (printConfig.reportType === 'unpointed_only') {
          baseTxs = baseTxs.filter(tx => !tx.reconciled);
        } else if (printConfig.reportType === 'missing_receipts') {
          baseTxs = baseTxs.filter(tx => tx.type === 'expense' && !tx.isInternalTransfer && tx.category !== INTERNAL_TRANSFER_CATEGORY && !tx.receiptUrl);
        }

        const catMap = {};
        const supMap = {};
        let totalInc = 0;
        let totalExp = 0;

        baseTxs.forEach(tx => {
          const cName = tx.category || 'Non catégorisé';
          const sName = (tx.supplier || '').trim() || 'Non renseigné';
          if (!catMap[cName]) catMap[cName] = { income: 0, expense: 0, total: 0, txs: [] };
          if (!supMap[sName]) supMap[sName] = { income: 0, expense: 0, total: 0, txs: [] };

          if (tx.type === 'income') {
            catMap[cName].income += tx.amount;
            catMap[cName].total += tx.amount;
            supMap[sName].income += tx.amount;
            supMap[sName].total += tx.amount;
            totalInc += tx.amount;
          } else {
            catMap[cName].expense += tx.amount;
            catMap[cName].total -= tx.amount;
            supMap[sName].expense += tx.amount;
            supMap[sName].total -= tx.amount;
            totalExp += tx.amount;
          }
          catMap[cName].txs.push(tx);
          supMap[sName].txs.push(tx);
        });

        const reportBefore = transactions
          .filter(tx => scopeAccId === 'all' || tx.accountId === scopeAccId)
          .filter(tx => tx.date < start)
          .reduce((acc, tx) => acc + (tx.type === 'income' ? tx.amount : -tx.amount), 0);

        return {
          scopeAccId,
          scopeAccName,
          start,
          end,
          baseTxs,
          catEntries: Object.entries(catMap).sort((a, b) => a[0].localeCompare(b[0])),
          supEntries: Object.entries(supMap).sort((a, b) => a[0].localeCompare(b[0])),
          totalInc,
          totalExp,
          totalNet: totalInc - totalExp,
          reportBefore,
          finalBalance: reportBefore + (totalInc - totalExp)
        };
      }, [printConfig, transactions, currentAccountId, currentYear, accounts, displayedTransactions]);

      const openPrintCenter = (defaultType = 'ag_complete') => {
        setPrintConfig(prev => ({
          ...prev,
          reportType: defaultType,
          accountScope: currentAccountId,
          dateFrom: `${currentYear}-01-01`,
          dateTo: `${currentYear}-12-31`,
          signatureDate: new Date().toISOString().split('T')[0]
        }));
        setIsPrintModalOpen(true);
      };

      const formattedSignatureDate = useMemo(() => {
        if (!printConfig.signatureDate) return new Date().toLocaleDateString('fr-FR');
        const [y, m, d] = printConfig.signatureDate.split('-');
        return (y && m && d) ? `${d}/${m}/${y}` : new Date().toLocaleDateString('fr-FR');
      }, [printConfig.signatureDate]);

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-gray-950 flex flex-col items-center justify-center p-4">
            <div className="bg-gray-900 border border-gray-800 p-8 rounded-3xl w-full max-w-md shadow-2xl flex flex-col items-center">
              <div className="bg-red-600 p-4 rounded-2xl shadow-lg shadow-red-600/20 mb-6">
                <Flame className="w-10 h-10 text-white" />
              </div>
              <h1 className="text-2xl font-bold text-white mb-2 text-center tracking-tight">Amicale SP Rieumes</h1>
              <p className="text-gray-400 mb-8 text-center text-sm font-medium">Accès sécurisé à la trésorerie</p>
              <form onSubmit={(e) => { 
                e.preventDefault(); 
                if (checkPassword(passwordInput)) { 
                  setIsAuthenticated(true); 
                  setPasswordError(false); 
                } else { 
                  setPasswordError(true); 
                } 
              }} className="w-full space-y-5">
                <div>
                  <input type="password" placeholder="Mot de passe d'accès" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} className={`w-full bg-gray-950 border ${passwordError ? 'border-red-500' : 'border-gray-700'} rounded-xl p-4 text-white outline-none focus:border-red-500 transition-all text-center text-lg tracking-widest`} />
                  {passwordError && <p className="text-red-500 text-xs mt-2 text-center font-medium">Mot de passe incorrect.</p>}
                </div>
                <button type="submit" className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-4 rounded-xl transition-colors flex items-center justify-center shadow-lg shadow-red-600/20">
                  <Lock className="w-5 h-5 mr-2" /> Déverrouiller
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gray-950 text-gray-100 font-sans">
          <div className="flex h-screen overflow-hidden print:hidden">
            {/* SIDEBAR DESKTOP */}
            <aside className="hidden md:flex w-64 flex-col bg-gray-900 border-r border-gray-800 print:hidden">
              <div className="p-6 flex items-center space-x-3">
                <div className="bg-red-600 p-2 rounded-xl shadow-lg shadow-red-600/20 flex-shrink-0">
                  <Flame className="w-6 h-6 text-white" />
                </div>
                <div>
                  <h1 className="text-lg font-bold text-white tracking-tight leading-tight">Trésorerie Amicale</h1>
                  <p className="text-xs text-red-400 font-medium mt-0.5">Sapeurs-Pompiers de Rieumes</p>
                </div>
              </div>
              <nav className="flex-1 px-4 py-4 space-y-2">
                {navItems.map((item) => (
                  <button key={item.id} onClick={() => handleNavClick(item.id)} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all ${activeTab === item.id ? 'bg-red-600 text-white shadow-md shadow-red-600/10' : 'text-gray-400 hover:bg-gray-800 hover:text-white'}`}>
                    <item.icon className="w-5 h-5" />
                    <span className="font-medium">{item.label}</span>
                  </button>
                ))}
              </nav>
              <div className="p-4 space-y-3 border-t border-gray-800">
                <div className={`flex flex-col items-center justify-center p-2.5 rounded-xl text-xs font-medium border ${
                  cloudStatus === 'connected' && !pendingOfflineSync ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' :
                  cloudStatus === 'offline' || pendingOfflineSync ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' :
                  cloudStatus === 'error' ? 'bg-red-500/10 text-red-400 border-red-500/20' :
                  'bg-gray-800 text-gray-400 border-gray-700'
                }`}>
                  <div className="flex items-center space-x-2">
                    <span className={`w-2 h-2 rounded-full ${
                      cloudStatus === 'connected' && !pendingOfflineSync ? 'bg-emerald-400 animate-pulse' :
                      cloudStatus === 'offline' || pendingOfflineSync ? 'bg-amber-400 animate-pulse' :
                      cloudStatus === 'error' ? 'bg-red-500' : 'bg-yellow-400 animate-pulse'
                    }`}></span>
                    <span>
                      {cloudStatus === 'connected' && !pendingOfflineSync ? 'Synchronisé (Fusion active)' :
                       pendingOfflineSync ? 'Sauvegardé sur PC (Attente réseau)' :
                       cloudStatus === 'offline' ? 'Hors-ligne (Sauvegarde PC active)' :
                       cloudStatus === 'error' ? 'Mode Local (Vérifier Règles)' :
                       'Connexion Firebase...'}
                    </span>
                  </div>
                  {pendingOfflineSync && cloudStatus === 'connected' && (
                    <button onClick={() => forcePushToCloud()} className="mt-1.5 text-[11px] underline text-amber-300 hover:text-white">
                      Fusionner maintenant
                    </button>
                  )}
                </div>
                <p className="text-xs text-gray-500 text-center font-medium">
                  © {new Date().getFullYear()} - Amicale SP Rieumes<br/>Laurent Basque
                </p>
              </div>
            </aside>

            {/* HEADER MOBILE */}
            <div className="md:hidden fixed top-0 left-0 right-0 h-16 bg-gray-900 border-b border-gray-800 flex items-center justify-between px-4 z-40 print:hidden">
              <div className="flex items-center space-x-2 overflow-hidden mr-2">
                 <Flame className="w-6 h-6 text-red-500 flex-shrink-0" />
                 <h1 className="text-base font-bold text-white truncate">Trésorerie Amicale SP Rieumes</h1>
              </div>
              <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="text-gray-400 flex-shrink-0">
                {isMobileMenuOpen ? <X className="w-6 h-6" /> : <Menu className="w-6 h-6" />}
              </button>
            </div>

            {isMobileMenuOpen && (
              <div className="md:hidden fixed inset-0 top-16 bg-gray-900 z-30 flex flex-col p-4 print:hidden">
                 <div className="flex-1 space-y-2 overflow-y-auto">
                   {navItems.map((item) => (
                    <button key={item.id} onClick={() => handleNavClick(item.id)} className={`w-full flex items-center space-x-3 px-4 py-4 rounded-xl transition-all ${activeTab === item.id ? 'bg-red-600 text-white' : 'text-gray-400'}`}>
                      <item.icon className="w-5 h-5" />
                      <span className="font-medium text-lg">{item.label}</span>
                    </button>
                  ))}
                 </div>
              </div>
            )}

            {/* CONTENU PRINCIPAL */}
            <main className="flex-1 flex flex-col h-full overflow-hidden w-full pt-16 md:pt-0">
              <header className="bg-gray-900/50 backdrop-blur-sm border-b border-gray-800 p-4 flex flex-col sm:flex-row justify-between items-center z-10 print:hidden space-y-3 sm:space-y-0">
                <div className="flex flex-wrap sm:flex-nowrap gap-3 w-full sm:w-auto">
                  <button 
                    onClick={() => setIsAccountPickerOpen(true)}
                    className="flex items-center justify-between space-x-3 bg-gray-800 hover:bg-gray-750 border border-gray-700 hover:border-red-500/50 text-white px-4 py-2.5 rounded-xl transition-all shadow-sm flex-1 sm:flex-initial group"
                  >
                    <div className="flex items-center space-x-2.5">
                      <div className="bg-red-500/10 text-red-400 p-1.5 rounded-lg group-hover:bg-red-600 group-hover:text-white transition-colors">
                        <CreditCard className="w-4 h-4" />
                      </div>
                      <div className="text-left">
                        <span className="block text-[10px] uppercase tracking-wider text-gray-400 font-semibold leading-none mb-0.5">Compte actif</span>
                        <span className="text-sm font-bold text-white">{currentAccountName}</span>
                      </div>
                    </div>
                    <ChevronDown className="w-4 h-4 text-gray-400 group-hover:text-white transition-colors" />
                  </button>

                  <button 
                    onClick={() => setIsYearPickerOpen(true)}
                    className="flex items-center justify-between space-x-3 bg-gray-800 hover:bg-gray-750 border border-gray-700 hover:border-red-500/50 text-white px-4 py-2.5 rounded-xl transition-all shadow-sm group"
                  >
                    <div className="flex items-center space-x-2.5">
                      <div className="bg-blue-500/10 text-blue-400 p-1.5 rounded-lg group-hover:bg-blue-600 group-hover:text-white transition-colors">
                        <Calendar className="w-4 h-4" />
                      </div>
                      <div className="text-left">
                        <span className="block text-[10px] uppercase tracking-wider text-gray-400 font-semibold leading-none mb-0.5">Exercice</span>
                        <span className="text-sm font-bold text-white flex items-center gap-1.5">
                          {currentYear}
                          {isCurrentYearClosed && <Lock className="w-3.5 h-3.5 text-yellow-500" />}
                        </span>
                      </div>
                    </div>
                    <ChevronDown className="w-4 h-4 text-gray-400 group-hover:text-white transition-colors" />
                  </button>
                </div>

                {!isCurrentYearClosed && (
                  <div className="flex flex-wrap sm:flex-nowrap gap-2.5 w-full sm:w-auto">
                    <button 
                      onClick={() => setIsTransferModalOpen(true)} 
                      className="flex-1 sm:flex-initial flex items-center justify-center space-x-2 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-indigo-300 hover:text-white px-4 py-2.5 rounded-xl font-medium transition-colors"
                      title="Transférer une somme d'un compte à un autre"
                    >
                      <ArrowLeftRight className="w-4 h-4" /><span>Virement interne</span>
                    </button>
                    <button 
                      onClick={() => setIsAddModalOpen(true)} 
                      className="flex-1 sm:flex-initial flex items-center justify-center space-x-2 bg-red-600 hover:bg-red-700 text-white px-5 py-2.5 rounded-xl font-medium transition-colors shadow-lg shadow-red-600/20"
                    >
                      <Plus className="w-5 h-5" /><span>Nouvelle Opération</span>
                    </button>
                  </div>
                )}
              </header>

              <div className="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
                <div className="max-w-[1600px] w-full mx-auto">

                  {/* F. BANDEAU DISCRET DE RAPPEL DE SAUVEGARDE .JSON (> 30 JOURS) */}
                  {backupReminderInfo.show && (
                    <div className="mb-6 bg-blue-950/40 border border-blue-500/30 rounded-2xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 print:hidden">
                      <div className="flex items-center space-x-3">
                        <div className="bg-blue-500/20 text-blue-400 p-2.5 rounded-xl flex-shrink-0">
                          <Download className="w-5 h-5" />
                        </div>
                        <div>
                          <h4 className="text-sm font-bold text-white">Rappel de sécurité mensuel (.json)</h4>
                          <p className="text-xs text-gray-300 mt-0.5">
                            {backupReminderInfo.days === null
                              ? "Vous n'avez pas encore téléchargé de copie de secours (.json) sur cet ordinateur."
                              : `Votre dernière copie de sauvegarde sur ordinateur date d'il y a ${backupReminderInfo.days} jours.`}
                          </p>
                        </div>
                      </div>
                      <div className="flex items-center space-x-2 w-full sm:w-auto justify-end">
                        <button
                          onClick={exportBackup}
                          className="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition-colors flex items-center space-x-1.5 shadow"
                        >
                          <Download className="w-4 h-4" />
                          <span>Télécharger la copie du mois (.json)</span>
                        </button>
                        <button
                          onClick={() => setDismissBackupReminder(true)}
                          title="Me le rappeler plus tard"
                          className="text-gray-400 hover:text-white p-2"
                        >
                          <X className="w-4 h-4" />
                        </button>
                      </div>
                    </div>
                  )}
                  
                  {/* ONGLET 1 : TABLEAU DE BORD */}
                  {activeTab === 'dashboard' && (
                    <div className="space-y-6">
                      {isCurrentYearClosed && (
                        <div className="bg-yellow-500/10 border border-yellow-500/20 text-yellow-500 p-4 rounded-xl flex items-center">
                          <Lock className="w-6 h-6 mr-3 flex-shrink-0" />
                          <div>
                            <h4 className="font-bold">Exercice Clôturé</h4>
                            <p className="text-sm">L'année {currentYear} est verrouillée.</p>
                          </div>
                        </div>
                      )}
                      <div>
                        <h2 className="text-2xl font-bold text-white mb-6">Aperçu Financier ({currentAccountName})</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                          <div className="bg-gray-900 border border-gray-800 p-6 rounded-2xl relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-4 opacity-10"><CheckCircle className="w-24 h-24" /></div>
                            <p className="text-sm font-medium text-gray-400 mb-1">Solde Bancaire (Pointé)</p>
                            <h3 className={`text-4xl font-bold ${balances.pointed >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>{formatCurrency(balances.pointed)}</h3>
                          </div>
                          <div className="bg-gray-900 border border-gray-800 p-6 rounded-2xl relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-4 opacity-10"><Circle className="w-24 h-24" /></div>
                            <p className="text-sm font-medium text-gray-400 mb-1">Opérations non pointées</p>
                            <h3 className={`text-4xl font-bold ${balances.unpointed >= 0 ? 'text-blue-400' : 'text-yellow-500'}`}>{balances.unpointed > 0 ? '+' : ''}{formatCurrency(balances.unpointed)}</h3>
                          </div>
                          <div className="bg-gray-900 border border-gray-800 p-6 rounded-2xl relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-4 opacity-10"><LayoutDashboard className="w-24 h-24" /></div>
                            <p className="text-sm font-medium text-gray-400 mb-1">Solde Théorique</p>
                            <h3 className={`text-4xl font-bold ${balances.theoretical >= 0 ? 'text-white' : 'text-red-400'}`}>{formatCurrency(balances.theoretical)}</h3>
                          </div>
                        </div>
                      </div>

                      {accounts.length > 0 && (
                        <div className="mt-8">
                          <h3 className="text-lg font-bold text-white mb-4">Soldes par compte (cliquer pour ouvrir le Livre de Comptes)</h3>
                          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {accounts.map(acc => {
                              const bal = accountBalances[acc.id] || { pointed: 0, unpointed: 0, theoretical: 0 };
                              return (
                                <div 
                                  key={acc.id} 
                                  onClick={() => { setCurrentAccountId(acc.id); setHasSelectedAccountOnce(true); setActiveTab('transactions'); }}
                                  className="bg-gray-900 hover:bg-gray-800/80 cursor-pointer transition-all p-5 rounded-2xl border border-gray-800 hover:border-red-500/50 flex flex-col justify-between group"
                                >
                                  <div className="flex items-center justify-between mb-4">
                                    <div className="flex items-center space-x-2.5">
                                      <CreditCard className="w-5 h-5 text-red-500" />
                                      <h4 className="font-bold text-gray-100 group-hover:text-white">{acc.name}</h4>
                                    </div>
                                    <span className="text-xs text-gray-500 group-hover:text-red-400">Ouvrir →</span>
                                  </div>
                                  <div className="flex justify-between items-end pt-2 border-t border-gray-800">
                                    <div><p className="text-xs text-gray-500 mb-1">Pointé</p><p className={`font-bold text-lg ${bal.pointed >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>{formatCurrency(bal.pointed)}</p></div>
                                    <div className="text-right"><p className="text-xs text-gray-500 mb-1">Théorique</p><p className={`font-bold text-lg ${bal.theoretical >= 0 ? 'text-white' : 'text-red-400'}`}>{formatCurrency(bal.theoretical)}</p></div>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  {/* ONGLET 2 : LIVRE DE COMPTES */}
                  {activeTab === 'transactions' && (
                    <div className="space-y-6">
                      {/* BANDEAU DES SOLDES DU COMPTE TRAITÉ */}
                      <div className="bg-gradient-to-br from-gray-900 via-gray-900 to-gray-950 border border-gray-800 rounded-2xl p-5 shadow-lg">
                        <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                          <div className="flex items-center space-x-4">
                            <div className="bg-red-600/20 border border-red-500/30 p-3.5 rounded-2xl text-red-400">
                              <CreditCard className="w-7 h-7" />
                            </div>
                            <div>
                              <span className="text-xs uppercase tracking-wider text-gray-400 font-semibold">Compte en cours de traitement</span>
                              <div className="flex flex-wrap items-center gap-2 mt-0.5">
                                <h2 className="text-2xl font-extrabold text-white">{currentAccountName}</h2>
                                <button 
                                  onClick={() => setIsAccountPickerOpen(true)}
                                  className="text-xs bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-1.5 rounded-lg border border-gray-700 transition-colors flex items-center space-x-1"
                                >
                                  <Repeat className="w-3.5 h-3.5 mr-1 text-red-400" />
                                  <span>Changer de compte</span>
                                </button>
                              </div>
                            </div>
                          </div>

                          <div className="grid grid-cols-3 gap-3 w-full lg:w-auto">
                            <div className="bg-gray-950/90 border border-gray-800 px-4 py-3 rounded-xl">
                              <p className="text-xs text-gray-400">Solde Pointé</p>
                              <p className={`text-lg sm:text-xl font-bold mt-0.5 ${balances.pointed >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                                {formatCurrency(balances.pointed)}
                              </p>
                            </div>
                            <div className="bg-gray-950/90 border border-gray-800 px-4 py-3 rounded-xl">
                              <p className="text-xs text-gray-400">Non Pointé</p>
                              <p className={`text-lg sm:text-xl font-bold mt-0.5 ${balances.unpointed >= 0 ? 'text-blue-400' : 'text-yellow-400'}`}>
                                {balances.unpointed > 0 ? '+' : ''}{formatCurrency(balances.unpointed)}
                              </p>
                            </div>
                            <div className="bg-gray-950/90 border border-gray-700 px-4 py-3 rounded-xl">
                              <p className="text-xs text-gray-300 font-medium">Solde Théorique</p>
                              <p className={`text-lg sm:text-xl font-extrabold mt-0.5 ${balances.theoretical >= 0 ? 'text-white' : 'text-red-400'}`}>
                                {formatCurrency(balances.theoretical)}
                              </p>
                            </div>
                          </div>
                        </div>
                      </div>

                      {/* TABLEAU DES ÉCRITURES AVEC RECHERCHE & FILTRES RAPIDES (A) */}
                      <div className="bg-gray-900 border border-gray-800 rounded-2xl shadow-sm overflow-visible">
                        <div className="p-5 border-b border-gray-800 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                          <div className="flex items-center space-x-3">
                            <h3 className="text-lg font-bold text-white">Écritures de l'exercice {currentYear}</h3>
                            <span className="text-xs bg-gray-800 text-gray-300 px-2.5 py-1 rounded-full border border-gray-700">
                              {displayedTransactions.length} / {filteredTransactions.length} opération(s)
                            </span>
                          </div>

                          {/* A. BARRE DE RECHERCHE & FILTRES RAPIDES */}
                          <div className="flex flex-wrap items-center gap-2.5 w-full lg:w-auto print:hidden">
                            <div className="relative flex-1 sm:w-64">
                              <Search className="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" />
                              <input
                                type="text"
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                placeholder="Chercher libellé, tiers, chèque, montant..."
                                className="w-full bg-gray-950 border border-gray-700 focus:border-red-500 rounded-xl pl-9 pr-8 py-2 text-xs text-white outline-none"
                              />
                              {searchQuery && (
                                <button onClick={() => setSearchQuery('')} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
                                  <X className="w-3.5 h-3.5" />
                                </button>
                              )}
                            </div>

                            <div className="flex items-center bg-gray-950 p-1 rounded-xl border border-gray-800">
                              <button
                                onClick={() => setQuickFilter('all')}
                                className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${quickFilter === 'all' ? 'bg-gray-800 text-white shadow' : 'text-gray-400 hover:text-white'}`}
                              >
                                Tout
                              </button>
                              <button
                                onClick={() => setQuickFilter(quickFilter === 'unpointed' ? 'all' : 'unpointed')}
                                className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center space-x-1.5 ${quickFilter === 'unpointed' ? 'bg-yellow-500/20 text-yellow-300 border border-yellow-500/40' : 'text-gray-400 hover:text-white'}`}
                              >
                                <Circle className="w-3 h-3" />
                                <span>Non pointés ({unpointedCount})</span>
                              </button>
                              <button
                                onClick={() => setQuickFilter(quickFilter === 'missing_receipt' ? 'all' : 'missing_receipt')}
                                className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center space-x-1.5 ${quickFilter === 'missing_receipt' ? 'bg-red-500/20 text-red-300 border border-red-500/40' : 'text-gray-400 hover:text-white'}`}
                              >
                                <Paperclip className="w-3 h-3" />
                                <span>Sans facture ({missingReceiptCount})</span>
                              </button>
