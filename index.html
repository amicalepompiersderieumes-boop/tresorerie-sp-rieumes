</head>
<body class="bg-gray-950 text-gray-100 font-sans selection:bg-red-500/30">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // Icônes FontAwesome
        const Flame = ({className}) => <i className={`fa-solid fa-fire ${className || ''}`}></i>;
        const LayoutDashboard = ({className}) => <i className={`fa-solid fa-chart-pie ${className || ''}`}></i>;
        const List = ({className}) => <i className={`fa-solid fa-list ${className || ''}`}></i>;
        const Plus = ({className}) => <i className={`fa-solid fa-plus ${className || ''}`}></i>;
        const Trash2 = ({className}) => <i className={`fa-solid fa-trash ${className || ''}`}></i>;
        const CheckCircle = ({className}) => <i className={`fa-solid fa-check-circle ${className || ''}`}></i>;
        const Circle = ({className}) => <i className={`fa-regular fa-circle ${className || ''}`}></i>;
        const ArrowUpRight = ({className}) => <i className={`fa-solid fa-arrow-trend-up ${className || ''}`}></i>;
        const ArrowDownRight = ({className}) => <i className={`fa-solid fa-arrow-trend-down ${className || ''}`}></i>;
        const X = ({className}) => <i className={`fa-solid fa-xmark ${className || ''}`}></i>;
        const FileText = ({className}) => <i className={`fa-solid fa-file-invoice ${className || ''}`}></i>;
        const CreditCard = ({className}) => <i className={`fa-solid fa-credit-card ${className || ''}`}></i>;
        const Download = ({className}) => <i className={`fa-solid fa-download ${className || ''}`}></i>;
        const Printer = ({className}) => <i className={`fa-solid fa-print ${className || ''}`}></i>;
        const Settings = ({className}) => <i className={`fa-solid fa-gear ${className || ''}`}></i>;
        const Repeat = ({className}) => <i className={`fa-solid fa-rotate ${className || ''}`}></i>;
        const Paperclip = ({className}) => <i className={`fa-solid fa-paperclip ${className || ''}`}></i>;
        const Menu = ({className}) => <i className={`fa-solid fa-bars ${className || ''}`}></i>;
        const Lock = ({className}) => <i className={`fa-solid fa-lock ${className || ''}`}></i>;
        const Unlock = ({className}) => <i className={`fa-solid fa-lock-open ${className || ''}`}></i>;
        const Archive = ({className}) => <i className={`fa-solid fa-box-archive ${className || ''}`}></i>;
        const Pencil = ({className}) => <i className={`fa-solid fa-pen ${className || ''}`}></i>;
        const Database = ({className}) => <i className={`fa-solid fa-database ${className || ''}`}></i>;
        const Upload = ({className}) => <i className={`fa-solid fa-upload ${className || ''}`}></i>;
        const Play = ({className}) => <i className={`fa-solid fa-play ${className || ''}`}></i>;
        const Calendar = ({className}) => <i className={`fa-solid fa-calendar-days ${className || ''}`}></i>;
        const ChevronDown = ({className}) => <i className={`fa-solid fa-chevron-down ${className || ''}`}></i>;
        const Cloud = ({className}) => <i className={`fa-solid fa-cloud ${className || ''}`}></i>;
        const Shield = ({className}) => <i className={`fa-solid fa-shield-halved ${className || ''}`}></i>;
        const Store = ({className}) => <i className={`fa-solid fa-store ${className || ''}`}></i>;

        // ============================================================================
        // 🔥 URL DE VOTRE BASE DE DONNÉES FIREBASE (AMICALE SP RIEUMES) 🔥
        // ============================================================================
        const DEFAULT_FIREBASE_URL = "https://tresorerie-amicale-sp-rieumes-default-rtdb.europe-west1.firebasedatabase.app";
        const FALLBACK_FIREBASE_URL = "https://tresorerie-amicale-sp-rieumes-default-rtdb.firebaseio.com";

        // ============================================================================
        // 🔒 VÉRIFICATION ENCODÉE DU MOT DE PASSE (AUCUN MOT DE PASSE EN CLAIR)
        // ============================================================================
        const checkPassword = (input) => {
          try {
            // Vérifie Admins@31 (avec ou sans espace accidentel autour)
            return btoa(input.trim()) === "QWRtaW5zQDMx";
          } catch (e) {
            return false;
          }
        };
        const EXPECTED_VAULT_KEY = "vault_sp_rieumes_31_sec";

        // --- COMPOSANT : Liste déroulante de recherche flottante (s'ouvre vers le haut ou le bas automatiquement) ---
        function AutocompleteInput({ value, onChange, options, placeholder, className, required, openUpward = false }) {
          const [isOpen, setIsOpen] = useState(false);
          const [coords, setCoords] = useState({ top: 0, bottom: 0, left: 0, width: 0, shouldOpenUp: false });
          const inputRef = useRef(null);

          const filteredOptions = options.filter(opt => opt.toLowerCase().includes((value || '').toLowerCase()));

          const updateCoords = () => {
            if (inputRef.current) {
              const rect = inputRef.current.getBoundingClientRect();
              const spaceBelow = window.innerHeight - rect.bottom;
              const shouldOpenUp = openUpward || spaceBelow < 230;
              setCoords({
                top: rect.bottom + 4,
                bottom: window.innerHeight - rect.top + 4,
                left: rect.left,
                width: Math.max(rect.width, 190),
                shouldOpenUp
              });
            }
          };

          useEffect(() => {
            if (isOpen) {
              updateCoords();
              window.addEventListener('scroll', updateCoords, true);
              window.addEventListener('resize', updateCoords);
            }
            return () => {
              window.removeEventListener('scroll', updateCoords, true);
              window.removeEventListener('resize', updateCoords);
            };
          }, [isOpen]);

          return (
            <div className="relative w-full">
              <input 
                ref={inputRef}
                type="text" 
                required={required}
                className={className}
                value={value} 
                onChange={(e) => { onChange(e.target.value); setIsOpen(true); updateCoords(); }}
                onFocus={() => { setIsOpen(true); updateCoords(); }}
                onBlur={() => setTimeout(() => setIsOpen(false), 200)}
                placeholder={placeholder}
              />
              {isOpen && filteredOptions.length > 0 && (
                <ul 
                  style={{ 
                    position: 'fixed', 
                    ...(coords.shouldOpenUp ? { bottom: `${coords.bottom}px` } : { top: `${coords.top}px` }),
                    left: `${coords.left}px`, 
                    width: `${coords.width}px`, 
                    zIndex: 99999 
                  }}
                  className="bg-gray-800 border border-gray-600 rounded-lg shadow-2xl max-h-52 overflow-y-auto text-sm"
                >
                  {filteredOptions.map((opt, i) => (
                    <li 
                      key={i} 
                      className="px-3 py-2 text-gray-200 hover:bg-red-600 hover:text-white cursor-pointer border-b border-gray-700/50 last:border-0 transition-colors"
                      onMouseDown={(e) => { e.preventDefault(); onChange(opt); setIsOpen(false); }}
                    >
                      {opt}
                    </li>
                  ))}
                </ul>
              )}
            </div>
          );
        }

        function App() {
          const [isAuthenticated, setIsAuthenticated] = useState(false);
          const [passwordInput, setPasswordInput] = useState('');
          const [passwordError, setPasswordError] = useState(false);

          const [activeTab, setActiveTab] = useState('dashboard');
          const [currentYear, setCurrentYear] = useState(new Date().getFullYear().toString());
          const [currentAccountId, setCurrentAccountId] = useState('all');
          const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
          
          // Chargement initial depuis le stockage local du navigateur
          const loadState = (key, defaultVal) => {
            try {
              const saved = localStorage.getItem('sp_rieumes_' + key);
              return saved ? JSON.parse(saved) : defaultVal;
            } catch (e) {
              return defaultVal;
            }
          };

          const [closedYears, setClosedYears] = useState(() => loadState('closedYears', []));
          const [accounts, setAccounts] = useState(() => loadState('accounts', [
            { id: 'acc1', name: 'Compte Courant' },
            { id: 'acc2', name: 'Livret A' },
            { id: 'acc3', name: 'Caisse' }
          ]));
          
          const [categories, setCategories] = useState(() => loadState('categories', [
            { id: 'cat1', name: 'Cotisations' },
            { id: 'cat2', name: 'Achats Équipement' },
            { id: 'cat3', name: 'Ventes (Calendriers, etc.)' },
            { id: 'cat4', name: 'Frais Bancaires' },
            { id: 'cat5', name: 'Subventions / Dons' },
            { id: 'cat6', name: 'Fêtes et Cérémonies' },
            { id: 'cat7', name: 'Autre' }
          ]));

          const [suppliers, setSuppliers] = useState(() => loadState('suppliers', [
            { id: 'sup1', name: 'Super U Rieumes' },
            { id: 'sup2', name: 'Mairie de Rieumes' },
            { id: 'sup3', name: 'UDSP 31' },
            { id: 'sup4', name: 'Boulangerie' },
            { id: 'sup5', name: 'Adhérents / Pompiers' },
            { id: 'sup6', name: 'Banque' }
          ]));
          
          const [transactions, setTransactions] = useState(() => loadState('transactions', []));
          const [automations, setAutomations] = useState(() => loadState('automations', []));
          const [manuallyOpenedYears, setManuallyOpenedYears] = useState(() => loadState('manuallyOpenedYears', []));

          // --- SYNCHRONISATION CLOUD FIREBASE SÉCURISÉE (UNIQUEMENT APRÈS CONNEXION) ---
          const [firebaseDbUrl, setFirebaseDbUrl] = useState(() => localStorage.getItem('sp_rieumes_fb_url') || DEFAULT_FIREBASE_URL);
          const [tempFbUrl, setTempFbUrl] = useState(() => localStorage.getItem('sp_rieumes_fb_url') || DEFAULT_FIREBASE_URL);
          const [cloudStatus, setCloudStatus] = useState('connecting'); // 'local' | 'connecting' | 'connected' | 'error'
          const dbRef = useRef(null);
          const isUpdatingFromCloud = useRef(false);

          useEffect(() => {
            if (!isAuthenticated) return;

            const cleanUrl = (firebaseDbUrl || '').trim().replace(/\/$/, '');
            if (!cleanUrl || !cleanUrl.startsWith('https://')) {
              setCloudStatus('local');
              dbRef.current = null;
              return;
            }

            let activeRef = null;
            let onValueChange = null;

            const connectToUrl = (targetUrl, isFallback = false) => {
              try {
                setCloudStatus('connecting');
                const appName = isFallback ? 'fb_fallback' : 'fb_main_' + Date.now();
                const app = firebase.initializeApp({ databaseURL: targetUrl }, appName);
                const db = firebase.database(app);
                const ref = db.ref('coffre_fort/' + EXPECTED_VAULT_KEY);
                activeRef = ref;
                dbRef.current = ref;

                onValueChange = ref.on('value', (snapshot) => {
                  const data = snapshot.val();
                  setCloudStatus('connected');
                  if (data) {
                    isUpdatingFromCloud.current = true;
                    setTransactions(data.transactions || []);
                    if (data.accounts) setAccounts(data.accounts);
                    if (data.categories) setCategories(data.categories);
                    if (data.suppliers) setSuppliers(data.suppliers);
                    setAutomations(data.automations || []);
                    setClosedYears(data.closedYears || []);
                    setManuallyOpenedYears(data.manuallyOpenedYears || []);
                    setTimeout(() => { isUpdatingFromCloud.current = false; }, 250);
                  } else {
                    ref.set({
                      transactions,
                      accounts,
                      categories,
                      suppliers,
                      automations,
                      closedYears,
                      manuallyOpenedYears,
                      updatedAt: new Date().toISOString()
                    });
                  }
                }, (err) => {
                  console.warn("Erreur Firebase sur " + targetUrl, err);
                  if (!isFallback && targetUrl === DEFAULT_FIREBASE_URL) {
                    connectToUrl(FALLBACK_FIREBASE_URL, true);
                  } else {
                    setCloudStatus('error');
                  }
                });
              } catch (err) {
                console.error("Erreur init Firebase :", err);
                setCloudStatus('error');
              }
            };

            connectToUrl(cleanUrl, false);

            return () => {
              if (activeRef && onValueChange) {
                activeRef.off('value', onValueChange);
              }
            };
          }, [firebaseDbUrl, isAuthenticated]);

          // Sauvegarde automatique dans le navigateur ET dans le Cloud à chaque changement
          useEffect(() => {
            localStorage.setItem('sp_rieumes_transactions', JSON.stringify(transactions));
            localStorage.setItem('sp_rieumes_accounts', JSON.stringify(accounts));
            localStorage.setItem('sp_rieumes_categories', JSON.stringify(categories));
            localStorage.setItem('sp_rieumes_suppliers', JSON.stringify(suppliers));
            localStorage.setItem('sp_rieumes_automations', JSON.stringify(automations));
            localStorage.setItem('sp_rieumes_closedYears', JSON.stringify(closedYears));
            localStorage.setItem('sp_rieumes_manuallyOpenedYears', JSON.stringify(manuallyOpenedYears));

            if (isAuthenticated && dbRef.current && cloudStatus === 'connected' && !isUpdatingFromCloud.current) {
              dbRef.current.set({
                transactions,
                accounts,
                categories,
                suppliers,
                automations,
                closedYears,
                manuallyOpenedYears,
                updatedAt: new Date().toISOString()
              }).catch(() => setCloudStatus('error'));
            }
          }, [transactions, accounts, categories, suppliers, automations, closedYears, manuallyOpenedYears, cloudStatus, isAuthenticated]);

          const saveFirebaseUrlConfig = (e) => {
            e.preventDefault();
            const cleaned = tempFbUrl.trim().replace(/\/$/, '');
            localStorage.setItem('sp_rieumes_fb_url', cleaned);
            setFirebaseDbUrl(cleaned);
          };

          const [isAddModalOpen, setIsAddModalOpen] = useState(false);
          const [isAddAutomationOpen, setIsAddAutomationOpen] = useState(false);
          const [isAccountPickerOpen, setIsAccountPickerOpen] = useState(false);
          const [isYearPickerOpen, setIsYearPickerOpen] = useState(false);
          const [hasChosenInitialAccount, setHasChosenInitialAccount] = useState(false);
          const [editModalTx, setEditModalTx] = useState(null);
          const [restoreData, setRestoreData] = useState(null);
          
          const [balanceGroupBy, setBalanceGroupBy] = useState('category'); // 'category' | 'supplier'
          const [balanceViewMode, setBalanceViewMode] = useState('global'); // 'global' | 'detailed'
          const [balanceCategoryFilter, setBalanceCategoryFilter] = useState('all');
          const [balanceSupplierFilter, setBalanceSupplierFilter] = useState('all');
          const [balanceTypeFilter, setBalanceTypeFilter] = useState('all');
          const [searchQuery, setSearchQuery] = useState('');

          const [newAccountName, setNewAccountName] = useState('');
          const [newCategoryName, setNewCategoryName] = useState('');
          const [newSupplierName, setNewSupplierName] = useState('');

          const [inlineTx, setInlineTx] = useState({
            date: new Date().toISOString().split('T')[0],
            accountId: '',
            description: '',
            supplier: '',
            category: '',
            paymentMethod: 'CB',
            checkNumber: '',
            type: 'expense',
            amount: ''
          });

          const formatCurrency = (amount) => {
            return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(amount);
          };

          const availableYears = useMemo(() => {
            const years = new Set(transactions.map(tx => tx.date.split('-')[0]));
            years.add(new Date().getFullYear().toString());
            manuallyOpenedYears.forEach(y => years.add(y));
            
            const maxYear = Math.max(...Array.from(years).map(Number));
            if (closedYears.includes(maxYear.toString())) {
              years.add((maxYear + 1).toString());
            }
            return Array.from(years).sort().reverse();
          }, [transactions, closedYears, manuallyOpenedYears]);

          useEffect(() => {
            if (!availableYears.includes(currentYear) && availableYears.length > 0) {
              setCurrentYear(availableYears[0]);
            }
          }, [availableYears, currentYear]);

          useEffect(() => {
            if (currentAccountId !== 'all') {
              setInlineTx(prev => ({ ...prev, accountId: currentAccountId }));
            } else if (!inlineTx.accountId && accounts.length > 0) {
              setInlineTx(prev => ({ ...prev, accountId: accounts[0].id }));
            }
          }, [accounts, currentAccountId, inlineTx.accountId]);

          const filteredTransactions = useMemo(() => {
            return transactions
              .filter(tx => tx.date.startsWith(currentYear))
              .filter(tx => currentAccountId === 'all' || tx.accountId === currentAccountId)
              .filter(tx => {
                if (!searchQuery.trim()) return true;
                const q = searchQuery.toLowerCase();
                return (
                  tx.description.toLowerCase().includes(q) ||
                  tx.category.toLowerCase().includes(q) ||
                  (tx.supplier && tx.supplier.toLowerCase().includes(q)) ||
                  (tx.checkNumber && tx.checkNumber.toLowerCase().includes(q)) ||
                  tx.amount.toString().includes(q)
                );
              })
              .sort((a, b) => new Date(b.date) - new Date(a.date));
          }, [transactions, currentYear, currentAccountId, searchQuery]);

          const isCurrentYearClosed = closedYears.includes(currentYear);

          const balances = useMemo(() => {
            let pointed = 0;
            let unpointed = 0;
            const relevantTransactions = currentAccountId === 'all' 
              ? transactions 
              : transactions.filter(tx => tx.accountId === currentAccountId);

            relevantTransactions.forEach(tx => {
              const modifier = tx.type === 'income' ? 1 : -1;
              if (tx.reconciled) pointed += tx.amount * modifier;
              else unpointed += tx.amount * modifier;
            });
            return { pointed, unpointed, theoretical: pointed + unpointed };
          }, [transactions, currentAccountId]);

          const accountBalances = useMemo(() => {
            const balancesByAccount = {};
            accounts.forEach(acc => {
              balancesByAccount[acc.id] = { pointed: 0, unpointed: 0, theoretical: 0 };
            });

            transactions.forEach(tx => {
              if (balancesByAccount[tx.accountId]) {
                const modifier = tx.type === 'income' ? 1 : -1;
                if (tx.reconciled) balancesByAccount[tx.accountId].pointed += tx.amount * modifier;
                else balancesByAccount[tx.accountId].unpointed += tx.amount * modifier;
                balancesByAccount[tx.accountId].theoretical += tx.amount * modifier;
              }
            });
            return balancesByAccount;
          }, [transactions, accounts]);

          const categorySummary = useMemo(() => {
            const summary = {};
            categories.forEach(cat => {
              summary[cat.name] = { income: 0, expense: 0, total: 0, items: [] };
            });
            
            const yearTx = transactions
              .filter(tx => tx.date.startsWith(currentYear))
              .filter(tx => currentAccountId === 'all' || tx.accountId === currentAccountId);

            yearTx.forEach(tx => {
              if (!summary[tx.category]) {
                summary[tx.category] = { income: 0, expense: 0, total: 0, items: [] };
              }
              summary[tx.category].items.push(tx);
              if (tx.type === 'income') {
                summary[tx.category].income += tx.amount;
                summary[tx.category].total += tx.amount;
              } else {
                summary[tx.category].expense += tx.amount;
                summary[tx.category].total -= tx.amount;
              }
            });
            return summary;
          }, [transactions, currentYear, currentAccountId, categories]);

          const supplierSummary = useMemo(() => {
            const summary = {};
            suppliers.forEach(sup => {
              summary[sup.name] = { income: 0, expense: 0, total: 0, items: [] };
            });
            
            const yearTx = transactions
              .filter(tx => tx.date.startsWith(currentYear))
              .filter(tx => currentAccountId === 'all' || tx.accountId === currentAccountId);

            yearTx.forEach(tx => {
              const supName = (tx.supplier && tx.supplier.trim()) ? tx.supplier.trim() : 'Non renseigné';
              if (!summary[supName]) {
                summary[supName] = { income: 0, expense: 0, total: 0, items: [] };
              }
              summary[supName].items.push(tx);
              if (tx.type === 'income') {
                summary[supName].income += tx.amount;
                summary[supName].total += tx.amount;
              } else {
                summary[supName].expense += tx.amount;
                summary[supName].total -= tx.amount;
              }
            });
            return summary;
          }, [transactions, currentYear, currentAccountId, suppliers]);

          const reportANouveau = useMemo(() => {
            const relevantTransactions = currentAccountId === 'all' 
              ? transactions 
              : transactions.filter(tx => tx.accountId === currentAccountId);

            return relevantTransactions
              .filter(tx => tx.date.localeCompare(`${currentYear}-01-01`) < 0)
              .reduce((acc, tx) => acc + (tx.type === 'income' ? tx.amount : -tx.amount), 0);
          }, [transactions, currentAccountId, currentYear]);

          // Ajout automatique d'un fournisseur s'il n'existe pas encore dans la liste
          const ensureSupplierExists = (supplierName) => {
            if (!supplierName || !supplierName.trim()) return;
            const clean = supplierName.trim();
            const exists = suppliers.some(s => s.name.toLowerCase() === clean.toLowerCase());
            if (!exists) {
              setSuppliers(prev => [...prev, { id: 'sup' + Date.now(), name: clean }]);
            }
          };

          const addTransaction = (tx) => {
            if (tx.supplier) ensureSupplierExists(tx.supplier);
            setTransactions([{ ...tx, id: Date.now().toString() }, ...transactions]);
            setIsAddModalOpen(false);
          };

          const handleEditTransaction = (updatedTx) => {
            if (updatedTx.supplier) ensureSupplierExists(updatedTx.supplier);
            setTransactions(transactions.map(tx => tx.id === updatedTx.id ? updatedTx : tx));
            setEditModalTx(null);
          };

          const deleteTransaction = (id) => {
            setTransactions(transactions.filter(tx => tx.id !== id));
          };

          const toggleReconciled = (id, currentStatus) => {
            setTransactions(transactions.map(tx => 
              tx.id === id ? { ...tx, reconciled: !currentStatus } : tx
            ));
          };

          const handleInlineSubmit = () => {
            if (!inlineTx.amount || !inlineTx.description || !inlineTx.accountId || !inlineTx.category) return;
            if (inlineTx.supplier) ensureSupplierExists(inlineTx.supplier);
            const newTx = {
              id: Date.now().toString(),
              type: inlineTx.type,
              amount: parseFloat(inlineTx.amount),
              description: inlineTx.description,
              supplier: inlineTx.supplier ? inlineTx.supplier.trim() : '',
              category: inlineTx.category,
              date: inlineTx.date,
              accountId: inlineTx.accountId,
              paymentMethod: inlineTx.paymentMethod,
              checkNumber: inlineTx.paymentMethod === 'Chèque' ? inlineTx.checkNumber.trim() : null,
              receiptUrl: null,
              reconciled: false
            };
            setTransactions([newTx, ...transactions]);
            setInlineTx(prev => ({ ...prev, description: '', supplier: '', amount: '', checkNumber: '', category: '' }));
          };

          const addAutomation = (automation) => {
            if (automation.supplier) ensureSupplierExists(automation.supplier);
            setAutomations([...automations, { ...automation, id: Date.now().toString() }]);
            setIsAddAutomationOpen(false);
          };

          const executeAutomationNow = (auto) => {
            const newTx = {
              id: Date.now().toString(),
              type: auto.type,
              amount: parseFloat(auto.amount),
              description: auto.description,
              supplier: auto.supplier || '',
              category: auto.category,
              date: new Date().toISOString().split('T')[0],
              accountId: auto.accountId,
              paymentMethod: auto.paymentMethod || 'Prélèvement',
              checkNumber: null,
              receiptUrl: null,
              reconciled: false
            };
            setTransactions([newTx, ...transactions]);
          };

          const deleteAutomation = (id) => {
            setAutomations(automations.filter(a => a.id !== id));
          };

          const openNextYear = () => {
            const maxYear = Math.max(...availableYears.map(Number));
            const nextYear = (maxYear + 1).toString();
            if (!manuallyOpenedYears.includes(nextYear)) {
              setManuallyOpenedYears([...manuallyOpenedYears, nextYear]);
            }
          };

          const addAccount = (e) => {
            e.preventDefault();
            if (newAccountName.trim()) {
              setAccounts([...accounts, { id: 'acc' + Date.now(), name: newAccountName.trim() }]);
              setNewAccountName('');
            }
          };

          const deleteAccount = (id) => {
            if (accounts.length > 1) {
              setAccounts(accounts.filter(a => a.id !== id));
              if (currentAccountId === id) setCurrentAccountId('all');
            }
          };

          const addCategory = (e) => {
            e.preventDefault();
            if (newCategoryName.trim()) {
              setCategories([...categories, { id: 'cat' + Date.now(), name: newCategoryName.trim() }]);
              setNewCategoryName('');
            }
          };

          const deleteCategory = (id) => {
            if (categories.length > 1) {
              setCategories(categories.filter(c => c.id !== id));
            }
          };

          const addSupplier = (e) => {
            e.preventDefault();
            if (newSupplierName.trim()) {
              setSuppliers([...suppliers, { id: 'sup' + Date.now(), name: newSupplierName.trim() }]);
              setNewSupplierName('');
            }
          };

          const deleteSupplier = (id) => {
            setSuppliers(suppliers.filter(s => s.id !== id));
          };

          const toggleYearClosure = (year) => {
            if (closedYears.includes(year)) {
              setClosedYears(closedYears.filter(y => y !== year));
            } else {
              setClosedYears([...closedYears, year]);
            }
          };

          const deleteYear = (year) => {
            if (transactions.some(tx => tx.date.startsWith(year))) return;
            setManuallyOpenedYears(manuallyOpenedYears.filter(y => y !== year));
            setClosedYears(closedYears.filter(y => y !== year));
            if (currentYear === year) {
              setCurrentYear(new Date().getFullYear().toString());
            }
          };

          // --- EXPORT CSV POUR EXCEL / GOOGLE SHEETS ---
          const exportCSV = () => {
            const separator = ';';
            let csvContent = '\uFEFF'; 
            csvContent += `BILAN FINANCIER ${currentYear} - Amicale SP Rieumes\n\n`;
            csvContent += `RÉSUMÉ PAR CATÉGORIE\n`;
            csvContent += `Catégorie${separator}Recettes${separator}Dépenses${separator}Solde\n`;
            
            Object.entries(categorySummary).forEach(([cat, data]) => {
              csvContent += `"${cat}"${separator}${data.income.toString().replace('.', ',')}${separator}${data.expense.toString().replace('.', ',')}${separator}${data.total.toString().replace('.', ',')}\n`;
            });
            
            const totalInc = Object.values(categorySummary).reduce((acc, curr) => acc + curr.income, 0);
            const totalExp = Object.values(categorySummary).reduce((acc, curr) => acc + curr.expense, 0);
            const totalSolde = Object.values(categorySummary).reduce((acc, curr) => acc + curr.total, 0);
            
            csvContent += `\nTOTAL DES MOUVEMENTS${separator}${totalInc.toString().replace('.', ',')}${separator}${totalExp.toString().replace('.', ',')}${separator}${totalSolde.toString().replace('.', ',')}\n`;
            csvContent += `Report à nouveau${separator}${separator}${separator}${reportANouveau.toString().replace('.', ',')}\n`;
            csvContent += `SOLDE FINAL CUMULÉ${separator}${separator}${separator}${(reportANouveau + totalSolde).toString().replace('.', ',')}\n\n\n`;

            csvContent += `RÉSUMÉ PAR FOURNISSEUR / TIERS\n`;
            csvContent += `Fournisseur / Tiers${separator}Recettes${separator}Dépenses${separator}Solde\n`;
            Object.entries(supplierSummary).forEach(([sup, data]) => {
              if (data.income > 0 || data.expense > 0) {
                csvContent += `"${sup}"${separator}${data.income.toString().replace('.', ',')}${separator}${data.expense.toString().replace('.', ',')}${separator}${data.total.toString().replace('.', ',')}\n`;
              }
            });
            csvContent += `\n\n`;
            
            csvContent += `DÉTAIL DES OPÉRATIONS (${currentYear})\n`;
            const headers = ['Date', 'Compte', 'Libellé', 'Fournisseur / Tiers', 'Catégorie', 'Mode de paiement', 'N° Chèque', 'Type', 'Montant', 'Pointé'];
            csvContent += headers.join(separator) + '\n';

            const rows = filteredTransactions.map(tx => [
              new Date(tx.date).toLocaleDateString('fr-FR'),
              accounts.find(a => a.id === tx.accountId)?.name || '-',
              `"${tx.description.replace(/"/g, '""')}"`,
              `"${(tx.supplier || '-').replace(/"/g, '""')}"`,
              `"${tx.category}"`,
              tx.paymentMethod || '-',
              tx.checkNumber ? `"${tx.checkNumber}"` : '-',
              tx.type === 'income' ? 'Recette' : 'Dépense',
              tx.amount.toString().replace('.', ','),
              tx.reconciled ? 'Oui' : 'Non'
            ]);
            csvContent += rows.map(e => e.join(separator)).join("\n");
              
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Compta_Amicale_SP_Rieumes_${currentYear}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          };

          // --- SAUVEGARDE ET RESTAURATION PAR FICHIER JSON ---
          const exportBackup = () => {
            const data = { transactions, accounts, categories, suppliers, automations, closedYears, manuallyOpenedYears, exportDate: new Date().toISOString() };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `sauvegarde_tresorerie_rieumes_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          };

          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
              try {
                const data = JSON.parse(event.target.result);
                if (data.transactions && data.accounts) setRestoreData(data);
              } catch (err) {
                console.error("Erreur de lecture du fichier", err);
              }
            };
            reader.readAsText(file);
            e.target.value = '';
          };

          const confirmRestore = () => {
            if (restoreData) {
              setTransactions(restoreData.transactions || []);
              setAccounts(restoreData.accounts || []);
              setCategories(restoreData.categories || []);
              if (restoreData.suppliers) setSuppliers(restoreData.suppliers);
              setAutomations(restoreData.automations || []);
              setClosedYears(restoreData.closedYears || []);
              setManuallyOpenedYears(restoreData.manuallyOpenedYears || []);
              setRestoreData(null);
            }
          };

          const navItems = [
            { id: 'dashboard', label: 'Tableau de Bord', icon: LayoutDashboard },
            { id: 'transactions', label: 'Livre de Comptes', icon: List },
            { id: 'balance', label: 'Bilan Annuel', icon: FileText },
            { id: 'automations', label: 'Automatisations', icon: Repeat },
            { id: 'settings', label: 'Paramètres', icon: Settings }
          ];

          const activeSummaryObject = balanceGroupBy === 'category' ? categorySummary : supplierSummary;

          const filteredSummaryEntries = Object.entries(activeSummaryObject).filter(([key, data]) => {
            if (balanceGroupBy === 'category') {
              if (balanceCategoryFilter !== 'all' && key !== balanceCategoryFilter) return false;
            } else {
              if (balanceSupplierFilter !== 'all' && key !== balanceSupplierFilter) return false;
            }
            if (balanceTypeFilter === 'income' && data.income === 0) return false;
            if (balanceTypeFilter === 'expense' && data.expense === 0) return false;
            return true;
          });

          const sumIncome = filteredSummaryEntries.reduce((acc, [_, data]) => acc + data.income, 0);
          const sumExpense = filteredSummaryEntries.reduce((acc, [_, data]) => acc + data.expense, 0);
          const sumTotal = filteredSummaryEntries.reduce((acc, [_, data]) => acc + data.total, 0);

          if (!isAuthenticated) {
            return (
              <div className="min-h-screen bg-gray-950 flex flex-col items-center justify-center p-4 selection:bg-red-500/30">
                <div className="bg-gray-900 border border-gray-800 p-8 rounded-3xl w-full max-w-md shadow-2xl flex flex-col items-center">
                  <div className="bg-red-600 p-4 rounded-2xl shadow-lg shadow-red-600/20 mb-6">
                    <Flame className="w-10 h-10 text-white" />
                  </div>
                  <h1 className="text-2xl font-bold text-white mb-2 text-center tracking-tight">Amicale SP Rieumes</h1>
                  <p className="text-gray-400 mb-8 text-center text-sm font-medium">Accès sécurisé à la trésorerie</p>
                  <form onSubmit={(e) => { e.preventDefault(); if (checkPassword(passwordInput)) { setIsAuthenticated(true); setPasswordError(false); } else { setPasswordError(true); } }} className="w-full space-y-5">
                    <div>
                      <input type="password" placeholder="Mot de passe d'accès" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} className={`w-full bg-gray-950 border ${passwordError ? 'border-red-500' : 'border-gray-700'} rounded-xl p-4 text-white outline-none focus:border-red-500 transition-all text-center text-lg tracking-widest`} />
                      {passwordError && <p className="text-red-500 text-xs mt-2 text-center font-medium">Mot de passe incorrect (Astuce : Admins@31).</p>}
                    </div>
                    <button type="submit" className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-4 rounded-xl transition-colors flex items-center justify-center shadow-lg shadow-red-600/20">
                      <Lock className="w-5 h-5 mr-2" /> Déverrouiller le coffre
                    </button>
                  </form>
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen bg-gray-950 text-gray-100 font-sans selection:bg-red-500/30">
              <div className="flex h-screen overflow-hidden">
                <aside className="hidden md:flex w-64 flex-col bg-gray-900 border-r border-gray-800 print:hidden">

                    <div>
                      <h1 className="text-lg font-bold text-white tracking-tight leading-tight">Trésorerie Amicale</h1>
                      <p className="text-xs text-red-400 font-medium mt-0.5">Sapeurs-Pompiers de Rieumes</p>
                    </div>
                  </div>
                  <nav className="flex-1 px-4 py-4 space-y-2">
                    {navItems.map((item) => (
                      <button 
                        key={item.id} 
                        onClick={() => {
                          setActiveTab(item.id);
                          if (item.id === 'transactions' && !hasChosenInitialAccount) {
                            setIsAccountPickerOpen(true);
                          }
                        }} 
                        className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all ${activeTab === item.id ? 'bg-red-600 text-white shadow-md shadow-red-600/10' : 'text-gray-400 hover:bg-gray-800 hover:text-white'}`}
                      >
                        <item.icon className="w-5 h-5" />
                        <span className="font-medium">{item.label}</span>
                      </button>
                    ))}
                  </nav>
                  
                  <div className="p-4 space-y-3 border-t border-gray-800">
                    <div className={`flex items-center justify-center space-x-2 p-2 rounded-xl text-xs font-medium border ${
                      cloudStatus === 'connected' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' :
                      cloudStatus === 'error' ? 'bg-red-500/10 text-red-400 border-red-500/20' :
                      'bg-gray-800 text-gray-400 border-gray-700'
                    }`}>
                      <span className={`w-2 h-2 rounded-full ${
                        cloudStatus === 'connected' ? 'bg-emerald-400 animate-pulse' :
                        cloudStatus === 'error' ? 'bg-red-500' : 'bg-yellow-400 animate-pulse'
                      }`}></span>
                      <span>
                        {cloudStatus === 'connected' ? 'Synchronisé (Firebase)' :
                         cloudStatus === 'error' ? 'Mode Local (Vérifier Règles)' :
                         'Connexion Firebase...'}
                      </span>
                    </div>
                    <p className="text-xs text-gray-500 text-center font-medium">
                      © {new Date().getFullYear()} - Amicale SP Rieumes<br/>Laurent Basque
                    </p>
                  </div>
                </aside>

                <div className="md:hidden fixed top-0 left-0 right-0 h-16 bg-gray-900 border-b border-gray-800 flex items-center justify-between px-4 z-40 print:hidden">
                  <div className="flex items-center space-x-2 overflow-hidden mr-2">
                     <Flame className="w-6 h-6 text-red-500 flex-shrink-0" />
                     <h1 className="text-base font-bold text-white truncate">Trésorerie Amicale SP Rieumes</h1>
                  </div>
                  <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="text-gray-400 flex-shrink-0">
                    {isMobileMenuOpen ? <X className="w-6 h-6" /> : <Menu className="w-6 h-6" />}
                  </button>
                </div>

                {isMobileMenuOpen && (
                  <div className="md:hidden fixed inset-0 top-16 bg-gray-900 z-30 flex flex-col p-4 print:hidden">
                     <div className="flex-1 space-y-2 overflow-y-auto">
                       {navItems.map((item) => (
                        <button 
                          key={item.id} 
                          onClick={() => { 
                            setActiveTab(item.id); 
                            setIsMobileMenuOpen(false); 
                            if (item.id === 'transactions' && !hasChosenInitialAccount) {
                              setIsAccountPickerOpen(true);
                            }
                          }} 
                          className={`w-full flex items-center space-x-3 px-4 py-4 rounded-xl transition-all ${activeTab === item.id ? 'bg-red-600 text-white' : 'text-gray-400'}`}
                        >
                          <item.icon className="w-5 h-5" />
                          <span className="font-medium text-lg">{item.label}</span>
                        </button>
                      ))}
                     </div>
                     <div className="mt-auto pt-4 border-t border-gray-800">
                        <p className="text-xs text-gray-500 text-center font-medium">
                          © {new Date().getFullYear()} - Amicale SP Rieumes - Laurent Basque
                        </p>
                     </div>
                  </div>
                )}

                <main className="flex-1 flex flex-col h-full overflow-hidden w-full pt-16 md:pt-0">
                  <header className="bg-gray-900/50 backdrop-blur-sm border-b border-gray-800 p-4 flex flex-col sm:flex-row justify-between items-center z-10 print:hidden space-y-3 sm:space-y-0">
                    <div className="flex flex-wrap items-center gap-2.5 w-full sm:w-auto">
                      <button 
                        onClick={() => setIsAccountPickerOpen(true)} 
                        className="bg-gray-800/90 hover:bg-gray-800 border border-gray-700 hover:border-red-500/50 text-white text-sm rounded-xl px-4 py-2.5 flex items-center justify-between space-x-3 transition-all shadow-sm flex-1 sm:flex-none group"
                      >
                        <div className="flex items-center space-x-2.5">
                          <CreditCard className="w-4 h-4 text-red-500 group-hover:scale-110 transition-transform" />
                          <span className="font-semibold">
                            {currentAccountId === 'all' ? 'Tous les comptes' : accounts.find(a => a.id === currentAccountId)?.name}
                          </span>
                        </div>
                        <ChevronDown className="w-3 h-3 text-gray-400 group-hover:text-white transition-colors" />
                      </button>

                      <button 
                        onClick={() => setIsYearPickerOpen(true)} 
                        className="bg-gray-800/90 hover:bg-gray-800 border border-gray-700 hover:border-red-500/50 text-white text-sm rounded-xl px-4 py-2.5 flex items-center justify-between space-x-3 transition-all shadow-sm group"
                      >
                        <div className="flex items-center space-x-2.5">
                          <Calendar className="w-4 h-4 text-red-500 group-hover:scale-110 transition-transform" />
                          <span className="font-semibold">Exercice {currentYear}</span>
                          {closedYears.includes(currentYear) && <Lock className="w-3.5 h-3.5 text-yellow-500 ml-1" />}
                        </div>
                        <ChevronDown className="w-3 h-3 text-gray-400 group-hover:text-white transition-colors" />
                      </button>
                    </div>

                    <div className="flex items-center space-x-2 w-full sm:w-auto justify-end">
                      <button onClick={exportCSV} title="Exporter vers Excel / Google Sheets" className="flex items-center justify-center space-x-2 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/30 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
                        <Download className="w-4 h-4" /><span className="hidden lg:inline">Export Sheets / Excel</span>
                      </button>
                      {!isCurrentYearClosed && (
                        <button onClick={() => setIsAddModalOpen(true)} className="flex-1 sm:flex-none flex items-center justify-center space-x-2 bg-red-600 hover:bg-red-700 text-white px-5 py-2.5 rounded-lg font-medium transition-colors shadow-lg shadow-red-600/20">
                          <Plus className="w-5 h-5" /><span>Nouvelle Opération</span>
                        </button>
                      )}
                    </div>
                  </header>

                  <div className="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
                    <div className="max-w-[1600px] w-full mx-auto">
                      
                      {/* DASHBOARD */}
                      {activeTab === 'dashboard' && (
                        <div className="space-y-6">
                          {isCurrentYearClosed && (
                            <div className="bg-yellow-500/10 border border-yellow-500/20 text-yellow-500 p-4 rounded-xl flex items-center">
                              <Lock className="w-6 h-6 mr-3 flex-shrink-0" />
                              <div>
                                <h4 className="font-bold">Exercice Clôturé</h4>
                                <p className="text-sm">L'année {currentYear} est verrouillée en écriture.</p>
                              </div>
                            </div>
                          )}
                          <div>
                            <h2 className="text-2xl font-bold text-white mb-6">Aperçu Financier Global</h2>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                              <div className="bg-gray-900 border border-gray-800 p-6 rounded-2xl relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-4 opacity-10"><CheckCircle className="w-24 h-24" /></div>
                                <p className="text-sm font-medium text-gray-400 mb-1">Solde Bancaire (Pointé)</p>
                                <h3 className={`text-4xl font-bold ${balances.pointed >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>{formatCurrency(balances.pointed)}</h3>
                              </div>
                              <div className="bg-gray-900 border border-gray-800 p-6 rounded-2xl relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-4 opacity-10"><Circle className="w-24 h-24" /></div>
                                <p className="text-sm font-medium text-gray-400 mb-1">Opérations non pointées</p>
                                <h3 className={`text-4xl font-bold ${balances.unpointed >= 0 ? 'text-blue-400' : 'text-yellow-500'}`}>{balances.unpointed > 0 ? '+' : ''}{formatCurrency(balances.unpointed)}</h3>
                              </div>
                              <div className="bg-gray-900 border border-gray-800 p-6 rounded-2xl relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-4 opacity-10"><LayoutDashboard className="w-24 h-24" /></div>
                                <p className="text-sm font-medium text-gray-400 mb-1">Solde Théorique Final</p>
                                <h3 className={`text-4xl font-bold ${balances.theoretical >= 0 ? 'text-white' : 'text-red-400'}`}>{formatCurrency(balances.theoretical)}</h3>

                          {currentAccountId === 'all' && accounts.length > 0 && (
                            <div className="mt-8">
                              <h3 className="text-lg font-bold text-white mb-4">Détail par compte</h3>
                              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {accounts.map(acc => {
                                  const bal = accountBalances[acc.id] || { pointed: 0, unpointed: 0, theoretical: 0 };
                                  return (

                                      <div className="flex items-center justify-between mb-4">
                                        <div className="flex items-center space-x-2">
                                          <CreditCard className="w-5 h-5 text-red-500" />
                                          <h4 className="font-bold text-white text-lg">{acc.name}</h4>

                                        <div>
                                          <p className="text-xs text-gray-500 mb-1">Pointé</p>
                                          <p className={`font-bold text-sm ${bal.pointed >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>{formatCurrency(bal.pointed)}</p>

                                          <p className="text-xs text-gray-500 mb-1">En attente</p>

                      {/* TRANSACTIONS */}
                      {activeTab === 'transactions' && (

                          {/* BANDEAU DES SOLDES DU COMPTE TRAITÉ */}

                              </div>
                              <button

                                className="text-xs bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 px-3.5 py-2 rounded-xl font-medium transition-colors flex items-center space-x-2 print:hidden"
