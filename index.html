                            </div>

                            <button
                              onClick={() => openPrintCenter(searchQuery || quickFilter !== 'all' ? 'ledger_filtered' : 'ledger_full')}
                              className="flex items-center space-x-1.5 bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow transition-colors"
                              title="Choisir les options d'impression du Livre de Comptes"
                            >
                              <Printer className="w-4 h-4" />
                              <span>Imprimer / PDF</span>
                            </button>
                          </div>
                        </div>
                        
                        <div className="overflow-x-auto pb-28">
                          <table className="w-full text-sm text-left text-gray-300">
                            <thead className="text-xs text-gray-400 uppercase bg-gray-950 border-b border-gray-800">
                              <tr>
                                <th className="px-3 py-3">Date</th>
                                <th className="px-3 py-3">Compte</th>
                                <th className="px-3 py-3">Libellé</th>
                                <th className="px-3 py-3">Fournisseur / Tiers</th>
                                <th className="px-3 py-3">Catégorie</th>
                                <th className="px-3 py-3">Mode</th>
                                <th className="px-3 py-3 text-right">Montant</th>
                                <th className="px-3 py-3 text-center">Pointé</th>
                                <th className="px-3 py-3 text-center print:hidden" title="Justificatif / Document lié">Doc.</th>
                                <th className="px-3 py-3 text-center print:hidden">Actions</th>
                              </tr>
                            </thead>
                            <tbody>
                              {!isCurrentYearClosed ? (
                                <tr className="bg-red-950/20 border-b-2 border-red-500/30 print:hidden">
                                  <td className="px-3 py-3"><input type="date" value={inlineTx.date} onChange={e => setInlineTx({...inlineTx, date: e.target.value})} className="bg-gray-900 border border-gray-700 focus:border-red-500 rounded-lg p-2 text-xs text-white w-full outline-none" /></td>
                                  <td className="px-3 py-3">
                                    {currentAccountId === 'all' ? (
                                      <select value={inlineTx.accountId} onChange={e => setInlineTx({...inlineTx, accountId: e.target.value})} className="bg-gray-900 border border-gray-700 focus:border-red-500 rounded-lg p-2 text-xs text-white w-full outline-none min-w-[110px]">
                                        {accounts.map(acc => <option key={acc.id} value={acc.id}>{acc.name}</option>)}
                                      </select>
                                    ) : (
                                      <div className="bg-gray-800/70 border border-gray-700 rounded-lg p-2 text-xs text-red-300 font-medium w-full min-w-[110px]">
                                        {accounts.find(a => a.id === currentAccountId)?.name}
                                      </div>
                                    )}
                                  </td>
                                  <td className="px-3 py-3"><input type="text" placeholder="Saisir un nouveau libellé..." value={inlineTx.description} onChange={e => setInlineTx({...inlineTx, description: e.target.value})} onKeyDown={e => { if (e.key === 'Enter') handleInlineSubmit(); }} className="bg-gray-900 border border-gray-700 focus:border-red-500 rounded-lg p-2 text-xs text-white w-full outline-none min-w-[140px]" /></td>
                                  <td className="px-3 py-3">
                                    <AutocompleteInput 
                                      value={inlineTx.supplier} 
                                      onChange={val => setInlineTx({...inlineTx, supplier: val})} 
                                      options={suppliers.map(s => s.name)} 
                                      placeholder="Fournisseur / Tiers..." 
                                      className="bg-gray-900 border border-gray-700 focus:border-red-500 rounded-lg p-2 text-xs text-white w-full outline-none min-w-[130px]" 
                                    />
                                  </td>
                                  <td className="px-3 py-3">
                                    <AutocompleteInput 
                                      value={inlineTx.category} 
                                      onChange={val => setInlineTx({...inlineTx, category: val})} 
                                      options={categories.map(c => c.name)} 
                                      placeholder="Choisir catégorie..." 
                                      className="bg-gray-900 border border-gray-700 focus:border-red-500 rounded-lg p-2 text-xs text-white w-full outline-none min-w-[130px]" 
                                    />
                                  </td>
                                  <td className="px-3 py-3">
                                    <div className="flex flex-col space-y-1 min-w-[100px]">
                                      <select value={inlineTx.paymentMethod} onChange={e => setInlineTx({...inlineTx, paymentMethod: e.target.value})} className="bg-gray-900 border border-gray-700 focus:border-red-500 rounded-lg p-2 text-xs text-white w-full outline-none">
                                        <option value="CB">CB</option>
                                        <option value="Chèque">Chèque</option>
                                        <option value="Prélèvement">Prélèvement</option>
                                        <option value="Virement">Virement</option>
                                        <option value="Espèces">Espèces</option>
                                      </select>
                                      {inlineTx.paymentMethod === 'Chèque' && (
                                        <input type="text" placeholder="N° chèque" value={inlineTx.checkNumber} onChange={e => setInlineTx({...inlineTx, checkNumber: e.target.value})} className="bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-white w-full outline-none" />
                                      )}
                                    </div>
                                  </td>
                                  <td className="px-3 py-3 text-right min-w-[165px]">
                                    <div className="flex items-center justify-end space-x-2">
                                      <select value={inlineTx.type} onChange={e => setInlineTx({...inlineTx, type: e.target.value})} className={`bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs outline-none font-bold ${inlineTx.type === 'income' ? 'text-emerald-500' : 'text-red-400'}`}>
                                        <option value="expense">Dépense</option>
                                        <option value="income">Recette</option>
                                      </select>
                                      <input type="number" step="0.01" placeholder="0.00" value={inlineTx.amount} onChange={e => setInlineTx({...inlineTx, amount: e.target.value})} onKeyDown={e => { if (e.key === 'Enter') handleInlineSubmit(); }} className="bg-gray-900 border border-gray-700 focus:border-red-500 rounded-lg p-2 text-xs text-white w-20 outline-none text-right font-bold" />
                                    </div>
                                  </td>
                                  <td className="px-3 py-3 text-center text-xs text-gray-500">Nouveau</td>
                                  <td className="px-3 py-3 text-center relative">
                                    <button
                                      type="button"
                                      onClick={() => setInlineTx(prev => ({ ...prev, showReceiptInput: !prev.showReceiptInput }))}
                                      title={inlineTx.receiptUrl ? `Document lié : ${inlineTx.receiptName || inlineTx.receiptUrl}` : "Scanner ou lier une facture"}
                                      className={`p-2 rounded-lg border transition-colors ${inlineTx.receiptUrl ? 'bg-blue-600/20 border-blue-500 text-blue-400' : 'bg-gray-900 border-gray-700 text-gray-400 hover:text-white'}`}
                                    >
                                      <Paperclip className="w-4 h-4 mx-auto" />
                                    </button>
                                    {inlineTx.showReceiptInput && (
                                      <div className="absolute right-0 top-full mt-1 z-[250] bg-gray-900 border border-gray-700 p-3.5 rounded-xl shadow-2xl w-80 text-left space-y-2.5">
                                        <div className="flex items-center justify-between">
                                          <span className="text-xs font-bold text-white">Joindre une facture (Dossier {(inlineTx.date || '').split('-')[0] || currentYear})</span>
                                          <button type="button" onClick={() => setInlineTx({...inlineTx, showReceiptInput: false})} className="text-gray-400 hover:text-white"><X className="w-4 h-4"/></button>
                                        </div>

                                        <div className="grid grid-cols-2 gap-2">
                                          <label className="flex flex-col items-center justify-center p-2.5 rounded-lg bg-emerald-600/15 hover:bg-emerald-600/25 border border-emerald-500/30 text-emerald-300 cursor-pointer text-center transition-colors">
                                            <FolderUp className="w-4 h-4 mb-1" />
                                            <span className="text-[11px] font-bold">{inlineTx.uploadingInlineDrive ? 'Envoi...' : 'Fichier PC -> Drive'}</span>
                                            <input type="file" accept="image/*,.pdf" onChange={handleInlineDriveFile} disabled={inlineTx.uploadingInlineDrive} className="hidden" />
                                          </label>
                                          <label className="flex flex-col items-center justify-center p-2.5 rounded-lg bg-blue-600/15 hover:bg-blue-600/25 border border-blue-500/30 text-blue-300 cursor-pointer text-center transition-colors">
                                            <Camera className="w-4 h-4 mb-1" />
                                            <span className="text-[11px] font-bold">{inlineTx.uploadingInlineDrive ? 'Envoi...' : 'Photo Tél -> Drive'}</span>
                                            <input type="file" accept="image/*" capture="environment" onChange={handleInlineDriveFile} disabled={inlineTx.uploadingInlineDrive} className="hidden" />
                                          </label>
                                        </div>

                                        <div>
                                          <label className="block text-[10px] text-gray-400 mb-1">Ou coller un lien Drive direct :</label>
                                          <input
                                            type="url"
                                            placeholder="https://drive.google.com/..."
                                            value={inlineTx.receiptUrl}
                                            onChange={e => setInlineTx({...inlineTx, receiptUrl: e.target.value, receiptName: ''})}
                                            className="bg-gray-950 border border-gray-700 focus:border-blue-500 rounded-lg p-2 text-xs text-white w-full outline-none"
                                          />
                                        </div>

                                        <div className="flex justify-between items-center pt-1">
                                          {inlineTx.receiptUrl && (
                                            <button type="button" onClick={() => setInlineTx({...inlineTx, receiptUrl: '', receiptName: ''})} className="text-[11px] text-red-400 hover:underline">Effacer</button>
                                          )}
                                          <button type="button" onClick={() => setInlineTx({...inlineTx, showReceiptInput: false})} className="ml-auto bg-blue-600 text-white text-xs px-3 py-1 rounded-lg font-medium">Valider</button>
                                        </div>
                                      </div>
                                    )}
                                  </td>
                                  <td className="px-3 py-3 text-center">
                                    <button onClick={handleInlineSubmit} disabled={!inlineTx.amount || !inlineTx.description} className="bg-red-600 hover:bg-red-700 disabled:opacity-40 text-white p-2 rounded-lg shadow" title="Ajouter l'écriture">
                                      <Plus className="w-4 h-4 mx-auto"/>
                                    </button>
                                  </td>
                                </tr>
                              ) : (
                                <tr className="bg-yellow-500/10 border-b border-yellow-500/20 print:hidden">
                                  <td colSpan="10" className="px-4 py-3 text-center">
                                    <div className="flex flex-wrap items-center justify-center gap-3 text-xs text-yellow-400">
                                      <span className="flex items-center font-medium"><Lock className="w-4 h-4 mr-1.5" /> L'exercice {currentYear} est actuellement clôturé (saisie directe masquée).</span>
                                      <button onClick={() => toggleYearClosure(currentYear)} className="bg-yellow-500/20 hover:bg-yellow-500/30 text-yellow-300 border border-yellow-500/40 px-3 py-1 rounded-lg font-bold transition-colors">
                                        Rouvrir l'exercice {currentYear}
                                      </button>
                                    </div>
                                  </td>
                                </tr>
                              )}
                              {displayedTransactions.length === 0 ? (
                                <tr>
                                  <td colSpan="10" className="px-4 py-8 text-center text-gray-500">
                                    {searchQuery || quickFilter !== 'all'
                                      ? "Aucune écriture ne correspond à votre filtre ou recherche."
                                      : `Aucune écriture pour ce compte sur l'année ${currentYear}.`}
                                  </td>
                                </tr>
                              ) : (
                                displayedTransactions.map((tx) => {
                                  const isTransfer = tx.isInternalTransfer || tx.category === INTERNAL_TRANSFER_CATEGORY;
                                  return (
                                    <tr key={tx.id} className="bg-gray-900 border-b border-gray-800 hover:bg-gray-800/50">
                                      <td className="px-3 py-3 whitespace-nowrap">{new Date(tx.date).toLocaleDateString('fr-FR')}</td>
                                      <td className="px-3 py-3 whitespace-nowrap">{accounts.find(a => a.id === tx.accountId)?.name || '-'}</td>
                                      <td className="px-3 py-3 font-medium text-gray-200">{tx.description}</td>
                                      <td className="px-3 py-3 whitespace-nowrap">
                                        {tx.supplier ? (
                                          <span className="bg-blue-500/10 text-blue-300 text-xs px-2.5 py-1 rounded-full border border-blue-500/20">{tx.supplier}</span>
                                        ) : (
                                          <span className="text-gray-600 text-xs">-</span>
                                        )}
                                      </td>
                                      <td className="px-3 py-3 whitespace-nowrap">
                                        <span className={`text-xs px-2.5 py-1 rounded-full border ${isTransfer ? 'bg-indigo-500/15 text-indigo-300 border-indigo-500/30' : 'bg-gray-800 text-gray-300 border-gray-700'}`}>
                                          {tx.category}
                                        </span>
                                      </td>
                                      <td className="px-3 py-3 text-sm text-gray-300 whitespace-nowrap">
                                        <span className="block font-medium">{tx.paymentMethod || '-'}</span>
                                        {tx.paymentMethod === 'Chèque' && tx.checkNumber && <span className="block text-xs text-gray-500">N° {tx.checkNumber}</span>}
                                      </td>
                                      <td className={`px-3 py-3 text-right font-bold whitespace-nowrap ${tx.type === 'income' ? 'text-emerald-500' : 'text-red-400'}`}>
                                        {tx.type === 'income' ? '+' : '-'}{formatCurrency(tx.amount)}
                                      </td>
                                      <td className="px-3 py-3 text-center">
                                        {isCurrentYearClosed ? (
                                          <div className="flex justify-center">{tx.reconciled ? <CheckCircle className="w-6 h-6 text-gray-500" /> : <Circle className="w-6 h-6 text-gray-600" />}</div>
                                        ) : (
                                          <button onClick={() => toggleReconciled(tx.id)} className={`print:hidden ${tx.reconciled ? 'text-emerald-500' : 'text-gray-600'}`}>
                                            {tx.reconciled ? <CheckCircle className="w-6 h-6 mx-auto" /> : <Circle className="w-6 h-6 mx-auto" />}
                                          </button>
                                        )}
                                      </td>
                                      <td className="px-3 py-3 text-center print:hidden">
                                        {tx.receiptUrl ? (
                                          <button
                                            onClick={() => setReceiptModalTx(tx)}
                                            title={tx.receiptName || "Voir ou modifier le justificatif lié"}
                                            className="inline-flex items-center justify-center p-1.5 rounded-lg bg-blue-500/15 text-blue-400 hover:bg-blue-500/30 border border-blue-500/30 transition-colors"
                                          >
                                            <Paperclip className="w-4 h-4" />
                                          </button>
                                        ) : (
                                          !isCurrentYearClosed ? (
                                            <button
                                              onClick={() => setReceiptModalTx(tx)}
                                              title="Scanner ou déposer une facture sur Google Drive"
                                              className="inline-flex items-center justify-center p-1.5 rounded-lg text-gray-600 hover:text-gray-300 hover:bg-gray-800 transition-colors"
                                            >
                                              <Paperclip className="w-4 h-4" />
                                            </button>
                                          ) : (
                                            <span className="text-gray-600">-</span>
                                          )
                                        )}
                                      </td>
                                      <td className="px-3 py-3 text-center print:hidden">
                                        {!isCurrentYearClosed && (
                                          <div className="flex justify-center space-x-2">
                                            <button onClick={() => setEditModalTx(tx)} className="text-gray-400 hover:text-white" title="Modifier l'opération"><Pencil className="w-4 h-4"/></button>
                                            <button onClick={() => setDeleteConfirmTx(tx)} className="text-gray-400 hover:text-red-500" title="Supprimer l'opération"><Trash2 className="w-4 h-4"/></button>
                                          </div>
                                        )}
                                      </td>
                                    </tr>
                                  );
                                })
                              )}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* ONGLET 3 : BILAN ANNUEL & RAPPORT D'ASSEMBLÉE GÉNÉRALE (G) */}
                  {activeTab === 'balance' && (
                    <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 space-y-6 print-card">
                      {/* EN-TÊTE OFFICIEL POUR L'IMPRESSION D'ASSEMBLÉE GÉNÉRALE */}
                      <div className="hidden print:block border-b-2 border-black pb-4 mb-6">
                        <div className="flex justify-between items-start">
                          <div>
                            <h1 className="text-2xl font-extrabold uppercase tracking-wide text-black">Amicale des Sapeurs-Pompiers de Rieumes</h1>
                            <p className="text-sm font-semibold text-gray-700 mt-1">Rapport Financier d'Assemblée Générale — Exercice {currentYear}</p>
                            <p className="text-xs text-gray-600">Périmètre : {currentAccountName}</p>
                          </div>
                          <div className="text-right text-xs text-gray-600">
                            <p>Édité le {new Date().toLocaleDateString('fr-FR')}</p>
                          </div>
                        </div>
                      </div>

                      <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 print:hidden">
                        <div>
                          <h2 className="text-xl font-bold text-white">Bilan Financier {currentYear} ({currentAccountName})</h2>
                          <p className="text-xs text-gray-400 mt-1">
                            Regroupement actuel : <strong className="text-gray-200">{balanceGroupBy === 'category' ? 'Par Catégorie' : 'Par Fournisseur / Tiers'}</strong> (Toutes opérations bancaires incluses)
                          </p>
                        </div>
                        <div className="flex flex-wrap gap-2">
                          <div className="bg-gray-950 p-1 rounded-xl border border-gray-800 flex">
                            <button 
                              onClick={() => { setBalanceGroupBy('category'); setBalanceItemFilter('all'); }} 
                              className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center space-x-1.5 ${balanceGroupBy === 'category' ? 'bg-red-600 text-white shadow' : 'text-gray-400 hover:text-white'}`}
                            >
                              <List className="w-3.5 h-3.5" />
                              <span>Par Catégorie</span>
                            </button>
                            <button 
                              onClick={() => { setBalanceGroupBy('supplier'); setBalanceItemFilter('all'); }} 
                              className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center space-x-1.5 ${balanceGroupBy === 'supplier' ? 'bg-blue-600 text-white shadow' : 'text-gray-400 hover:text-white'}`}
                            >
                              <Users className="w-3.5 h-3.5" />
                              <span>Par Fournisseur / Tiers</span>
                            </button>
                          </div>

                          <div className="bg-gray-950 p-1 rounded-xl border border-gray-800 flex">
                            <button onClick={() => setBalanceViewMode('global')} className={`px-3 py-1.5 rounded-lg text-xs font-medium ${balanceViewMode === 'global' ? 'bg-gray-800 text-white' : 'text-gray-400'}`}>Vue Synthèse</button>
                            <button onClick={() => setBalanceViewMode('detailed')} className={`px-3 py-1.5 rounded-lg text-xs font-medium ${balanceViewMode === 'detailed' ? 'bg-gray-800 text-white' : 'text-gray-400'}`}>Vue Détaillée</button>
                          </div>

                          <select 
                            value={balanceItemFilter} 
                            onChange={(e) => setBalanceItemFilter(e.target.value)}
                            className="bg-gray-800 border border-gray-700 text-white text-xs rounded-xl px-3 py-1.5 outline-none"
                          >
                            <option value="all">{balanceGroupBy === 'category' ? 'Toutes les catégories' : 'Tous les fournisseurs / tiers'}</option>
                            {Object.keys(activeSummary).sort().map(key => (
                              <option key={key} value={key}>{key}</option>
                            ))}
                          </select>

                          <button onClick={exportCSV} className="flex items-center space-x-1.5 bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-xl text-xs font-medium">
                            <Download className="w-4 h-4"/><span>Export CSV / Sheets</span>
                          </button>
                          <button onClick={() => openPrintCenter('ag_complete')} className="flex items-center space-x-1.5 bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold shadow">
                            <Printer className="w-4 h-4"/><span>Centre d'Impression / PDF</span>
                          </button>
                        </div>
                      </div>

                      <div className="bg-gray-950 p-4 rounded-xl border border-gray-800 flex justify-between items-center print-card">
                        <span className="text-gray-300 font-medium print-text-black">Report à nouveau (Solde au 1er Janvier {currentYear})</span>
                        <span className={`text-lg font-bold ${reportANouveau >= 0 ? 'text-emerald-500' : 'text-red-500'} print-text-black`}>{formatCurrency(reportANouveau)}</span>
                      </div>

                      {balanceViewMode === 'global' ? (
                        <table className="w-full text-sm text-left text-gray-300 print-text-black">
                          <thead className="bg-gray-950 border-b border-gray-800 print-card">
                            <tr>
                              <th className="px-6 py-4">{balanceGroupBy === 'category' ? 'Catégorie' : 'Fournisseur / Tiers'}</th>
                              <th className="px-6 py-4 text-right">Recettes</th>
                              <th className="px-6 py-4 text-right">Dépenses</th>
                              <th className="px-6 py-4 text-right">Solde</th>
                            </tr>
                          </thead>
                          <tbody>
                            {filteredSummaryEntries.length === 0 ? (
                              <tr>
                                <td colSpan="4" className="px-6 py-8 text-center text-gray-500">Aucune opération sur cette sélection.</td>
                              </tr>
                            ) : (
                              filteredSummaryEntries.map(([itemKey, data]) => (
                                <tr key={itemKey} className="border-b border-gray-800 hover:bg-gray-800/30">
                                  <td className="px-6 py-3.5 font-medium text-white print-text-black">{itemKey}</td>
                                  <td className="px-6 py-3.5 text-right text-emerald-500 print-text-black">{data.income > 0 ? formatCurrency(data.income) : '-'}</td>
                                  <td className="px-6 py-3.5 text-right text-red-500 print-text-black">{data.expense > 0 ? formatCurrency(data.expense) : '-'}</td>
                                  <td className={`px-6 py-3.5 text-right font-bold ${data.total >= 0 ? 'text-white' : 'text-red-400'} print-text-black`}>{formatCurrency(data.total)}</td>
                                </tr>
                              ))
                            )}
                            <tr className="bg-gray-950 font-bold text-white border-t-2 border-gray-700 print-card print-text-black">
                              <td className="px-6 py-4">TOTAL DES MOUVEMENTS {currentYear}</td>
                              <td className="px-6 py-4 text-right text-emerald-400 print-text-black">{formatCurrency(sumIncome)}</td>
                              <td className="px-6 py-4 text-right text-red-400 print-text-black">{formatCurrency(sumExpense)}</td>
                              <td className="px-6 py-4 text-right">{formatCurrency(sumTotal)}</td>
                            </tr>
                            {balanceItemFilter === 'all' && (
                              <tr className="bg-red-950/20 font-extrabold text-white border-t border-red-500/30 print-card print-text-black">
                                <td className="px-6 py-4" colSpan="3">SOLDE FINAL AU 31/12/{currentYear} (Avec Report à nouveau)</td>
                                <td className="px-6 py-4 text-right text-lg">{formatCurrency(reportANouveau + sumTotal)}</td>
                              </tr>
                            )}
                          </tbody>
                        </table>
                      ) : (
                        <div className="space-y-4">
                          {filteredSummaryEntries.map(([itemKey, data]) => {
                            const itemTxs = filteredTransactions.filter(t => 
                              balanceGroupBy === 'category' 
                                ? (t.category || 'Non catégorisé') === itemKey
                                : ((t.supplier || '').trim() || 'Non renseigné') === itemKey
                            );
                            if (itemTxs.length === 0) return null;
                            return (
                              <div key={itemKey} className="border border-gray-800 rounded-xl overflow-hidden print-card">
                                <div className="bg-gray-950 px-4 py-3 flex justify-between items-center border-b border-gray-800 print-card">
                                  <span className="font-bold text-white print-text-black">{itemKey}</span>
                                  <span className={`font-bold ${data.total >= 0 ? 'text-emerald-400' : 'text-red-400'} print-text-black`}>{formatCurrency(data.total)}</span>
                                </div>
                                <div className="divide-y divide-gray-800/60">
                                  {itemTxs.map(tx => (
                                    <div key={tx.id} className="px-4 py-2.5 flex justify-between items-center text-xs">
                                      <div className="flex flex-wrap items-center gap-2">
                                        <span className="text-gray-400 print-text-black">{new Date(tx.date).toLocaleDateString('fr-FR')}</span>
                                        <span className="text-gray-200 font-medium print-text-black">{tx.description}</span>
                                        {balanceGroupBy === 'category' && tx.supplier && (
                                          <span className="bg-blue-500/10 text-blue-300 px-2 py-0.5 rounded-full border border-blue-500/20 print-text-black">{tx.supplier}</span>
                                        )}
                                        {balanceGroupBy === 'supplier' && tx.category && (
                                          <span className="bg-gray-800 text-gray-300 px-2 py-0.5 rounded-full border border-gray-700 print-text-black">{tx.category}</span>
                                        )}
                                        {tx.receiptUrl && (
                                          <button onClick={() => setReceiptModalTx(tx)} className="text-blue-400 hover:underline inline-flex items-center print:hidden">
                                            <Paperclip className="w-3 h-3 mr-1"/>Justificatif
                                          </button>
                                        )}
                                      </div>
                                      <span className={`font-bold ${tx.type === 'income' ? 'text-emerald-400' : 'text-red-400'} print-text-black`}>
                                        {tx.type === 'income' ? '+' : '-'}{formatCurrency(tx.amount)}
                                      </span>
                                    </div>
                                  ))}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}

                      {/* G. SECTION RAPPORT D'ASSEMBLÉE GÉNÉRALE : ÉTAT DES COMPTES & SIGNATURES OFFICIELLES */}
                      <div className="pt-6 border-t border-gray-800 space-y-6 print-card">
                        <div>
                          <h3 className="text-base font-bold text-white mb-3 print-text-black">
                            Situation de la trésorerie par compte au 31/12/{currentYear}
                          </h3>
                          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            {accounts.map(acc => {
                              const eoy = endOfYearAccountBalances[acc.id] || { pointed: 0, theoretical: 0 };
                              return (
                                <div key={acc.id} className="bg-gray-950 border border-gray-800 rounded-xl p-4 print-card">
                                  <span className="text-xs font-bold uppercase text-gray-400 block print-text-black">{acc.name}</span>
                                  <div className="flex justify-between items-baseline mt-2">
                                    <span className="text-xs text-gray-400 print-text-black">Solde théorique :</span>
                                    <span className="text-base font-extrabold text-white print-text-black">{formatCurrency(eoy.theoretical)}</span>
                                  </div>
                                  <div className="flex justify-between items-baseline mt-1">
                                    <span className="text-[11px] text-gray-500 print-text-black">Solde pointé :</span>
                                    <span className="text-xs font-semibold text-emerald-400 print-text-black">{formatCurrency(eoy.pointed)}</span>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>

                        {/* CADRES D'APPROBATION ET SIGNATURES (TRÉSORIER & PRÉSIDENT) */}
                        <div className="pt-4 border-t border-gray-800 print-card">
                          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 text-xs text-gray-400 print-text-black">
                            <span>Certifié sincère et véritable pour l'Assemblée Générale de l'exercice {currentYear}.</span>
                            <span className="mt-1 sm:mt-0 font-semibold">Fait à Rieumes, le {formattedSignatureDate}</span>
                          </div>
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                            <div className="border border-gray-700 rounded-xl p-4 min-h-[120px] flex flex-col justify-between bg-gray-950/50 print-card">
                              <div>
                                <span className="text-xs font-bold uppercase tracking-wider text-gray-400 block print-text-black">Le Trésorier</span>
                                <span className="text-sm font-extrabold text-white mt-0.5 block print-text-black">{treasurerName}</span>
                              </div>
                              <span className="text-[10px] text-gray-500 italic print-text-black">Signature :</span>
                            </div>
                            <div className="border border-gray-700 rounded-xl p-4 min-h-[120px] flex flex-col justify-between bg-gray-950/50 print-card">
                              <div>
                                <span className="text-xs font-bold uppercase tracking-wider text-gray-400 block print-text-black">Le Président</span>
                                <span className="text-sm font-extrabold text-white mt-0.5 block print-text-black">{presidentName}</span>
                              </div>
                              <span className="text-[10px] text-gray-500 italic print-text-black">Signature :</span>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* ONGLET 4 : AUTOMATISATIONS */}
                  {activeTab === 'automations' && (
                    <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                      <div className="flex justify-between items-center mb-6">
                        <h2 className="text-xl font-bold text-white">Opérations Récurrentes</h2>
                        <button onClick={() => setIsAddAutomationOpen(true)} className="flex items-center space-x-2 bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
                          <Plus className="w-4 h-4"/><span>Ajouter</span>
                        </button>
                      </div>
                      {automations.length === 0 ? (
                        <p className="text-gray-500 text-sm">Aucune automatisation enregistrée.</p>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          {automations.map(auto => (
                            <div key={auto.id} className="bg-gray-950 border border-gray-800 p-4 rounded-xl flex justify-between items-center">
                              <div>
                                <p className="font-bold text-white">{auto.description}</p>
                                <p className="text-xs text-gray-400">
                                  {auto.supplier ? `${auto.supplier} • ` : ''}{auto.category} • {auto.frequency === 'monthly' ? 'Mensuel' : 'Annuel'}
                                </p>
                              </div>
                              <div className="flex items-center space-x-3">
                                <span className={`font-bold ${auto.type === 'income' ? 'text-emerald-400' : 'text-red-400'}`}>{formatCurrency(auto.amount)}</span>
                                <button onClick={() => deleteAutomation(auto.id)} className="text-gray-500 hover:text-red-500"><Trash2 className="w-4 h-4"/></button>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                  {/* ONGLET 5 : PARAMÈTRES */}
                  {activeTab === 'settings' && (
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      {/* COMPTES */}
                      <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                        <h2 className="text-lg font-bold text-white mb-4 flex items-center"><CreditCard className="w-5 h-5 mr-2 text-red-500"/> Comptes Bancaires</h2>
                        <ul className="space-y-3 mb-6">
                          {accounts.map(acc => (
                            <li key={acc.id} className="flex justify-between items-center bg-gray-950 p-3 rounded-lg border border-gray-800">
                              <span className="text-gray-200 font-medium">{acc.name}</span>
                              <button onClick={() => deleteAccount(acc.id)} className="text-gray-500 hover:text-red-500"><Trash2 className="w-4 h-4"/></button>
                            </li>
                          ))}
                        </ul>
                        <form onSubmit={addAccount} className="flex space-x-2">
                          <input type="text" value={newAccountName} onChange={e => setNewAccountName(e.target.value)} placeholder="Nouveau compte..." className="flex-1 bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white outline-none" />
                          <button className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium">Ajouter</button>
                        </form>
                      </div>

                      {/* CATÉGORIES */}
                      <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                        <h2 className="text-lg font-bold text-white mb-4 flex items-center"><List className="w-5 h-5 mr-2 text-red-500"/> Catégories</h2>
                        <ul className="space-y-2.5 mb-6 max-h-64 overflow-y-auto pr-1">
                          {categories.map(cat => (
                            <li key={cat.id} className="flex justify-between items-center bg-gray-950 p-3 rounded-lg border border-gray-800">
                              <span className="text-gray-200 text-sm">{cat.name}</span>
                              <button onClick={() => deleteCategory(cat.id)} className="text-gray-500 hover:text-red-500"><Trash2 className="w-4 h-4"/></button>
                            </li>
                          ))}
                        </ul>
                        <form onSubmit={addCategory} className="flex space-x-2">
                          <input type="text" value={newCategoryName} onChange={e => setNewCategoryName(e.target.value)} placeholder="Nouvelle catégorie..." className="flex-1 bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white outline-none" />
                          <button className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium">Ajouter</button>
                        </form>
                      </div>

                      {/* FOURNISSEURS / TIERS */}
                      <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                        <h2 className="text-lg font-bold text-white mb-4 flex items-center"><Users className="w-5 h-5 mr-2 text-blue-400"/> Fournisseurs / Tiers</h2>
                        <ul className="space-y-2.5 mb-6 max-h-64 overflow-y-auto pr-1">
                          {suppliers.map(sup => (
                            <li key={sup.id} className="flex justify-between items-center bg-gray-950 p-3 rounded-lg border border-gray-800">
                              <span className="text-gray-200 text-sm">{sup.name}</span>
                              <button onClick={() => deleteSupplier(sup.id)} className="text-gray-500 hover:text-red-500"><Trash2 className="w-4 h-4"/></button>
                            </li>
                          ))}
                        </ul>
                        <form onSubmit={addSupplier} className="flex space-x-2">
                          <input type="text" value={newSupplierName} onChange={e => setNewSupplierName(e.target.value)} placeholder="Nouveau fournisseur..." className="flex-1 bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white outline-none" />
                          <button className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium">Ajouter</button>
                        </form>
                      </div>

                      {/* SIGNATAIRES OFFICIELS (TRÉSORIER & PRÉSIDENT) */}
                      <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 md:col-span-3">
                        <div className="mb-4">
                          <h2 className="text-lg font-bold text-white flex items-center">
                            <Pencil className="w-5 h-5 mr-2 text-red-500"/> Signataires Officiels (Rapport d'Assemblée Générale)
                          </h2>
                          <p className="text-xs text-gray-400 mt-0.5">
                            Ces noms apparaissent automatiquement dans les cadres de signatures du Bilan Annuel et des impressions PDF. Vous pouvez les modifier à tout moment en cas de changement de bureau.
                          </p>
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-xs font-semibold text-gray-400 mb-1.5">Nom et Prénom du Trésorier</label>
                            <input
                              type="text"
                              value={treasurerName}
                              onChange={(e) => setTreasurerName(e.target.value)}
                              placeholder="Ex: Frédéric Sudron"
                              className="w-full bg-gray-950 border border-gray-700 focus:border-red-500 rounded-xl p-3 text-sm text-white outline-none font-medium"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-gray-400 mb-1.5">Nom et Prénom du Président</label>
                            <input
                              type="text"
                              value={presidentName}
                              onChange={(e) => setPresidentName(e.target.value)}
                              placeholder="Ex: Laurent Basque"
                              className="w-full bg-gray-950 border border-gray-700 focus:border-red-500 rounded-xl p-3 text-sm text-white outline-none font-medium"
                            />
                          </div>
                        </div>
                      </div>

                      {/* PASSERELLE GOOGLE DRIVE AUTOMATIQUE (D : RANGEMENT PAR ANNÉE + FOURNISSEUR) */}
                      <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 md:col-span-3">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                          <div>
                            <h2 className="text-lg font-bold text-white flex items-center">
                              <FolderUp className="w-5 h-5 mr-2 text-blue-400"/> Envoi Automatique & Classement Année / Fournisseur dans Google Drive
                            </h2>
                            <p className="text-xs text-gray-400 mt-0.5">
                              Chaque facture est nommée <code className="text-blue-300">facture_NomDuTiers_Numéro</code> et rangée automatiquement dans <code className="text-emerald-300">Année / Nom du Fournisseur /</code> (ex: <code className="text-emerald-300">2026 / Super U Rieumes /</code>).
                            </p>
                          </div>
                          <span className={`text-xs px-3 py-1 rounded-full font-semibold ${driveScriptUrl ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : 'bg-gray-800 text-gray-400 border border-gray-700'}`}>
                            {driveScriptUrl ? '✓ Dossier Google Drive configuré' : 'Non configuré (Optionnel)'}
                          </span>
                        </div>
                        <div className="flex flex-col sm:flex-row gap-3">
                          <input
                            type="url"
                            value={tempDriveScriptUrl}
                            onChange={(e) => setTempDriveScriptUrl(e.target.value)}
                            placeholder="Collez ici l'URL du script Google Drive (https://script.google.com/macros/s/.../exec)"
                            className="flex-1 bg-gray-950 border border-gray-700 rounded-xl p-3 text-sm text-white outline-none focus:border-blue-500"
                          />
                          <button
                            onClick={() => {
                              const cleaned = tempDriveScriptUrl.trim();
                              setDriveScriptUrl(cleaned);
                              localStorage.setItem('sp_rieumes_drive_script_url', cleaned);
                              forcePushToCloud(cleaned);
                              setDriveTestMsg({ type: 'success', text: "Lien enregistré et verrouillé dans Firebase pour tous vos appareils (PC et Téléphone) !" });
                            }}
                            className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-xl font-bold text-sm transition-colors"
                          >
                            Enregistrer pour tous les appareils
                          </button>
                          <button
                            onClick={testDriveConnection}
                            className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-3 rounded-xl font-bold text-sm transition-colors"
                          >
                            Tester l'envoi Drive
                          </button>
                        </div>
                        {driveTestMsg && (
                          <div className={`mt-3 p-3 rounded-xl text-xs font-medium border ${
                            driveTestMsg.type === 'success' ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' :
                            driveTestMsg.type === 'error' ? 'bg-red-500/10 border-red-500/30 text-red-300' :
                            'bg-blue-500/10 border-blue-500/30 text-blue-300'
                          }`}>
                            {driveTestMsg.text}
                          </div>
                        )}
                      </div>

                      {/* CONNEXION CLOUD FIREBASE */}
                      <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 md:col-span-3">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
                          <div>
                            <h2 className="text-lg font-bold text-white flex items-center">
                              <Database className="w-5 h-5 mr-2 text-emerald-400"/> Synchronisation en ligne (Firebase - Fusion Multi-Appareils)
                            </h2>
                            <p className="text-xs text-gray-400 mt-0.5">
                              Les créations faites sur PC et sur Téléphone sont fusionnées ligne par ligne sans jamais s'écraser.
                            </p>
                          </div>
                          <span className={`text-xs px-3 py-1 rounded-full font-semibold ${
                            cloudStatus === 'connected' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' :
                            cloudStatus === 'error' ? 'bg-red-500/10 text-red-400 border border-red-500/30' :
                            'bg-amber-500/10 text-amber-400 border border-amber-500/30'
                          }`}>
                            {cloudStatus === 'connected' ? '✓ Connecté & Fusion intelligente active' :
                             cloudStatus === 'error' ? `⚠️ ${cloudErrorDetail || 'Vérifier les Règles Firebase'}` :
                             'Connexion / Attente synchronisation...'}
                          </span>
                        </div>
                        <div className="flex flex-col sm:flex-row gap-3">
                          <input 
                            type="url" 
                            value={tempFbUrl} 
                            onChange={(e) => setTempFbUrl(e.target.value)} 
                            placeholder="https://tresorerie-amicale-sp-rieumes-default-rtdb.europe-west1.firebasedatabase.app" 
                            className="flex-1 bg-gray-950 border border-gray-700 rounded-xl p-3 text-sm text-white outline-none focus:border-emerald-500"
                          />
                          <button 
                            onClick={() => {
                              localStorage.setItem('sp_rieumes_fb_url', tempFbUrl.trim());
                              setFirebaseDbUrl(tempFbUrl.trim());
                              setTimeout(() => forcePushToCloud(), 400);
                            }}
                            className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-bold text-sm transition-colors"
                          >
                            Connecter / Fusionner
                          </button>
                        </div>
                      </div>

                      {/* CLÔTURE D'EXERCICE */}
                      <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 md:col-span-3">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                          <div>
                            <h2 className="text-lg font-bold text-white flex items-center"><Calendar className="w-5 h-5 mr-2 text-red-500"/> Gestion des Exercices Annuels</h2>
                            <p className="text-xs text-gray-400 mt-0.5">Vous pouvez laisser plusieurs exercices ouverts en même temps. Cliquez sur un exercice pour l'ouvrir ou le clôturer.</p>
                          </div>
                          <button
                            onClick={() => {
                              const nextY = openNextYear();
                              setCurrentYear(nextY);
                            }}
                            className="flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition-colors shadow-lg shadow-blue-600/20"
                          >
                            <Plus className="w-4 h-4" />
                            <span>Ouvrir l'exercice {Math.max(...availableYears.map(Number)) + 1}</span>
                          </button>
                        </div>
                        <div className="flex flex-wrap gap-3">
                          {availableYears.map(year => {
                            const closed = closedYears.includes(year);
                            const hasTx = transactions.some(tx => tx.date.startsWith(year));
                            return (
                              <div key={year} className={`flex items-center space-x-2 px-4 py-2.5 rounded-xl border text-sm font-medium ${closed ? 'bg-yellow-500/10 border-yellow-500/30 text-yellow-400' : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400'}`}>
                                <button onClick={() => toggleYearClosure(year)} className="flex items-center space-x-2">
                                  {closed ? <Lock className="w-4 h-4"/> : <Unlock className="w-4 h-4"/>}
                                  <span>{year} ({closed ? 'Clôturé' : 'Ouvert'})</span>
                                </button>
                                {!hasTx && availableYears.length > 1 && (
                                  <button onClick={() => deleteYear(year)} title="Supprimer cet exercice vide" className="ml-2 text-gray-500 hover:text-red-400 pl-2 border-l border-gray-700">
                                    <Trash2 className="w-3.5 h-3.5" />
                                  </button>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>

                      {/* SAUVEGARDE JSON */}
                      <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 md:col-span-3">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
                          <h2 className="text-lg font-bold text-white flex items-center"><Database className="w-5 h-5 mr-2 text-red-500"/> Sauvegarde sur Ordinateur (.json)</h2>
                          {lastJsonBackupAt && (
                            <span className="text-xs text-gray-400">
                              Dernière copie PC : {new Date(lastJsonBackupAt).toLocaleDateString('fr-FR')}
                            </span>
                          )}
                        </div>
                        <div className="flex flex-col sm:flex-row gap-4">
                          <button onClick={exportBackup} className="flex-1 flex items-center justify-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-medium">
                            <Download className="w-5 h-5"/><span>Sauvegarder sur le PC (.json)</span>
                          </button>
                          <label className="flex-1 flex items-center justify-center space-x-2 bg-gray-800 hover:bg-gray-700 text-white py-3 rounded-xl cursor-pointer font-medium">
                            <Upload className="w-5 h-5"/><span>Restaurer un fichier (.json)</span>
                            <input type="file" accept=".json" onChange={handleFileUpload} className="hidden" />
                          </label>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </main>
          </div>

          {/* FENÊTRE DE SÉLECTION DU COMPTE */}
          {isAccountPickerOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex justify-center items-center z-50 p-4">
              <div className="bg-gray-900 border border-gray-700 rounded-3xl w-full max-w-2xl overflow-hidden shadow-2xl">
                <div className="p-6 border-b border-gray-800 flex justify-between items-center">
                  <div className="flex items-center space-x-3">
                    <div className="bg-red-600 p-2.5 rounded-xl text-white">
                      <CreditCard className="w-6 h-6" />
                    </div>
                    <div>
                      <h3 className="text-xl font-bold text-white">Quel compte souhaitez-vous traiter ?</h3>
                      <p className="text-xs text-gray-400">Sélectionnez le compte sur lequel saisir ou pointer vos écritures</p>
                    </div>
                  </div>
                  <button onClick={() => setIsAccountPickerOpen(false)} className="text-gray-400 hover:text-white p-1">
                    <X className="w-6 h-6" />
                  </button>
                </div>

                <div className="p-6 grid grid-cols-1 sm:grid-cols-2 gap-4 max-h-[75vh] overflow-y-auto">
                  {accounts.map(acc => {
                    const bal = accountBalances[acc.id] || { pointed: 0, unpointed: 0, theoretical: 0 };
                    const isSelected = currentAccountId === acc.id;
                    return (
                      <button
                        key={acc.id}
                        onClick={() => { setCurrentAccountId(acc.id); setHasSelectedAccountOnce(true); setIsAccountPickerOpen(false); }}
                        className={`text-left p-5 rounded-2xl border transition-all flex flex-col justify-between group ${isSelected ? 'bg-red-600/15 border-red-500 shadow-lg shadow-red-600/10' : 'bg-gray-950 hover:bg-gray-800 border-gray-800 hover:border-gray-600'}`}
                      >
                        <div className="flex items-center justify-between mb-4">
                          <span className="text-lg font-bold text-white group-hover:text-red-400 transition-colors">{acc.name}</span>
                          <span className={`text-xs px-2.5 py-1 rounded-full font-semibold ${isSelected ? 'bg-red-600 text-white' : 'bg-gray-800 text-gray-400'}`}>
                            {isSelected ? 'Actif' : 'Choisir'}
                          </span>
                        </div>
                        <div className="space-y-1.5 pt-3 border-t border-gray-800/80 w-full">
                          <div className="flex justify-between text-xs">
                            <span className="text-gray-400">Solde Pointé :</span>
                            <span className={`font-bold ${bal.pointed >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>{formatCurrency(bal.pointed)}</span>
                          </div>
                          <div className="flex justify-between text-xs">
                            <span className="text-gray-400">Non pointé :</span>
                            <span className="font-medium text-blue-400">{bal.unpointed > 0 ? '+' : ''}{formatCurrency(bal.unpointed)}</span>
                          </div>
                          <div className="flex justify-between text-sm pt-1 border-t border-gray-800/50">
                            <span className="text-gray-300 font-semibold">Solde Théorique :</span>
                            <span className={`font-extrabold ${bal.theoretical >= 0 ? 'text-white' : 'text-red-400'}`}>{formatCurrency(bal.theoretical)}</span>
                          </div>
                        </div>
                      </button>
                    );
                  })}

                  <button
                    onClick={() => { setCurrentAccountId('all'); setHasSelectedAccountOnce(true); setIsAccountPickerOpen(false); }}
                    className={`sm:col-span-2 text-left p-4 rounded-2xl border transition-all flex items-center justify-between ${currentAccountId === 'all' ? 'bg-red-600/15 border-red-500' : 'bg-gray-950 hover:bg-gray-800 border-gray-800'}`}
                  >
                    <div>
                      <span className="font-bold text-white block">Voir tous les comptes (Cumul global)</span>
                      <span className="text-xs text-gray-400">Affiche toutes les écritures confondues</span>
                    </div>
                    <span className="text-xs bg-gray-800 text-gray-300 px-3 py-1.5 rounded-xl border border-gray-700">Vue globale</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FENÊTRE DE SÉLECTION DE L'ANNÉE */}
          {isYearPickerOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex justify-center items-center z-50 p-4">
              <div className="bg-gray-900 border border-gray-700 rounded-3xl w-full max-w-lg overflow-hidden shadow-2xl">
                <div className="p-6 border-b border-gray-800 flex justify-between items-center">
                  <div className="flex items-center space-x-3">
                    <div className="bg-blue-600 p-2.5 rounded-xl text-white">
                      <Calendar className="w-6 h-6" />
                    </div>
                    <div>
                      <h3 className="text-xl font-bold text-white">Choisir l'exercice comptable</h3>
                      <p className="text-xs text-gray-400">Sélectionnez l'année à consulter ou modifier</p>
                    </div>
                  </div>
                  <button onClick={() => setIsYearPickerOpen(false)} className="text-gray-400 hover:text-white p-1">
                    <X className="w-6 h-6" />
                  </button>
                </div>

                <div className="p-6 grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[65vh] overflow-y-auto">
                  {availableYears.map(year => {
                    const isSelected = currentYear === year;
                    const isClosed = closedYears.includes(year);
                    const countTx = transactions.filter(t => t.date.startsWith(year)).length;
                    return (
                      <div
                        key={year}
                        className={`p-4 rounded-2xl border text-left transition-all flex flex-col justify-between ${
                          isSelected 
                            ? 'bg-blue-600/15 border-blue-500 shadow-lg shadow-blue-600/10' 
                            : 'bg-gray-950 hover:bg-gray-800 border-gray-800 hover:border-gray-600'
                        }`}
                      >
                        <div className="flex items-center justify-between mb-2">
                          <button onClick={() => { setCurrentYear(year); setIsYearPickerOpen(false); }} className="text-2xl font-extrabold text-white hover:text-blue-400 transition-colors">
                            {year}
                          </button>
                          <div className="flex items-center space-x-1.5">
                            <button
                              onClick={(e) => { e.stopPropagation(); toggleYearClosure(year); }}
                              title="Cliquer pour basculer Ouvert / Clôturé"
                              className={`flex items-center space-x-1 text-[11px] px-2.5 py-1 rounded-full border font-semibold transition-colors ${
                                isClosed 
                                  ? 'bg-yellow-500/10 text-yellow-400 border-yellow-500/30 hover:bg-yellow-500/20' 
                                  : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30 hover:bg-emerald-500/20'
                              }`}
                            >
                              {isClosed ? <><Lock className="w-3 h-3" /><span>Clôturé</span></> : <><Unlock className="w-3 h-3" /><span>Ouvert</span></>}
                            </button>
                            {countTx === 0 && availableYears.length > 1 && (
                              <button
                                onClick={(e) => { e.stopPropagation(); deleteYear(year); }}
                                title="Supprimer cet exercice vide"
                                className="p-1 text-gray-500 hover:text-red-400 rounded-lg"
                              >
                                <Trash2 className="w-4 h-4" />
                              </button>
                            )}
                          </div>
                        </div>
                        <button onClick={() => { setCurrentYear(year); setIsYearPickerOpen(false); }} className="text-left w-full flex justify-between items-center pt-2 border-t border-gray-800/60 mt-1">
                          <span className="text-xs text-gray-400">{countTx} écriture(s)</span>
                          <span className="text-xs font-semibold text-blue-400">Choisir →</span>
                        </button>
                      </div>
                    );
                  })}
                </div>

                <div className="p-4 bg-gray-950 border-t border-gray-800 flex justify-between items-center">
                  <span className="text-xs text-gray-400">Garder plusieurs exercices ouverts :</span>
                  <button
                    onClick={() => {
                      const nextYear = openNextYear();
                      setCurrentYear(nextYear);
                      setIsYearPickerOpen(false);
                    }}
                    className="flex items-center space-x-1.5 text-xs bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl font-bold transition-colors shadow"
                  >
                    <Plus className="w-3.5 h-3.5" />
                    <span>Ouvrir l'exercice {Math.max(...availableYears.map(Number)) + 1}</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODALE : VIREMENT INTERNE COMPTE À COMPTE (B) */}
          {isTransferModalOpen && (
            <InternalTransferModal
              onClose={() => setIsTransferModalOpen(false)}
              onSave={addInternalTransfer}
              accounts={accounts}
              currentAccountId={currentAccountId}
              currentYear={currentYear}
            />
          )}

          {/* MODALE : GESTION / APERÇU DU DOCUMENT LIÉ (JUSTIFICATIF) */}
          {receiptModalTx && (
            <ReceiptModal
              tx={receiptModalTx}
              isClosed={isCurrentYearClosed}
              driveScriptUrl={driveScriptUrl}
              suppliers={suppliers}
              onClose={() => setReceiptModalTx(null)}
              onSave={(url, name, sup) => handleUpdateReceipt(receiptModalTx.id, url, name, sup)}
            />
          )}

          {/* MODALE : NOUVELLE OPÉRATION */}
          {isAddModalOpen && (
            <AddTransactionModal 
              onClose={() => setIsAddModalOpen(false)} 
              onSave={addTransaction} 
              accounts={accounts} 
              currentAccountId={currentAccountId} 
              categories={categories} 
              suppliers={suppliers}
              driveScriptUrl={driveScriptUrl}
            />
          )}

          {/* MODALE : MODIFIER OPÉRATION */}
          {editModalTx && (
            <EditTransactionModal
              tx={editModalTx}
              onClose={() => setEditModalTx(null)}
              onSave={handleEditTransaction}
              accounts={accounts}
              categories={categories}
              suppliers={suppliers}
              driveScriptUrl={driveScriptUrl}
            />
          )}

          {/* MODALE : CONFIRMATION DE SUPPRESSION D'UNE ÉCRITURE */}
          {deleteConfirmTx && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-50 p-4 print:hidden">
              <div className="bg-gray-900 border border-gray-700 rounded-2xl p-6 max-w-md w-full space-y-4 shadow-2xl">
                <div className="flex items-center space-x-3">
                  <div className="bg-red-500/20 text-red-400 p-3 rounded-xl border border-red-500/30">
                    <AlertTriangle className="w-6 h-6" />
                  </div>
                  <div>
                    <h3 className="text-lg font-bold text-white">Supprimer cette écriture ?</h3>
                    <p className="text-xs text-gray-400">Cette suppression sera synchronisée sur tous les appareils.</p>
                  </div>
                </div>

                <div className="bg-gray-950 border border-gray-800 rounded-xl p-4 space-y-1.5 text-xs">
                  <div className="flex justify-between">
                    <span className="text-gray-400">Date :</span>
                    <span className="text-gray-200 font-medium">{new Date(deleteConfirmTx.date).toLocaleDateString('fr-FR')}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-gray-400">Libellé :</span>
                    <span className="text-white font-bold">{deleteConfirmTx.description}</span>
                  </div>
                  {deleteConfirmTx.supplier && (
                    <div className="flex justify-between">
                      <span className="text-gray-400">Tiers :</span>
                      <span className="text-blue-300">{deleteConfirmTx.supplier}</span>
                    </div>
                  )}
                  <div className="flex justify-between pt-1 border-t border-gray-800">
                    <span className="text-gray-400">Montant :</span>
                    <span className={`font-extrabold text-sm ${deleteConfirmTx.type === 'income' ? 'text-emerald-400' : 'text-red-400'}`}>
                      {deleteConfirmTx.type === 'income' ? '+' : '-'}{formatCurrency(deleteConfirmTx.amount)}
                    </span>
                  </div>
                </div>

                <div className="flex space-x-3 pt-2">
                  <button
                    type="button"
                    onClick={() => setDeleteConfirmTx(null)}
                    className="flex-1 py-3 bg-gray-800 hover:bg-gray-700 text-white rounded-xl text-sm font-medium transition-colors"
                  >
                    Annuler
                  </button>
                  <button
                    type="button"
                    onClick={() => deleteTransaction(deleteConfirmTx.id)}
                    className="flex-1 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl text-sm font-bold transition-colors shadow-lg shadow-red-600/20"
                  >
                    Oui, supprimer
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODALE : NOUVELLE AUTOMATISATION */}
          {isAddAutomationOpen && (
            <AddAutomationModal 
              onClose={() => setIsAddAutomationOpen(false)} 
              onSave={addAutomation} 
              accounts={accounts} 
              categories={categories} 
              suppliers={suppliers}
            />
          )}

          {/* MODALE : CONFIRMATION RESTAURATION */}
          {restoreData && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-50 p-4 print:hidden">
              <div className="bg-gray-900 border border-gray-700 rounded-2xl p-6 max-w-md w-full space-y-4">
                <h3 className="text-xl font-bold text-white">Restaurer la sauvegarde ?</h3>
                <p className="text-sm text-gray-300">Cette action remplacera les données actuelles par celles du fichier sélectionné.</p>
                <div className="flex space-x-3 pt-2">
                  <button onClick={() => setRestoreData(null)} className="flex-1 py-2.5 bg-gray-800 text-white rounded-xl">Annuler</button>
                  <button onClick={confirmRestore} className="flex-1 py-2.5 bg-red-600 text-white rounded-xl font-bold">Confirmer</button>
                </div>
              </div>
            </div>
          )}

          {/* MODALE : CENTRE D'IMPRESSION SUR-MESURE */}
          {isPrintModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex justify-center items-center z-50 p-4 print:hidden">
              <div className="bg-gray-900 border border-gray-700 rounded-3xl w-full max-w-2xl overflow-hidden shadow-2xl">
                <div className="p-6 border-b border-gray-800 flex justify-between items-center">
                  <div className="flex items-center space-x-3">
                    <div className="bg-blue-600 p-2.5 rounded-xl text-white">
                      <Printer className="w-6 h-6" />
                    </div>
                    <div>
                      <h3 className="text-xl font-bold text-white">Centre d'Impression & Export PDF</h3>
                      <p className="text-xs text-gray-400">Choisissez le modèle exact et les options à inclure sur votre document</p>
                    </div>
                  </div>
                  <button onClick={() => setIsPrintModalOpen(false)} className="text-gray-400 hover:text-white p-1">
                    <X className="w-6 h-6" />
                  </button>
                </div>

                <div className="p-6 space-y-5 max-h-[78vh] overflow-y-auto">
                  {/* 1. CHOIX DU MODÈLE DE DOCUMENT */}
                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-2.5">
                      1. Quel document souhaitez-vous imprimer ?
                    </label>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                      {[
                        { id: 'ag_complete', title: "Rapport complet d'AG", desc: "Synthèse par catégorie + soldes des comptes + signatures" },
                        { id: 'balance_category', title: "Bilan détaillé par Catégorie", desc: "Chaque catégorie avec le détail de ses opérations" },
                        { id: 'balance_supplier', title: "Bilan par Fournisseur / Tiers", desc: "Total et détail des sommes versées par fournisseur" },
                        { id: 'ledger_full', title: "Journal complet (Livre de Comptes)", desc: "Toutes les écritures de la période choisie par date" },
                        { id: 'ledger_filtered', title: "Sélection filtrée actuelle", desc: `Uniquement les ${displayedTransactions.length} écriture(s) filtrées à l'écran` },
                        { id: 'unpointed_only', title: "État de Rapprochement Bancaire", desc: "Liste uniquement les opérations non pointées" },
                        { id: 'missing_receipts', title: "Dépenses sans facture liée", desc: "Liste des dépenses à régulariser (justificatif manquant)" }
                      ].map(opt => (
                        <button
                          key={opt.id}
                          type="button"
                          onClick={() => setPrintConfig(prev => ({ ...prev, reportType: opt.id }))}
                          className={`p-3.5 rounded-2xl border text-left transition-all ${
                            printConfig.reportType === opt.id
                              ? 'bg-blue-600/20 border-blue-500 text-white shadow-lg shadow-blue-600/10'
                              : 'bg-gray-950 hover:bg-gray-800 border-gray-800 text-gray-300'
                          }`}
                        >
                          <div className="font-bold text-sm flex items-center justify-between">
                            <span>{opt.title}</span>
                            {printConfig.reportType === opt.id && <CheckCircle className="w-4 h-4 text-blue-400 flex-shrink-0" />}
                          </div>
                          <p className="text-[11px] text-gray-400 mt-1">{opt.desc}</p>
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* 2. PÉRIMÈTRE DES COMPTES & PÉRIODE */}
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2 border-t border-gray-800">
                    <div>
                      <label className="block text-xs font-semibold text-gray-400 mb-1">Compte à imprimer</label>
                      <select
                        value={printConfig.accountScope}
                        onChange={e => setPrintConfig(prev => ({ ...prev, accountScope: e.target.value }))}
