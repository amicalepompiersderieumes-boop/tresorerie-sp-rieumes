    // --- COMPOSANT LOGO HYBRIDE (0 Ko sur Firebase : lit ./logo.png ou le cache local) ---
    function AmicaleLogo({ size = "md", customLogoData = null, className = "" }) {
      const [fileFailed, setFileFailed] = useState(false);

      useEffect(() => {
        setFileFailed(false);
      }, [customLogoData]);

        md: "w-12 h-12",

      const srcToUse = customLogoData || "./logo.png";

      if (!fileFailed) {
        return (

            alt="Écusson Sapeurs-Pompiers de Rieumes"
            onError={() => setFileFailed(true)}
            className={`${dims} object-contain drop-shadow-md flex-shrink-0 ${className}`}
          />
        );
      }
      return <CrestFallbackSVG className={`${dims} flex-shrink-0 ${className}`} />;

    const Paperclip = ({ className }) => <Icon className={className}><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></Icon>;
    const ExternalLink = ({ className }) => <Icon className={className}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></Icon>;

    const Calendar = ({ className }) => <Icon className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></Icon>;
    const ChevronDown = ({ className }) => <Icon className={className}><path d="m6 9 6 6 6-6"/></Icon>;
    const Users = ({ className }) => <Icon className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Icon>;
    const AlertTriangle = ({ className }) => <Icon className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></Icon>;
    const Shield = ({ className }) => <Icon className={className}><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></Icon>;
    const LogOut = ({ className }) => <Icon className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></Icon>;
    const KeyRound = ({ className }) => <Icon className={className}><path d="M2 18v3c0 .6.4 1 1 1h4v-3h3v-3h2l1.4-1.4a6.5 6.5 0 1 0-4-4Z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></Icon>;
    const FolderOpen = ({ className }) => <Icon className={className}><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></Icon>;
    const Save = ({ className }) => <Icon className={className}><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></Icon>;
    const Eye = ({ className }) => <Icon className={className}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></Icon>;
    const Clock = ({ className }) => <Icon className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Icon>;
    const Smartphone = ({ className }) => <Icon className={className}><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></Icon>;
    const Monitor = ({ className }) => <Icon className={className}><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></Icon>;

    // --- CONFIGURATION FIREBASE & GOOGLE DRIVE ---
    const DEFAULT_FIREBASE_URL = "https://tresorerie-amicale-sp-rieumes-default-rtdb.europe-west1.firebasedatabase.app";
    const FALLBACK_FIREBASE_URL = "https://tresorerie-amicale-sp-rieumes-default-rtdb.firebaseio.com";
    const DEFAULT_DRIVE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwI5A9Z3dYq_CyW3eQ3RDI1ZCF_ouQT4ixI6_6wRnFdH_GISy1M7BfsmKWDhoKudWaT/exec";
    const DEFAULT_DRIVE_FOLDER_URL = "https://drive.google.com/drive/folders/1hyiduyNvaFfImmuW80JHGhbqXXVUa0t2";
    const INTERNAL_TRANSFER_CATEGORY = "Virement interne";
    const EXPECTED_VAULT_KEY = "vault_sp_51a9496ee31d9c64";

    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyBcuKj1O1fwG6ftZYvzeY8R2THiHvVxzRs",
      authDomain: "tresorerie-amicale-sp-rieumes.firebaseapp.com",
      databaseURL: DEFAULT_FIREBASE_URL,
      projectId: "tresorerie-amicale-sp-rieumes"
    };

    const mainFirebaseApp = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
    const firebaseAuth = mainFirebaseApp.auth();
    const mainDb = mainFirebaseApp.database();

    const ROLE_META = {
      admin: { label: 'Administrateur', short: 'Admin', badgeClass: 'bg-red-500/15 text-red-300 border-red-500/30', avatarClass: 'bg-red-600 text-white' },
      treasurer: { label: 'Trésorier', short: 'Trésorier', badgeClass: 'bg-blue-500/15 text-blue-300 border-blue-500/30', avatarClass: 'bg-blue-600 text-white' },
      viewer: { label: 'Lecture seule', short: 'Lecture seule', badgeClass: 'bg-gray-700/60 text-gray-300 border-gray-600', avatarClass: 'bg-gray-600 text-white' }
    };

    const getFirstName = (fullName, email) => {
      const clean = (fullName || '').trim();
      const raw = clean ? clean : ((email || '').split('@')[0] || 'Membre');
      const firstPart = raw.split(/[\s._]+/)[0] || raw;
      return firstPart
        .split('-')
        .map(part => part ? part.charAt(0).toUpperCase() + part.slice(1).toLowerCase() : '')
        .join('-');
    };

    const detectDeviceLabel = () => {
      const ua = navigator.userAgent || '';
      if (/iPad|Tablet/i.test(ua)) return 'Tablette';
      if (/Mobi|Android|iPhone|iPod/i.test(ua)) return 'Téléphone';
      return 'Ordinateur';
    };

    // --- HELPER : FUSION INTELLIGENTE MULTI-APPAREILS (ANTI-ÉCRASEMENT) ---
    const smartMergeById = (localArr = [], cloudArr = [], deletedSet = new Set(), uniqueNameField = null) => {
      const map = new Map();
      (cloudArr || []).forEach(item => {
        if (item && item.id && !deletedSet.has(String(item.id))) {
          map.set(String(item.id), item);
        }
      });
      (localArr || []).forEach(item => {
        if (item && item.id && !deletedSet.has(String(item.id))) {
          const id = String(item.id);
          const existing = map.get(id);
          if (!existing) {
            if (uniqueNameField && item[uniqueNameField]) {
              const dup = Array.from(map.values()).find(
                x => (x[uniqueNameField] || '').trim().toLowerCase() === (item[uniqueNameField] || '').trim().toLowerCase()
              );
              if (dup) return;
            }
            map.set(id, item);
          } else {
            const localMod = item.lastModified || 0;
            const cloudMod = existing.lastModified || 0;
            if (localMod >= cloudMod) {
              map.set(id, { ...existing, ...item });
            }
          }
        }
      });
      return Array.from(map.values());
    };

    // --- HELPER : GÉNÉRATION DU NOM DE FICHIER "facture_nom_du_tiers_numero" ---
    const buildInvoiceFileName = (file, tierOrFallback = '') => {
      const originalName = (file && file.name) ? file.name : '';
      let ext = '';
      if (originalName.includes('.')) {
        ext = '.' + originalName.split('.').pop().toLowerCase();
      } else if (file && file.type) {
        if (file.type.includes('pdf')) ext = '.pdf';
        else if (file.type.includes('png')) ext = '.png';
        else if (file.type.includes('webp')) ext = '.webp';
        else if (file.type.includes('jpeg') || file.type.includes('jpg') || file.type.includes('image')) ext = '.jpg';
      }
      if (!ext) ext = '.jpg';

      const rawTier = (tierOrFallback || '').trim() || 'tiers';
      const cleanTier = rawTier
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-zA-Z0-9]/g, '_')
        .replace(/_+/g, '_')
        .replace(/^_|_$/g, '') || 'tiers';

      const now = new Date();
      const datePart = now.toISOString().slice(0, 10).replace(/-/g, '');
      const randPart = Math.floor(1000 + Math.random() * 9000);
      const uniqueNum = `${datePart}-${randPart}`;

      return `facture_${cleanTier}_${uniqueNum}${ext}`;
    };

    // --- HELPER : ENVOI ROBUSTE VERS GOOGLE DRIVE (AVEC SOUS-DOSSIER ANNÉE + SOUS-DOSSIER FOURNISSEUR / TIERS) ---
    const uploadFileToGoogleDrive = async (file, scriptUrl, tierOrFallback = '', yearFolder = '') => {
      const cleanUrl = (scriptUrl || '').trim();
      if (!cleanUrl.startsWith('https://script.google.com/macros/s/') || !cleanUrl.endsWith('/exec')) {
        throw new Error("L'URL du script doit commencer par https://script.google.com/macros/s/... et finir par /exec");
      }

      const targetYear = (yearFolder || '').toString().trim() || new Date().getFullYear().toString();
      const targetSupplierFolder = (tierOrFallback || '')
        .toString()
        .trim()
        .replace(/[\\/:*?"<>|]/g, '-') || 'Autres_Tiers';

      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = async (ev) => {
          try {
            const base64Content = ev.target.result.split(',')[1];
            const finalFileName = buildInvoiceFileName(file, targetSupplierFolder);

            const payload = JSON.stringify({
              fileName: finalFileName,
              yearFolder: targetYear,
              supplierFolder: targetSupplierFolder,
              subFolderPath: `${targetYear}/${targetSupplierFolder}`,
              mimeType: file.type || 'application/octet-stream',
              base64: base64Content
            });

            const response = await fetch(cleanUrl, {
              method: 'POST',
              redirect: 'follow',
              body: payload
            });

            const rawText = await response.text();
            let resData = null;
            try {
              resData = JSON.parse(rawText);
            } catch (jsonErr) {
              if (rawText.includes('<!DOCTYPE html>') || rawText.includes('Google Accounts')) {
                throw new Error("Autorisation Google manquante : dans script.google.com, exécutez 'autoriserMonDrive' puis refaites 'Déployer > Nouveau déploiement' avec 'Qui peut accéder : Tout le monde'.");
              }
              throw new Error("Réponse inattendue de Google : " + rawText.substring(0, 120));
            }

            if (resData && resData.status === 'success' && resData.url) {
              resolve({
                url: resData.url,
                name: resData.name || finalFileName,
                folder: resData.folder || `${targetYear}`,
                scriptVersion: resData.version || 1
              });
            } else {
              reject(new Error(resData?.message || "Vérifiez l'ID du dossier Drive dans votre script Google."));
            }
          } catch (err) {
            reject(err);
          }
        };
        reader.onerror = () => reject(new Error("Erreur de lecture du fichier sur l'appareil"));
        reader.readAsDataURL(file);
      });
    };

    // --- HELPER : SAUVEGARDE .JSON DIRECTEMENT DANS GOOGLE DRIVE (Trésorier > Sauvegarde > Année) ---
    const uploadBackupJsonToGoogleDrive = async (backupObject, scriptUrl, targetYear = '') => {
      const cleanUrl = (scriptUrl || '').trim();
      if (!cleanUrl.startsWith('https://script.google.com/macros/s/') || !cleanUrl.endsWith('/exec')) {
        throw new Error("Configurez d'abord l'URL du script Google Drive dans les Paramètres.");
      }

      const now = new Date();
      const dateStr = now.toISOString().split('T')[0];
      const timeStr = `${String(now.getHours()).padStart(2, '0')}h${String(now.getMinutes()).padStart(2, '0')}`;
      const yearStr = (targetYear || now.getFullYear()).toString().trim();
      const fileName = `sauvegarde_tresorerie_${dateStr}_${timeStr}.json`;

      const jsonString = JSON.stringify(backupObject, null, 2);
      const base64Content = btoa(unescape(encodeURIComponent(jsonString)));

      const payload = JSON.stringify({
        isBackup: true,
        fileName,
        yearFolder: yearStr,
        supplierFolder: `Sauvegardes_${yearStr}`,
        subFolderPath: `Sauvegarde/${yearStr}`,
        mimeType: 'application/json',
        base64: base64Content
      });

      const response = await fetch(cleanUrl, {
        method: 'POST',
        redirect: 'follow',
        body: payload
      });

      const rawText = await response.text();
      let resData = null;
      try {
        resData = JSON.parse(rawText);
      } catch (e) {
        throw new Error("Réponse inattendue de Google Drive lors de la sauvegarde JSON.");
      }

      if (resData && resData.status === 'success') {
        return {
          url: resData.url,
          name: resData.name || fileName,
          folder: resData.folder || `Trésorier / Sauvegarde / ${yearStr}`,
          scriptVersion: resData.version || 1
        };
      }
      throw new Error(resData?.message || "Erreur lors de l'enregistrement de la sauvegarde sur Google Drive.");
    };

    // --- COMPOSANT : Liste déroulante de recherche intelligente ---
    function AutocompleteInput({ value, onChange, options, placeholder, className, required, direction = 'down' }) {
      const [isOpen, setIsOpen] = useState(false);
      const safeValue = value || '';
      const filteredOptions = options.filter(opt => opt.toLowerCase().includes(safeValue.toLowerCase()));

      const dropdownPositionClasses = direction === 'up'
        ? 'bottom-full mb-1.5 shadow-[0_-10px_25px_-5px_rgba(0,0,0,0.6)]'
        : 'top-full mt-1 shadow-2xl';

      return (
        <div className="relative w-full">
          <input 
            type="text" 
            required={required}
            className={className}
            value={safeValue} 
            onChange={(e) => { onChange(e.target.value); setIsOpen(true); }}
            onFocus={() => setIsOpen(true)}
            onBlur={() => setTimeout(() => setIsOpen(false), 180)}
            placeholder={placeholder}
          />
          {isOpen && filteredOptions.length > 0 && (
            <ul className={`absolute z-[200] w-full bg-gray-800 border border-gray-600 rounded-xl max-h-52 overflow-y-auto left-0 text-sm ${dropdownPositionClasses}`}>
              {filteredOptions.map((opt, i) => (
                <li 
                  key={i} 
                  className="px-3.5 py-2.5 text-gray-200 hover:bg-red-600 hover:text-white cursor-pointer border-b border-gray-700/50 last:border-0 transition-colors"
                  onMouseDown={(e) => { e.preventDefault(); onChange(opt); setIsOpen(false); }}
                >
                  {opt}
                </li>
              ))}
            </ul>
          )}
        </div>
      );
    }

        const file = e.target.files[0];

        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 220;
            let w = img.width;
            let h = img.height;
            if (w > h && w > maxDim) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else if (h >= w && h > maxDim) {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/png', 0.85);
            localStorage.setItem('sp_rieumes_custom_logo', dataUrl);
            setCustomLogoData(dataUrl);
            setLogoMsg("✅ Écusson mémorisé dans cet appareil (0 Ko utilisé sur Firebase) !");

          img.src = ev.target.result;

      useEffect(() => {

        const unsubscribeAuth = firebaseAuth.onAuthStateChanged(async (user) => {
          if (profileRef) { profileRef.off(); profileRef = null; }
          if (usersListRef) { usersListRef.off(); usersListRef = null; }
          if (presenceListRef) { presenceListRef.off(); presenceListRef = null; }

            const usersSnap = await mainDb.ref('users').once('value');

        connectedRef.on('value', onConnected);

          mainDb.ref('login_logs').push({

            email: authUser.email || '',

          }).catch(() => {});

          connectedRef.off('value', onConnected);

      const handleClearLoginLogs = async () => {
        if (!isAdmin) return;

      const handleEmailLogin = async (e) => {
        e.preventDefault();
        setLoginError('');
        setLoginInfo('');
        setIsLoggingIn(true);
        try {
          await firebaseAuth.signInWithEmailAndPassword(loginEmail.trim(), loginPassword);
          setLoginPassword('');
        } catch (err) {
          if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
            setLoginError("Adresse e-mail ou mot de passe incorrect.");
          } else if (err.code === 'auth/too-many-requests') {
            setLoginError("Trop de tentatives. Réessayez dans quelques minutes ou réinitialisez votre mot de passe.");
          } else if (err.code === 'auth/invalid-email') {
            setLoginError("Format d'adresse e-mail invalide.");
          } else {
            setLoginError("Erreur de connexion : " + (err.message || err.code));
          }
        }
        setIsLoggingIn(false);

      const handleForgotPassword = async () => {
        const email = loginEmail.trim();
        setLoginError('');
        setLoginInfo('');
        if (!email) {
          setLoginError("Saisissez d'abord votre adresse e-mail ci-dessus pour recevoir le lien de réinitialisation.");
          return;
        }
        try {
          await firebaseAuth.sendPasswordResetEmail(email);
          setLoginInfo(`✅ Un e-mail de réinitialisation vient d'être envoyé à ${email} (pensez à vérifier vos spams).`);
        } catch (err) {
          setLoginError("Impossible d'envoyer l'e-mail : vérifiez l'adresse saisie.");
        }
      };

      const handleLogout = async () => {
        if (authUser?.uid) {
          try {
            await mainDb.ref(`presence/${authUser.uid}`).set({
              online: false,
              device: detectDeviceLabel(),
              name: currentUserDisplayName,
              email: authUser.email || '',

        await firebaseAuth.signOut();

        const cleanName = newUserForm.name.trim();
        const cleanEmail = newUserForm.email.trim().toLowerCase();
        const cleanPwd = newUserForm.password;
        if (!cleanName || !cleanEmail || cleanPwd.length < 6) {
          setUserAdminMsg({ type: 'error', text: "Renseignez un prénom/nom, un e-mail valide et un mot de passe d'au moins 6 caractères." });
          return;
        }
        setIsCreatingUser(true);
        setUserAdminMsg({ type: 'info', text: "Création du compte sur les serveurs Google Firebase..." });
        let secondaryApp = null;
        try {
          secondaryApp = firebase.initializeApp(FIREBASE_CONFIG, 'userCreator_' + Date.now());
          const cred = await secondaryApp.auth().createUserWithEmailAndPassword(cleanEmail, cleanPwd);
          const newUid = cred.user.uid;
          await secondaryApp.auth().signOut();
          await secondaryApp.delete();
          secondaryApp = null;

          await mainDb.ref(`users/${newUid}`).set({
            uid: newUid,
            name: cleanName,
            email: cleanEmail,
            role: newUserForm.role,
            active: true,
            createdAt: new Date().toISOString(),
            createdBy: currentUserDisplayName

          if (secondaryApp) {
            try { await secondaryApp.delete(); } catch (_) {}

          if (err.code === 'auth/email-already-in-use') {
            setUserAdminMsg({ type: 'error', text: "Cette adresse e-mail possède déjà un compte Firebase." });

              }).catch(() => {});

          } else {
            const nowIso = new Date().toISOString();
            hasInitialCloudSyncCompleted.current = true;
            if (canEditCompta) {
              saveCallback({
                transactions: cur.transactions,

                categories: cur.categories,
                suppliers: cur.suppliers,

                closedYears: cur.closedYears,

        };

        const connectSmart = async () => {
          setCloudStatus(navigator.onLine ? 'connecting' : 'offline');
          setCloudErrorDetail('');

          const urlsToTry = [cleanUrl];
          if (cleanUrl === DEFAULT_FIREBASE_URL) urlsToTry.push(FALLBACK_FIREBASE_URL);

          const pathsToTry = [
            `coffre_fort/${EXPECTED_VAULT_KEY}`,
            `coffre_fort/vault_sp_51a9496e7121b924`,
            `tresorerie_amicale`
          ];

          const idToken = firebaseAuth.currentUser ? await firebaseAuth.currentUser.getIdToken().catch(() => '') : '';

          for (const baseUrl of urlsToTry) {
            for (const path of pathsToTry) {
              if (isCancelled) return;
              try {
                const authParam = idToken ? `&auth=${encodeURIComponent(idToken)}` : '';
                const testResp = await fetch(`${baseUrl}/${path}.json?t=${Date.now()}${authParam}`, { cache: 'no-store' });
                if (testResp.ok) {
                  const initialData = await testResp.json();
                  activeRestUrl.current = `${baseUrl}/${path}`;
                  setCloudStatus('connected');

                  try {
                    const db = (baseUrl === DEFAULT_FIREBASE_URL)
                      ? mainDb
                      : firebase.initializeApp({ ...FIREBASE_CONFIG, databaseURL: baseUrl }, 'fb_alt_' + Date.now()).database();
                    const ref = db.ref(path);
                    activeRef = ref;
                    dbRef.current = ref;

                    onValueChange = ref.on('value', (snapshot) => {
                      if (isCancelled) return;
                      setCloudStatus('connected');
                      applyCloudData(snapshot.val(), (payload) => writeDataToCloud(payload));
                    });
                  } catch (sdkErr) {
                    console.warn("SDK WebSocket indisponible en local, mode HTTPS actif :", sdkErr);
                  }

                  applyCloudData(initialData, (payload) => writeDataToCloud(payload));
                  return;
                } else if (testResp.status === 401 || testResp.status === 403) {
                  setCloudErrorDetail('Accès refusé par les règles Firebase');
                }
              } catch (netErr) {
                console.warn("Tentative échouée sur", baseUrl, path, netErr);
              }
            }
          }

          if (!isCancelled) {
            setCloudStatus(navigator.onLine ? 'error' : 'offline');
          }
        };

        connectSmart();

        return () => {
          isCancelled = true;
          if (activeRef && onValueChange) {
            activeRef.off('value', onValueChange);
          }
        };
      }, [firebaseDbUrl, isAuthenticated, canEditCompta]);

      // Sauvegarde automatique dans le navigateur ET dans le Cloud
      useEffect(() => {

        localStorage.setItem('sp_rieumes_categories', JSON.stringify(categories));
        localStorage.setItem('sp_rieumes_suppliers', JSON.stringify(suppliers));
        localStorage.setItem('sp_rieumes_automations', JSON.stringify(automations));
        localStorage.setItem('sp_rieumes_closedYears', JSON.stringify(closedYears));
        localStorage.setItem('sp_rieumes_manuallyOpenedYears', JSON.stringify(manuallyOpenedYears));

              closedYears,

      }, [transactions, accounts, categories, suppliers, automations, closedYears, manuallyOpenedYears, deletedIds, driveScriptUrl, driveFolderUrl, treasurerName, presidentName, isAuthenticated, canEditCompta]);

      const forcePushToCloud = async (explicitDriveUrl, explicitFolderUrl) => {
        if (!canEditCompta) return;

        const urlToSave = explicitDriveUrl !== undefined ? explicitDriveUrl : (driveScriptUrl || localStorage.getItem('sp_rieumes_drive_script_url') || '');
        const folderToSave = explicitFolderUrl !== undefined ? explicitFolderUrl : (driveFolderUrl || DEFAULT_DRIVE_FOLDER_URL);
        try {

            const token = firebaseAuth.currentUser ? await firebaseAuth.currentUser.getIdToken().catch(() => '') : '';
            const authParam = token ? `&auth=${encodeURIComponent(token)}` : '';
            const r = await fetch(`${activeRestUrl.current}.json?t=${Date.now()}${authParam}`, { cache: 'no-store' });
            if (r.ok) cloudSnap = await r.json();
          }
          const mergedDeleted = Array.from(new Set([
            ...(deletedIds || []).map(String),
            ...((cloudSnap && cloudSnap.deletedIds) || []).map(String)
          ])).slice(-1000);

        return transactions
          .filter(tx => tx.date.startsWith(currentYear))
          .filter(tx => currentAccountId === 'all' || tx.accountId === currentAccountId)
          .sort((a, b) => new Date(b.date) - new Date(a.date));
      }, [transactions, currentYear, currentAccountId]);

      // A. Compteurs et liste filtrée pour le Livre de Comptes (Recherche + Filtres rapides)
      const unpointedCount = useMemo(() => {
        return filteredTransactions.filter(tx => !tx.reconciled).length;
      }, [filteredTransactions]);

      const missingReceiptCount = useMemo(() => {
        return filteredTransactions.filter(tx => tx.type === 'expense' && !tx.isInternalTransfer && tx.category !== INTERNAL_TRANSFER_CATEGORY && !tx.receiptUrl).length;
      }, [filteredTransactions]);

      const displayedTransactions = useMemo(() => {
        return filteredTransactions.filter(tx => {
          if (quickFilter === 'unpointed' && tx.reconciled) return false;
          if (quickFilter === 'missing_receipt') {
            const isRealExpense = tx.type === 'expense' && !tx.isInternalTransfer && tx.category !== INTERNAL_TRANSFER_CATEGORY;
            if (!isRealExpense || tx.receiptUrl) return false;
          }
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase().trim();
            const desc = (tx.description || '').toLowerCase();
            const sup = (tx.supplier || '').toLowerCase();
            const cat = (tx.category || '').toLowerCase();
            const chk = (tx.checkNumber || '').toLowerCase();
            const amt = (tx.amount !== undefined ? tx.amount.toString() : '');
            const dateFr = new Date(tx.date).toLocaleDateString('fr-FR');
            return desc.includes(q) || sup.includes(q) || cat.includes(q) || chk.includes(q) || amt.includes(q) || dateFr.includes(q);
          }
          return true;
        });
      }, [filteredTransactions, quickFilter, searchQuery]);

      const isCurrentYearClosed = closedYears.includes(currentYear);

      // --- CALCUL EN TEMPS RÉEL DU STOCKAGE & QUOTAS (FIREBASE / GITHUB / DRIVE) ---
      const storageMetrics = useMemo(() => {
        const payloadObj = {
          transactions,
          accounts,
          categories,
          suppliers,
          automations,
          closedYears,
          manuallyOpenedYears,
          deletedIds,
          driveScriptUrl,
          treasurerName,
          presidentName
        };
        const jsonStr = JSON.stringify(payloadObj);
        const bytes = new Blob([jsonStr]).size;
        const kb = (bytes / 1024).toFixed(2);
        const mb = (bytes / (1024 * 1024)).toFixed(4);
        const firebaseLimitBytes = 1024 * 1024 * 1024; // 1 Go gratuit sur Firebase Realtime DB
        const firebasePercent = Math.min(100, (bytes / firebaseLimitBytes) * 100);
        const avgTxBytes = 320;
        const remainingInstallations = Math.max(0, Math.floor((firebaseLimitBytes - bytes) / avgTxBytes));

        const embeddedFilesCount = transactions.filter(t => (t.receiptUrl || '').startsWith('data:')).length;
        const driveLinksCount = transactions.filter(t => t.receiptUrl && !(t.receiptUrl || '').startsWith('data:')).length;

        // Estimation taille du dépôt GitHub (index.html ~115 Ko + logo.png ~85 Ko = ~210 Ko sur 1 Go autorisé)
        const githubEstimatedKb = githubLiveSizeKb || 210;
        const githubPercent = (githubEstimatedKb / (1024 * 1024)) * 100;

        // Calcul de la bande passante mensuelle GitHub Pages (Quota gratuit = 100 Go / mois = 102 400 Mo)
        const monthlyLoads = (githubMonthlyStats && githubMonthlyStats.loads) ? githubMonthlyStats.loads : 1;
        const pageWeightKb = 210; // index.html + logo.png
        const bandwidthUsedMb = ((monthlyLoads * pageWeightKb) / 1024).toFixed(2);
        const bandwidthLimitGb = 100;
        const bandwidthRemainingGb = Math.max(0, bandwidthLimitGb - (monthlyLoads * pageWeightKb) / (1024 * 1024)).toFixed(4);
        const bandwidthPercent = Math.min(100, ((monthlyLoads * pageWeightKb) / (100 * 1024 * 1024)) * 100);
        const remainingLoadsThisMonth = Math.floor((100 * 1024 * 1024) / pageWeightKb) - monthlyLoads;

        // Extraction de l'ID du projet Firebase pour créer le lien direct vers la console
        let firebaseProjectId = 'tresorerie-amicale-sp-rieumes';
        const matchProj = (firebaseDbUrl || '').match(/https:\/\/([a-zA-Z0-9-]+)-default-rtdb/);
        if (matchProj && matchProj[1]) firebaseProjectId = matchProj[1];

        return {
          bytes,
          kb,
          mb,
          firebasePercent,
          remainingInstallations,
          embeddedFilesCount,
          driveLinksCount,
          githubEstimatedKb,
          githubPercent,
          monthlyLoads,
          bandwidthUsedMb,
          bandwidthRemainingGb,
          bandwidthPercent,
          remainingLoadsThisMonth,
          firebaseConsoleUrl: `https://console.firebase.google.com/project/${firebaseProjectId}/database`
        };
      }, [transactions, accounts, categories, suppliers, automations, closedYears, manuallyOpenedYears, deletedIds, driveScriptUrl, treasurerName, presidentName, firebaseDbUrl, githubMonthlyStats, githubLiveSizeKb]);

      const balances = useMemo(() => {
        let pointed = 0;
        let unpointed = 0;
        const relevantTransactions = currentAccountId === 'all' 
          ? transactions 
          : transactions.filter(tx => tx.accountId === currentAccountId);

        relevantTransactions.forEach(tx => {
          const modifier = tx.type === 'income' ? 1 : -1;
          if (tx.reconciled) pointed += tx.amount * modifier;
          else unpointed += tx.amount * modifier;
        });
        return { pointed, unpointed, theoretical: pointed + unpointed };
      }, [transactions, currentAccountId]);

      const accountBalances = useMemo(() => {
        const balancesByAccount = {};
        accounts.forEach(acc => {
          balancesByAccount[acc.id] = { pointed: 0, unpointed: 0, theoretical: 0 };
        });

        transactions.forEach(tx => {
          if (balancesByAccount[tx.accountId]) {
            const modifier = tx.type === 'income' ? 1 : -1;
            if (tx.reconciled) balancesByAccount[tx.accountId].pointed += tx.amount * modifier;
            else balancesByAccount[tx.accountId].unpointed += tx.amount * modifier;
            balancesByAccount[tx.accountId].theoretical += tx.amount * modifier;
          }
        });
        return balancesByAccount;
      }, [transactions, accounts]);

      // G. Soldes des comptes arrêtés au 31/12 de l'exercice sélectionné (pour le rapport d'AG)
      const endOfYearAccountBalances = useMemo(() => {
        const res = {};
        accounts.forEach(acc => {
          res[acc.id] = { pointed: 0, theoretical: 0 };
        });
        const cutoff = `${currentYear}-12-31`;
        transactions.forEach(tx => {
          if (tx.date <= cutoff && res[tx.accountId]) {
            const mod = tx.type === 'income' ? 1 : -1;
            if (tx.reconciled) res[tx.accountId].pointed += tx.amount * mod;
            res[tx.accountId].theoretical += tx.amount * mod;
          }
        });
        return res;
      }, [transactions, accounts, currentYear]);

      // Comptabilisation complète de toutes les opérations (y compris les virements internes) dans le Bilan Annuel et le Rapport d'AG
      const categorySummary = useMemo(() => {
        const summary = {};
        categories.forEach(cat => {
          summary[cat.name] = { income: 0, expense: 0, total: 0 };
        });
        
        filteredTransactions.forEach(tx => {
          const catName = tx.category || 'Non catégorisé';
          if (!summary[catName]) {
            summary[catName] = { income: 0, expense: 0, total: 0 };
          }
          if (tx.type === 'income') {
            summary[catName].income += tx.amount;
            summary[catName].total += tx.amount;
          } else {
            summary[catName].expense += tx.amount;
            summary[catName].total -= tx.amount;
          }
        });
        return summary;
      }, [filteredTransactions, categories]);

      const supplierSummary = useMemo(() => {
        const summary = {};
        suppliers.forEach(sup => {
          summary[sup.name] = { income: 0, expense: 0, total: 0 };
        });
        
        filteredTransactions.forEach(tx => {
          const supName = (tx.supplier || '').trim() || 'Non renseigné';
          if (!summary[supName]) {
            summary[supName] = { income: 0, expense: 0, total: 0 };
          }
          if (tx.type === 'income') {
            summary[supName].income += tx.amount;
            summary[supName].total += tx.amount;
          } else {
            summary[supName].expense += tx.amount;
            summary[supName].total -= tx.amount;
          }
        });
        return summary;
      }, [filteredTransactions, suppliers]);

      const activeSummary = balanceGroupBy === 'category' ? categorySummary : supplierSummary;

      const reportANouveau = useMemo(() => {
        const relevantTransactions = currentAccountId === 'all' 
          ? transactions 
          : transactions.filter(tx => tx.accountId === currentAccountId);

        return relevantTransactions
          .filter(tx => tx.date.localeCompare(`${currentYear}-01-01`) < 0)
          .reduce((acc, tx) => acc + (tx.type === 'income' ? tx.amount : -tx.amount), 0);
      }, [transactions, currentAccountId, currentYear]);

      const currentAccountName = useMemo(() => {
        if (currentAccountId === 'all') return 'Tous les comptes';
        return accounts.find(a => a.id === currentAccountId)?.name || 'Compte';
      }, [accounts, currentAccountId]);

      const orderedAccountsForPrint = useMemo(() => {
        if (currentAccountId === 'all') return accounts;
        const active = accounts.find(a => a.id === currentAccountId);
        const others = accounts.filter(a => a.id !== currentAccountId);
        return active ? [active, ...others] : accounts;
      }, [accounts, currentAccountId]);

      const openPrintCenter = (defaultReportType = 'ag_complete') => {
        setPrintConfig(prev => ({
          ...prev,
          reportType: defaultReportType,
          accountScope: currentAccountId,
          dateFrom: `${currentYear}-01-01`,
          dateTo: `${currentYear}-12-31`,
          signatureDate: new Date().toISOString().split('T')[0]
        }));
        setIsPrintModalOpen(true);
      };

      const formattedSignatureDate = useMemo(() => {
        if (!printConfig.signatureDate) return new Date().toLocaleDateString('fr-FR');
        const parts = printConfig.signatureDate.split('-');
        return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : printConfig.signatureDate;
      }, [printConfig.signatureDate]);

      const printReportData = useMemo(() => {
        const start = printConfig.dateFrom || `${currentYear}-01-01`;
        const end = printConfig.dateTo || `${currentYear}-12-31`;
        const scopeAccName = printConfig.accountScope === 'all'
          ? 'Tous les comptes (Cumul global)'
          : (accounts.find(a => a.id === printConfig.accountScope)?.name || 'Compte');

        const accFilter = (tx) => printConfig.accountScope === 'all' || tx.accountId === printConfig.accountScope;

        let baseTxs = [];
        if (printConfig.reportType === 'ledger_filtered') {
          baseTxs = [...displayedTransactions];
        } else {
          baseTxs = transactions
            .filter(tx => accFilter(tx) && tx.date >= start && tx.date <= end)
            .sort((a, b) => new Date(a.date) - new Date(b.date));
        }

        if (printConfig.reportType === 'unpointed_only') {
          baseTxs = baseTxs.filter(tx => !tx.reconciled);
        } else if (printConfig.reportType === 'missing_receipts') {
          baseTxs = baseTxs.filter(tx => tx.type === 'expense' && !tx.isInternalTransfer && tx.category !== INTERNAL_TRANSFER_CATEGORY && !tx.receiptUrl);
        }

        const reportBefore = transactions
          .filter(tx => accFilter(tx) && tx.date < start)
          .reduce((acc, tx) => acc + (tx.type === 'income' ? tx.amount : -tx.amount), 0);

        let totalInc = 0;
        let totalExp = 0;
        const catMap = {};
        const supMap = {};

        baseTxs.forEach(tx => {
          if (tx.type === 'income') totalInc += tx.amount;
          else totalExp += tx.amount;

          const cName = tx.category || 'Non catégorisé';
          if (!catMap[cName]) catMap[cName] = { income: 0, expense: 0, total: 0, txs: [] };
          if (tx.type === 'income') { catMap[cName].income += tx.amount; catMap[cName].total += tx.amount; }
          else { catMap[cName].expense += tx.amount; catMap[cName].total -= tx.amount; }
          catMap[cName].txs.push(tx);

          const sName = (tx.supplier || '').trim() || 'Non renseigné';
          if (!supMap[sName]) supMap[sName] = { income: 0, expense: 0, total: 0, txs: [] };
          if (tx.type === 'income') { supMap[sName].income += tx.amount; supMap[sName].total += tx.amount; }
          else { supMap[sName].expense += tx.amount; supMap[sName].total -= tx.amount; }
          supMap[sName].txs.push(tx);
        });

        const totalNet = totalInc - totalExp;
        const finalBalance = reportBefore + totalNet;

        return {
          start,
          end,
          scopeAccName,
          baseTxs,
          reportBefore,
          totalInc,
          totalExp,
          totalNet,
          finalBalance,
          catEntries: Object.entries(catMap).sort((a, b) => a[0].localeCompare(b[0])),
          supEntries: Object.entries(supMap).sort((a, b) => a[0].localeCompare(b[0]))
        };
      }, [printConfig, currentYear, accounts, transactions, displayedTransactions]);

      const triggerAutomation = (auto) => {
        if (!canEditCompta) return;
        const txDate = auto.nextDate || new Date().toISOString().split('T')[0];
        const uniqueId = Date.now().toString() + '_' + Math.random().toString(36).slice(2, 6);
        setTransactions(prev => [{
          id: uniqueId,
          createdBy: currentUserFirstName,
          updatedBy: currentUserFirstName,
          lastModified: Date.now(),
          type: auto.type,
          amount: auto.amount,
          description: auto.description,
          supplier: auto.supplier || '',
          category: auto.category,
          date: txDate,
          accountId: auto.accountId,
          paymentMethod: auto.paymentMethod || 'Prélèvement',
          checkNumber: null,
          receiptUrl: null,
          receiptName: null,
          reconciled: false
        }, ...prev]);

        const nextDateObj = new Date(txDate);
        if (auto.frequency === 'yearly') {
          nextDateObj.setFullYear(nextDateObj.getFullYear() + 1);
        } else {
          nextDateObj.setMonth(nextDateObj.getMonth() + 1);
        }
        const nextDateStr = nextDateObj.toISOString().split('T')[0];
        setAutomations(prev => prev.map(a => a.id === auto.id ? { ...a, nextDate: nextDateStr, lastModified: Date.now() } : a));
        showToast(`Écriture générée : ${auto.description}`, 'success');
      };

      const addTransaction = (tx) => {
        if (!canEditCompta) return;
        ensureCategoryAndSupplierExist(tx.category, tx.supplier);
        const uniqueId = Date.now().toString() + '_' + Math.random().toString(36).slice(2, 6);
        setTransactions(prev => [{
          ...tx,
          id: uniqueId,
          createdBy: currentUserFirstName,
          updatedBy: currentUserFirstName,
          lastModified: Date.now()
        }, ...prev]);
        setIsAddModalOpen(false);
      };

      // B. Fonction d'ajout d'un Virement Interne (crée les 2 écritures simultanément)
      const addInternalTransfer = ({ fromAccountId, toAccountId, amount, date, description, paymentMethod, reconciled }) => {
        if (!canEditCompta) return;
        const fromAcc = accounts.find(a => a.id === fromAccountId)?.name || 'Compte source';
        const toAcc = accounts.find(a => a.id === toAccountId)?.name || 'Compte destination';
        const baseId = Date.now().toString();
        const now = Date.now();
        const cleanDesc = (description || '').trim();

        const txOut = {
          id: `${baseId}_out`,
          transferPairId: baseId,
          isInternalTransfer: true,
          createdBy: currentUserFirstName,
          updatedBy: currentUserFirstName,
          lastModified: now,
          type: 'expense',
          amount: parseFloat(amount),
          description: cleanDesc ? `${cleanDesc} (Vers ${toAcc})` : `Virement interne vers ${toAcc}`,
          supplier: toAcc,
          category: INTERNAL_TRANSFER_CATEGORY,
          date,
          accountId: fromAccountId,
          paymentMethod: paymentMethod || 'Virement',
          checkNumber: null,
          receiptUrl: null,
          receiptName: null,
          reconciled: !!reconciled
        };

        const txIn = {
          id: `${baseId}_in`,
          transferPairId: baseId,
          isInternalTransfer: true,
          createdBy: currentUserFirstName,
          updatedBy: currentUserFirstName,
          lastModified: now,
          type: 'income',
          amount: parseFloat(amount),
          description: cleanDesc ? `${cleanDesc} (Depuis ${fromAcc})` : `Virement interne depuis ${fromAcc}`,
          supplier: fromAcc,
          category: INTERNAL_TRANSFER_CATEGORY,
          date,
          accountId: toAccountId,
          paymentMethod: paymentMethod || 'Virement',
          checkNumber: null,
          receiptUrl: null,
          receiptName: null,
          reconciled: !!reconciled
        };

        setTransactions(prev => [txIn, txOut, ...prev]);
        setIsTransferModalOpen(false);
      };

      const handleEditTransaction = (updatedTx) => {
        if (!canEditCompta) return;
        ensureCategoryAndSupplierExist(updatedTx.category, updatedTx.supplier);
        setTransactions(prev => prev.map(tx => tx.id === updatedTx.id ? { ...updatedTx, updatedBy: currentUserFirstName, lastModified: Date.now() } : tx));
        setEditModalTx(null);
      };

      const handleUpdateReceipt = (txId, newReceiptUrl, newReceiptName, updatedSupplier) => {
        if (!canEditCompta) return;
        if (updatedSupplier) {
          ensureCategoryAndSupplierExist('', updatedSupplier);
        }
        setTransactions(prev => prev.map(tx => 
          tx.id === txId 
            ? { 
                ...tx, 
                receiptUrl: newReceiptUrl || null, 
                receiptName: newReceiptName || null,
                supplier: updatedSupplier !== undefined ? updatedSupplier : tx.supplier,
                updatedBy: currentUserFirstName,
                lastModified: Date.now() 
              } 
            : tx
        ));
        setReceiptModalTx(null);
      };

      const deleteTransaction = (id) => {
        if (!canEditCompta) return;
        setDeletedIds(prev => Array.from(new Set([...prev, String(id)])));
        setTransactions(prev => prev.filter(tx => tx.id !== id));
        setDeleteConfirmTx(null);
      };

      const toggleReconciled = (id) => {
        if (!canEditCompta) return;
        setTransactions(prev => prev.map(tx => 
          tx.id === id ? { ...tx, reconciled: !tx.reconciled, updatedBy: currentUserFirstName, lastModified: Date.now() } : tx
        ));
      };

      const handleInlineDriveFile = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const tierLabel = (inlineTx.supplier || '').trim() || (inlineTx.description || '').trim() || 'tiers';
        const txYear = (inlineTx.date || '').split('-')[0] || currentYear;
        if (driveScriptUrl) {
          setInlineTx(prev => ({ ...prev, uploadingInlineDrive: true }));
          try {
            const res = await uploadFileToGoogleDrive(file, driveScriptUrl, tierLabel, txYear);
            setInlineTx(prev => ({
              ...prev,
              receiptUrl: res.url,
              receiptName: res.name,
              uploadingInlineDrive: false,
              showReceiptInput: false
            }));
          } catch (err) {
            showToast("Erreur d'envoi vers Google Drive : " + err.message, "error");
            setInlineTx(prev => ({ ...prev, uploadingInlineDrive: false }));
          }
        } else {
          if (file.size > 1500000) {
            showToast("Fichier > 1,5 Mo : configurez la passerelle Google Drive dans les Paramètres.", "error");
            return;
          }
          const reader = new FileReader();
          reader.onload = (ev) => {
            setInlineTx(prev => ({
              ...prev,
              receiptUrl: ev.target.result,
              receiptName: buildInvoiceFileName(file, tierLabel),
              showReceiptInput: false
            }));
          };
          reader.readAsDataURL(file);
        }
      };

      const handleInlineSubmit = () => {
        if (!canEditCompta) return;
        if (!inlineTx.amount || !inlineTx.description || !inlineTx.accountId) return;
        const chosenCategory = (inlineTx.category || '').trim() || (categories[0]?.name || 'Autre');
        ensureCategoryAndSupplierExist(chosenCategory, inlineTx.supplier);

        const newTx = {

          accountId: inlineTx.accountId,

          receiptName: inlineTx.receiptName || null,

        };
        setTransactions(prev => [newTx, ...prev]);
        setInlineTx(prev => ({ ...prev, description: '', supplier: '', category: '', amount: '', checkNumber: '', receiptUrl: '', receiptName: '', showReceiptInput: false }));
      };

      const openNextYear = () => {
        const maxYear = Math.max(...availableYears.map(Number));
        const nextYear = (maxYear + 1).toString();
        if (!manuallyOpenedYears.includes(nextYear)) {
          setManuallyOpenedYears(prev => [...prev, nextYear]);
        }
        setClosedYears(prev => prev.filter(y => y !== nextYear));
        return nextYear;
      };

      const deleteYear = (year) => {
        if (transactions.some(tx => tx.date.startsWith(year))) return;
        setManuallyOpenedYears(prev => prev.filter(y => y !== year));
        setClosedYears(prev => prev.filter(y => y !== year));
        if (currentYear === year) {
          setCurrentYear(new Date().getFullYear().toString());
        }
      };

      const addAutomation = (automation) => {
        ensureCategoryAndSupplierExist(automation.category, automation.supplier);
        const uniqueId = Date.now().toString() + '_' + Math.random().toString(36).slice(2, 6);
        setAutomations(prev => [...prev, { ...automation, id: uniqueId, lastModified: Date.now() }]);
        setIsAddAutomationOpen(false);
      };

      const deleteAutomation = (id) => {
        setDeletedIds(prev => Array.from(new Set([...prev, String(id)])));
        setAutomations(prev => prev.filter(a => a.id !== id));
      };

      const addAccount = (e) => {
        e.preventDefault();
        if (newAccountName.trim()) {
          setAccounts(prev => [...prev, { id: 'acc_' + Date.now(), name: newAccountName.trim(), lastModified: Date.now() }]);
          setNewAccountName('');
        }
      };

      const deleteAccount = (id) => {
        if (accounts.length > 1) {
          setDeletedIds(prev => Array.from(new Set([...prev, String(id)])));
          setAccounts(prev => prev.filter(a => a.id !== id));
          if (currentAccountId === id) setCurrentAccountId('all');
        }
      };

      const addCategory = (e) => {
        e.preventDefault();
        if (newCategoryName.trim()) {
          setCategories(prev => [...prev, { id: 'cat_' + Date.now(), name: newCategoryName.trim(), lastModified: Date.now() }]);
          setNewCategoryName('');
        }
      };

      const deleteCategory = (id) => {
        if (categories.length > 1) {
          setDeletedIds(prev => Array.from(new Set([...prev, String(id)])));
          setCategories(prev => prev.filter(c => c.id !== id));
        }
      };

      const addSupplier = (e) => {
        e.preventDefault();
        if (newSupplierName.trim()) {
          setSuppliers(prev => [...prev, { id: 'sup_' + Date.now(), name: newSupplierName.trim(), lastModified: Date.now() }]);
          setNewSupplierName('');
        }
      };

      const deleteSupplier = (id) => {
        setDeletedIds(prev => Array.from(new Set([...prev, String(id)])));
        setSuppliers(prev => prev.filter(s => s.id !== id));
      };

      const toggleYearClosure = (year) => {
        if (closedYears.includes(year)) {
          setClosedYears(prev => prev.filter(y => y !== year));
        } else {
          setClosedYears(prev => [...prev, year]);
        }
      };

      const exportCSV = () => {
        const separator = ';';
        let csvContent = '\uFEFF'; 
        csvContent += `BILAN FINANCIER ${currentYear} - Amicale SP Rieumes\n\n`;
        csvContent += `RÉSUMÉ PAR CATÉGORIE\n`;
        csvContent += `Catégorie${separator}Recettes${separator}Dépenses${separator}Solde\n`;
        
        Object.entries(categorySummary).forEach(([cat, data]) => {
          csvContent += `${cat}${separator}${data.income.toString().replace('.', ',')}${separator}${data.expense.toString().replace('.', ',')}${separator}${data.total.toString().replace('.', ',')}\n`;
        });

        csvContent += `\nRÉSUMÉ PAR FOURNISSEUR / TIERS\n`;
        csvContent += `Fournisseur / Tiers${separator}Recettes${separator}Dépenses${separator}Solde\n`;
        Object.entries(supplierSummary).forEach(([sup, data]) => {
          if (data.income > 0 || data.expense > 0) {
            csvContent += `${sup}${separator}${data.income.toString().replace('.', ',')}${separator}${data.expense.toString().replace('.', ',')}${separator}${data.total.toString().replace('.', ',')}\n`;
          }
        });
        
        const totalInc = Object.values(categorySummary).reduce((acc, curr) => acc + curr.income, 0);
        const totalExp = Object.values(categorySummary).reduce((acc, curr) => acc + curr.expense, 0);
        const totalSolde = Object.values(categorySummary).reduce((acc, curr) => acc + curr.total, 0);
        
        csvContent += `\nTOTAL DES MOUVEMENTS${separator}${totalInc.toString().replace('.', ',')}${separator}${totalExp.toString().replace('.', ',')}${separator}${totalSolde.toString().replace('.', ',')}\n`;
        csvContent += `Report à nouveau${separator}${separator}${separator}${reportANouveau.toString().replace('.', ',')}\n`;
        csvContent += `SOLDE FINAL (Avec report)${separator}${separator}${separator}${(reportANouveau + totalSolde).toString().replace('.', ',')}\n\n\n`;
        csvContent += `DÉTAIL DES OPÉRATIONS\n`;
        const headers = ['Date', 'Compte', 'Libellé', 'Fournisseur / Tiers', 'Catégorie', 'Mode', 'N° Chèque', 'Type', 'Montant', 'Pointé', 'Justificatif'];
        csvContent += headers.join(separator) + '\n';

        const rows = filteredTransactions.map(tx => [
          new Date(tx.date).toLocaleDateString('fr-FR'),
          accounts.find(a => a.id === tx.accountId)?.name || '-',
          `"${(tx.description || '').replace(/"/g, '""')}"`,
          `"${(tx.supplier || '-').replace(/"/g, '""')}"`,
          tx.category,
          tx.paymentMethod || '-',
          tx.checkNumber ? `"${tx.checkNumber}"` : '-',
          tx.type === 'income' ? 'Recette' : 'Dépense',
          tx.amount.toString().replace('.', ','),
          tx.reconciled ? 'Oui' : 'Non',
          tx.receiptUrl ? `"${tx.receiptUrl.startsWith('data:') ? (tx.receiptName || 'Fichier joint') : tx.receiptUrl}"` : '-'
        ]);
        csvContent += rows.map(e => e.join(separator)).join("\n");
          
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `Bilan_SP_Rieumes_${currentYear}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const exportBackup = () => {
        const nowIso = new Date().toISOString();
        const data = { transactions, accounts, categories, suppliers, automations, closedYears, manuallyOpenedYears, deletedIds, driveScriptUrl, treasurerName, presidentName, exportDate: nowIso };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `sauvegarde_tresorerie_${nowIso.split('T')[0]}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        localStorage.setItem('sp_rieumes_last_json_backup', nowIso);
        setLastJsonBackupAt(nowIso);
        setDismissBackupReminder(true);
      };

      // Sauvegarde centralisée dans Google Drive (Trésorier > Sauvegarde > Année) + copie PC optionnelle
      const exportBackupToDrive = async (alsoDownloadOnPc = true) => {
        const nowIso = new Date().toISOString();
        const backupPayload = {
          transactions,
          accounts,
          categories,
          suppliers,
          automations,
          closedYears,
          manuallyOpenedYears,
          deletedIds,
          driveScriptUrl,
          treasurerName,
          presidentName,
          exportDate: nowIso
        };

        if (alsoDownloadOnPc) {
          exportBackup();
        }

        const activeScriptUrl = (driveScriptUrl || localStorage.getItem('sp_rieumes_drive_script_url') || '').trim();
        if (!activeScriptUrl) {
          setBackupDriveMsg({
            type: 'error',
            text: "Copie enregistrée sur cet appareil. Pour l'envoyer aussi sur le Drive de l'Amicale, collez l'URL du script Google Drive plus haut."
          });
          return;
        }

        setIsBackingUpToDrive(true);
        setBackupDriveMsg({
          type: 'info',
          text: `Envoi de la sauvegarde vers Google Drive (Trésorier > Sauvegarde > ${currentYear})...`
        });

        try {
          const res = await uploadBackupJsonToGoogleDrive(backupPayload, activeScriptUrl, currentYear);
          localStorage.setItem('sp_rieumes_last_json_backup', nowIso);
          setLastJsonBackupAt(nowIso);
          setDismissBackupReminder(true);
          setIsBackingUpToDrive(false);

          const isV3 = Number(res.scriptVersion) >= 3 || (res.folder || '').includes('Trésorier');
          const msg = isV3
            ? `✅ Sauvegarde centralisée sur Google Drive dans "${res.folder}" (${res.name}) !`
            : `✅ Sauvegarde envoyée sur Drive (${res.name} dans "${res.folder}").`;
          setBackupDriveMsg({ type: 'success', text: msg });
          showToast(`Sauvegarde envoyée sur Drive (${res.name}) !`, 'success');
        } catch (err) {
          setIsBackingUpToDrive(false);
          setBackupDriveMsg({
            type: 'error',
            text: "Erreur d'envoi Drive : " + err.message
          });
          showToast("Erreur sauvegarde Drive : " + err.message, 'error');
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.transactions && data.accounts) setRestoreData(data);
          } catch (err) {
            console.error("Erreur de lecture", err);
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const confirmRestore = () => {
        if (restoreData) {
          setTransactions(restoreData.transactions || []);
          setAccounts(restoreData.accounts || []);
          setCategories(restoreData.categories || []);
          if (restoreData.suppliers) setSuppliers(restoreData.suppliers);
          setAutomations(restoreData.automations || []);
          setClosedYears(restoreData.closedYears || []);
          setManuallyOpenedYears(restoreData.manuallyOpenedYears || []);
          setDeletedIds(restoreData.deletedIds || []);
          if (restoreData.driveScriptUrl) {
            setDriveScriptUrl(restoreData.driveScriptUrl);
            setTempDriveScriptUrl(restoreData.driveScriptUrl);
          }
          if (restoreData.treasurerName) setTreasurerName(restoreData.treasurerName);
          if (restoreData.presidentName) setPresidentName(restoreData.presidentName);
          setRestoreData(null);
        }
      };

      const handleNavClick = (tabId) => {
        setActiveTab(tabId);
        setIsMobileMenuOpen(false);
        if (tabId === 'transactions' && !hasSelectedAccountOnce) {
          setIsAccountPickerOpen(true);
        }
      };

      const navItems = [
        { id: 'dashboard', label: 'Tableau de Bord', icon: LayoutDashboard },
        { id: 'transactions', label: 'Livre de Comptes', icon: List },
        { id: 'balance', label: 'Bilan Annuel', icon: FileText },
        ...(canEditCompta ? [
          { id: 'automations', label: 'Automatisations', icon: Repeat },
          { id: 'settings', label: 'Paramètres', icon: Settings }
        ] : [])
      ];

      useEffect(() => {
        if (isViewer && (activeTab === 'automations' || activeTab === 'settings')) {
          setActiveTab('dashboard');
        }
        if (!isAdmin && (settingsSubTab === 'users' || settingsSubTab === 'tech')) {
          setSettingsSubTab('compta');
        }
      }, [isViewer, isAdmin, activeTab, settingsSubTab]);

      const onlineUsersCount = useMemo(() => {
        return Object.values(onlinePresence).filter(p => p && p.online === true).length;
      }, [onlinePresence]);

      if (authLoading) {
        return (
          <div className="min-h-screen bg-gray-950 flex flex-col">
            <div className="tricolor-bar w-full"></div>
            <div className="flex-1 flex flex-col items-center justify-center p-4 space-y-4">
              <AmicaleLogo size="lg" customLogoData={customLogoData} />
              <p className="text-sm text-gray-300 font-medium animate-pulse">Vérification de votre session sécurisée...</p>
            </div>
          </div>
        );
      }

      if (authUser && userProfile && userProfile.active === false) {
        return (
          <div className="min-h-screen bg-gray-950 flex flex-col">
            <div className="tricolor-bar w-full"></div>
            <div className="flex-1 flex flex-col items-center justify-center p-4">
              <div className="bg-gray-900 border border-red-500/40 p-8 rounded-3xl w-full max-w-md shadow-2xl text-center space-y-5">
                <div className="mx-auto w-14 h-14 rounded-2xl bg-red-500/15 border border-red-500/30 flex items-center justify-center text-red-400">
                  <Lock className="w-7 h-7" />
                </div>
                <h2 className="text-xl font-extrabold text-white">
                  {userProfile.pendingApproval ? "Compte en attente d'activation" : "Accès désactivé"}
                </h2>
                <p className="text-sm text-gray-300">
                  {userProfile.pendingApproval
                    ? `Le compte (${authUser.email}) n'a pas encore de rôle attribué. Demandez à l'Administrateur de vous ajouter dans Paramètres > Utilisateurs.`
                    : `Votre accès à la trésorerie de l'Amicale (${authUser.email}) a été suspendu par l'Administrateur.`}
                </p>
                <button
                  onClick={handleLogout}
                  className="w-full bg-gray-800 hover:bg-gray-700 text-white font-bold py-3.5 px-4 rounded-xl transition-colors flex items-center justify-center space-x-2"
                >
                  <LogOut className="w-4 h-4" />
                  <span>Se déconnecter</span>
                </button>
              </div>
            </div>
          </div>
        );
      }

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-gray-950 flex flex-col">
            <div className="tricolor-bar w-full"></div>
            <div className="flex-1 flex flex-col items-center justify-center p-4">
              <div className="bg-gray-900 border border-gray-800 p-8 rounded-3xl w-full max-w-md shadow-2xl flex flex-col items-center relative overflow-hidden">
                <div className="mb-4 p-2 rounded-2xl bg-gray-950/60 border border-gray-800 shadow-inner">
                  <AmicaleLogo size="lg" customLogoData={customLogoData} />
                </div>
                <h1 className="text-2xl font-extrabold text-white mb-1 text-center tracking-tight">Sapeurs-Pompiers de Rieumes</h1>
                <p className="text-red-400 mb-6 text-center text-xs font-bold uppercase tracking-widest">Trésorerie de l'Amicale • Accès Sécurisé</p>
                <form onSubmit={handleEmailLogin} className="w-full space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-gray-400 mb-1.5">Adresse e-mail</label>
                    <input
                      type="email"
                      required
                      autoComplete="email"
                      placeholder="votre.nom@exemple.fr"
                      value={loginEmail}
                      onChange={(e) => setLoginEmail(e.target.value)}
                      className="w-full bg-gray-950 border border-gray-700 rounded-xl p-3.5 text-white outline-none focus:border-red-500 transition-all text-sm"
                    />
                  </div>
                  <div>
                    <div className="flex items-center justify-between mb-1.5">
                      <label className="block text-xs font-semibold text-gray-400">Mot de passe personnel</label>
                      <button type="button" onClick={handleForgotPassword} className="text-xs text-blue-400 hover:text-blue-300 hover:underline">
                        Mot de passe oublié ?
                      </button>
                    </div>
                    <input
                      type="password"
                      required
                      autoComplete="current-password"
                      placeholder="••••••••"
                      value={loginPassword}
                      onChange={(e) => setLoginPassword(e.target.value)}
                      className={`w-full bg-gray-950 border ${loginError ? 'border-red-500' : 'border-gray-700'} rounded-xl p-3.5 text-white outline-none focus:border-red-500 transition-all text-sm`}
                    />
                  </div>
                  {loginError && <p className="text-red-400 text-xs bg-red-500/10 border border-red-500/30 p-3 rounded-xl font-medium">{loginError}</p>}
                  {loginInfo && <p className="text-emerald-400 text-xs bg-emerald-500/10 border border-emerald-500/30 p-3 rounded-xl font-medium">{loginInfo}</p>}
                  <button
                    type="submit"
                    disabled={isLoggingIn}
                    className="w-full bg-red-600 hover:bg-red-700 disabled:opacity-50 text-white font-bold py-3.5 px-4 rounded-xl transition-colors flex items-center justify-center shadow-lg shadow-red-600/20"
                  >
                    <Lock className="w-5 h-5 mr-2" />
                    <span>{isLoggingIn ? 'Connexion sécurisée...' : 'Se connecter à la trésorerie'}</span>
                  </button>
                </form>
                <p className="text-[11px] text-gray-500 mt-5 text-center">
                  Authentification protégée par Google Firebase • Accès nominatif
                </p>
              </div>
            </div>
          </div>
        );
      }

      const roleStyle = ROLE_META[userRole] || ROLE_META.viewer;

      return (
        <div className="min-h-screen bg-gray-950 text-gray-100 font-sans">
          <div className="tricolor-bar w-full print:hidden"></div>

          {/* NOTIFICATION TOAST DISCRÈTE */}
          {toastMsg && (
            <div className="fixed bottom-5 right-5 z-[300] print:hidden max-w-sm">
              <div className={`px-4 py-3 rounded-2xl border shadow-2xl text-xs font-bold flex items-center space-x-2.5 ${
                toastMsg.type === 'success' ? 'bg-emerald-950/95 border-emerald-500/50 text-emerald-200' :
                toastMsg.type === 'error' ? 'bg-red-950/95 border-red-500/50 text-red-200' :
                'bg-gray-900/95 border-blue-500/50 text-blue-200'
              }`}>
                <span className="flex-1">{toastMsg.text}</span>
                <button onClick={() => setToastMsg(null)} className="opacity-70 hover:opacity-100"><X className="w-4 h-4" /></button>
              </div>
            </div>
          )}

          <div className="flex h-[calc(100vh-4px)] overflow-hidden print:hidden">
            {/* SIDEBAR DESKTOP */}
            <aside className="hidden md:flex w-64 flex-col bg-gray-900 border-r border-gray-800 print:hidden">
              <div className="p-5 flex items-center space-x-3 border-b border-gray-800/80">
                <AmicaleLogo size="md" customLogoData={customLogoData} />
                <div>
                  <h1 className="text-base font-extrabold text-white tracking-tight leading-tight">Amicale SP</h1>
                  <p className="text-xs text-red-400 font-bold uppercase tracking-wider mt-0.5">Rieumes • 1947</p>
                </div>
              </div>

              {/* ENCART PERSONNEL UTILISATEUR CONNECTÉ */}
              <div className="mx-3 mt-4 p-3.5 rounded-2xl bg-gray-950/80 border border-gray-800 space-y-2.5">
                <div className="flex items-center space-x-3">
                  <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-extrabold text-base flex-shrink-0 shadow ${roleStyle.avatarClass}`}>
                    {currentUserFirstName.charAt(0).toUpperCase()}
                  </div>
                  <div className="min-w-0 flex-1">
                    <p className="text-xs font-extrabold text-white truncate">Bonjour {currentUserFirstName} 👋</p>
                    <span className={`inline-flex items-center text-[10px] font-bold px-2 py-0.5 rounded-full border mt-1 ${roleStyle.badgeClass}`}>
                      {isAdmin && <Shield className="w-2.5 h-2.5 mr-1" />}
                      {isViewer && <Eye className="w-2.5 h-2.5 mr-1" />}
                      {roleStyle.label}
                    </span>
                  </div>
                </div>
                <div className="flex items-center gap-1.5 pt-2 border-t border-gray-800/80">
                  <button
                    onClick={() => setIsPasswordModalOpen(true)}
                    className="flex-1 flex items-center justify-center space-x-1 bg-gray-900 hover:bg-gray-800 text-gray-300 hover:text-white text-[11px] font-medium py-1.5 px-2 rounded-lg border border-gray-800 transition-colors"
                    title="Changer mon mot de passe"
                  >
                    <KeyRound className="w-3 h-3" />
                    <span>Mot de passe</span>
                  </button>
                  <button
                    onClick={handleLogout}
                    className="flex items-center justify-center bg-gray-900 hover:bg-red-600/20 text-gray-400 hover:text-red-400 p-1.5 rounded-lg border border-gray-800 transition-colors"
                    title="Se déconnecter"
                  >
                    <LogOut className="w-3.5 h-3.5" />
                  </button>
                </div>
              </div>

              <nav className="flex-1 px-4 py-4 space-y-2">
                {navItems.map((item) => (
                  <button key={item.id} onClick={() => handleNavClick(item.id)} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all ${activeTab === item.id ? 'bg-red-600 text-white shadow-md shadow-red-600/10' : 'text-gray-400 hover:bg-gray-800 hover:text-white'}`}>
                    <item.icon className="w-5 h-5" />
                    <span className="font-medium">{item.label}</span>
                  </button>
                ))}
              </nav>
              <div className="p-4 space-y-3 border-t border-gray-800">
                <div className={`flex flex-col items-center justify-center p-2.5 rounded-xl text-xs font-medium border ${
                  cloudStatus === 'connected' && !pendingOfflineSync ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' :
                  cloudStatus === 'offline' || pendingOfflineSync ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' :
                  cloudStatus === 'error' ? 'bg-red-500/10 text-red-400 border-red-500/20' :
                  'bg-gray-800 text-gray-400 border-gray-700'
                }`}>
                  <div className="flex items-center space-x-2">
                    <span className={`w-2 h-2 rounded-full ${
                      cloudStatus === 'connected' && !pendingOfflineSync ? 'bg-emerald-400 animate-pulse' :
                      cloudStatus === 'offline' || pendingOfflineSync ? 'bg-amber-400 animate-pulse' :
                      cloudStatus === 'error' ? 'bg-red-500' : 'bg-yellow-400 animate-pulse'
                    }`}></span>
                    <span>
                      {cloudStatus === 'connected' && !pendingOfflineSync ? 'Synchronisé (Fusion active)' :
                       pendingOfflineSync ? 'Sauvegardé sur PC (Attente réseau)' :
                       cloudStatus === 'offline' ? 'Hors-ligne (Sauvegarde PC active)' :
                       cloudStatus === 'error' ? 'Mode Local (Vérifier Règles)' :
                       'Connexion Firebase...'}
                    </span>
                  </div>
                  {pendingOfflineSync && cloudStatus === 'connected' && (
                    <button onClick={() => forcePushToCloud()} className="mt-1.5 text-[11px] underline text-amber-300 hover:text-white">
                      Fusionner maintenant
                    </button>
                  )}
                </div>
                <p className="text-xs text-gray-500 text-center font-medium">
                  © {new Date().getFullYear()} - Amicale SP Rieumes<br/>Laurent Basque
                </p>
              </div>
            </aside>

            {/* HEADER MOBILE */}
            <div className="md:hidden fixed top-1 left-0 right-0 h-16 bg-gray-900 border-b border-gray-800 flex items-center justify-between px-4 z-40 print:hidden">
              <div className="flex items-center space-x-2.5 overflow-hidden mr-2">
                 <AmicaleLogo size="sm" customLogoData={customLogoData} />
                 <h1 className="text-base font-bold text-white truncate">Amicale SP Rieumes</h1>
              </div>
              <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="text-gray-400 flex-shrink-0">
                {isMobileMenuOpen ? <X className="w-6 h-6" /> : <Menu className="w-6 h-6" />}
              </button>
            </div>

            {isMobileMenuOpen && (
              <div className="md:hidden fixed inset-0 top-16 bg-gray-900 z-30 flex flex-col p-4 print:hidden">
                 <div className="mb-4 p-3.5 rounded-2xl bg-gray-950 border border-gray-800 flex items-center justify-between">
                   <div className="flex items-center space-x-3">
                     <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-extrabold ${roleStyle.avatarClass}`}>
                       {currentUserFirstName.charAt(0).toUpperCase()}
                     </div>
                     <div>
                       <p className="text-sm font-extrabold text-white">Bonjour {currentUserFirstName} 👋</p>
                       <span className={`inline-block text-[10px] font-bold px-2 py-0.5 rounded-full border mt-0.5 ${roleStyle.badgeClass}`}>{roleStyle.label}</span>
                     </div>
                   </div>
                   <div className="flex items-center space-x-2">
                     <button onClick={() => { setIsMobileMenuOpen(false); setIsPasswordModalOpen(true); }} className="p-2 bg-gray-800 rounded-lg text-gray-300"><KeyRound className="w-4 h-4" /></button>
                     <button onClick={handleLogout} className="p-2 bg-red-600/20 rounded-lg text-red-400"><LogOut className="w-4 h-4" /></button>
                   </div>
                 </div>
                 <div className="flex-1 space-y-2 overflow-y-auto">
                   {navItems.map((item) => (
                    <button key={item.id} onClick={() => handleNavClick(item.id)} className={`w-full flex items-center space-x-3 px-4 py-4 rounded-xl transition-all ${activeTab === item.id ? 'bg-red-600 text-white' : 'text-gray-400'}`}>
                      <item.icon className="w-5 h-5" />
                      <span className="font-medium text-lg">{item.label}</span>
                    </button>
                  ))}
                 </div>
              </div>
            )}

            {/* CONTENU PRINCIPAL */}
            <main className="flex-1 flex flex-col h-full overflow-hidden w-full pt-16 md:pt-0">
              <header className="bg-gray-900/50 backdrop-blur-sm border-b border-gray-800 p-4 flex flex-col sm:flex-row justify-between items-center z-10 print:hidden space-y-3 sm:space-y-0">
                <div className="flex flex-wrap sm:flex-nowrap gap-3 w-full sm:w-auto">
                  <button 
                    onClick={() => setIsAccountPickerOpen(true)}
                    className="flex items-center justify-between space-x-3 bg-gray-800 hover:bg-gray-750 border border-gray-700 hover:border-red-500/50 text-white px-4 py-2.5 rounded-xl transition-all shadow-sm flex-1 sm:flex-initial group"
                  >
                    <div className="flex items-center space-x-2.5">
                      <div className="bg-red-500/10 text-red-400 p-1.5 rounded-lg group-hover:bg-red-600 group-hover:text-white transition-colors">
                        <CreditCard className="w-4 h-4" />
                      </div>
                      <div className="text-left">
                        <span className="block text-[10px] uppercase tracking-wider text-gray-400 font-semibold leading-none mb-0.5">Compte actif</span>
                        <span className="text-sm font-bold text-white">{currentAccountName}</span>
                      </div>
                    </div>
                    <ChevronDown className="w-4 h-4 text-gray-400 group-hover:text-white transition-colors" />
                  </button>

                  <button 
                    onClick={() => setIsYearPickerOpen(true)}
                    className="flex items-center justify-between space-x-3 bg-gray-800 hover:bg-gray-750 border border-gray-700 hover:border-red-500/50 text-white px-4 py-2.5 rounded-xl transition-all shadow-sm group"
                  >
                    <div className="flex items-center space-x-2.5">
                      <div className="bg-blue-500/10 text-blue-400 p-1.5 rounded-lg group-hover:bg-blue-600 group-hover:text-white transition-colors">
                        <Calendar className="w-4 h-4" />
                      </div>
                      <div className="text-left">
                        <span className="block text-[10px] uppercase tracking-wider text-gray-400 font-semibold leading-none mb-0.5">Exercice</span>
                        <span className="text-sm font-bold text-white flex items-center gap-1.5">
                          {currentYear}
                          {isCurrentYearClosed && <Lock className="w-3.5 h-3.5 text-yellow-500" />}
                        </span>
                      </div>
                    </div>
                    <ChevronDown className="w-4 h-4 text-gray-400 group-hover:text-white transition-colors" />
                  </button>
                </div>

                {/* ACTIONS RAPIDES DU BANDEAU (DRIVE, SAUVEGARDE, VIREMENT, OPÉRATION) */}
                <div className="flex flex-wrap sm:flex-nowrap items-center gap-2 w-full sm:w-auto justify-end">
                  {canEditCompta && (
                    <>
                      <a
                        href={driveFolderUrl || DEFAULT_DRIVE_FOLDER_URL}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="flex items-center justify-center space-x-1.5 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-amber-300 hover:text-amber-200 px-3 py-2.5 rounded-xl text-xs font-bold transition-colors"
                        title="Ouvrir le dossier Google Drive de l'Amicale"
                      >
                        <FolderOpen className="w-4 h-4" />
