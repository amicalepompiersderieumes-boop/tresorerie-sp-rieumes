                                  </p>
                                </div>
                                <Circle className="w-8 h-8 text-yellow-500/20" />
                              </div>

                              <div className="bg-gray-950 border border-gray-800/80 p-4 rounded-xl flex justify-between items-center">
                                <div>
                                  <p className="text-xs text-gray-400 mb-0.5">Solde Théorique Final</p>
                                  <p className={`text-2xl font-bold ${balances.theoretical >= 0 ? 'text-white' : 'text-red-400'}`}>
                                    {formatCurrency(balances.theoretical)}
                                  </p>
                                </div>
                                <LayoutDashboard className="w-8 h-8 text-gray-500/20" />
                              </div>
                            </div>
                          </div>

                          <div className="bg-gray-900 border border-gray-800 rounded-2xl shadow-sm">
                            <div className="p-6 border-b border-gray-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                              <div>
                                <h2 className="text-xl font-bold text-white">Livre de Comptes ({currentYear})</h2>
                                <p className="text-xs text-gray-400 mt-0.5">{filteredTransactions.length} opération(s) affichée(s)</p>
                              </div>
                              <div className="w-full sm:w-64">
                                <input 
                                  type="text" 
                                  placeholder="Rechercher (libellé, fournisseur...)" 
                                  value={searchQuery}
                                  onChange={(e) => setSearchQuery(e.target.value)}
                                  className="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white outline-none focus:border-red-500"
                                />
                              </div>
                            </div>
                            <div className="overflow-x-auto">
                              <table className="w-full text-sm text-left text-gray-300">
                                <thead className="text-xs text-gray-400 uppercase bg-gray-950 border-b border-gray-800">
                                  <tr>
                                    <th className="px-3 py-3">Date</th>
                                    <th className="px-3 py-3">Compte</th>
                                    <th className="px-3 py-3">Libellé</th>
                                    <th className="px-3 py-3">Fournisseur / Tiers</th>
                                    <th className="px-3 py-3">Catégorie</th>
                                    <th className="px-3 py-3">Mode</th>
                                    <th className="px-3 py-3 text-right">Montant</th>
                                    <th className="px-3 py-3 text-center">Pointé</th>
                                    <th className="px-3 py-3 text-center print:hidden"><Paperclip className="w-4 h-4 mx-auto"/></th>
                                    <th className="px-3 py-3 text-center print:hidden">Actions</th>
                                  </tr>
                                </thead>
                                <tbody>
                                  {!isCurrentYearClosed && (
                                    <tr className="bg-gray-800/40 border-b border-gray-700 print:hidden">
                                      <td className="px-3 py-3"><input type="date" value={inlineTx.date} onChange={e => setInlineTx({...inlineTx, date: e.target.value})} className="bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-white w-full outline-none" /></td>
                                      <td className="px-3 py-3">{currentAccountId === 'all' ? (
                                        <select value={inlineTx.accountId} onChange={e => setInlineTx({...inlineTx, accountId: e.target.value})} className="bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-white w-full outline-none min-w-[105px]">{accounts.map(acc => <option key={acc.id} value={acc.id}>{acc.name}</option>)}</select>
                                      ) : <div className="bg-gray-800/50 border border-gray-700 rounded p-1.5 text-xs text-gray-400 w-full min-w-[105px]">{accounts.find(a => a.id === currentAccountId)?.name}</div>}</td>
                                      <td className="px-3 py-3"><input type="text" placeholder="Nouveau libellé..." value={inlineTx.description} onChange={e => setInlineTx({...inlineTx, description: e.target.value})} className="bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-white w-full outline-none min-w-[130px]" /></td>
                                      <td className="px-3 py-3">
                                        <AutocompleteInput 
                                          value={inlineTx.supplier} 
                                          onChange={val => setInlineTx({...inlineTx, supplier: val})} 
                                          options={suppliers.map(s => s.name)} 
                                          placeholder="Fournisseur..." 
                                          className="bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-white w-full outline-none min-w-[125px]" 
                                        />
                                      </td>
                                      <td className="px-3 py-3">
                                        <AutocompleteInput 
                                          value={inlineTx.category} 
                                          onChange={val => setInlineTx({...inlineTx, category: val})} 
                                          options={categories.map(c => c.name)} 
                                          placeholder="Catégorie..." 
                                          className="bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-white w-full outline-none min-w-[125px]" 
                                        />
                                      </td>
                                      <td className="px-3 py-3">
                                        <div className="flex flex-col space-y-1 min-w-[105px]">
                                          <select value={inlineTx.paymentMethod} onChange={e => setInlineTx({...inlineTx, paymentMethod: e.target.value})} className="bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-white w-full outline-none">
                                            <option value="CB">CB</option>
                                            <option value="Chèque">Chèque</option>
                                            <option value="Prélèvement">Prélèvement</option>
                                            <option value="Virement">Virement</option>
                                            <option value="Espèces">Espèces</option>
                                          </select>
                                          {inlineTx.paymentMethod === 'Chèque' && (
                                            <input type="text" placeholder="N° de chèque" value={inlineTx.checkNumber} onChange={e => setInlineTx({...inlineTx, checkNumber: e.target.value})} className="bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-white w-full outline-none" />
                                          )}
                                        </div>
                                      </td>
                                      <td className="px-3 py-3 text-right min-w-[165px]">
                                        <div className="flex items-center justify-end space-x-1.5">
                                          <select value={inlineTx.type} onChange={e => setInlineTx({...inlineTx, type: e.target.value})} className={`bg-gray-900 border border-gray-700 rounded p-1.5 text-xs outline-none font-bold ${inlineTx.type === 'income' ? 'text-emerald-500' : 'text-red-400'}`}>
                                            <option value="expense">Dépense</option>
                                            <option value="income">Recette</option>
                                          </select>
                                          <input type="number" step="0.01" placeholder="0.00" value={inlineTx.amount} onChange={e => setInlineTx({...inlineTx, amount: e.target.value})} className="bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-white w-20 outline-none text-right font-bold" />
                                        </div>
                                      </td>
                                      <td className="px-3 py-3 text-center">-</td>
                                      <td className="px-3 py-3 text-center">-</td>
                                      <td className="px-3 py-3 text-center">
                                        <button onClick={handleInlineSubmit} disabled={!inlineTx.amount || !inlineTx.description || !inlineTx.category} className="bg-red-600 hover:bg-red-700 disabled:opacity-50 text-white p-2 rounded-lg" title="Ajouter l'opération">
                                          <Plus className="w-4 h-4 mx-auto"/>
                                        </button>
                                      </td>
                                    </tr>
                                  )}
                                  {filteredTransactions.map((tx) => (
                                    <tr key={tx.id} className="bg-gray-900 border-b border-gray-800 hover:bg-gray-800/50">
                                      <td className="px-3 py-3 whitespace-nowrap">{new Date(tx.date).toLocaleDateString('fr-FR')}</td>
                                      <td className="px-3 py-3 whitespace-nowrap">{accounts.find(a => a.id === tx.accountId)?.name || '-'}</td>
                                      <td className="px-3 py-3 font-medium text-gray-200">{tx.description}</td>
                                      <td className="px-3 py-3 whitespace-nowrap">
                                        {tx.supplier ? (
                                          <span className="text-gray-300 text-xs font-medium flex items-center space-x-1.5">
                                            <Store className="w-3 h-3 text-gray-500" />
                                            <span>{tx.supplier}</span>
                                          </span>
                                        ) : <span className="text-gray-600 text-xs">-</span>}
                                      </td>
                                      <td className="px-3 py-3 whitespace-nowrap"><span className="bg-gray-800 text-gray-300 text-xs px-2.5 py-1 rounded-full border border-gray-700">{tx.category}</span></td>
                                      <td className="px-3 py-3 text-sm text-gray-300 whitespace-nowrap">
                                        <span className="block font-medium">{tx.paymentMethod || '-'}</span>
                                        {tx.paymentMethod === 'Chèque' && tx.checkNumber && (
                                          <span className="block text-xs text-gray-500">N° {tx.checkNumber}</span>
                                        )}
                                      </td>
                                      <td className={`px-3 py-3 text-right font-bold whitespace-nowrap ${tx.type === 'income' ? 'text-emerald-500' : 'text-red-400'}`}>{tx.type === 'income' ? '+' : '-'}{formatCurrency(tx.amount)}</td>
                                      <td className="px-3 py-3 text-center">
                                        {isCurrentYearClosed ? (
                                          <div className="flex justify-center">{tx.reconciled ? <CheckCircle className="w-6 h-6 text-gray-500" /> : <Circle className="w-6 h-6 text-gray-600" />}</div>
                                        ) : (
                                          <button onClick={() => toggleReconciled(tx.id, tx.reconciled)} className={`print:hidden ${tx.reconciled ? 'text-emerald-500' : 'text-gray-600'}`}>{tx.reconciled ? <CheckCircle className="w-6 h-6 mx-auto" /> : <Circle className="w-6 h-6 mx-auto" />}</button>
                                        )}
                                      </td>
                                      <td className="px-3 py-3 text-center print:hidden">
                                        {tx.receiptUrl ? (
                                          <a href={tx.receiptUrl} target="_blank" rel="noopener noreferrer" className="text-blue-400 hover:text-blue-300" title="Voir le justificatif"><Paperclip className="w-4 h-4 mx-auto"/></a>
                                        ) : '-'}
                                      </td>
                                      <td className="px-3 py-3 text-center print:hidden">
                                        {!isCurrentYearClosed && (
                                          <div className="flex items-center justify-center space-x-3">
                                            <button onClick={() => setEditModalTx(tx)} className="text-gray-400 hover:text-blue-400" title="Modifier"><Pencil className="w-4 h-4"/></button>
                                            <button onClick={() => deleteTransaction(tx.id)} className="text-gray-400 hover:text-red-500" title="Supprimer"><Trash2 className="w-4 h-4"/></button>
                                          </div>
                                        )}
                                      </td>
                                    </tr>
                                  ))}
                                </tbody>
                              </table>
                            </div>
                          </div>
                        </div>
                      )}

                      {/* BILAN ANNUEL */}
                      {activeTab === 'balance' && (
                        <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 space-y-6">
                          <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 border-b border-gray-800 pb-6">
                            <div>
                              <h2 className="text-xl font-bold text-white">
                                Bilan Financier {currentYear} {balanceGroupBy === 'category' ? '(Par Catégorie)' : '(Par Fournisseur / Tiers)'}
                              </h2>
                              <p className="text-xs text-gray-400 mt-1">Compte : {currentAccountId === 'all' ? 'Tous les comptes' : accounts.find(a => a.id === currentAccountId)?.name}</p>
                            </div>
                            
                            <div className="flex flex-wrap items-center gap-3 print:hidden">
                              {/* Choix du regroupement : Catégorie ou Fournisseur */}
                              <div className="bg-gray-950 p-1 rounded-lg border border-gray-800 flex">
                                <button 
                                  onClick={() => setBalanceGroupBy('category')} 
                                  className={`px-3 py-1.5 rounded-md text-xs font-medium transition-all flex items-center space-x-1.5 ${balanceGroupBy === 'category' ? 'bg-red-600 text-white' : 'text-gray-400 hover:text-white'}`}
                                >
                                  <List className="w-3.5 h-3.5" />
                                  <span>Par Catégorie</span>
                                </button>
                                <button 
                                  onClick={() => setBalanceGroupBy('supplier')} 
                                  className={`px-3 py-1.5 rounded-md text-xs font-medium transition-all flex items-center space-x-1.5 ${balanceGroupBy === 'supplier' ? 'bg-red-600 text-white' : 'text-gray-400 hover:text-white'}`}
                                >
                                  <Store className="w-3.5 h-3.5" />
                                  <span>Par Fournisseur / Tiers</span>
                                </button>
                              </div>

                              {/* Choix Synthèse ou Détaillée */}
                              <div className="bg-gray-950 p-1 rounded-lg border border-gray-800 flex">
                                <button onClick={() => setBalanceViewMode('global')} className={`px-3 py-1.5 rounded-md text-xs font-medium transition-all ${balanceViewMode === 'global' ? 'bg-red-600 text-white' : 'text-gray-400 hover:text-white'}`}>Vue Synthèse</button>
                                <button onClick={() => setBalanceViewMode('detailed')} className={`px-3 py-1.5 rounded-md text-xs font-medium transition-all ${balanceViewMode === 'detailed' ? 'bg-red-600 text-white' : 'text-gray-400 hover:text-white'}`}>Vue Détaillée</button>
                              </div>

                              {balanceGroupBy === 'category' ? (
                                <select value={balanceCategoryFilter} onChange={(e) => setBalanceCategoryFilter(e.target.value)} className="bg-gray-800 border border-gray-700 text-white text-xs rounded-lg p-2.5 outline-none">
                                  <option value="all">Toutes les catégories</option>
                                  {categories.map(cat => <option key={cat.id} value={cat.name}>{cat.name}</option>)}
                                </select>
                              ) : (
                                <select value={balanceSupplierFilter} onChange={(e) => setBalanceSupplierFilter(e.target.value)} className="bg-gray-800 border border-gray-700 text-white text-xs rounded-lg p-2.5 outline-none">
                                  <option value="all">Tous les fournisseurs / tiers</option>
                                  {Object.keys(supplierSummary).map(supName => (
                                    <option key={supName} value={supName}>{supName}</option>
                                  ))}
                                </select>
                              )}

                              <select value={balanceTypeFilter} onChange={(e) => setBalanceTypeFilter(e.target.value)} className="bg-gray-800 border border-gray-700 text-white text-xs rounded-lg p-2.5 outline-none">
                                <option value="all">Recettes & Dépenses</option>
                                <option value="income">Recettes uniquement</option>
                                <option value="expense">Dépenses uniquement</option>
                              </select>

                              <button onClick={exportCSV} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2.5 rounded-lg flex items-center space-x-1.5 font-medium">
                                <Download className="w-4 h-4" /><span>Exporter CSV / Sheets</span>
                              </button>
                              <button onClick={() => window.print()} className="bg-gray-800 hover:bg-gray-700 text-white text-xs px-3 py-2.5 rounded-lg flex items-center space-x-1.5 font-medium">
                                <Printer className="w-4 h-4" /><span>Imprimer</span>
                              </button>
                            </div>
                          </div>

                          <div className="bg-gray-950 p-4 rounded-xl border border-gray-800 flex justify-between items-center">
                            <span className="text-gray-300 font-medium">Report à nouveau (Solde au 01/01/{currentYear})</span>
                            <span className={`text-lg font-bold ${reportANouveau >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>{formatCurrency(reportANouveau)}</span>
                          </div>

                          {balanceViewMode === 'global' ? (
                            <div className="overflow-x-auto">
                              <table className="w-full text-sm text-left text-gray-300">
                                <thead className="bg-gray-950 border-b border-gray-800 text-xs uppercase text-gray-400">
                                  <tr>
                                    <th className="px-6 py-4">{balanceGroupBy === 'category' ? 'Catégorie' : 'Fournisseur / Tiers'}</th>
                                    {(balanceTypeFilter === 'all' || balanceTypeFilter === 'income') && <th className="px-6 py-4 text-right">Recettes</th>}
                                    {(balanceTypeFilter === 'all' || balanceTypeFilter === 'expense') && <th className="px-6 py-4 text-right">Dépenses</th>}
                                    <th className="px-6 py-4 text-right">Solde {balanceGroupBy === 'category' ? 'Catégorie' : 'Fournisseur'}</th>
                                  </tr>
                                </thead>
                                <tbody>
                                  {filteredSummaryEntries.map(([label, data]) => (
                                    <tr key={label} className="border-b border-gray-800 hover:bg-gray-800/30">
                                      <td className="px-6 py-4 font-medium text-white">
                                        {balanceGroupBy === 'supplier' && <Store className="w-3.5 h-3.5 text-red-400 mr-2" />}
                                        {label}
                                      </td>
                                      {(balanceTypeFilter === 'all' || balanceTypeFilter === 'income') && (
                                        <td className="px-6 py-4 text-right text-emerald-500">{data.income > 0 ? formatCurrency(data.income) : '-'}</td>
                                      )}
                                      {(balanceTypeFilter === 'all' || balanceTypeFilter === 'expense') && (
                                        <td className="px-6 py-4 text-right text-red-500">{data.expense > 0 ? formatCurrency(data.expense) : '-'}</td>
                                      )}
                                      <td className={`px-6 py-4 text-right font-bold ${data.total >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>{formatCurrency(data.total)}</td>
                                    </tr>
                                  ))}
                                </tbody>
                                <tfoot className="bg-gray-950 border-t-2 border-gray-700 font-bold text-white">
                                  <tr>
                                    <td className="px-6 py-4">Total de l'exercice {currentYear}</td>
                                    {(balanceTypeFilter === 'all' || balanceTypeFilter === 'income') && (
                                      <td className="px-6 py-4 text-right text-emerald-500">{formatCurrency(sumIncome)}</td>
                                    )}
                                    {(balanceTypeFilter === 'all' || balanceTypeFilter === 'expense') && (
                                      <td className="px-6 py-4 text-right text-red-500">{formatCurrency(sumExpense)}</td>
                                    )}
                                    <td className={`px-6 py-4 text-right ${sumTotal >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>{formatCurrency(sumTotal)}</td>
                                  </tr>
                                </tfoot>
                              </table>
                            </div>
                          ) : (
                            <div className="space-y-4">
                              {filteredSummaryEntries.map(([label, data]) => (
                                <div key={label} className="bg-gray-950 border border-gray-800 rounded-xl overflow-hidden">
                                  <div className="p-4 bg-gray-900/60 border-b border-gray-800 flex justify-between items-center">
                                    <h4 className="font-bold text-white flex items-center">
                                      {balanceGroupBy === 'supplier' && <Store className="w-4 h-4 text-red-400 mr-2" />}
                                      <span>{label}</span>
                                      <span className="text-xs text-gray-500 font-normal ml-2">({data.items.length} opération{data.items.length > 1 ? 's' : ''})</span>
                                    </h4>
                                    <div className="flex space-x-4 text-sm">
                                      {data.income > 0 && <span className="text-emerald-500">+{formatCurrency(data.income)}</span>}
                                      {data.expense > 0 && <span className="text-red-500">-{formatCurrency(data.expense)}</span>}
                                      <span className={`font-bold ${data.total >= 0 ? 'text-white' : 'text-red-400'}`}>= {formatCurrency(data.total)}</span>
                                    </div>
                                  </div>
                                  {data.items.length > 0 ? (
                                    <table className="w-full text-xs text-left text-gray-400">
                                      <tbody>
                                        {data.items.map(item => (
                                          <tr key={item.id} className="border-b border-gray-900 last:border-0 hover:bg-gray-900/30">
                                            <td className="px-4 py-2.5 w-28">{new Date(item.date).toLocaleDateString('fr-FR')}</td>
                                            <td className="px-4 py-2.5 text-gray-200 font-medium">{item.description}</td>
                                            <td className="px-4 py-2.5 text-gray-400">
                                              {balanceGroupBy === 'category' ? (item.supplier || '-') : item.category}
                                            </td>
                                            <td className="px-4 py-2.5 w-32">{item.paymentMethod} {item.checkNumber ? `(N°${item.checkNumber})` : ''}</td>
                                            <td className={`px-4 py-2.5 text-right font-bold ${item.type === 'income' ? 'text-emerald-500' : 'text-red-400'}`}>
                                              {item.type === 'income' ? '+' : '-'}{formatCurrency(item.amount)}
                                            </td>
                                          </tr>
                                        ))}
                                      </tbody>
                                    </table>
                                  ) : (
                                    <p className="p-4 text-xs text-gray-600 italic">Aucune opération enregistrée pour {currentYear}.</p>
                                  )}
                                </div>
                              ))}
                            </div>
                          )}

                          <div className="bg-gray-950 p-5 rounded-xl border border-gray-800 flex justify-between items-center">
                            <span className="text-white font-bold text-base">Solde Final Cumulé (Report + Exercice {currentYear})</span>
                            <span className={`text-2xl font-bold ${(reportANouveau + sumTotal) >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                              {formatCurrency(reportANouveau + sumTotal)}
                            </span>
                          </div>
                        </div>
                      )}

                      {/* AUTOMATISATIONS */}
                      {activeTab === 'automations' && (
                        <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                          <div className="flex justify-between items-center mb-6">
                            <div>
                              <h2 className="text-xl font-bold text-white">Opérations Récurrentes & Modèles</h2>
                              <p className="text-xs text-gray-400 mt-1">Créez vos opérations régulières et générez-les en 1 clic dans le livre de comptes.</p>
                            </div>
                            <button onClick={() => setIsAddAutomationOpen(true)} className="flex items-center space-x-2 bg-red-600 hover:bg-red-700 text-white px-4 py-2.5 rounded-lg text-sm font-medium transition-colors">
                              <Plus className="w-4 h-4"/><span>Nouvelle Automatisation</span>
                            </button>
                          </div>

                          {automations.length === 0 ? (
                            <p className="text-gray-500 text-sm text-center py-8">Aucune opération récurrente configurée.</p>
                          ) : (
                            <div className="overflow-x-auto">
                              <table className="w-full text-sm text-left text-gray-300">
                                <thead className="text-xs text-gray-400 uppercase bg-gray-950 border-b border-gray-800">
                                  <tr>
                                    <th className="px-4 py-3">Libellé</th>
                                    <th className="px-4 py-3">Fournisseur</th>
                                    <th className="px-4 py-3">Compte</th>
                                    <th className="px-4 py-3">Catégorie</th>
                                    <th className="px-4 py-3">Fréquence</th>
                                    <th className="px-4 py-3 text-right">Montant</th>
                                    <th className="px-4 py-3 text-center">Actions</th>
                                  </tr>
                                </thead>
                                <tbody>
                                  {automations.map((auto) => (
                                    <tr key={auto.id} className="border-b border-gray-800 hover:bg-gray-800/40">
                                      <td className="px-4 py-3 font-medium text-white">{auto.description}</td>
                                      <td className="px-4 py-3 text-gray-300">{auto.supplier || '-'}</td>
                                      <td className="px-4 py-3">{accounts.find(a => a.id === auto.accountId)?.name || '-'}</td>
                                      <td className="px-4 py-3"><span className="bg-gray-800 text-gray-300 text-xs px-2.5 py-1 rounded-full border border-gray-700">{auto.category}</span></td>
                                      <td className="px-4 py-3">{auto.frequency === 'monthly' ? 'Mensuelle' : 'Annuelle'} ({auto.paymentMethod})</td>
                                      <td className={`px-4 py-3 text-right font-bold ${auto.type === 'income' ? 'text-emerald-500' : 'text-red-400'}`}>
                                        {auto.type === 'income' ? '+' : '-'}{formatCurrency(auto.amount)}
                                      </td>
                                      <td className="px-4 py-3 text-center">
                                        <div className="flex items-center justify-center space-x-3">
                                          <button onClick={() => executeAutomationNow(auto)} className="bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-lg text-xs flex items-center space-x-1" title="Générer cette écriture aujourd'hui">
                                            <Play className="w-3 h-3" /><span>Générer</span>
                                          </button>
                                          <button onClick={() => deleteAutomation(auto.id)} className="text-gray-500 hover:text-red-500">
                                            <Trash2 className="w-4 h-4"/>
                                          </button>
                                        </div>
                                      </td>
                                    </tr>
                                  ))}
                                </tbody>
                              </table>
                            </div>
                          )}
                        </div>
                      )}

                      {/* PARAMETRES */}
                      {activeTab === 'settings' && (
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                          {/* CONNEXION CLOUD FIREBASE */}
                          <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 md:col-span-3">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-2">
                              <div>
                                <h2 className="text-lg font-bold text-white flex items-center"><Shield className="w-5 h-5 mr-2 text-emerald-400"/> Coffre-Fort Cloud Firebase (Sécurisé)</h2>
                                <p className="text-sm text-gray-400">Vos données sont stockées dans le coffre privé <code className="text-emerald-400 bg-gray-950 px-1.5 py-0.5 rounded">{EXPECTED_VAULT_KEY}</code>.</p>
                              </div>
                              <span className={`text-xs px-3 py-1.5 rounded-full font-bold border ${
                                cloudStatus === 'connected' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' :
                                cloudStatus === 'error' ? 'bg-red-500/10 text-red-400 border-red-500/30' :
                                'bg-yellow-500/10 text-yellow-400 border-yellow-500/30'
                              }`}>
                                {cloudStatus === 'connected' ? '● Connecté au Cloud en direct' :
                                 cloudStatus === 'error' ? '● Accès bloqué (Vérifiez l\'onglet Règles sur Firebase)' :
                                 '● Connexion en cours...'}
                              </span>
                            </div>
                            <form onSubmit={saveFirebaseUrlConfig} className="flex flex-col sm:flex-row gap-3">
                              <input 
                                type="url" 
                                value={tempFbUrl} 
                                onChange={(e) => setTempFbUrl(e.target.value)} 
                                placeholder="URL de votre Realtime Database" 
                                className="flex-1 bg-gray-950 border border-gray-700 rounded-xl p-3 text-sm text-white outline-none focus:border-red-500"
                              />
                              <button type="submit" className="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-xl text-sm font-bold transition-colors whitespace-nowrap">
                                Mettre à jour l'URL
                              </button>
                            </form>
                          </div>

                          {/* SAUVEGARDE ET EXPORT */}
                          <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 md:col-span-3">
                            <h2 className="text-lg font-bold text-white mb-2 flex items-center"><Database className="w-5 h-5 mr-2 text-red-500"/> Sauvegardes & Exportations</h2>
                            <p className="text-sm text-gray-400 mb-6">Vos données sont enregistrées automatiquement dans le Cloud Firebase et dans votre navigateur. Pensez à télécharger régulièrement une copie de sauvegarde (.json) sur votre ordinateur.</p>
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                              <button onClick={exportBackup} className="flex items-center justify-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white py-3.5 px-4 rounded-xl font-medium transition-colors shadow-lg shadow-blue-600/20">
                                <Download className="w-5 h-5"/><span>Sauvegarder sur le PC (.json)</span>
                              </button>
                              <label className="flex items-center justify-center space-x-2 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-white py-3.5 px-4 rounded-xl font-medium cursor-pointer transition-colors">
                                <Upload className="w-5 h-5 text-blue-400"/><span>Charger une sauvegarde (.json)</span>
                                <input type="file" accept=".json" onChange={handleFileUpload} className="hidden" />
                              </label>
                              <button onClick={exportCSV} className="flex items-center justify-center space-x-2 bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 px-4 rounded-xl font-medium transition-colors shadow-lg shadow-emerald-600/20">
                                <FileText className="w-5 h-5"/><span>Exporter Excel / Sheets (.csv)</span>
                              </button>
                            </div>
                          </div>

                          {/* COMPTES */}
                          <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                            <h2 className="text-lg font-bold text-white mb-4 flex items-center"><CreditCard className="w-5 h-5 mr-2 text-red-500"/> Comptes & Caisses</h2>
                            <ul className="space-y-3 mb-6 max-h-64 overflow-y-auto pr-1">
                              {accounts.map(acc => (
                                <li key={acc.id} className="flex justify-between items-center bg-gray-950 p-3 rounded-lg border border-gray-800">
                                  <span className="text-gray-300 font-medium">{acc.name}</span>
                                  {accounts.length > 1 && (
                                    <button onClick={() => deleteAccount(acc.id)} className="text-gray-500 hover:text-red-500"><Trash2 className="w-4 h-4"/></button>
                                  )}
                                </li>
                              ))}
                            </ul>
                            <form onSubmit={addAccount} className="flex space-x-2">
                              <input type="text" value={newAccountName} onChange={e => setNewAccountName(e.target.value)} placeholder="Nouveau compte..." className="flex-1 bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white outline-none" />
                              <button className="bg-red-600 hover:bg-red-700 text-white px-4 py-2.5 rounded-lg text-sm font-medium">Ajouter</button>
                            </form>
                          </div>

                          {/* CATÉGORIES */}
                          <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                            <h2 className="text-lg font-bold text-white mb-4 flex items-center"><List className="w-5 h-5 mr-2 text-red-500"/> Catégories</h2>
                            <ul className="space-y-3 mb-6 max-h-64 overflow-y-auto pr-1">
                              {categories.map(cat => (
                                <li key={cat.id} className="flex justify-between items-center bg-gray-950 p-3 rounded-lg border border-gray-800">
                                  <span className="text-gray-300 font-medium">{cat.name}</span>
                                  {categories.length > 1 && (
                                    <button onClick={() => deleteCategory(cat.id)} className="text-gray-500 hover:text-red-500"><Trash2 className="w-4 h-4"/></button>
                                  )}
                                </li>
                              ))}
                            </ul>
                            <form onSubmit={addCategory} className="flex space-x-2">
                              <input type="text" value={newCategoryName} onChange={e => setNewCategoryName(e.target.value)} placeholder="Nouvelle catégorie..." className="flex-1 bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white outline-none" />
                              <button className="bg-red-600 hover:bg-red-700 text-white px-4 py-2.5 rounded-lg text-sm font-medium">Ajouter</button>
                            </form>
                          </div>

                          {/* FOURNISSEURS / TIERS */}
                          <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                            <h2 className="text-lg font-bold text-white mb-4 flex items-center"><Store className="w-5 h-5 mr-2 text-red-500"/> Fournisseurs / Tiers</h2>
                            <ul className="space-y-3 mb-6 max-h-64 overflow-y-auto pr-1">
                              {suppliers.map(sup => (
                                <li key={sup.id} className="flex justify-between items-center bg-gray-950 p-3 rounded-lg border border-gray-800">
                                  <span className="text-gray-300 font-medium">{sup.name}</span>
                                  <button onClick={() => deleteSupplier(sup.id)} className="text-gray-500 hover:text-red-500"><Trash2 className="w-4 h-4"/></button>
                                </li>
                              ))}
                            </ul>
                            <form onSubmit={addSupplier} className="flex space-x-2">
                              <input type="text" value={newSupplierName} onChange={e => setNewSupplierName(e.target.value)} placeholder="Nouveau fournisseur..." className="flex-1 bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white outline-none" />
                              <button className="bg-red-600 hover:bg-red-700 text-white px-4 py-2.5 rounded-lg text-sm font-medium">Ajouter</button>
                            </form>
                          </div>

                          {/* GESTION DES EXERCICES EN BAS DES PARAMETRES */}
                          <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 md:col-span-3">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                              <div>
                                <h2 className="text-lg font-bold text-white flex items-center"><Archive className="w-5 h-5 mr-2 text-red-500"/> Gestion des Exercices (Années)</h2>
                                <p className="text-sm text-gray-400">Ouvrez une nouvelle année, verrouillez un exercice terminé ou supprimez une année vide.</p>
                              </div>
                              <button onClick={openNextYear} className="bg-red-600 hover:bg-red-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition-colors flex items-center space-x-2">
                                <Plus className="w-4 h-4" />
                                <span>Ouvrir l'année {Math.max(...availableYears.map(Number)) + 1}</span>
                              </button>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                              {availableYears.map(year => {
                                const isClosed = closedYears.includes(year);
                                const yearTxCount = transactions.filter(tx => tx.date.startsWith(year)).length;
                                return (
                                  <div key={year} className="bg-gray-950 p-4 rounded-xl border border-gray-800 flex flex-col justify-between space-y-4">
                                    <div className="flex justify-between items-center">
                                      <div>
                                        <span className="text-lg font-bold text-white">Année {year}</span>
                                        <p className="text-xs text-gray-500">{yearTxCount} opération(s)</p>
                                      </div>
                                      <span className={`text-xs px-2.5 py-1 rounded-full font-medium ${isClosed ? 'bg-yellow-500/10 text-yellow-500 border border-yellow-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'}`}>
                                        {isClosed ? 'Clôturé' : 'Ouvert'}
                                      </span>
                                    </div>
                                    <div className="flex items-center space-x-2 pt-2 border-t border-gray-800/60">
                                      <button onClick={() => toggleYearClosure(year)} className="flex-1 text-xs bg-gray-800 hover:bg-gray-700 text-gray-200 py-2 px-3 rounded-lg flex items-center justify-center space-x-1.5 transition-colors">
                                        {isClosed ? <Unlock className="w-3.5 h-3.5 text-emerald-400"/> : <Lock className="w-3.5 h-3.5 text-yellow-500"/>}
                                        <span>{isClosed ? 'Déverrouiller' : 'Clôturer'}</span>
                                      </button>
                                      {yearTxCount === 0 && (
                                        <button onClick={() => deleteYear(year)} className="p-2 bg-red-500/10 hover:bg-red-500/20 text-red-500 rounded-lg transition-colors" title="Supprimer cette année vide">
                                          <Trash2 className="w-4 h-4"/>
                                        </button>
                                      )}
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                </main>
              </div>

              {isAddModalOpen && <AddTransactionModal onClose={() => setIsAddModalOpen(false)} onSave={addTransaction} accounts={accounts} currentAccountId={currentAccountId} categories={categories} suppliers={suppliers} />}
              {editModalTx && <EditTransactionModal tx={editModalTx} onClose={() => setEditModalTx(null)} onSave={handleEditTransaction} accounts={accounts} categories={categories} suppliers={suppliers} />}
              {isAddAutomationOpen && <AddAutomationModal onClose={() => setIsAddAutomationOpen(false)} onSave={addAutomation} accounts={accounts} categories={categories} suppliers={suppliers} />}
              
              {/* MODALE DE CHOIX DU COMPTE POUR LE LIVRE DE COMPTES */}
              {isAccountPickerOpen && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-50 p-4 print:hidden">
                  <div className="bg-gray-900 border border-gray-700 rounded-3xl w-full max-w-lg overflow-hidden shadow-2xl">
                    <div className="p-6 border-b border-gray-800 flex justify-between items-center">
                      <div className="flex items-center space-x-3">
                        <div className="bg-red-600 p-2.5 rounded-xl shadow-lg shadow-red-600/20">
                          <CreditCard className="w-6 h-6 text-white" />
                        </div>
                        <div>
                          <h3 className="text-xl font-bold text-white">Choix du Compte</h3>
                          <p className="text-xs text-gray-400">Quel compte souhaitez-vous traiter en écriture ?</p>
                        </div>
                      </div>
                      <button onClick={() => { setHasChosenInitialAccount(true); setIsAccountPickerOpen(false); }} className="text-gray-400 hover:text-white"><X className="w-6 h-6"/></button>
                    </div>
                    <div className="p-6 space-y-3 max-h-[70vh] overflow-y-auto">
                      {accounts.map(acc => {
                        const bal = accountBalances[acc.id] || { pointed: 0, unpointed: 0, theoretical: 0 };
                        const isSelected = currentAccountId === acc.id;
                        return (
                          <button
                            key={acc.id}
                            onClick={() => { setCurrentAccountId(acc.id); setHasChosenInitialAccount(true); setIsAccountPickerOpen(false); }}
                            className={`w-full text-left p-4 rounded-2xl border transition-all flex items-center justify-between group ${isSelected ? 'bg-red-600/10 border-red-500 shadow-lg shadow-red-600/5' : 'bg-gray-950 border-gray-800 hover:border-gray-600'}`}
                          >
                            <div className="flex items-center space-x-3">
                              <div className={`p-3 rounded-xl transition-colors ${isSelected ? 'bg-red-600 text-white' : 'bg-gray-900 text-gray-400 group-hover:text-white'}`}>
                                <CreditCard className="w-5 h-5" />
                              </div>
                              <div>
                                <h4 className="font-bold text-white text-base">{acc.name}</h4>
                                <p className="text-xs text-gray-400 mt-0.5">
                                  Pointé : <span className={bal.pointed >= 0 ? 'text-emerald-400 font-semibold' : 'text-red-400 font-semibold'}>{formatCurrency(bal.pointed)}</span>
                                </p>
                              </div>
                            </div>
                            <div className="text-right">
                              <p className="text-xs text-gray-500 mb-0.5">Solde Théorique</p>
                              <p className={`text-base font-bold ${bal.theoretical >= 0 ? 'text-white' : 'text-red-400'}`}>{formatCurrency(bal.theoretical)}</p>
                            </div>
                          </button>
                        );
                      })}

                      <div className="pt-2">
                        <button
                          onClick={() => { setCurrentAccountId('all'); setHasChosenInitialAccount(true); setIsAccountPickerOpen(false); }}
                          className={`w-full text-center p-3.5 rounded-2xl border transition-all font-medium text-sm flex items-center justify-center space-x-2 ${currentAccountId === 'all' ? 'bg-red-600/10 border-red-500 text-red-400' : 'bg-gray-950 border-gray-800 text-gray-400 hover:text-white hover:border-gray-700'}`}
                        >
                          <LayoutDashboard className="w-4 h-4" />
                          <span>Voir tous les comptes confondus</span>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* MODALE DE CHOIX DE L'ANNÉE (EXERCICE) */}
              {isYearPickerOpen && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-50 p-4 print:hidden">
                  <div className="bg-gray-900 border border-gray-700 rounded-3xl w-full max-w-md overflow-hidden shadow-2xl">
                    <div className="p-6 border-b border-gray-800 flex justify-between items-center">
                      <div className="flex items-center space-x-3">
                        <div className="bg-red-600 p-2.5 rounded-xl shadow-lg shadow-red-600/20">
                          <Calendar className="w-6 h-6 text-white" />
                        </div>
                        <div>
                          <h3 className="text-xl font-bold text-white">Choix de l'Exercice</h3>
                          <p className="text-xs text-gray-400">Sélectionnez l'année comptable à consulter</p>
                        </div>
                      </div>
                      <button onClick={() => setIsYearPickerOpen(false)} className="text-gray-400 hover:text-white"><X className="w-6 h-6"/></button>
                    </div>
                    <div className="p-6 space-y-3 max-h-[70vh] overflow-y-auto">
                      {availableYears.map(year => {
                        const isSelected = currentYear === year;
                        const isClosed = closedYears.includes(year);
                        const yearTxCount = transactions.filter(tx => tx.date.startsWith(year)).length;
                        return (
                          <button
                            key={year}
                            onClick={() => { setCurrentYear(year); setIsYearPickerOpen(false); }}
                            className={`w-full text-left p-4 rounded-2xl border transition-all flex items-center justify-between group ${isSelected ? 'bg-red-600/10 border-red-500 shadow-lg shadow-red-600/5' : 'bg-gray-950 border-gray-800 hover:border-gray-600'}`}
                          >
                            <div className="flex items-center space-x-3">
                              <div className={`p-3 rounded-xl transition-colors ${isSelected ? 'bg-red-600 text-white' : 'bg-gray-900 text-gray-400 group-hover:text-white'}`}>
                                <Calendar className="w-5 h-5" />
                              </div>
                              <div>
                                <h4 className="font-bold text-white text-lg">Année {year}</h4>
                                <p className="text-xs text-gray-400">{yearTxCount} opération{yearTxCount > 1 ? 's' : ''} enregistrée{yearTxCount > 1 ? 's' : ''}</p>
                              </div>
                            </div>
                            <div>
                              <span className={`text-xs px-3 py-1.5 rounded-full font-semibold flex items-center space-x-1.5 ${isClosed ? 'bg-yellow-500/10 text-yellow-500 border border-yellow-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'}`}>
                                {isClosed ? <Lock className="w-3 h-3 mr-1" /> : <Unlock className="w-3 h-3 mr-1" />}
                                <span>{isClosed ? 'Clôturé' : 'En cours'}</span>
                              </span>
                            </div>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>
              )}

              {/* MODALE DE CONFIRMATION DE RESTAURATION */}
              {restoreData && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-50 p-4">
                  <div className="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4">
                    <h3 className="text-xl font-bold text-white">Restaurer la sauvegarde ?</h3>
                    <p className="text-sm text-gray-300">
                      Vous êtes sur le point de remplacer les données actuelles par une sauvegarde contenant <strong>{restoreData.transactions?.length || 0} opération(s)</strong> et <strong>{restoreData.accounts?.length || 0} compte(s)</strong>.
                    </p>
                    <div className="flex space-x-3 pt-2">
                      <button onClick={() => setRestoreData(null)} className="flex-1 py-2.5 bg-gray-800 text-white rounded-xl">Annuler</button>
                      <button onClick={confirmRestore} className="flex-1 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold">Confirmer</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        function AddTransactionModal({ onClose, onSave, accounts, currentAccountId, categories, suppliers }) {
          const [type, setType] = useState('expense');
          const [amount, setAmount] = useState('');
          const [description, setDescription] = useState('');
          const [supplier, setSupplier] = useState('');
          const [category, setCategory] = useState('');
          const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
          const [accountId, setAccountId] = useState(currentAccountId === 'all' && accounts.length > 0 ? accounts[0].id : currentAccountId);
          const [paymentMethod, setPaymentMethod] = useState('CB');
          const [checkNumber, setCheckNumber] = useState('');
          const [receiptUrl, setReceiptUrl] = useState('');

          const handleSubmit = (e) => {
            e.preventDefault();
            if (!amount || !description || !category) return;
            onSave({
              type,
              amount: parseFloat(amount),
              description,
              supplier: supplier ? supplier.trim() : '',
              category,
              date,
              accountId,
              paymentMethod,
              checkNumber: paymentMethod === 'Chèque' ? checkNumber.trim() : null,
              receiptUrl: receiptUrl.trim() || null,
              reconciled: false
            });
          };

          return (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-50 p-4">
              <div className="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-md shadow-2xl">
                <div className="flex justify-between items-center p-6 border-b border-gray-800"><h3 className="text-xl font-bold text-white">Nouvelle Opération</h3><button onClick={onClose} className="text-gray-400 hover:text-white"><X className="w-6 h-6"/></button></div>
                <form onSubmit={handleSubmit} className="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
                  <div className="grid grid-cols-2 gap-4">
                    <button type="button" onClick={() => setType('expense')} className={`p-3 rounded-xl border flex items-center justify-center space-x-2 ${type === 'expense' ? 'bg-red-500/10 border-red-500 text-red-500' : 'bg-gray-800 border-gray-700 text-gray-400'}`}><ArrowDownRight className="w-5 h-5"/><span className="font-medium">Dépense</span></button>
                    <button type="button" onClick={() => setType('income')} className={`p-3 rounded-xl border flex items-center justify-center space-x-2 ${type === 'income' ? 'bg-emerald-500/10 border-emerald-500 text-emerald-500' : 'bg-gray-800 border-gray-700 text-gray-400'}`}><ArrowUpRight className="w-5 h-5"/><span className="font-medium">Recette</span></button>
                  </div>
                  <div><label className="block text-sm text-gray-400 mb-1">Montant (€)</label><input type="number" step="0.01" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={amount} onChange={(e) => setAmount(e.target.value)} /></div>
                  <div><label className="block text-sm text-gray-400 mb-1">Date</label><input type="date" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={date} onChange={(e) => setDate(e.target.value)} /></div>
                  <div><label className="block text-sm text-gray-400 mb-1">Compte</label><select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={accountId} onChange={(e) => setAccountId(e.target.value)}>{accounts.map(acc => <option key={acc.id} value={acc.id}>{acc.name}</option>)}</select></div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm text-gray-400 mb-1">Mode</label>
                      <select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)}>
                        <option value="CB">CB</option>
                        <option value="Chèque">Chèque</option>
                        <option value="Prélèvement">Prélèvement</option>
                        <option value="Virement">Virement</option>
                        <option value="Espèces">Espèces</option>
                      </select>
                    </div>
                    {paymentMethod === 'Chèque' && (
                      <div>
                        <label className="block text-sm text-gray-400 mb-1">N° de chèque</label>
                        <input type="text" required placeholder="Ex: 001245" className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={checkNumber} onChange={(e) => setCheckNumber(e.target.value)} />
                      </div>
                    )}
                  </div>
                  <div><label className="block text-sm text-gray-400 mb-1">Libellé</label><input type="text" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={description} onChange={(e) => setDescription(e.target.value)} /></div>
                  <div>
                    <label className="block text-sm text-gray-400 mb-1">Fournisseur / Tiers (Optionnel - crée automatiquement si nouveau)</label>
                    <AutocompleteInput value={supplier} onChange={setSupplier} options={suppliers.map(s => s.name)} required={false} openUpward={true} placeholder="Rechercher ou saisir un fournisseur..." className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" />
                  </div>
                  <div>
                    <label className="block text-sm text-gray-400 mb-1">Catégorie</label>
                    <AutocompleteInput value={category} onChange={setCategory} options={categories.map(c => c.name)} required={true} openUpward={true} placeholder="Rechercher une catégorie..." className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" />
                  </div>
                  <div><label className="block text-sm text-gray-400 mb-1">Lien Justificatif (Optionnel)</label><input type="url" placeholder="https://drive.google.com/..." className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none text-sm" value={receiptUrl} onChange={(e) => setReceiptUrl(e.target.value)} /></div>
                  <div className="pt-4 flex space-x-3"><button type="button" onClick={onClose} className="flex-1 py-3 bg-gray-800 text-white rounded-xl">Annuler</button><button type="submit" className="flex-1 py-3 bg-red-600 text-white rounded-xl font-bold">Enregistrer</button></div>
                </form>
              </div>
            </div>
          );
        }

        function EditTransactionModal({ tx, onClose, onSave, accounts, categories, suppliers }) {
          const [type, setType] = useState(tx.type);
          const [amount, setAmount] = useState(tx.amount);
          const [description, setDescription] = useState(tx.description);
          const [supplier, setSupplier] = useState(tx.supplier || '');
          const [category, setCategory] = useState(tx.category);
          const [date, setDate] = useState(tx.date);
          const [accountId, setAccountId] = useState(tx.accountId);
          const [paymentMethod, setPaymentMethod] = useState(tx.paymentMethod || 'CB');
          const [checkNumber, setCheckNumber] = useState(tx.checkNumber || '');
          const [receiptUrl, setReceiptUrl] = useState(tx.receiptUrl || '');

          const handleSubmit = (e) => {
            e.preventDefault();
            if (!amount || !description || !category) return;
            onSave({
              ...tx,
              type,
              amount: parseFloat(amount),
              description,
              supplier: supplier ? supplier.trim() : '',
              category,
              date,
              accountId,
              paymentMethod,
              checkNumber: paymentMethod === 'Chèque' ? checkNumber.trim() : null,
              receiptUrl: receiptUrl.trim() || null
            });
          };

          return (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-50 p-4">
              <div className="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-md shadow-2xl">
                <div className="flex justify-between items-center p-6 border-b border-gray-800"><h3 className="text-xl font-bold text-white">Modifier l'opération</h3><button onClick={onClose} className="text-gray-400 hover:text-white"><X className="w-6 h-6"/></button></div>
                <form onSubmit={handleSubmit} className="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
                  <div className="grid grid-cols-2 gap-4">
                    <button type="button" onClick={() => setType('expense')} className={`p-3 rounded-xl border flex items-center justify-center space-x-2 ${type === 'expense' ? 'bg-red-500/10 border-red-500 text-red-500' : 'bg-gray-800 border-gray-700 text-gray-400'}`}><ArrowDownRight className="w-5 h-5"/><span className="font-medium">Dépense</span></button>
                    <button type="button" onClick={() => setType('income')} className={`p-3 rounded-xl border flex items-center justify-center space-x-2 ${type === 'income' ? 'bg-emerald-500/10 border-emerald-500 text-emerald-500' : 'bg-gray-800 border-gray-700 text-gray-400'}`}><ArrowUpRight className="w-5 h-5"/><span className="font-medium">Recette</span></button>
                  </div>
                  <div><label className="block text-sm text-gray-400 mb-1">Montant (€)</label><input type="number" step="0.01" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={amount} onChange={(e) => setAmount(e.target.value)} /></div>
                  <div><label className="block text-sm text-gray-400 mb-1">Date</label><input type="date" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={date} onChange={(e) => setDate(e.target.value)} /></div>
                  <div><label className="block text-sm text-gray-400 mb-1">Compte</label><select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={accountId} onChange={(e) => setAccountId(e.target.value)}>{accounts.map(acc => <option key={acc.id} value={acc.id}>{acc.name}</option>)}</select></div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm text-gray-400 mb-1">Mode</label>
                      <select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)}>
                        <option value="CB">CB</option>
                        <option value="Chèque">Chèque</option>
                        <option value="Prélèvement">Prélèvement</option>
                        <option value="Virement">Virement</option>
                        <option value="Espèces">Espèces</option>
                      </select>
                    </div>
                    {paymentMethod === 'Chèque' && (
                      <div>
                        <label className="block text-sm text-gray-400 mb-1">N° de chèque</label>
                        <input type="text" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={checkNumber} onChange={(e) => setCheckNumber(e.target.value)} />
                      </div>
                    )}
                  </div>
                  <div><label className="block text-sm text-gray-400 mb-1">Libellé</label><input type="text" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={description} onChange={(e) => setDescription(e.target.value)} /></div>
                  <div>
                    <label className="block text-sm text-gray-400 mb-1">Fournisseur / Tiers</label>
                    <AutocompleteInput value={supplier} onChange={setSupplier} options={suppliers.map(s => s.name)} required={false} openUpward={true} placeholder="Rechercher ou saisir un fournisseur..." className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" />
                  </div>
                  <div>
                    <label className="block text-sm text-gray-400 mb-1">Catégorie</label>
                    <AutocompleteInput value={category} onChange={setCategory} options={categories.map(c => c.name)} required={true} openUpward={true} placeholder="Rechercher une catégorie..." className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" />
                  </div>
                  <div><label className="block text-sm text-gray-400 mb-1">Lien Justificatif (Optionnel)</label><input type="url" placeholder="https://drive.google.com/..." className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none text-sm" value={receiptUrl} onChange={(e) => setReceiptUrl(e.target.value)} /></div>
                  <div className="pt-4 flex space-x-3"><button type="button" onClick={onClose} className="flex-1 py-3 bg-gray-800 text-white rounded-xl">Annuler</button><button type="submit" className="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold">Mettre à jour</button></div>
                </form>
              </div>
            </div>
          );
        }

        function AddAutomationModal({ onClose, onSave, accounts, categories, suppliers }) {
          const [type, setType] = useState('expense');
          const [amount, setAmount] = useState('');
          const [description, setDescription] = useState('');
          const [supplier, setSupplier] = useState('');
          const [category, setCategory] = useState('');
          const [startDate, setStartDate] = useState(new Date().toISOString().split('T')[0]);
          const [frequency, setFrequency] = useState('monthly');
          const [paymentMethod, setPaymentMethod] = useState('Prélèvement');
          const [accountId, setAccountId] = useState(accounts.length > 0 ? accounts[0].id : '');

          const handleSubmit = (e) => {
            e.preventDefault();
            if (!amount || !description || !category) return;
            onSave({ type, amount: parseFloat(amount), description, supplier: supplier ? supplier.trim() : '', category, startDate, nextDate: startDate, frequency, paymentMethod, accountId });
          };

          return (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-50 p-4">
              <div className="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-md shadow-2xl">
                <div className="flex justify-between items-center p-6 border-b border-gray-800"><h3 className="text-xl font-bold text-white">Nouvelle Automatisation</h3><button onClick={onClose} className="text-gray-400 hover:text-white"><X className="w-6 h-6"/></button></div>
                <form onSubmit={handleSubmit} className="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
                  <div className="grid grid-cols-2 gap-4">
                    <button type="button" onClick={() => setType('expense')} className={`p-3 rounded-xl border flex items-center justify-center space-x-2 ${type === 'expense' ? 'bg-red-500/10 border-red-500 text-red-500' : 'bg-gray-800 border-gray-700 text-gray-400'}`}><ArrowDownRight className="w-5 h-5"/><span className="font-medium">Dépense</span></button>
                    <button type="button" onClick={() => setType('income')} className={`p-3 rounded-xl border flex items-center justify-center space-x-2 ${type === 'income' ? 'bg-emerald-500/10 border-emerald-500 text-emerald-500' : 'bg-gray-800 border-gray-700 text-gray-400'}`}><ArrowUpRight className="w-5 h-5"/><span className="font-medium">Recette</span></button>
                  </div>
                  <div><label className="block text-sm text-gray-400 mb-1">Montant (€)</label><input type="number" step="0.01" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={amount} onChange={(e) => setAmount(e.target.value)} /></div>
                  <div><label className="block text-sm text-gray-400 mb-1">Date de référence</label><input type="date" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={startDate} onChange={(e) => setStartDate(e.target.value)} /></div>
                  <div className="grid grid-cols-2 gap-4">
                    <div><label className="block text-sm text-gray-400 mb-1">Fréquence</label><select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={frequency} onChange={(e) => setFrequency(e.target.value)}><option value="monthly">Mensuelle</option><option value="yearly">Annuelle</option></select></div>
                    <div><label className="block text-sm text-gray-400 mb-1">Mode</label><select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)}><option value="Prélèvement">Prélèvement</option><option value="Virement">Virement</option><option value="CB">CB</option><option value="Chèque">Chèque</option></select></div>
                  </div>
                  <div><label className="block text-sm text-gray-400 mb-1">Compte</label><select className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={accountId} onChange={(e) => setAccountId(e.target.value)}>{accounts.map(acc => <option key={acc.id} value={acc.id}>{acc.name}</option>)}</select></div>
                  <div><label className="block text-sm text-gray-400 mb-1">Libellé</label><input type="text" required className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" value={description} onChange={(e) => setDescription(e.target.value)} /></div>
                  <div>
                    <label className="block text-sm text-gray-400 mb-1">Fournisseur / Tiers</label>
                    <AutocompleteInput value={supplier} onChange={setSupplier} options={suppliers.map(s => s.name)} required={false} openUpward={true} placeholder="Rechercher ou saisir un fournisseur..." className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" />
                  </div>
                  <div>
                    <label className="block text-sm text-gray-400 mb-1">Catégorie</label>
                    <AutocompleteInput value={category} onChange={setCategory} options={categories.map(c => c.name)} required={true} openUpward={true} placeholder="Rechercher une catégorie..." className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white outline-none" />
                  </div>
                  <div className="pt-4 flex space-x-3"><button type="button" onClick={onClose} className="flex-1 py-3 bg-gray-800 text-white rounded-xl">Annuler</button><button type="submit" className="flex-1 py-3 bg-red-600 text-white rounded-xl font-bold">Enregistrer</button></div>
                </form>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
